<!-- زر إرسال طلب الشراء من متجر العملاء -->
<button onclick="submitPurchaseOrder()" style="background: #28a745; color: #white; padding: 12px 20px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold;">
    إرسال طلب الشراء 🛒
</button>

<script>
  // دالة إرسال الطلب للسيستم الرئيسي عندك
  function submitPurchaseOrder() {
    // 1. جمع بيانات المنتجات والعميل (حسب المتغيرات الموجودة عندك في الكود)
    const orderData = {
      customerName: "عميل المتجر الإلكتروني", // أو اربطها بحقل اسم العميل عندك
      items: typeof cart !== 'undefined' ? cart : [], // السلة بتاعتك
      totalAmount: typeof getTotal === 'function' ? getTotal() : 0, // الإجمالي
      orderDate: new Date().toISOString(),
      type: 'purchase_order', // التعديل الجذري هنا عشان تسمع كطلب شراء
      status: 'pending'       // حالة الطلب طلب جديد بانتظار المراجعة
    };

    // 2. رفع الطلب لـ Firebase تحت جدول أو مجموعة orders
    db.collection('orders').add(orderData)
      .then(() => {
        alert("تم إرسال طلب الشراء بنجاح وسيتم مراجعته فوراً!");
        // لو حابب تفضي السلة أو توديه لصفحة النجاح
      })
      .catch((error) => {
        console.error("خطأ في إرسال الطلب: ", error);
        alert("حدث خطأ، حاول مرة أخرى.");
      });
  }
</script>
