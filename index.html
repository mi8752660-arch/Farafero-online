<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FARAFERO GIFT SHOP - طلب الشراء أونلاين (PO)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'], cinzel: ['Cinzel', 'serif'], montserrat: ['Montserrat', 'sans-serif'] },
                    colors: { gold: '#C5A059' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #C5A059; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col p-4 sm:p-6" dir="rtl">

    <div class="max-w-4xl mx-auto w-full space-y-6">
        
        <!-- HEADER -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-12 h-12 flex items-center justify-center bg-white rounded-2xl border border-gold/40 shadow-sm p-1">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
                        <path d="M50 32C42 22 30 22 33 32C35.5 38.5 48 35 50 32Z" stroke="#C5A059" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M50 32C58 22 70 22 67 32C64.5 38.5 52 35 50 32Z" stroke="#C5A059" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="25" y="32" width="50" height="12" fill="white" stroke="#C5A059" stroke-width="3" stroke-linejoin="round"/>
                        <rect x="28" y="44" width="44" height="34" fill="white" stroke="#C5A059" stroke-width="3" stroke-linejoin="round"/>
                        <line x1="50" y1="32" x2="50" y2="78" stroke="#C5A059" stroke-width="3"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-[3px] text-slate-900 leading-tight font-cinzel">FARAFERO</h1>
                    <p class="text-[9px] text-gold font-semibold tracking-[4px] uppercase font-montserrat">ONLINE PO ORDER</p>
                </div>
            </div>
            <span class="bg-amber-50 text-gold text-xs font-bold px-3 py-1.5 rounded-xl border border-amber-200">طلب شراء أونلاين</span>
        </div>

        <!-- MAIN FORM AND CART GRID -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
            
            <!-- PRODUCTS CATALOG SECTION -->
            <div class="md:col-span-7 bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                <h3 class="font-black text-slate-900 border-b pb-3 flex items-center">
                    <i class="fa-solid fa-gift text-gold ml-2"></i> اختر الهدايا للطلب
                </h3>
                <input type="text" id="store-search" oninput="renderStoreProducts()" placeholder="ابحث عن هدية..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-xs font-semibold focus:outline-none focus:border-gold">
                <div id="store-products-grid" class="grid grid-cols-2 gap-3 max-h-[420px] overflow-y-auto custom-scrollbar p-1"></div>
            </div>

            <!-- CHECKOUT FORM & SUMMARY SECTION -->
            <div class="md:col-span-5 space-y-4">
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                    <h3 class="font-black text-slate-900 border-b pb-3 flex items-center">
                        <i class="fa-solid fa-file-invoice text-gold ml-2"></i> بيانات الشحن والأوردر
                    </h3>

                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="font-bold text-slate-700 block mb-1">اسم العميل بالكامل:</label>
                            <input type="text" id="po-cust-name" placeholder="اكتب اسمك..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-semibold focus:outline-none focus:border-gold">
                        </div>

                        <div>
                            <label class="font-bold text-slate-700 block mb-1">رقم الموبايل (11 رقم صحيح):</label>
                            <input type="tel" id="po-cust-phone" placeholder="01xxxxxxxx" maxlength="11" oninput="validatePhone()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-semibold focus:outline-none focus:border-gold dir-ltr text-right">
                            <p id="phone-error" class="text-rose-500 text-[10px] font-bold mt-1 hidden">⚠️ رقم الهاتف غير صحيح (يجب أن يبدأ بـ 01 ويتكون من 11 رقم)</p>
                        </div>

                        <div>
                            <label class="font-bold text-slate-700 block mb-1">المحافظة:</label>
                            <select id="po-cust-city" onchange="updateShippingByCity()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-800 focus:outline-none focus:border-gold">
                                <option value="">اختر المحافظة...</option>
                                <option value="الإسكندرية">الإسكندرية (شحن 60 جنيه)</option>
                                <option value="القاهرة">القاهرة (شحن 120 جنيه)</option>
                            </select>
                        </div>

                        <div>
                            <label class="font-bold text-slate-700 block mb-1">العنوان بالتفصيل (الشارع، البناية، الشقة):</label>
                            <textarea id="po-cust-address" rows="2" placeholder="اكتب العنوان بالتفصيل..." oninput="validateAddress()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-semibold focus:outline-none focus:border-gold"></textarea>
                            <p id="address-error" class="text-rose-500 text-[10px] font-bold mt-1 hidden">⚠️ يجيب كتابة العنوان بالتفصيل</p>
                        </div>
                    </div>

                    <!-- CART ITEMS -->
                    <div class="space-y-1 pt-2 border-t">
                        <span class="text-xs font-bold text-slate-700">الأصناف المختارة:</span>
                        <div id="po-cart-items" class="divide-y max-h-[100px] overflow-y-auto my-1 text-xs bg-slate-50 p-2 rounded-xl border"></div>
                    </div>

                    <!-- TOTALS -->
                    <div class="space-y-1.5 pt-2 border-t text-xs">
                        <div class="flex justify-between text-slate-600">
                            <span>إحمالي المنتجات:</span>
                            <span id="po-subtotal" class="font-bold">0 EGP</span>
                        </div>
                        <div class="flex justify-between text-slate-600">
                            <span>مصاريف الشحن:</span>
                            <span id="po-shipping-fee" class="font-bold text-gold">0 EGP</span>
                        </div>
                        <div class="flex justify-between text-sm font-black text-slate-900 border-t pt-2">
                            <span>الإجمالي النهائي:</span>
                            <span id="po-grand-total" class="text-gold text-base">0 EGP</span>
                        </div>
                    </div>

                    <button onclick="submitPoOrder()" class="w-full bg-gold hover:bg-[#b08b49] text-white font-black py-3 rounded-2xl shadow-md text-xs transition-all flex items-center justify-center space-x-1.5 space-x-reverse">
                        <i class="fa-solid fa-check-circle"></i>
                        <span>إرسال طلب الـ PO أونلاين</span>
                    </button>
                </div>
            </div>

        </div>

    </div>

    <!-- SCRIPT ENGINE -->
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAuP10QxT-N1gEo7nW6Zc9I1Nzg9ehdD6E",
          authDomain: "farafero-store-99e0d.firebaseapp.com",
          projectId: "farafero-store-99e0d",
          storageBucket: "farafero-store-99e0d.firebasestorage.app",
          messagingSenderId: "47711607235",
          appId: "1:47711607235:web:6cc25baa82eebcf6460576",
          measurementId: "G-Q736FT0ZH5"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let state = {
            products: [],
            cart: [],
            shippingFee: 0
        };

        function initOnlineStore() {
            db.collection("products").onSnapshot((snapshot) => {
                state.products = [];
                snapshot.forEach((doc) => {
                    state.products.push({ id: doc.id, ...doc.data() });
                });
                renderStoreProducts();
            });
        }

        function renderStoreProducts() {
            const grid = document.getElementById('store-products-grid');
            const search = document.getElementById('store-search').value.toLowerCase();
            if(!grid) return;
            grid.innerHTML = '';

            state.products.filter(p => p.name.toLowerCase().includes(search) || (p.code && p.code.toLowerCase().includes(search))).forEach(p => {
                grid.innerHTML += `
                    <div class="bg-slate-50 hover:bg-amber-50/50 border p-2.5 rounded-2xl text-xs space-y-1 transition-all flex flex-col justify-between cursor-pointer" onclick="addToPoCart('${p.id}')">
                        <div class="flex items-center space-x-2 space-x-reverse">
                            <img src="${p.image}" class="w-8 h-8 rounded-xl object-cover">
                            <div class="flex-grow">
                                <p class="text-[9px] text-gold font-bold">${p.code || ''}</p>
                                <p class="font-bold line-clamp-1">${p.name}</p>
                            </div>
                        </div>
                        <div class="flex justify-between items-center mt-1">
                            <span class="font-black text-gold">${Math.round(p.price)} EGP</span>
                            <span class="text-[9px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded-md font-bold">مخزون: ${p.stock}</span>
                        </div>
                    </div>
                `;
            });
        }

        function addToPoCart(id) {
            const p = state.products.find(x => x.id === id);
            if (!p || p.stock <= 0) return alert('عذراً، هذه الهدية غير متوفرة حالياً!');
            
            const item = state.cart.find(x => x.id === id);
            if (item) {
                if (item.qty + 1 > p.stock) return alert('الكمية المطلوبة أكبر من المتبقي بالمخزن!');
                item.qty++;
            } else {
                state.cart.push({ ...p, qty: 1 });
            }
            renderPoCart();
        }

        function removeFromPoCart(idx) {
            state.cart.splice(idx, 1);
            renderPoCart();
        }

        function updateShippingByCity() {
            const city = document.getElementById('po-cust-city').value;
            if (city === 'الإسكندرية') {
                state.shippingFee = 60;
            } else if (city === 'القاهرة') {
                state.shippingFee = 120;
            } else {
                state.shippingFee = 0;
            }
            renderPoCart();
        }

        function validatePhone() {
            const phone = document.getElementById('po-cust-phone').value.trim();
            const errorEl = document.getElementById('phone-error');
            const phoneRegex = /^01[0125][0-9]{8}$/;
            if (phone && !phoneRegex.test(phone)) {
                errorEl.classList.remove('hidden');
                return false;
            } else {
                errorEl.classList.add('hidden');
                return true;
            }
        }

        function validateAddress() {
            const address = document.getElementById('po-cust-address').value.trim();
            const errorEl = document.getElementById('address-error');
            if (address.length < 5) {
                errorEl.classList.remove('hidden');
                return false;
            } else {
                errorEl.classList.add('hidden');
                return true;
            }
        }

        function renderPoCart() {
            const container = document.getElementById('po-cart-items');
            if(!container) return;
            container.innerHTML = '';
            let subtotal = 0;

            if (state.cart.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 py-2">لم تقم باختيار هدايا بعد</p>';
            } else {
                state.cart.forEach((i, idx) => {
                    subtotal += i.price * i.qty;
                    container.innerHTML += `
                        <div class="flex justify-between items-center py-1">
                            <div>
                                <span class="font-bold text-slate-800">${i.name}</span>
                                <span class="text-slate-400 text-[10px] block">${Math.round(i.price)} EGP × ${i.qty}</span>
                            </div>
                            <div class="flex items-center space-x-2 space-x-reverse">
                                <b>${Math.round(i.price * i.qty)} EGP</b>
                                <button onclick="removeFromPoCart(${idx})" class="text-rose-500 font-bold">✕</button>
                            </div>
                        </div>`;
                });
            }

            const grandTotal = subtotal + state.shippingFee;

            document.getElementById('po-subtotal').innerText = Math.round(subtotal) + ' EGP';
            document.getElementById('po-shipping-fee').innerText = Math.round(state.shippingFee) + ' EGP';
            document.getElementById('po-grand-total').innerText = Math.round(grandTotal) + ' EGP';
        }

        function getNextPoId() {
            return db.collection("orders").get().then(snapshot => {
                let maxNum = 0;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.id) {
                        const num = parseInt(data.id.replace(/[^0-9]/g, '')) || 0;
                        if (num > maxNum) maxNum = num;
                    }
                });
                return 'PO-' + String(maxNum + 1).padStart(4, '0');
            });
        }

        async function submitPoOrder() {
            if (state.cart.length === 0) return alert('برجاء اختيار هدية واحدة على الأقل!');

            const name = document.getElementById('po-cust-name').value.trim();
            const phone = document.getElementById('po-cust-phone').value.trim();
            const city = document.getElementById('po-cust-city').value;
            const address = document.getElementById('po-cust-address').value.trim();

            if (!name) return alert('برجاء إدخال اسم العميل!');
            if (!validatePhone() || !phone) return alert('برجاء إدخال رقم تليفون صحيح ومكون من 11 رقماً يبدأ بـ 01!');
            if (!city) return alert('برجاء اختيار المحافظة لتحديد مصاريف الشحن!');
            if (!validateAddress() || !address) return alert('برجاء كتابة العنوان بالتفصيل!');

            const subtotal = state.cart.reduce((a, b) => a + (b.price * b.qty), 0);
            const total = subtotal + state.shippingFee;
            const orderId = await getNextPoId();
            const dateStr = new Date().toLocaleDateString('en-GB');

            // تسجيل العميل مباشرة في مجموعة العملاء (VIP) عند إنشاء الـ PO أونلاين
            const customerDocId = 'cust_' + phone.replace(/\s+/g, '_');
            const customerRef = db.collection("customers").doc(customerDocId);
            
            customerRef.get().then((docSnap) => {
                if (docSnap.exists) {
                    const existingData = docSnap.data();
                    customerRef.update({
                        name: name,
                        ordersCount: (existingData.ordersCount || 1) + 1,
                        lastDate: dateStr
                    });
                } else {
                    customerRef.set({
                        name: name,
                        phone: phone,
                        ordersCount: 1,
                        lastDate: dateStr,
                        timestamp: Date.now(),
                        isBlocked: false
                    });
                }
            });

            const newPoOrder = {
                id: orderId,
                type: 'po',
                status: 'pending',
                date: dateStr,
                timestamp: Date.now(),
                customerName: name,
                customerPhone: `${phone} - ${city} - ${address}`,
                subtotal: subtotal,
                shipping: state.shippingFee,
                discount: 0,
                packaging: 0,
                total: total,
                detailedItems: JSON.parse(JSON.stringify(state.cart))
            };

            db.collection("orders").add(newPoOrder).then(() => {
                alert(`✅ تم إرسال طلب الشراء أونلاين برقم ${orderId} بنجاح وتم تسجيل بياناتك وسيتم مراجعته وتأكيده قريباً!`);
                state.cart = [];
                document.getElementById('po-cust-name').value = '';
                document.getElementById('po-cust-phone').value = '';
                document.getElementById('po-cust-city').value = '';
                document.getElementById('po-cust-address').value = '';
                state.shippingFee = 0;
                renderPoCart();
            }).catch(err => {
                alert('حدث خطأ أثناء إرسال الطلب: ' + err.message);
            });
        }

        document.addEventListener('DOMContentLoaded', initOnlineStore);
    </script>
</body>
</html>
