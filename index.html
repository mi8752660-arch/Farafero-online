    async function cloudPull(url) {
      const clean = (url || '').trim();
      if (!clean) return null;
      const sep = clean.includes('?') ? '&' : '?';
      const res = await fetch(`${clean}${sep}t=${Date.now()}`, { method: 'GET', cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    }

    async function cloudPush(url, payload) {
      const clean = (url || '').trim();
      if (!clean) return false;
      try {
        const res = await fetch(clean, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        return res.ok;
      } catch {
        await fetch(clean, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        return true;
      }
    }

        const cartKey = `${product.id}__${opt}`;
        setCart(prev => {
          const exists = prev.find(i => i.cartKey === cartKey);
          if (exists) {
            return prev.map(i => i.cartKey === cartKey ? { ...i, quantity: i.quantity + 1 } : i);
          }
          return [
            ...prev,
            {
              cartKey,
              id: product.id,
              name: product.name,
              arabicSubtitle: product.arabicSubtitle,
              price: product.price,
              image: product.image,
              selectedOption: opt,
              quantity: 1
            }
          ];

        setLastAddedItem({ name: product.name, option: opt, image: product.image });
        setCartDrawerOpen(true);
      };

      const updateCartQty = (cartKey, delta) => {
        setCart(prev =>
          prev
            .map(i => (i.cartKey === cartKey ? { ...i, quantity: i.quantity + delta } : i))
            .filter(i => i.quantity > 0)
        );
      };

      const removeFromCart = (cartKey) => {
        setCart(prev => prev.filter(i => i.cartKey !== cartKey));
      };

              name: o.customerName,
              phone: o.phone,
              governorate: o.governorate,
              address: o.address,
              ordersCount: 1,
              totalSpent: o.total
            });
          } else {
            const cur = map.get(key);
            cur.ordersCount += 1;
            cur.totalSpent += o.total;

        return Array.from(map.values());

    function HeroBannerSlider({ sliders, onSelectCategory }) {
      const [current, setCurrent] = useState(0);

      useEffect(() => {
        if (!sliders || sliders.length <= 1) return;
        const timer = setInterval(() => {
          setCurrent(prev => (prev + 1) % sliders.length);
        }, 5000);
        return () => clearInterval(timer);
      }, [sliders]);

      const slide = sliders[current] || sliders[0];
      if (!slide) return null;

      return (
        <section className="relative h-[340px] sm:h-[460px] bg-stone-900 overflow-hidden">
          <img src={slide.image} alt={slide.title} className="w-full h-full object-cover opacity-70 transition-all duration-700" />
          <div className="absolute inset-0 bg-gradient-to-t from-black/75 via-black/30 to-transparent flex items-end">
            <div className="max-w-7xl mx-auto w-full px-4 sm:px-6 pb-10 sm:pb-14 text-white space-y-3">
              {slide.badge && (
                <span className="inline-block px-3 py-1 bg-white/15 backdrop-blur text-[11px] font-bold tracking-widest uppercase">
                  {slide.badge}
                </span>
              )}
              <h2 className="text-2xl sm:text-4xl lg:text-5xl font-bold max-w-2xl leading-tight">
                {slide.title}
              </h2>
              <p className="text-xs sm:text-base text-stone-200 max-w-xl">
                {slide.subtitle}
              </p>
              <div className="pt-2 flex flex-wrap items-center gap-4">
                <button
                  onClick={() => onSelectCategory(slide.targetCategory || 'الكل')}
                  className="px-6 py-3 bg-white text-stone-950 hover:bg-stone-200 text-xs sm:text-sm font-bold transition"
                >
                  {slide.ctaText || 'تسوق الآن'}
                </button>
                {sliders.length > 1 && (
                  <div className="flex items-center gap-2">
                    {sliders.map((s, idx) => (
                      <button
                        key={s.id}
                        onClick={() => setCurrent(idx)}
                        className={`h-2 transition-all ${idx === current ? 'w-8 bg-white' : 'w-2 bg-white/50'}`}
                        aria-label={`بانر ${idx + 1}`}
                      />
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        </section>
      );
    }

      const [selectedOpt, setSelectedOpt] = useState(options[0]);
      const [hovered, setHovered] = useState(false);
      const displayImage = hovered && product.hoverImage ? product.hoverImage : product.image;

      return (
        <div
          className="group flex flex-col justify-between"
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
        >
          <div>
            <div className="relative aspect-[3/4] bg-stone-200/50 overflow-hidden mb-3 cursor-pointer" onClick={onQuickView}>
              <img
                src={displayImage}
                alt={product.name}
                className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
              />
              <div className="absolute top-2.5 right-2.5 flex flex-col gap-1.5">
                {!product.inStock ? (
                  <span className="px-2.5 py-0.5 bg-stone-900 text-white text-[11px] font-bold">Sold out</span>
                ) : product.oldPrice && product.oldPrice > product.price ? (
                  <span className={`px-2.5 py-0.5 text-[11px] font-bold ${theme.badgeSale}`}>Sale</span>
                ) : null}
              </div>
              {product.inStock && (
                <span className="absolute bottom-2.5 left-2.5 px-2 py-0.5 bg-white/90 text-emerald-800 text-[10px] font-bold">
                  in stock
                </span>
              )}
            </div>

            <div className="space-y-1">
              <h3 onClick={onQuickView} className="text-xs sm:text-sm font-bold hover:underline cursor-pointer line-clamp-2 leading-snug">
                {product.name}
              </h3>
              {product.arabicSubtitle && (
                <p className={`text-[11px] line-clamp-1 ${theme.mutedText}`}>{product.arabicSubtitle}</p>
              )}
              <div className="flex flex-wrap items-baseline gap-2 pt-0.5 text-xs sm:text-sm">
                {product.oldPrice && product.oldPrice > product.price && (
                  <span className={`line-through text-xs ${theme.mutedText}`}>{Number(product.oldPrice).toFixed(2)} EGP</span>
                )}
                <span className="font-bold">{Number(product.price).toFixed(2)} EGP</span>

          </div>

          <div className="mt-3 space-y-2.5">
            {options.length > 1 && (
              <div className="flex flex-wrap gap-1">

                    type="button"

                    className={`px-2 py-0.5 text-[10px] font-semibold border transition ${
                      selectedOpt === opt ? theme.accentBtn + ' border-transparent' : `${theme.border} opacity-80 hover:opacity-100`
                    }`}

                    {opt}
                  </button>

            <button

                product.inStock ? theme.outlineBtn : 'border-stone-300 opacity-50 cursor-not-allowed'
              }`}
            >
              {product.inStock ? 'أضف للسلة (Add to cart)' : 'Sold out'}
            </button>
          </div>
        </div>
      );
    }

    function CheckoutPage({ cart, cartSubtotal, settings, theme, updateCartQty, removeFromCart, onBackToStore, onSubmitOrder }) {
      const govs = Object.keys(settings.shippingRates);
      const [customerName, setCustomerName] = useState('');
      const [phone, setPhone] = useState('');
      const [governorate, setGovernorate] = useState(govs.includes('الإسكندرية') ? 'الإسكندرية' : govs[0] || 'القاهرة');
      const [address, setAddress] = useState('');
      const [paymentMethod, setPaymentMethod] = useState('الدفع عند الاستلام (COD)');
      const [giftNote, setGiftNote] = useState('');

      if (cart.length === 0) {
        return (
          <div className={`max-w-lg mx-auto my-16 p-10 border text-center space-y-4 ${theme.border}`}>
            <h2 className="text-xl font-bold">سلة المشتريات فارغة</h2>
            <button onClick={onBackToStore} className={`px-6 py-3 text-xs font-bold ${theme.accentBtn}`}>
              العودة للمتجر
            </button>
          </div>
        );
      }

      const shipping = Number(settings.shippingRates[governorate] ?? 0);
      const total = cartSubtotal + shipping;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!customerName.trim() || !phone.trim() || !address.trim()) return;
        onSubmitOrder({
          customerName: customerName.trim(),
          phone: phone.trim(),
          governorate,
          address: address.trim(),
          paymentMethod,
          giftNote: giftNote.trim(),
          shipping,
          total
        });
      };

      return (
        <div className="max-w-6xl mx-auto px-4 sm:px-6 py-10">
          <div className={`flex items-center justify-between border-b pb-4 mb-8 ${theme.border}`}>
            <h1 className="text-2xl font-bold">إتمام الطلب والدفع</h1>
            <button onClick={onBackToStore} className="text-xs font-bold underline">← العودة للمتجر</button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            <form onSubmit={handleSubmit} className={`lg:col-span-7 space-y-5 p-6 sm:p-8 border ${theme.surfaceBg} ${theme.border}`}>
              <h2 className={`text-base font-bold border-b pb-3 ${theme.border}`}>1. بيانات الشحن والتوصيل</h2>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold mb-1.5">الاسم بالكامل *</label>
                  <input type="text" required value={customerName} onChange={e => setCustomerName(e.target.value)} placeholder="الاسم بالكامل" className={`w-full px-3.5 py-2.5 border text-sm ${theme.cardBg} ${theme.border}`} />
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1.5">رقم الموبايل *</label>
                  <input type="tel" required dir="ltr" value={phone} onChange={e => setPhone(e.target.value)} placeholder="010xxxxxxxx" className={`w-full px-3.5 py-2.5 border text-sm text-right ${theme.cardBg} ${theme.border}`} />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold mb-1.5">المحافظة (جميع محافظات مصر) *</label>
                <select value={governorate} onChange={e => setGovernorate(e.target.value)} className={`w-full px-3.5 py-2.5 border text-sm font-semibold ${theme.cardBg} ${theme.border}`}>
                  {govs.map(g => (
                    <option key={g} value={g} className="text-stone-900 bg-white">
                      {g} — مصاريف الشحن: {settings.shippingRates[g]} ج.م
                    </option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold mb-1.5">العنوان بالتفصيل *</label>
                <input type="text" required value={address} onChange={e => setAddress(e.target.value)} placeholder="المنطقة، الشارع، رقم العمارة، الدور والشقة" className={`w-full px-3.5 py-2.5 border text-sm ${theme.cardBg} ${theme.border}`} />
              </div>

              <div>
                <label className="block text-xs font-bold mb-1.5">رسالة كارت الإهداء المجاني (اختياري)</label>
                <input type="text" value={giftNote} onChange={e => setGiftNote(e.target.value)} placeholder="اكتب رسالتك هنا..." className={`w-full px-3.5 py-2.5 border text-sm ${theme.cardBg} ${theme.border}`} />
              </div>

              <h2 className={`text-base font-bold border-b pb-3 pt-2 ${theme.border}`}>2. طريقة الدفع</h2>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs font-bold">
                {[
                  { id: 'الدفع عند الاستلام (COD)', desc: 'نقداً عند استلام الأوردر' },
                  { id: 'إنستاباي (InstaPay)', desc: 'تحويل فوري عبر إنستاباي' },
                  { id: 'محفظة إلكترونية (فودافون / أورانج / اتصالات كاش)', desc: 'تحويل محفظة إلكترونية' },
                  { id: 'بطاقة بنكية (Visa / Mastercard)', desc: 'دفع بالبطاقة البنكية' }
                ].map(pm => (
                  <label key={pm.id} className={`p-3.5 border cursor-pointer ${paymentMethod === pm.id ? 'border-current font-black' : theme.border}`}>
                    <div className="flex items-center gap-2">
                      <input type="radio" name="pm" checked={paymentMethod === pm.id} onChange={() => setPaymentMethod(pm.id)} />
                      <span>{pm.id}</span>
                    </div>
                    <p className={`text-[11px] font-normal mt-1 mr-5 ${theme.mutedText}`}>{pm.desc}</p>
                  </label>
                ))}
              </div>

              <button type="submit" className={`w-full py-4 text-sm font-bold transition mt-4 ${theme.accentBtn}`}>
                تأكيد الطلب وإصدار الفاتورة ({total} ج.م)
              </button>
            </form>

            <div className={`lg:col-span-5 border p-6 space-y-4 ${theme.border}`}>
              <h2 className={`text-base font-bold border-b pb-3 ${theme.border}`}>ملخص الطلب</h2>
              <div className="space-y-3 max-h-80 overflow-y-auto">
                {cart.map(item => (
                  <div key={item.cartKey} className={`flex items-center justify-between gap-3 border-b pb-3 text-xs ${theme.border}`}>
                    <img src={item.image} alt="" className="w-14 h-16 object-cover" />
                    <div className="flex-1 min-w-0">
                      <p className="font-bold truncate">{item.name}</p>
                      <p className={theme.mutedText}>{item.selectedOption}</p>
                      <div className="flex items-center gap-2 mt-1">
                        <button type="button" onClick={() => updateCartQty(item.cartKey, -1)} className={`px-2 border ${theme.border}`}>-</button>
                        <span>{item.quantity}</span>
                        <button type="button" onClick={() => updateCartQty(item.cartKey, 1)} className={`px-2 border ${theme.border}`}>+</button>
                        <button type="button" onClick={() => removeFromCart(item.cartKey)} className="text-rose-600 underline mr-2">حذف</button>
                      </div>
                    </div>
                    <span className="font-bold">{item.price * item.quantity} ج.م</span>
                  </div>
                ))}
              </div>

              <div className="space-y-2 pt-2 text-sm">
                <div className="flex justify-between"><span>المجموع الفرعي:</span><strong>{cartSubtotal} ج.م</strong></div>
                <div className="flex justify-between"><span>الشحن ({governorate}):</span><strong>{shipping} ج.م</strong></div>
                <div className={`flex justify-between text-base font-black border-t pt-3 ${theme.border}`}><span>الإجمالي النهائي:</span><span>{total} ج.م</span></div>
              </div>
            </div>
          </div>
        </div>
      );
    }

              <div><strong>العميل:</strong> {invoice.customerName}</div>
              <div dir="ltr" className="text-right"><strong>الموبايل:</strong> {invoice.phone}</div>
              <div className="sm:col-span-2"><strong>العنوان:</strong> {invoice.governorate} — {invoice.address}</div>
              <div className="sm:col-span-2"><strong>طريقة الدفع:</strong> {invoice.paymentMethod}</div>
              {invoice.giftNote && <div className="sm:col-span-2 bg-white p-2 border"><strong>كارت الإهداء:</strong> "{invoice.giftNote}"</div>}
            </div>

            <table className="w-full text-right text-xs border-collapse">
              <thead>
                <tr className="border-y bg-stone-100">
                  <th className="p-2.5">المنتج</th>
                  <th className="p-2.5">الاختيار</th>
                  <th className="p-2.5">الكمية</th>
                  <th className="p-2.5">السعر</th>
                  <th className="p-2.5">الإجمالي</th>
                </tr>
              </thead>
              <tbody className="divide-y">
                {invoice.items.map(i => (
                  <tr key={i.cartKey}>
                    <td className="p-2.5 font-bold">{i.name}</td>
                    <td className="p-2.5">{i.selectedOption}</td>
                    <td className="p-2.5">{i.quantity}</td>
                    <td className="p-2.5">{i.price} ج.م</td>
                    <td className="p-2.5 font-bold">{i.price * i.quantity} ج.م</td>
                  </tr>
                ))}
              </tbody>
            </table>

            <div className="space-y-1.5 text-sm border-t pt-4">
              <div className="flex justify-between"><span>المجموع الفرعي:</span><strong>{invoice.subtotal} ج.م</strong></div>
              <div className="flex justify-between"><span>الشحن ({invoice.governorate}):</span><strong>{invoice.shipping} ج.م</strong></div>
              <div className="flex justify-between text-base font-black border-t pt-2"><span>الإجمالي المطلوب:</span><span>{invoice.total} ج.م</span></div>
            </div>

            <div className="flex flex-col sm:flex-row gap-3 pt-2 no-print">
              <button onClick={() => window.print()} className="flex-1 py-3 bg-stone-900 text-white text-xs font-bold">طباعة الفاتورة / حفظ PDF</button>
              <button onClick={onContinueShopping} className="flex-1 py-3 border border-stone-900 text-stone-900 text-xs font-bold">العودة للمتجر</button>
            </div>
          </div>
        </div>
      );
    }

    function PolicyPage({ type, settings, theme, onBack }) {
      return (
        <div className="max-w-3xl mx-auto px-4 py-12 space-y-6">
          <button onClick={onBack} className="text-xs font-bold underline">← العودة للمتجر</button>
          {type === 'exchange' ? (
            <div className={`space-y-4 border p-6 sm:p-8 ${theme.surfaceBg} ${theme.border}`}>
              <h1 className="text-2xl font-bold">سياسة الاستبدال والاسترجاع</h1>
              <p className="text-sm leading-relaxed opacity-85">
                في {settings.storeName} نحرص على وصول هديتك بأعلى جودة وتغليف مثالي. في حال وجود أي عيب صناعة أو تلف أثناء الشحن يتم الاستبدال خلال 14 يوماً.
              </p>
              <p className={`text-xs ${theme.mutedText}`}>واتساب: {settings.whatsapp}</p>
            </div>
          ) : (
            <div className={`space-y-4 border p-6 sm:p-8 ${theme.surfaceBg} ${theme.border}`}>
              <h1 className="text-2xl font-bold">أسعار الشحن لجميع محافظات مصر</h1>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
                {Object.entries(settings.shippingRates).map(([gov, rate]) => (
                  <div key={gov} className={`flex justify-between p-2.5 border ${theme.cardBg} ${theme.border}`}>
                    <span>{gov}</span>
                    <strong>{rate} ج.م</strong>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    function AdminLogin({ storeName, onSuccess, onBack }) {
      const [pass, setPass] = useState('');
      const [err, setErr] = useState('');
      const submit = (e) => {
        e.preventDefault();
        if (pass === ADMIN_PASSCODE || pass === '123456') onSuccess();
        else setErr('كلمة المرور غير صحيحة');
      };
      return (
        <div className="min-h-screen bg-stone-100 text-stone-900 flex items-center justify-center p-4">
          <div className="bg-white border border-stone-200 max-w-md w-full p-8 space-y-5 shadow-sm">
            <h1 className="text-lg font-bold text-center">لوحة تحكم {storeName}</h1>
            {err && <p className="text-xs font-bold text-rose-700 bg-rose-50 p-2.5 text-center">{err}</p>}
            <form onSubmit={submit} className="space-y-4">
              <input type="password" required value={pass} onChange={e => setPass(e.target.value)} placeholder="كلمة المرور" className="w-full px-4 py-3 border border-stone-300 text-sm" />
              <button type="submit" className="w-full py-3 bg-stone-900 text-white text-xs font-bold">دخول</button>
            </form>
            <button onClick={onBack} className="w-full text-xs text-stone-500 underline">العودة للمتجر</button>
          </div>
        </div>
      );
    }

    function AdminPanel({
      settings,
      setSettings,
      categoriesList,
      setCategoriesList,
      products,
      setProducts,
      sliders,
      setSliders,
      orders,
      setOrders,
      customers,
      syncStatus,
      onSyncNow,
      onBackToStore,
      onLogout
    }) {
      const [tab, setTab] = useState('dashboard');
      const [editingId, setEditingId] = useState(null);
      const [name, setName] = useState('');
      const [arabicSubtitle, setArabicSubtitle] = useState('');
      const [category, setCategory] = useState(categoriesList[0] || 'بوكسات هدايا');
      const [price, setPrice] = useState('');
      const [oldPrice, setOldPrice] = useState('');
      const [optionsText, setOptionsText] = useState('Standard, Deluxe');
      const [description, setDescription] = useState('');
      const [image, setImage] = useState('');
      const [newCategoryName, setNewCategoryName] = useState('');
      const [cloudUrl, setCloudUrl] = useState(settings.cloudSyncUrl || '');
      const [msg, setMsg] = useState('');

      const flash = (text) => {
        setMsg(text);
        setTimeout(() => setMsg(''), 3000);
      };

      const totalSales = useMemo(() => orders.reduce((s, o) => s + (Number(o.total) || 0), 0), [orders]);

      const handleMobileUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result === 'string') setImage(reader.result);
        };
        reader.readAsDataURL(file);
      };

      const startEditProduct = (p) => {
        setEditingId(p.id);
        setName(p.name);
        setArabicSubtitle(p.arabicSubtitle || '');
        setCategory(p.category);
        setPrice(String(p.price));
        setOldPrice(p.oldPrice ? String(p.oldPrice) : '');
        setOptionsText((p.options || []).join(', '));
        setDescription(p.description || '');
        setImage(p.image || '');
        setTab('products');
      };

      const resetProductForm = () => {
        setEditingId(null);
        setName('');
        setArabicSubtitle('');
        setPrice('');
        setOldPrice('');
        setDescription('');
        setImage('');
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        if (!name.trim() || !price) return;
        const parsedOptions = optionsText.split(',').map(s => s.trim()).filter(Boolean);
        const finalImg = image || 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=900&q=80';

        if (editingId) {
          setProducts(prev =>
            prev.map(item =>
              item.id === editingId
                ? {
                    ...item,
                    name: name.trim(),
                    arabicSubtitle: arabicSubtitle.trim(),
                    category: (category || 'عام').trim(),
                    price: Number(price),
                    oldPrice: oldPrice ? Number(oldPrice) : null,
                    options: parsedOptions.length ? parsedOptions : ['قياسي'],
                    image: finalImg,
                    description: description.trim()
                  }
                : item
            )
          );
          resetProductForm();
          flash('تم تحديث بيانات المنتج ✓');
        } else {
          const newProd = {
            id: 'FRF-' + Math.floor(100 + Math.random() * 900),
            name: name.trim(),
            arabicSubtitle: arabicSubtitle.trim(),
            category: (category || 'عام').trim(),
            price: Number(price),
            oldPrice: oldPrice ? Number(oldPrice) : null,
            isBestSeller: true,
            options: parsedOptions.length ? parsedOptions : ['قياسي'],
            image: finalImg,
            hoverImage: '',
            description: description.trim(),
            inStock: true
          };
          setProducts(prev => [newProd, ...prev]);
          resetProductForm();
          flash('تمت إضافة المنتج ونشره في المتجر ✓');
        }
      };

      const addNewCategory = (e) => {
        e.preventDefault();
        const clean = newCategoryName.trim();
        if (!clean) return;
        if (!categoriesList.includes(clean)) {
          setCategoriesList(prev => [...prev, clean]);
        }
        setNewCategoryName('');
        flash(`تمت إضافة قسم "${clean}" ✓`);
      };

      return (
        <div className="min-h-screen bg-stone-50 text-stone-900 flex flex-col lg:flex-row">
          <aside className="w-full lg:w-64 bg-stone-950 text-stone-300 p-4 flex lg:flex-col justify-between gap-3">
            <div className="flex lg:flex-col gap-2 overflow-x-auto">
              {[
                { id: 'dashboard', label: 'نظرة عامة وإحصائيات' },
                { id: 'products', label: 'المنتجات ورفع الصور' },
                { id: 'categories', label: 'إدارة الأقسام' },
                { id: 'shipping', label: 'شحن المحافظات (27)' },
                { id: 'sliders', label: 'البانر والإعلانات' },
                { id: 'orders', label: `الطلبات (${orders.length})` },
                { id: 'customers', label: `العملاء (${customers.length})` },
                { id: 'settings', label: 'الأنماط والإعدادات' }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className={`px-4 py-2.5 text-xs font-bold whitespace-nowrap text-right transition ${
                    tab === t.id ? 'bg-white text-stone-950' : 'hover:bg-stone-900'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>
            <div className="flex lg:flex-col gap-2">
              <button onClick={onSyncNow} className="px-3 py-2 bg-emerald-800 text-white text-xs font-bold">مزامنة</button>
              <button onClick={onBackToStore} className="px-3 py-2 bg-stone-800 text-white text-xs font-bold">المتجر</button>
              <button onClick={onLogout} className="px-3 py-2 bg-rose-900 text-white text-xs font-bold">خروج</button>
            </div>
          </aside>

          <main className="flex-1 p-5 sm:p-8 space-y-6">
            <div className="flex flex-wrap items-center justify-between gap-2 border-b pb-4">
              <h1 className="text-xl font-bold">لوحة تحكم {settings.storeName}</h1>
              <span className="text-xs font-bold px-3 py-1 bg-white border">{syncStatus}</span>
            </div>

            {msg && <div className="p-3 bg-emerald-900 text-white text-xs font-bold">{msg}</div>}

            {tab === 'dashboard' && (
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div className="bg-white p-5 border">
                  <p className="text-xs text-stone-500 font-bold">إجمالي المبيعات</p>
                  <p className="text-2xl font-black mt-1">{totalSales} ج.م</p>
                </div>
                <div className="bg-white p-5 border">
                  <p className="text-xs text-stone-500 font-bold">عدد الطلبات</p>
                  <p className="text-2xl font-black mt-1">{orders.length}</p>
                </div>
                <div className="bg-white p-5 border">
                  <p className="text-xs text-stone-500 font-bold">عدد المنتجات</p>
                  <p className="text-2xl font-black mt-1">{products.length}</p>
                </div>
                <div className="bg-white p-5 border">
                  <p className="text-xs text-stone-500 font-bold">العملاء</p>
                  <p className="text-2xl font-black mt-1">{customers.length}</p>
                </div>
              </div>
            )}

            {tab === 'products' && (
              <div className="space-y-6">
                <form onSubmit={handleSaveProduct} className="bg-white p-6 border border-stone-200 space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="font-bold text-base">
                      {editingId ? `تعديل منتج (${editingId})` : 'إضافة منتج جديد (رفع مباشر من الموبايل)'}
                    </h2>
                    {editingId && (
                      <button type="button" onClick={resetProductForm} className="text-xs font-bold underline text-rose-700">
                        إلغاء التعديل
                      </button>
                    )}
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    <input type="text" required value={name} onChange={e => setName(e.target.value)} placeholder="اسم المنتج *" className="px-3.5 py-2.5 border text-sm" />
                    <input type="text" value={arabicSubtitle} onChange={e => setArabicSubtitle(e.target.value)} placeholder="وصف قصير بالعربي" className="px-3.5 py-2.5 border text-sm" />
                    <select value={category} onChange={e => setCategory(e.target.value)} className="px-3.5 py-2.5 border text-sm bg-white font-semibold">
                      {categoriesList.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                    <input type="number" required value={price} onChange={e => setPrice(e.target.value)} placeholder="السعر الحالي (ج.م) *" className="px-3.5 py-2.5 border text-sm" />
                    <input type="number" value={oldPrice} onChange={e => setOldPrice(e.target.value)} placeholder="السعر قبل الخصم (لشارة Sale)" className="px-3.5 py-2.5 border text-sm" />
                    <input type="text" value={optionsText} onChange={e => setOptionsText(e.target.value)} placeholder="الخيارات مفصولة بفاصلة (,)" className="px-3.5 py-2.5 border text-sm" />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 items-center">
                    <div>
                      <label className="block text-xs font-bold mb-1">ارفع صورة من الموبايل:</label>
                      <input type="file" accept="image/*" onChange={handleMobileUpload} className="w-full text-xs" />
                    </div>
                    <input type="text" value={description} onChange={e => setDescription(e.target.value)} placeholder="تفاصيل المنتج" className="px-3.5 py-2.5 border text-sm" />
                  </div>

                  {image && <img src={image} alt="Preview" className="w-24 h-28 object-cover border" />}

                  <button type="submit" className="px-6 py-3 bg-stone-900 text-white text-xs font-bold">
                    {editingId ? 'حفظ التعديلات' : 'حفظ ونشر المنتج'}
                  </button>
                </form>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  {products.map(p => (
                    <div key={p.id} className="bg-white p-3.5 border space-y-2 flex flex-col justify-between">
                      <div>
                        <img src={p.image} alt={p.name} className="w-full aspect-[3/4] object-cover mb-2" />
                        <p className="text-[11px] text-stone-400">{p.category}</p>
                        <h3 className="text-xs font-bold line-clamp-2">{p.name}</h3>
                        <p className="text-xs font-black mt-1">{p.price} EGP</p>
                      </div>
                      <div className="flex gap-1.5 pt-2">
                        <button onClick={() => startEditProduct(p)} className="px-2.5 py-1.5 bg-stone-100 text-stone-900 text-[11px] font-bold">
                          تعديل
                        </button>
                        <button
                          onClick={() => setProducts(prev => prev.map(item => item.id === p.id ? { ...item, inStock: !item.inStock } : item))}
                          className={`flex-1 py-1.5 text-[11px] font-bold border ${p.inStock ? 'border-emerald-700 text-emerald-800' : 'border-stone-400 text-stone-500'}`}
                        >
                          {p.inStock ? 'in stock' : 'Sold out'}
                        </button>
                        <button
                          onClick={() => { setProducts(prev => prev.filter(i => i.id !== p.id)); flash('تم حذف المنتج'); }}
                          className="px-2.5 py-1.5 bg-rose-50 text-rose-700 text-[11px] font-bold"
                        >
                          حذف
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'categories' && (
              <div className="bg-white p-6 border space-y-5 max-w-xl">
                <h2 className="font-bold text-base">إدارة أقسام المتجر</h2>
                <form onSubmit={addNewCategory} className="flex gap-2">
                  <input
                    type="text"
                    value={newCategoryName}
                    onChange={e => setNewCategoryName(e.target.value)}
                    placeholder="اسم قسم جديد (مثال: هدايا رجالي)"
                    className="flex-1 px-3.5 py-2.5 border text-sm"
                  />
                  <button type="submit" className="px-5 py-2.5 bg-stone-900 text-white text-xs font-bold">إضافة</button>
                </form>
                <div className="space-y-2">
                  {categoriesList.map(cat => (
                    <div key={cat} className="flex items-center justify-between p-3 bg-stone-50 border text-xs font-bold">
                      <span>{cat}</span>
                      <button
                        onClick={() => setCategoriesList(prev => prev.filter(c => c !== cat))}
                        className="text-rose-700 underline"
                      >
                        حذف
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'shipping' && (
              <div className="bg-white p-6 border space-y-4">
                <h2 className="font-bold text-base">تعديل مصاريف الشحن لجميع محافظات مصر (ج.م)</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                  {Object.entries(settings.shippingRates).map(([gov, rate]) => (
                    <div key={gov} className="flex items-center justify-between p-3 bg-stone-50 border">
                      <span className="text-xs font-bold">{gov}</span>
                      <input
                        type="number"
                        value={rate}
                        onChange={e => {
                          const val = Number(e.target.value);
                          setSettings(prev => ({ ...prev, shippingRates: { ...prev.shippingRates, [gov]: val } }));
                        }}
                        className="w-24 px-2 py-1 border bg-white text-center text-xs font-bold"
                      />
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'sliders' && (
              <div className="bg-white p-6 border space-y-4 max-w-2xl">
                <h2 className="font-bold text-base">تعديل البانر الرئيسي والشريط العلوي</h2>
                <div className="space-y-2">
                  <label className="text-xs font-bold">إعلانات الشريط العلوي:</label>
                  {settings.announcements.map((ann, idx) => (
                    <input
                      key={idx}
                      type="text"
                      value={ann}
                      onChange={e => {
                        const updated = [...settings.announcements];
                        updated[idx] = e.target.value;
                        setSettings(prev => ({ ...prev, announcements: updated }));
                      }}
                      className="w-full px-3 py-2 border text-xs"
                    />
                  ))}
                </div>
                <div className="space-y-3 pt-3 border-t">
                  <label className="text-xs font-bold">شرائح البانر الرئيسي:</label>
                  {sliders.map((s, idx) => (
                    <div key={s.id} className="p-3 bg-stone-50 border space-y-2">
                      <input type="text" value={s.title} onChange={e => setSliders(prev => prev.map((it, i) => i === idx ? { ...it, title: e.target.value } : it))} className="w-full px-3 py-2 border bg-white text-xs font-bold" />
                      <input type="text" value={s.subtitle} onChange={e => setSliders(prev => prev.map((it, i) => i === idx ? { ...it, subtitle: e.target.value } : it))} className="w-full px-3 py-2 border bg-white text-xs" />
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'orders' && (
              <div className="space-y-3">
                {orders.length === 0 ? (
                  <p className="text-xs text-stone-500 bg-white p-6 border">لا توجد طلبات مسجلة بعد.</p>
                ) : (
                  orders.map(o => (
                    <div key={o.id} className="bg-white p-4 border flex flex-wrap items-center justify-between gap-3 text-xs">
                      <div>
                        <p className="font-bold text-sm">{o.id} — {o.customerName} ({o.phone})</p>
                        <p className="text-stone-500 mt-0.5">{o.governorate} - {o.address} | {o.paymentMethod} | الإجمالي: {o.total} ج.م</p>
                      </div>
                      <select
                        value={o.status}
                        onChange={e => setOrders(prev => prev.map(it => it.id === o.id ? { ...it, status: e.target.value } : it))}
                        className="px-3 py-1.5 border font-bold bg-stone-50"
                      >
                        <option value="جديد">جديد</option>
                        <option value="قيد التجهيز">قيد التجهيز</option>
                        <option value="تم الشحن">تم الشحن</option>
                        <option value="تم التسليم">تم التسليم</option>
                        <option value="ملغي">ملغي</option>
                      </select>
                    </div>
                  ))
                )}
              </div>
            )}

            {tab === 'customers' && (
              <div className="bg-white border overflow-x-auto">
                <table className="w-full text-right text-xs">
                  <thead className="bg-stone-100">
                    <tr>
                      <th className="p-3">الاسم</th>
                      <th className="p-3">الموبايل</th>
                      <th className="p-3">المحافظة والعنوان</th>
                      <th className="p-3">عدد الطلبات</th>
                      <th className="p-3">إجمالي المشتريات</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y">
                    {customers.map((c, idx) => (
                      <tr key={idx}>
                        <td className="p-3 font-bold">{c.name}</td>
                        <td className="p-3" dir="ltr">{c.phone}</td>
                        <td className="p-3">{c.governorate} — {c.address}</td>
                        <td className="p-3 font-bold">{c.ordersCount}</td>
                        <td className="p-3 font-bold text-emerald-800">{c.totalSpent} ج.م</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {tab === 'settings' && (
              <div className="bg-white p-6 border space-y-4 max-w-xl">
                <h2 className="font-bold text-base">نمط التصميم وإعدادات المتجر</h2>
                <div>
                  <label className="block text-xs font-bold mb-1">نمط التصميم الافتراضي:</label>
                  <select
                    value={settings.themeId}
                    onChange={e => setSettings(prev => ({ ...prev, themeId: e.target.value }))}
                    className="w-full px-3.5 py-2.5 border text-sm bg-white font-bold"
                  >
                    {Object.values(THEMES).map(t => (
                      <option key={t.id} value={t.id}>{t.arabicName} ({t.name})</option>
                    ))}
                  </select>
                </div>
                <input type="text" value={settings.storeName} onChange={e => setSettings(prev => ({ ...prev, storeName: e.target.value }))} placeholder="اسم المتجر" className="w-full px-3.5 py-2.5 border text-sm" />
                <input type="text" value={settings.whatsapp} onChange={e => setSettings(prev => prev({ ...prev, whatsapp: e.target.value }))} placeholder="رقم الواتساب" className="w-full px-3.5 py-2.5 border text-sm" />
                <input type="url" dir="ltr" value={cloudUrl} onChange={e => setCloudUrl(e.target.value)} placeholder="رابط المزامنة السحابية (اختياري)" className="w-full px-3.5 py-2.5 border text-sm text-left" />
                <button onClick={() => { setSettings(prev => ({ ...prev, cloudSyncUrl: cloudUrl.trim() })); flash('تم حفظ الإعدادات ✓'); }} className="px-6 py-2.5 bg-stone-900 text-white text-xs font-bold">
                  حفظ الإعدادات
                </button>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
