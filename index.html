                      <input type="number" value={shippingRates.other} onChange={(e) => setShippingRates({...shippingRates, other: Number(e.target.value)})} className="w-full bg-stone-50 border border-stone-200 rounded-2xl px-4 py-3 text-sm font-bold" />
                    </div>
                    <button onClick={() => showToast('✅ تم حفظ أسعار الشحن بنجاح')} className="w-full bg-brand-800 text-white py-3.5 rounded-2xl font-black text-sm shadow-md">
                      حفظ إعدادات الشحن
                    </button>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Cart Slide-over Drawer */}
          {cartOpen && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex justify-end animate-fadeIn">
              <div className="w-full max-w-md bg-white h-full flex flex-col shadow-2xl">
                <div className="p-6 border-b border-stone-200 flex items-center justify-between">
                  <h2 className="font-black text-lg text-stone-900">سلة المشتريات ({cartCount})</h2>
                  <button onClick={() => setCartOpen(false)} className="p-2 rounded-xl bg-stone-100 text-stone-700 font-bold hover:bg-stone-200"><Icons.Close className="w-5 h-5" /></button>
                </div>
                <div className="flex-1 overflow-y-auto p-6 space-y-4">
                  {cart.length === 0 ? (
                    <div className="text-center py-24 text-stone-400 font-bold text-sm">سلة المشتريات فارغة حالياً</div>
                  ) : (
                    cart.map(item => (
                      <div key={item.id} className="flex items-center gap-4 bg-stone-50 p-4 rounded-2xl border border-stone-100">
                        <img src={item.image} alt={item.name} className="w-16 h-16 rounded-2xl object-cover bg-white" />
                        <div className="flex-1">
                          <h4 className="font-extrabold text-xs text-stone-900 line-clamp-1">{item.name}</h4>
                          <div className="text-brand-800 font-black text-sm mt-1">{item.price * item.qty} ج.م</div>
                          <div className="flex items-center justify-between mt-2">
                            <div className="flex items-center gap-2">
                              <button onClick={() => updateCartQty(item.id, -1)} className="w-7 h-7 rounded-xl bg-white border border-stone-200 font-black text-xs shadow-xs flex items-center justify-center"><Icons.Minus className="w-3.5 h-3.5" /></button>
                              <span className="text-xs font-black">{item.qty}</span>
                              <button onClick={() => updateCartQty(item.id, 1)} className="w-7 h-7 rounded-xl bg-white border border-stone-200 font-black text-xs shadow-xs flex items-center justify-center"><Icons.Plus className="w-3.5 h-3.5" /></button>
                            </div>
                            <button onClick={() => removeFromCart(item.id)} className="text-stone-400 hover:text-brand-700 p-1"><Icons.Trash className="w-4 h-4" /></button>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>
                {cart.length > 0 && (
                  <div className="p-6 border-t border-stone-200 space-y-4 bg-stone-50">
                    <div className="flex justify-between font-black text-base">
                      <span>المجموع الفرعي</span>
                      <span className="text-brand-800">{cartSubtotal} ج.م</span>
                    </div>
                    <button onClick={() => { setCartOpen(false); setCurrentPage('checkout'); }} className="w-full bg-brand-800 hover:bg-brand-700 text-white py-4 rounded-2xl font-black text-sm shadow-xl transition-all flex items-center justify-center gap-2">
                      <span>إتمام الطلب الآن</span>
                      <Icons.ShoppingBag className="w-4 h-4" />
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-stone-900 text-stone-300 mt-20">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 grid grid-cols-1 md:grid-cols-3 gap-10">
              <div className="space-y-4">
                <div className="flex items-center gap-3">
                  <div className="w-12 h-12 rounded-2xl bg-brand-800 text-white flex items-center justify-center text-xl shadow">🎁</div>
                  <div>
                    <div className="text-lg font-black text-white">{STORE_INFO.name}</div>
                    <div className="text-[11px] text-amber-400 font-bold">{STORE_INFO.slogan}</div>
                  </div>
                </div>
                <p className="text-xs text-stone-400 leading-relaxed">
                  وجهتك الأولى للهدايا العصرية والمجات والإكسسوارات والتحف الديكورية بجودة عالية وأسعار مناسبة.
                </p>
              </div>
              <div>
                <h4 className="text-white font-black text-sm mb-4">روابط سريعة</h4>
                <ul className="space-y-2 text-xs font-bold text-stone-400">
                  <li><button onClick={() => setCurrentPage('home')} className="hover:text-white transition-colors">الرئيسية</button></li>
                  <li><button onClick={() => setCurrentPage('shop')} className="hover:text-white transition-colors">المتجر</button></li>
                  <li><button onClick={() => setCurrentPage('offers')} className="hover:text-white transition-colors">العروض</button></li>
                  <li><button onClick={() => setCurrentPage('about')} className="hover:text-white transition-colors">من نحن</button></li>
                </ul>
              </div>
              <div>
                <h4 className="text-white font-black text-sm mb-4">تواصل معنا</h4>
                <ul className="space-y-2 text-xs font-bold text-stone-400">
                  <li>الهاتف / واتساب: <span dir="ltr">{STORE_INFO.phone}</span></li>
                  <li>الإيميل: {STORE_INFO.email}</li>
                  <li>العنوان: {STORE_INFO.address}</li>
                </ul>
              </div>
            </div>
            <div className="border-t border-stone-800 py-6 text-center text-xs font-bold text-stone-500">
              © 2026 {STORE_INFO.name}. جميع الحقوق محفوظة.
            </div>
          </footer>

          {/* Floating WhatsApp Button */}
          <a href={`https://wa.me/${STORE_INFO.whatsapp}?text=${encodeURIComponent('مرحباً، أود الاستفسار عن منتجات Farafero Store')}`} target="_blank" rel="noopener noreferrer" aria-label="تواصل عبر واتساب" className="fixed bottom-6 left-6 z-40 bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3.5 rounded-full shadow-2xl flex items-center gap-2 text-xs font-black transition-transform hover:scale-105">
            <Icons.WhatsApp className="w-5 h-5" />
            <span>تواصل معنا</span>
          </a>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
