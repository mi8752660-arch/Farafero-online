<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farafero Store | فرفيرو للهدايا والتحف العصرية</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; scroll-behavior: smooth; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f5f5f4; }
    ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #9f1239; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
  </style>
</head>
<body class="bg-stone-50 text-stone-900 antialiased min-h-screen flex flex-col selection:bg-rose-800 selection:text-white">

  <div id="root"></div>

  <!-- React, ReactDOM & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DEFAULT_CATEGORIES = [
      'الكل',
      'مجات وأكواب',
      'إضاءات وديكور',
      'إكسسوارات وساعات',
      'شموع وروائح',
      'بوكسات هدايا',
      'برفان وميكاب',
      'دباديب وورود',
      'محافظ جلدية'
    ];

    const INITIAL_PRODUCTS = [
      {
        id: 'p1',
        name: 'مج حراري بتصميم رخامي فاخر وغطاء ذهبي',
        category: 'مجات وأكواب',
        price: 220,
        oldPrice: 280,
        isOffer: true,
        inStock: true,
        rating: 5.0,
        image: 'https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?auto=format&fit=crop&w=800&q=80',
        description: 'مج سيراميك فاخر يحافظ على حرارة المشروبات لأطول فترة مع ملعقة ذهبية أنيقة وتغليف هدايا مبطن.'
      },
      {
        id: 'p2',
        name: 'عطر نسائي فرنسي فخم بنفحات الفانيليا والزهور',
        category: 'برفان وميكاب',
        price: 750,
        oldPrice: 950,
        isOffer: true,
        inStock: true,
        rating: 4.9,
        image: 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=800&q=80',
        description: 'عطر ثابت يدوم طوال اليوم يمنحك حضوراً طاغياً وجذاباً في كل المناسبات.'
      },
      {
        id: 'p3',
        name: 'دبدوب أحمر عميق فائق النعومة مع قلب حب',
        category: 'دباديب وورود',
        price: 420,
        oldPrice: 500,
        isOffer: true,
        inStock: true,
        rating: 5.0,
        image: 'https://images.unsplash.com/photo-1559454403-b8fb8852101e?auto=format&fit=crop&w=800&q=80',
        description: 'دبدوب هدية مثالي للتعبير عن الحب والمشاعر الدافئة في الفلانتين وأعياد الميلاد.'
      },
      {
        id: 'p4',
        name: 'بوكس ورد جوري صناعي دائم مع شوكولاتة فاخرة',
        category: 'دباديب وورود',
        price: 580,
        oldPrice: null,
        isOffer: false,
        inStock: true,
        rating: 4.9,
        image: 'https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&w=800&q=80',
        description: 'تنسيق راقي من الورود الدائمة مع تشكيلة شوكولاتة بلجيكية فاخرة.'
      },
      {
        id: 'p5',
        name: 'سلسلة وتريات ستانلس ستيل مضادة للماء مطلي ذهب',
        category: 'إكسسوارات وساعات',
        price: 290,
        oldPrice: 350,
        isOffer: true,
        inStock: true,
        rating: 4.8,
        image: 'https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=800&q=80',
        description: 'سلسلة عصرية أنيقة غير قابلة للصدأ مع علبة قطيفة هدية.'
      },
      {
        id: 'p6',
        name: 'محافظ جلد طبيعي رجالي مع إمكانية حفر الاسم',
        category: 'محافظ جلدية',
        price: 340,
        oldPrice: null,
        isOffer: false,
        inStock: true,
        rating: 4.9,
        image: 'https://images.unsplash.com/photo-1627123424574-724758594e93?auto=format&fit=crop&w=800&q=80',
        description: 'محفظة من الجلد الطبيعي الفاخر بتصميم عملي وأنيق لبطاقاتك ونقودك.'
      },
      {
        id: 'p7',
        name: 'مجموعة ميكاب أساسية متكاملة (روج، باليت آيشادو، ماسكرا)',
        category: 'برفان وميكاب',
        price: 890,
        oldPrice: 1100,
        isOffer: true,
        inStock: true,
        rating: 5.0,
        image: 'https://images.unsplash.com/photo-1512496015851-a90fb38ba796?auto=format&fit=crop&w=800&q=80',
        description: 'طقم مستحضرات تجميل أصلي بجودة عالمية يناسب إطلالتك اليومية والمناسبات.'
      },
      {
        id: 'p8',
        name: 'ساعة يد كلاسيكية نسائية بسوار جلدي راقي',
        category: 'إكسسوارات وساعات',
        price: 490,
        oldPrice: null,
        isOffer: false,
        inStock: true,
        rating: 5.0,
        image: 'https://images.unsplash.com/photo-1524592094714-0f0654e20314?auto=format&fit=crop&w=800&q=80',
        description: 'تصميم عصري وجذاب يناسب جميع المناسبات الرسمية والكاجوال مع ضمان سنة.'
      }
    ];

    const DEFAULT_STORE_INFO = {
      name: 'Farafero Store',
      arabicName: 'فرفيرو ستور',
      slogan: 'Gifts with Love',
      phone: '01005187411',
      whatsapp: '201005187411',
      email: 'info@faraferostore.com',
      address: 'الإسكندرية، مصر',
      freeShippingThreshold: 1000,
      heroBadge: '✨ تشكيلة هدايا 2026 الأصلية وصلت الآن',
      heroTitle: 'هدايا استثنائية تصنع لحظات لا تُنسى',
      heroDesc: 'في فرفيرو ستور جمعنالك أرقى المجان، الإضاءات الديكورية، الإكسسوارات الفاخرة، العطور ومستحضرات التجميل، والبوكسات الجاهزة بتغليف ملكي يليق بكل مناسباتك.'
    };

    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [cartOpen, setCartOpen] = useState(false);
      const [wishlistOpen, setWishlistOpen] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState('الكل');
      const [sortBy, setSortBy] = useState('default');
      const [searchQuery, setSearchQuery] = useState('');
      const [toast, setToast] = useState(null);
      const [quickViewProduct, setQuickViewProduct] = useState(null);
      const [quickViewQty, setQuickViewQty] = useState(1);

      // Store Customization State
      const [storeInfo, setStoreInfo] = useState(() => {
        const saved = localStorage.getItem('farafero_store_info');
        return saved ? JSON.parse(saved) : DEFAULT_STORE_INFO;
      });

      // Announcement Banner State
      const [announcementText, setAnnouncementText] = useState(() => {
        const saved = localStorage.getItem('farafero_announcement');
        return saved !== null ? saved : '🎁 شحن مجاني للطلبات فوق 1000 ج.م • استخدم كود FARAFERO10 لخصم 10%';
      });

      // Categories State
      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem('farafero_categories');
        return saved ? JSON.parse(saved) : DEFAULT_CATEGORIES;
      });
      const [newCategoryInput, setNewCategoryInput] = useState('');

      // Custom Box Builder State
      const [customBox, setCustomBox] = useState({
        boxStyle: 'بوكس ملكي أسود × ذهبي',
        mug: 'مج رخامي بغطاء ذهبي',
        extra: 'شمعة عود وفانيليا',
        cardText: ''
      });

      // Persistent Storage
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('farafero_products');
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
      });

      const [cart, setCart] = useState(() => {
        const saved = localStorage.getItem('farafero_cart');
        return saved ? JSON.parse(saved) : [];
      });

      const [wishlist, setWishlist] = useState(() => {
        const saved = localStorage.getItem('farafero_wishlist');
        return saved ? JSON.parse(saved) : [];
      });

      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem('farafero_orders');
        return saved ? JSON.parse(saved) : [];
      });

      const [customers, setCustomers] = useState(() => {
        const saved = localStorage.getItem('farafero_customers');
        return saved ? JSON.parse(saved) : [];
      });

      const [shippingRates, setShippingRates] = useState(() => {
        const saved = localStorage.getItem('farafero_shipping');
        return saved ? JSON.parse(saved) : { alexandria: 45, cairo: 65, other: 85 };
      });

      const [coupons, setCoupons] = useState(() => {
        const saved = localStorage.getItem('farafero_coupons');
        return saved ? JSON.parse(saved) : [{ code: 'FARAFERO10', discountPercent: 10 }];
      });

      const [couponInput, setCouponInput] = useState('');
      const [appliedCoupon, setAppliedCoupon] = useState(null);

      // Admin State
      const [isAdmin, setIsAdmin] = useState(false);
      const [adminPasswordInput, setAdminPasswordInput] = useState('');
      const [adminTab, setAdminTab] = useState('products');
      const [editingProduct, setEditingProduct] = useState(null);
      const [newCouponForm, setNewCouponForm] = useState({ code: '', discountPercent: '' });
      const [newProductForm, setNewProductForm] = useState({
        name: '', category: 'مجات وأكواب', price: '', oldPrice: '', isOffer: false, inStock: true, image: '', description: ''
      });
      const [tempAnnouncementInput, setTempAnnouncementInput] = useState(announcementText);
      const [tempShipping, setTempShipping] = useState(shippingRates);
      const [tempStoreSettings, setTempStoreSettings] = useState(storeInfo);

      // Checkout Form
      const [checkoutForm, setCheckoutForm] = useState({
        name: '', phone: '', governorate: 'alexandria', address: '', paymentMethod: 'cod', notes: ''
      });

      useEffect(() => { localStorage.setItem('farafero_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('farafero_cart', JSON.stringify(cart)); }, [cart]);
      useEffect(() => { localStorage.setItem('farafero_wishlist', JSON.stringify(wishlist)); }, [wishlist]);
      useEffect(() => { localStorage.setItem('farafero_orders', JSON.stringify(orders)); }, [orders]);
      useEffect(() => { localStorage.setItem('farafero_customers', JSON.stringify(customers)); }, [customers]);
      useEffect(() => { localStorage.setItem('farafero_shipping', JSON.stringify(shippingRates)); }, [shippingRates]);
      useEffect(() => { localStorage.setItem('farafero_coupons', JSON.stringify(coupons)); }, [coupons]);
      useEffect(() => { localStorage.setItem('farafero_announcement', announcementText); }, [announcementText]);
      useEffect(() => { localStorage.setItem('farafero_categories', JSON.stringify(categories)); }, [categories]);
      useEffect(() => { localStorage.setItem('farafero_store_info', JSON.stringify(storeInfo)); }, [storeInfo]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setNewProductForm(prev => ({ ...prev, image: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      const toggleWishlist = (product) => {
        setWishlist(prev => {
          const exists = prev.find(item => item.id === product.id);
          if (exists) {
            showToast('تمت الإزالة من المفضلة');
            return prev.filter(item => item.id !== product.id);
          }
          showToast('❤️ تمت الإضافة إلى قائمة المفضلة');
          return [...prev, product];
        });
      };

      const addToCart = (product, qty = 1) => {
        if (!product.inStock) return;
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + qty } : item);
          }
          return [...prev, { ...product, qty }];
        });
        showToast(`✨ تمت إضافة "${product.name}" إلى سلة المشتريات`);
        setQuickViewProduct(null);
        setQuickViewQty(1);
      };

      const addCustomBoxToCart = (e) => {
        e.preventDefault();
        const customProduct = {
          id: `custom-${Date.now()}`,
          name: `بوكس هدية مخصص (${customBox.mug} + ${customBox.extra})`,
          category: 'بوكسات هدايا',
          price: 520,
          inStock: true,
          image: 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=800&q=80',
          description: `تغليف: ${customBox.boxStyle} | كارت إهداء: ${customBox.cardText || 'بدون نص'}`
        };
        addToCart(customProduct, 1);
        setCartOpen(true);
      };

      const updateCartQty = (id, delta) => {
        setCart(prev => prev.map(item => item.id === id ? { ...item, qty: item.qty + delta } : item).filter(item => item.qty > 0));
      };

      const applyCouponCode = () => {
        const found = coupons.find(c => c.code.toUpperCase() === couponInput.trim().toUpperCase());
        if (found) {
          setAppliedCoupon(found);
          showToast(`🎉 تم تطبيق كود الخصم (${found.discountPercent}%) بنجاح!`);
        } else {
          showToast('❌ كود الخصم غير صالح');
        }
      };

      const cartSubtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      const cartCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const discountAmount = appliedCoupon ? Math.round((cartSubtotal * appliedCoupon.discountPercent) / 100) : 0;
      const isFreeShipping = cartSubtotal >= storeInfo.freeShippingThreshold;
      const currentShippingCost = isFreeShipping ? 0 : (shippingRates[checkoutForm.governorate] || 0);
      const orderTotal = Math.max(0, cartSubtotal - discountAmount + currentShippingCost);

      const handlePlaceOrder = (e) => {
        e.preventDefault();
        if (cart.length === 0) return;

        const newOrder = {
          id: `ORD-${Date.now().toString().slice(-6)}`,
          date: new Date().toLocaleDateString('ar-EG'),
          customerName: checkoutForm.name,
          phone: checkoutForm.phone,
          governorate: checkoutForm.governorate,
          address: checkoutForm.address,
          paymentMethod: checkoutForm.paymentMethod,
          notes: checkoutForm.notes,
          items: cart,
          subtotal: cartSubtotal,
          discount: discountAmount,
          shipping: currentShippingCost,
          total: orderTotal,
          status: 'قيد المراجعة'
        };

        setOrders(prev => [newOrder, ...prev]);

        setCustomers(prev => {
          const exists = prev.find(c => c.phone === checkoutForm.phone);
          if (exists) {
            return prev.map(c => c.phone === checkoutForm.phone ? { ...c, ordersCount: c.ordersCount + 1, totalSpent: c.totalSpent + orderTotal } : c);
          }
          return [{ id: `VIP-${Date.now().toString().slice(-5)}`, name: checkoutForm.name, phone: checkoutForm.phone, address: checkoutForm.address, ordersCount: 1, totalSpent: orderTotal }, ...prev];
        });

        const govNames = { alexandria: 'الإسكندرية', cairo: 'القاهرة والجيزة', other: 'باقي المحافظات' };
        const itemsText = cart.map(i => `- ${i.name} (×${i.qty}) = ${i.price * i.qty} ج.م`).join('%0A');
        const waText = `مرحباً ${storeInfo.name}، أود تأكيد طلبي رقم ${newOrder.id}:%0A%0A*بيانات العميل:*%0Aالاسم: ${checkoutForm.name}%0Aالموبايل: ${checkoutForm.phone}%0Aالمحافظة: ${govNames[checkoutForm.governorate]}%0Aالعنوان: ${checkoutForm.address}%0A%0A*المنتجات المطلوبة:*%0A${itemsText}%0A%0A${discountAmount > 0 ? `الخصم: -${discountAmount} ج.م%0A` : ''}مصاريف الشحن: ${currentShippingCost === 0 ? 'مجاني 🎉' : `${currentShippingCost} ج.م`}%0A*الإجمالي الكلي: ${orderTotal} ج.م*`;

        setCart([]);
        setAppliedCoupon(null);
        setCurrentPage('home');
        showToast('🎉 تم تسجيل طلبك بنجاح! جاري تحويلك للواتساب...');
        window.open(`https://wa.me/${storeInfo.whatsapp}?text=${waText}`, '_blank');
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPasswordInput === 'farafero2026') {
          setIsAdmin(true);
          setCurrentPage('admin');
          setAdminPasswordInput('');
          showToast('🔐 تم تسجيل الدخول للوحة التحكم بنجاح');
        } else {
          showToast('❌ كلمة المرور غير صحيحة');
        }
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        const productData = {
          ...newProductForm,
          price: Number(newProductForm.price),
          oldPrice: newProductForm.oldPrice ? Number(newProductForm.oldPrice) : null,
          rating: 5.0,
          image: newProductForm.image || 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=800&q=80'
        };

        if (editingProduct) {
          setProducts(prev => prev.map(p => p.id === editingProduct.id ? { ...productData, id: p.id } : p));
          setEditingProduct(null);
          showToast('تم تحديث المنتج بنجاح');
        } else {
          setProducts(prev => [{ ...productData, id: `p-${Date.now()}` }, ...prev]);
          showToast('تمت إضافة المنتج الجديد للمتجر');
        }

        setNewProductForm({ name: '', category: categories[1] || 'مجات وأكواب', price: '', oldPrice: '', isOffer: false, inStock: true, image: '', description: '' });
      };

      const handleAddCoupon = (e) => {
        e.preventDefault();
        if (!newCouponForm.code || !newCouponForm.discountPercent) return;
        setCoupons(prev => [...prev, { code: newCouponForm.code.toUpperCase(), discountPercent: Number(newCouponForm.discountPercent) }]);
        setNewCouponForm({ code: '', discountPercent: '' });
        showToast('تم إضافة كوبون الخصم بنجاح');
      };

      const handleUpdateAnnouncement = (e) => {
        e.preventDefault();
        setAnnouncementText(tempAnnouncementInput);
        showToast('✨ تم تحديث شريط الإعلانات العلوي بنجاح');
      };

      const handleUpdateShipping = (e) => {
        e.preventDefault();
        setShippingRates(tempShipping);
        showToast('🚚 تم تحديث مصاريف الشحن بنجاح');
      };

      const handleUpdateStoreSettings = (e) => {
        e.preventDefault();
        setStoreInfo(tempStoreSettings);
        showToast('⚙️ تم تحديث بيانات وإعدادات المتجر الرئيسية بنجاح');
      };

      const handleAddCategory = (e) => {
        e.preventDefault();
        if (!newCategoryInput.trim()) return;
        if (categories.includes(newCategoryInput.trim())) {
          showToast('❌ هذا التصنيف موجود بالفعل');
          return;
        }
        setCategories(prev => [...prev, newCategoryInput.trim()]);
        setNewCategoryInput('');
        showToast('✨ تمت إضافة التصنيف الجديد بنجاح');
      };

      const deleteCategory = (catToDelete) => {
        if (catToDelete === 'الكل') return;
        setCategories(prev => prev.filter(c => c !== catToDelete));
        showToast('تم حذف التصنيف');
      };

      const startEditProduct = (p) => {
        setEditingProduct(p);
        setNewProductForm({ name: p.name, category: p.category, price: p.price, oldPrice: p.oldPrice || '', isOffer: p.isOffer, inStock: p.inStock, image: p.image, description: p.description });
      };

      const deleteProduct = (id) => {
        setProducts(prev => prev.filter(p => p.id !== id));
        showToast('تم حذف المنتج من المتجر');
      };

      const updateOrderStatus = (orderId, newStatus) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
        showToast('تم تحديث حالة الطلب');
      };

      const filteredProducts = useMemo(() => {
        let list = products.filter(p => {
          const matchesCat = selectedCategory === 'الكل' || p.category === selectedCategory;
          const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.category.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCat && matchesSearch;
        });

        if (sortBy === 'price-asc') list = [...list].sort((a, b) => a.price - b.price);
        if (sortBy === 'price-desc') list = [...list].sort((a, b) => b.price - a.price);
        return list;
      }, [products, selectedCategory, searchQuery, sortBy]);

      const offerProducts = products.filter(p => p.isOffer);

      const ProductCard = ({ product }) => {
        const isFav = wishlist.some(item => item.id === product.id);
        return (
          <div className="group bg-white rounded-3xl border border-stone-200 overflow-hidden shadow-sm hover:shadow-2xl transition-all duration-300 flex flex-col">
            <div className="relative aspect-square overflow-hidden bg-stone-100">
              <img 
                src={product.image} 
                alt={product.name} 
                onClick={() => { setQuickViewProduct(product); setQuickViewQty(1); }}

                                <span className="font-black text-rose-800 text-sm">{order.total} ج.م</span>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {/* CUSTOMERS TAB */}
                {adminTab === 'customers' && (
                  <div className="bg-white rounded-3xl border border-stone-200 p-8 space-y-6">
                    <h3 className="text-xl font-black text-stone-900">سجل العملاء المميزين (VIP)</h3>
                    {customers.length === 0 ? (
                      <p className="text-xs text-stone-500 py-10 text-center">لا توجد بيانات عملاء مسجلة.</p>
                    ) : (
                      <table className="w-full text-right border-collapse">
                        <thead>
                          <tr className="border-b border-stone-200 text-xs font-black text-stone-500">
                            <th className="pb-3">كود العميل</th>
                            <th className="pb-3">الاسم</th>
                            <th className="pb-3">الموبايل</th>
                            <th className="pb-3">عدد الطلبات</th>
                            <th className="pb-3">إجمالي المشتريات</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-stone-100 text-xs font-bold">
                          {customers.map(c => (
                            <tr key={c.id}>
                              <td className="py-3 text-amber-700">{c.id}</td>
                              <td className="py-3">{c.name}</td>
                              <td className="py-3">{c.phone}</td>
                              <td className="py-3">{c.ordersCount} طلبات</td>
                              <td className="py-3 text-rose-800">{c.totalSpent} ج.م</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </div>
                )}

                {/* COUPONS TAB */}
                {adminTab === 'coupons' && (
                  <div className="bg-white rounded-3xl border border-stone-200 p-8 space-y-6 max-w-xl">
                    <h3 className="text-xl font-black text-stone-900">إدارة أكواد الخصم</h3>
                    <form onSubmit={handleAddCoupon} className="space-y-4">
                      <div>
                        <label className="text-xs font-bold text-stone-700 block mb-1">كود الخصم (مثال: SAVE20):</label>
                        <input 
                          type="text" required
                          value={newCouponForm.code}
                          onChange={(e) => setNewCouponForm({...newCouponForm, code: e.target.value})}
                          placeholder="FARAFERO20"
                          className="w-full p-3 rounded-xl border border-stone-200 text-xs font-bold bg-stone-50 uppercase"
                        />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-stone-700 block mb-1">نسبة الخصم (%):</label>
                        <input 
                          type="number" required
                          value={newCouponForm.discountPercent}
                          onChange={(e) => setNewCouponForm({...newCouponForm, discountPercent: e.target.value})}
                          placeholder="15"
                          className="w-full p-3 rounded-xl border border-stone-200 text-xs font-bold bg-stone-50"
                        />
                      </div>
                      <button type="submit" className="bg-stone-900 hover:bg-rose-800 text-white font-black px-6 py-3 rounded-xl text-xs shadow-md">
                        إضافة الكود 🎟️
                      </button>
                    </form>

                    <div className="border-t pt-4 mt-6">
                      <h4 className="font-bold text-xs text-stone-700 mb-3">الأكواد الحالية المفعلة:</h4>
                      <div className="space-y-2">
                        {coupons.map((cp, idx) => (
                          <div key={idx} className="flex items-center justify-between bg-stone-50 p-3 rounded-xl border text-xs font-bold">
                            <span>{cp.code}</span>
                            <span className="text-rose-800">خصم {cp.discountPercent}%</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* QUICK VIEW MODAL */}
          {quickViewProduct && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl animate-fadeIn relative">
                <button 
                  onClick={() => setQuickViewProduct(null)}
                  className="absolute top-4 left-4 w-9 h-9 bg-stone-100 hover:bg-stone-200 rounded-full flex items-center justify-center font-bold text-stone-700 z-10"
                >
                  ✕
                </button>
                <div className="grid grid-cols-1 sm:grid-cols-2">
                  <div className="aspect-square bg-stone-100">
                    <img src={quickViewProduct.image} alt={quickViewProduct.name} className="w-full h-full object-cover" />
                  </div>
                  <div className="p-6 sm:p-8 flex flex-col justify-between space-y-4">
                    <div>
                      <span className="text-xs font-bold text-amber-700">{quickViewProduct.category}</span>
                      <h3 className="text-xl font-black text-stone-900 mt-1">{quickViewProduct.name}</h3>
                      <p className="text-xs text-stone-500 mt-2 leading-relaxed">{quickViewProduct.description}</p>
                    </div>

                    <div className="space-y-4 pt-4 border-t border-stone-100">
                      <div className="flex items-center justify-between">
                        <span className="text-2xl font-black text-rose-800">{quickViewProduct.price} ج.م</span>
                        <div className="flex items-center border border-stone-200 rounded-xl overflow-hidden">
                          <button onClick={() => setQuickViewQty(Math.max(1, quickViewQty - 1))} className="px-3 py-1 bg-stone-100 font-bold">-</button>
                          <span className="px-4 py-1 text-xs font-black">{quickViewQty}</span>
                          <button onClick={() => setQuickViewQty(quickViewQty + 1)} className="px-3 py-1 bg-stone-100 font-bold">+</button>
                        </div>
                      </div>

                      <button 
                        onClick={() => addToCart(quickViewProduct, quickViewQty)}
                        className="w-full bg-stone-900 hover:bg-rose-800 text-white font-black py-3.5 rounded-2xl shadow-lg transition-colors text-xs"
                      >
                        إضافة للسلة ({quickViewProduct.price * quickViewQty} ج.م) 🛒
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* CART SLIDE-OVER */}
          {cartOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden bg-black/60 backdrop-blur-sm flex justify-start">
              <div className="bg-white w-full max-w-md h-full shadow-2xl flex flex-col justify-between animate-fadeIn">
                <div className="p-6 border-b border-stone-200 flex items-center justify-between">
                  <h3 className="font-black text-lg text-stone-900">سلة المشتريات ({cartCount})</h3>
                  <button onClick={() => setCartOpen(false)} className="w-8 h-8 rounded-full bg-stone-100 font-bold">✕</button>
                </div>

                <div className="flex-1 overflow-y-auto p-6 space-y-4">
                  {cart.length === 0 ? (
                    <div className="text-center py-20 space-y-3">
                      <span className="text-4xl">🛒</span>
                      <p className="text-xs text-stone-500 font-bold">سلة المشتريات فارغة حالياً</p>
                    </div>
                  ) : (
                    cart.map(item => (
                      <div key={item.id} className="flex items-center gap-4 bg-stone-50 p-3 rounded-2xl border border-stone-200">
                        <img src={item.image} alt={item.name} className="w-16 h-16 object-cover rounded-xl border" />
                        <div className="flex-1">
                          <h4 className="font-bold text-xs text-stone-900 line-clamp-1">{item.name}</h4>
                          <span className="text-rose-800 font-black text-xs">{item.price} ج.م</span>
                          <div className="flex items-center gap-2 mt-2">
                            <button onClick={() => updateCartQty(item.id, -1)} className="w-6 h-6 rounded bg-stone-200 font-bold text-xs">-</button>
                            <span className="text-xs font-bold">{item.qty}</span>
                            <button onClick={() => updateCartQty(item.id, 1)} className="w-6 h-6 rounded bg-stone-200 font-bold text-xs">+</button>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="p-6 border-t border-stone-200 space-y-4 bg-stone-50">
                    <div className="space-y-2 text-xs font-bold">
                      <div className="flex justify-between">
                        <span className="text-stone-500">المجموع الفرعي:</span>
                        <span>{cartSubtotal} ج.م</span>
                      </div>
                      {discountAmount > 0 && (
                        <div className="flex justify-between text-emerald-600">
                          <span>الخصم المطبق:</span>
                          <span>-{discountAmount} ج.م</span>
                        </div>
                      )}
                      <div className="flex justify-between text-stone-900 font-black text-sm pt-2 border-t">
                        <span>الإجمالي:</span>
                        <span className="text-rose-800">{orderTotal} ج.م</span>
                      </div>
                    </div>

                    <button 
                      onClick={() => { setCartOpen(false); setCurrentPage('checkout'); }}
                      className="w-full bg-rose-700 hover:bg-rose-800 text-white font-black py-4 rounded-2xl shadow-lg transition-colors text-xs"
                    >
                      إتمام الطلب عبر واتساب 🛍️
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* WISHLIST SLIDE-OVER */}
          {wishlistOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden bg-black/60 backdrop-blur-sm flex justify-start">
              <div className="bg-white w-full max-w-md h-full shadow-2xl flex flex-col justify-between animate-fadeIn">
                <div className="p-6 border-b border-stone-200 flex items-center justify-between">
                  <h3 className="font-black text-lg text-stone-900">المفضلة ({wishlist.length})</h3>
                  <button onClick={() => setWishlistOpen(false)} className="w-8 h-8 rounded-full bg-stone-100 font-bold">✕</button>
                </div>
                <div className="flex-1 overflow-y-auto p-6 space-y-4">
                  {wishlist.length === 0 ? (
                    <div className="text-center py-20">
                      <span className="text-4xl">🤍</span>
                      <p className="text-xs text-stone-500 font-bold mt-2">لا توجد منتجات في المفضلة</p>
                    </div>
                  ) : (
                    wishlist.map(item => (
                      <div key={item.id} className="flex items-center gap-4 bg-stone-50 p-3 rounded-2xl border border-stone-200">
                        <img src={item.image} alt={item.name} className="w-16 h-16 object-cover rounded-xl border" />
                        <div className="flex-1">
                          <h4 className="font-bold text-xs text-stone-900 line-clamp-1">{item.name}</h4>
                          <span className="text-rose-800 font-black text-xs">{item.price} ج.م</span>
                        </div>
                        <button onClick={() => toggleWishlist(item)} className="text-rose-700 font-bold text-xs">إزالة</button>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* CHECKOUT PAGE */}
          {currentPage === 'checkout' && (
            <div className="max-w-2xl mx-auto px-4 py-12">
              <div className="bg-white rounded-3xl border border-stone-200 shadow-xl p-8 sm:p-10 space-y-6">
                <div>
                  <h2 className="text-2xl font-black text-stone-900">إتمام الطلب وتأكيده</h2>
                  <p className="text-xs text-stone-500 mt-1">أدخل بيانات التوصيل وسيتم تحويلك فوراً لتأكيد الطلب عبر واتساب</p>
                </div>

                <form onSubmit={handlePlaceOrder} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-stone-700 block mb-1">الاسم الكامل:</label>
                    <input 
                      type="text" required
                      value={checkoutForm.name}
                      onChange={(e) => setCheckoutForm({...checkoutForm, name: e.target.value})}
                      placeholder="محمد أحمد..."
                      className="w-full p-3.5 rounded-xl border border-stone-200 text-xs font-bold bg-stone-50"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-stone-700 block mb-1">رقم الموبايل (واتساب):</label>
                    <input 
                      type="tel" required
                      value={checkoutForm.phone}
                      onChange={(e) => setCheckoutForm({...checkoutForm, phone: e.target.value})}
                      placeholder="010xxxxxxxx"
                      className="w-full p-3.5 rounded-xl border border-stone-200 text-xs font-bold bg-stone-50"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-stone-700 block mb-1">المحافظة:</label>
                    <select 
                      value={checkoutForm.governorate}
                      onChange={(e) => setCheckoutForm({...checkoutForm, governorate: e.target.value})}
                      className="w-full p-3.5 rounded-xl border border-stone-200 text-xs font-bold bg-stone-50"
                    >
                      <option value="alexandria">الإسكندرية (شحن {shippingRates.alexandria} ج.م)</option>
                      <option value="cairo">القاهرة والجيزة (شحن {shippingRates.cairo} ج.م)</option>
                      <option value="other">باقي المحافظات (شحن {shippingRates.other} ج.م)</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-xs font-bold text-stone-700 block mb-1">العنوان بالتفصيل:</label>
                    <textarea 
                      required rows="2"
                      value={checkoutForm.address}
                      onChange={(e) => setCheckoutForm({...checkoutForm, address: e.target.value})}
                      placeholder="الشارع، البناية، الطابق..."
                      className="w-full p-3.5 rounded-xl border border-stone-200 text-xs font-bold bg-stone-50"
                    ></textarea>
                  </div>

                  {/* Coupon Box */}
                  <div className="flex gap-2 pt-2">
                    <input 
                      type="text"
                      placeholder="أدخل كود الخصم (إن وجد)"
                      value={couponInput}
                      onChange={(e) => setCouponInput(e.target.value)}
                      className="flex-1 p-3.5 rounded-xl border border-stone-200 text-xs font-bold uppercase bg-stone-50"
                    />
                    <button type="button" onClick={applyCouponCode} className="bg-stone-900 text-white font-bold px-6 py-3.5 rounded-xl text-xs">
                      تطبيق
                    </button>
                  </div>

                  <div className="bg-stone-50 p-6 rounded-2xl border space-y-2 text-xs font-bold">
                    <div className="flex justify-between">
                      <span>إجمالي المنتجات:</span>
                      <span>{cartSubtotal} ج.م</span>
                    </div>
                    {discountAmount > 0 && (
                      <div className="flex justify-between text-emerald-600">
                        <span>الخصم:</span>
                        <span>-{discountAmount} ج.م</span>
                      </div>
                    )}
                    <div className="flex justify-between">
                      <span>مصاريف الشحن:</span>
                      <span>{currentShippingCost === 0 ? 'مجاني 🎉' : `${currentShippingCost} ج.م`}</span>
                    </div>
                    <div className="flex justify-between text-sm font-black pt-2 border-t">
                      <span>الإجمالي النهائي:</span>
                      <span className="text-rose-800">{orderTotal} ج.م</span>
                    </div>
                  </div>

                  <div className="flex gap-3 pt-4">
                    <button type="submit" className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-lg transition-colors text-xs flex items-center justify-center gap-2">
                      <span>تأكيد الطلب عبر واتساب 💬</span>
                    </button>
                    <button type="button" onClick={() => setCurrentPage('home')} className="bg-stone-200 text-stone-700 font-bold px-6 py-4 rounded-2xl text-xs">
                      إلغاء
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Premium Footer Design */}
          <footer className="bg-gradient-to-b from-stone-950 via-stone-900 to-stone-950 text-stone-300 py-16 px-4 sm:px-6 lg:px-8 border-t border-stone-800/80 mt-20 relative overflow-hidden">
            <div className="absolute inset-0 opacity-10 bg-[radial-gradient(#e11d48_1px,transparent_1px)] [background-size:20px_20px]"></div>
            <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-10 text-center md:text-right relative z-10">
              
              <div className="space-y-3">
                <div className="flex items-center justify-center md:justify-start gap-3">
                  <div className="w-10 h-10 bg-gradient-to-tr from-rose-800 to-amber-600 rounded-xl flex items-center justify-center shadow">
                    <span className="text-xl">🎁</span>
                  </div>
                  <h3 className="text-white font-black text-xl">{storeInfo.arabicName}</h3>
                </div>
                <p className="text-xs text-stone-400 leading-relaxed max-w-sm mx-auto md:mx-0">وجهتك الأولى لاختيار أرقى الهدايا والتحف العصرية وتغليفها بأعلى معايير الجودة والأناقة لصنع لحظات لا تُنسى.</p>
              </div>

              <div className="space-y-3">
                <h4 className="text-white font-bold text-sm tracking-wider uppercase border-b border-stone-800 pb-2 inline-block">تواصل معنا</h4>
                <p className="text-xs text-stone-400">هاتف / واتساب: <span className="text-amber-400 font-bold">{storeInfo.phone}</span></p>
                <p className="text-xs text-stone-400">العنوان: <span className="text-stone-300">{storeInfo.address}</span></p>
                <p className="text-xs text-stone-400">البريد الإلكتروني: {storeInfo.email}</p>
              </div>

              <div className="space-y-3">
                <h4 className="text-white font-bold text-sm tracking-wider uppercase border-b border-stone-800 pb-2 inline-block">روابط سريعة</h4>
                <div className="flex flex-col gap-2 text-xs">
                  <button onClick={() => setCurrentPage('catalog')} className="text-stone-400 hover:text-rose-400 transition-colors text-right">المنتجات والعروض الفاخرة</button>
                  <button onClick={() => setCurrentPage('custombox')} className="text-stone-400 hover:text-rose-400 transition-colors text-right">تصميم بوكس هدايا مخصص 🎀</button>
                  <button onClick={() => setCurrentPage('admin-login')} className="text-amber-500 hover:text-amber-400 transition-colors text-right font-bold">لوحة تحكم الإدارة 🔐</button>
                </div>
              </div>

            </div>
            
            <div className="max-w-7xl mx-auto border-t border-stone-800/60 mt-12 pt-6 text-center text-xs text-stone-500">
              جميع الحقوق محفوطة © 2026 {storeInfo.name} • تم التصميم والتطوير بعناية فائقة 💖
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
