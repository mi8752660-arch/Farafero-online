        giftNote: 'كل سنة وإنتي طيبة يا أجمل أخت في الدنيا ❤️',
        items: [{ id: 'PRD-103', name: 'بوكس السعادة الملكي المتكامل', price: 590, quantity: 1 }],
        subtotal: 590,
        shipping: 45,
        total: 635,
        status: 'تم التسليم'
      }
    ];

    const ADMIN_PASSCODE = 'farafero2026';

    async function cloudPull(url) {
      const clean = (url || '').trim();
      if (!clean) return null;
      const sep = clean.includes('?') ? '&' : '?';
      const res = await fetch(`${clean}${sep}t=${Date.now()}`, { method: 'GET', cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    }

    async function cloudPush(url, payload) {
      const clean = (url || '').trim();
      if (!clean) return false;
      try {
        const res = await fetch(clean, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        return res.ok;
      } catch {
        await fetch(clean, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        return true;
      }
    }

    function App() {
      const [settings, setSettings] = useState(() => {
        try {
          const saved = localStorage.getItem('farafero_full_settings_v1');
          const parsed = saved ? JSON.parse(saved) : {};
          return {
            ...INITIAL_SETTINGS,
            ...parsed,
            shippingRates: { ...INITIAL_SETTINGS.shippingRates, ...(parsed.shippingRates || {}) },
            cloudSyncUrl: parsed.cloudSyncUrl || HARDCODED_CLOUD_URL
          };
        } catch { return INITIAL_SETTINGS; }
      });

      const [products, setProducts] = useState(() => {
        try {
          const saved = localStorage.getItem('farafero_full_products_v1');
          return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
        } catch { return INITIAL_PRODUCTS; }
      });

      const [sliders, setSliders] = useState(() => {
        try {
          const saved = localStorage.getItem('farafero_full_sliders_v1');
          return saved ? JSON.parse(saved) : INITIAL_SLIDERS;
        } catch { return INITIAL_SLIDERS; }
      });

      const [orders, setOrders] = useState(() => {
        try {
          const saved = localStorage.getItem('farafero_full_orders_v1');
          return saved ? JSON.parse(saved) : INITIAL_ORDERS;
        } catch { return INITIAL_ORDERS; }
      });

      const [cart, setCart] = useState(() => {
        try {
          const saved = localStorage.getItem('farafero_full_cart_v1');
          return saved ? JSON.parse(saved) : [];
        } catch { return []; }
      });

      const [syncState, setSyncState] = useState('محلي');
      const [view, setView] = useState('home');
      const [selectedCategory, setSelectedCategory] = useState('الكل');
      const [searchQuery, setSearchQuery] = useState('');
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [currentInvoice, setCurrentInvoice] = useState(null);
      const [toast, setToast] = useState(null);
      const skipNextPush = useRef(false);

      const notify = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const syncCloud = async (manual = false) => {
        if (!settings.cloudSyncUrl || !settings.cloudSyncUrl.trim()) {
          setSyncState('محلي');
          if (manual) notify('أضف رابط المزامنة السحابية أولاً من لوحة التحكم');
          return;
        }
        setSyncState('جاري المزامنة...');
        try {
          const remote = await cloudPull(settings.cloudSyncUrl);
          if (remote && typeof remote === 'object') {
            skipNextPush.current = true;
            if (Array.isArray(remote.products) && remote.products.length > 0) setProducts(remote.products);
            if (Array.isArray(remote.orders) && remote.orders.length > 0) setOrders(remote.orders);
            if (Array.isArray(remote.sliders) && remote.sliders.length > 0) setSliders(remote.sliders);
            if (remote.settings && typeof remote.settings === 'object') {
              setSettings(prev => ({
                ...prev,
                ...remote.settings,
                shippingRates: { ...prev.shippingRates, ...(remote.settings.shippingRates || {}) },
                cloudSyncUrl: prev.cloudSyncUrl
              }));
            }
          }
          await cloudPush(settings.cloudSyncUrl, {
            products,
            orders,
            sliders,
            settings: { ...settings, cloudSyncUrl: undefined },
            updatedAt: new Date().toISOString()
          });
          setSyncState('متصل سحابياً');
          if (manual) notify('تمت المزامنة السحابية ✓');
        } catch {
          setSyncState('وضع محلي');
          if (manual) notify('تعذر الاتصال بالرابط السحابي، البيانات محفوظة محلياً');
        }
      };

      useEffect(() => {
        if (settings.cloudSyncUrl) syncCloud(false);
        else setSyncState('محلي');
      }, [settings.cloudSyncUrl]);

      useEffect(() => {
        try { localStorage.setItem('farafero_full_settings_v1', JSON.stringify(settings)); } catch {}
      }, [settings]);

      useEffect(() => {
        try { localStorage.setItem('farafero_full_products_v1', JSON.stringify(products)); } catch {}
        if (skipNextPush.current) { skipNextPush.current = false; return; }
        if (settings.cloudSyncUrl && settings.autoCloudSync) {
          cloudPush(settings.cloudSyncUrl, { products, orders, sliders, settings: { ...settings, cloudSyncUrl: undefined } });
        }
      }, [products]);

      useEffect(() => {
        try { localStorage.setItem('farafero_full_orders_v1', JSON.stringify(orders)); } catch {}
        if (skipNextPush.current) { skipNextPush.current = false; return; }
        if (settings.cloudSyncUrl && settings.autoCloudSync) {
          cloudPush(settings.cloudSyncUrl, { products, orders, sliders, settings: { ...settings, cloudSyncUrl: undefined } });
        }
      }, [orders]);

      useEffect(() => {
        try { localStorage.setItem('farafero_full_sliders_v1', JSON.stringify(sliders)); } catch {}
      }, [sliders]);

      useEffect(() => {
        try { localStorage.setItem('farafero_full_cart_v1', JSON.stringify(cart)); } catch {}
      }, [cart]);

      const categories = useMemo(() => ['الكل', ...new Set(products.map(p => p.category).filter(Boolean))], [products]);

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const catMatch = selectedCategory === 'الكل' || p.category === selectedCategory;
          const q = searchQuery.trim().toLowerCase();
          const searchMatch = !q || p.name.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q) || (p.category || '').toLowerCase().includes(q);
          return catMatch && searchMatch;
        });
      }, [products, selectedCategory, searchQuery]);

      const addToCart = (product) => {
        if (!product.inStock) {
          notify('هذا المنتج غير متوفر حالياً');
          return;
        }
        setCart(prev => {
          const found = prev.find(i => i.id === product.id);
          if (found) return prev.map(i => i.id === product.id ? { ...i, quantity: i.quantity + 1 } : i);
          return [...prev, { ...product, quantity: 1 }];
        });
        notify(`تمت إضافة "${product.name}" إلى السلة`);
      };

      const updateQty = (id, delta) => {
        setCart(prev => prev.map(i => i.id === id ? { ...i, quantity: Math.max(0, i.quantity + delta) } : i).filter(i => i.quantity > 0));
      };

      const removeFromCart = (id) => {
        setCart(prev => prev.filter(i => i.id !== id));
      };

      const cartSubtotal = useMemo(() => cart.reduce((sum, i) => sum + i.price * i.quantity, 0), [cart]);
      const cartCount = useMemo(() => cart.reduce((sum, i) => sum + i.quantity, 0), [cart]);

      // تسجيل العملاء تلقائياً عند إنشاء طلب شراء فقط
      const customers = useMemo(() => {
        const map = new Map();
        orders.forEach(o => {
          const key = (o.phone || '').trim();
          if (!key) return;
          if (!map.has(key)) {
            map.set(key, { name: o.customerName, phone: o.phone, governorate: o.governorate, address: o.address, ordersCount: 1, totalSpent: o.total });
          } else {
            const cur = map.get(key);
            cur.ordersCount += 1;
            cur.totalSpent += o.total;
          }
        });
        return Array.from(map.values());
      }, [orders]);

      const handleCheckout = (orderPayload) => {
        const newOrder = {
          id: 'FRF-' + Math.floor(100000 + Math.random() * 900000),
          date: new Date().toLocaleString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
          items: cart,
          subtotal: cartSubtotal,
          ...orderPayload,
          status: 'جديد'
        };
        setOrders(prev => [newOrder, ...prev]);
        setProducts(prev => prev.map(prod => {
          const ordered = cart.find(i => i.id === prod.id);
          if (!ordered) return prod;
          const nextStock = Math.max(0, (prod.internalStock ?? 10) - ordered.quantity);
          return { ...prod, internalStock: nextStock, inStock: nextStock > 0 ? prod.inStock : false };
        }));
        setCart([]);
        setCurrentInvoice(newOrder);
        setView('invoice');
      };

      if (view === 'admin-login') {
        return <AdminLogin storeName={settings.storeName} onSuccess={() => { setIsAdminAuthenticated(true); setView('admin'); }} onBack={() => setView('home')} />;
      }

      if (view === 'admin' && isAdminAuthenticated) {
        return (
          <AdminDashboard
            settings={settings}
            setSettings={setSettings}
            products={products}
            setProducts={setProducts}
            sliders={sliders}
            setSliders={setSliders}
            orders={orders}
            setOrders={setOrders}
            customers={customers}
            syncState={syncState}
            onSyncNow={() => syncCloud(true)}
            onLogout={() => { setIsAdminAuthenticated(false); setView('home'); }}
            onVisitStore={() => setView('home')}
            notify={notify}
            toast={toast}
          />
        );
      }

      if (view === 'invoice' && currentInvoice) {
        return <InvoiceView settings={settings} invoice={currentInvoice} onBack={() => setView('home')} />;
      }

      return (
        <div className="flex flex-col min-h-screen">
          {settings.announcement && (
            <div className="bg-rose-950 text-amber-50 text-xs sm:text-sm py-2 px-4 text-center font-semibold">
              {settings.announcement}
            </div>
          )}

          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-rose-100 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <button onClick={() => setView('home')} className="text-right">
                <div className="font-brand text-xl sm:text-2xl font-bold text-rose-950 leading-none">{settings.storeName}</div>
                <div className="text-[11px] text-amber-700 font-semibold mt-0.5">{settings.slogan}</div>
              </button>

              <div className="flex items-center gap-2 sm:gap-3 flex-1 max-w-md">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="ابحث عن منتج أو قسم..."
                  className="w-full px-4 py-2 rounded-2xl border border-stone-200 text-sm focus:outline-none focus:border-rose-700"
                />
              </div>

              <div className="flex items-center gap-2">
                <button onClick={() => setView('home')} className={`px-3.5 py-2 rounded-xl text-sm font-bold ${view === 'home' ? 'bg-rose-900 text-white' : 'bg-stone-100 text-stone-700'}`}>
                  المتجر
                </button>
                <button onClick={() => setView('cart')} className="relative px-3.5 py-2 rounded-xl bg-rose-50 text-rose-900 font-bold text-sm">
                  السلة ({cartCount})
                </button>
                <button onClick={() => setView('admin-login')} className="px-3.5 py-2 rounded-xl bg-stone-900 text-white font-bold text-sm">
                  الإدارة
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl mx-auto w-full px-4 py-6">
            {view === 'home' && (
              <StorefrontHome
                sliders={sliders}
                categories={categories}
                selectedCategory={selectedCategory}
                setSelectedCategory={setSelectedCategory}
                products={filteredProducts}
                onAddToCart={addToCart}
              />
            )}

            {view === 'cart' && (
              <CartCheckout
                cart={cart}
                cartSubtotal={cartSubtotal}
                settings={settings}
                updateQty={updateQty}
                removeFromCart={removeFromCart}
                onCheckout={handleCheckout}
                onBackToStore={() => setView('home')}
              />
            )}
          </main>

          <footer className="bg-stone-950 text-stone-400 text-xs py-6 px-4 mt-12">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
              <span>© 2026 {settings.storeName} — {settings.location}</span>
              <span>واتساب: {settings.whatsapp} • حالة البيانات: {syncState}</span>
            </div>
          </footer>

          {toast && (
            <div className="fixed bottom-5 right-5 z-50 bg-stone-900 text-white px-4 py-3 rounded-2xl shadow-xl text-xs font-bold">
              {toast}
            </div>
          )}
        </div>
      );
    }

    function StorefrontHome({ sliders, categories, selectedCategory, setSelectedCategory, products, onAddToCart }) {
      const [activeSlide, setActiveSlide] = useState(0);

      useEffect(() => {
        if (!sliders.length) return;
        const timer = setInterval(() => {
          setActiveSlide(prev => (prev + 1) % sliders.length);
        }, 4500);
        return () => clearInterval(timer);
      }, [sliders.length]);

      const currentSlide = sliders[activeSlide] || sliders[0];

      return (
        <div className="space-y-8">
          {currentSlide && (
            <div className="relative h-64 sm:h-96 rounded-3xl overflow-hidden shadow-lg bg-stone-900">
              <img src={currentSlide.image} alt={currentSlide.title} className="w-full h-full object-cover opacity-65" />
              <div className="absolute inset-0 bg-gradient-to-t from-black/75 via-black/25 to-transparent flex flex-col justify-end p-6 sm:p-10 text-white">
                <h1 className="text-2xl sm:text-4xl font-black">{currentSlide.title}</h1>
                <p className="text-sm sm:text-lg text-amber-100 mt-1">{currentSlide.subtitle}</p>
                {sliders.length > 1 && (
                  <div className="flex items-center gap-2 mt-4">
                    {sliders.map((s, idx) => (
                      <button
                        key={s.id}
                        onClick={() => setActiveSlide(idx)}
                        className={`h-2.5 rounded-full transition-all ${idx === activeSlide ? 'w-8 bg-amber-400' : 'w-2.5 bg-white/60'}`}
                        aria-label={`إعلان ${idx + 1}`}
                      />
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          <div className="flex items-center gap-2 overflow-x-auto pb-2">
            {categories.map(cat => (
              <button
                key={cat}
                onClick={() => setSelectedCategory(cat)}

    function CartCheckout({ cart, cartSubtotal, settings, updateQty, removeFromCart, onCheckout, onBackToStore }) {
      const govList = Object.keys(settings.shippingRates);
      const [customerName, setCustomerName] = useState('');
      const [phone, setPhone] = useState('');
      const [governorate, setGovernorate] = useState(govList.includes('الإسكندرية') ? 'الإسكندرية' : govList[0] || 'القاهرة');
      const [address, setAddress] = useState('');
      const [paymentMethod, setPaymentMethod] = useState('الدفع عند الاستلام (COD)');
      const [giftNote, setGiftNote] = useState('');

      if (cart.length === 0) {
        return (
          <div className="bg-white rounded-3xl border border-stone-200 p-12 text-center space-y-4 max-w-lg mx-auto">
            <h2 className="text-xl font-black text-stone-900">السلة فارغة حالياً</h2>
            <button onClick={onBackToStore} className="px-6 py-3 rounded-2xl bg-rose-900 text-white text-sm font-bold">
              العودة للمتجر
            </button>
          </div>
        );
      }

      const shipping = Number(settings.shippingRates[governorate] ?? 0);
      const total = cartSubtotal + shipping;

      const submitOrder = (e) => {
        e.preventDefault();
        if (!customerName.trim() || !phone.trim() || !address.trim()) return;
        onCheckout({
          customerName: customerName.trim(),
          phone: phone.trim(),
          governorate,
          address: address.trim(),
          paymentMethod,
          giftNote: giftNote.trim(),
          shipping,
          total
        });
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
          <div className="lg:col-span-5 bg-white p-6 rounded-3xl border border-stone-200 space-y-4">
            <h2 className="text-lg font-black text-stone-900 border-b pb-3">منتجات السلة</h2>
            {cart.map(item => (
              <div key={item.id} className="flex items-center justify-between gap-3 border-b border-stone-100 pb-3">
                <div className="min-w-0 flex-1">
                  <p className="font-bold text-sm text-stone-900 truncate">{item.name}</p>
                  <p className="text-xs font-bold text-rose-900">{item.price * item.quantity} ج.م</p>
                </div>
                <div className="flex items-center gap-1.5">
                  <button type="button" onClick={() => updateQty(item.id, -1)} className="w-7 h-7 rounded-lg bg-stone-100 font-bold">-</button>
                  <span className="text-xs font-bold w-5 text-center">{item.quantity}</span>
                  <button type="button" onClick={() => updateQty(item.id, 1)} className="w-7 h-7 rounded-lg bg-stone-100 font-bold">+</button>
                  <button type="button" onClick={() => removeFromCart(item.id)} className="px-2 py-1 text-xs font-bold text-rose-600">حذف</button>
                </div>
              </div>
            ))}
            <div className="space-y-2 pt-2 text-sm">
              <div className="flex justify-between"><span>المجموع الفرعي:</span><strong>{cartSubtotal} ج.م</strong></div>
              <div className="flex justify-between"><span>شحن ({governorate}):</span><strong>{shipping} ج.م</strong></div>
              <div className="flex justify-between text-base font-black text-rose-900 pt-2 border-t"><span>الإجمالي:</span><span>{total} ج.م</span></div>
            </div>
          </div>

          <form onSubmit={submitOrder} className="lg:col-span-7 bg-white p-6 rounded-3xl border border-stone-200 space-y-4">
            <h2 className="text-lg font-black text-stone-900 border-b pb-3">بيانات التوصيل والدفع</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <input type="text" required value={customerName} onChange={e => setCustomerName(e.target.value)} placeholder="الاسم بالكامل *" className="px-4 py-3 rounded-xl border border-stone-200 text-sm" />
              <input type="tel" required dir="ltr" value={phone} onChange={e => setPhone(e.target.value)} placeholder="010xxxxxxxx *" className="px-4 py-3 rounded-xl border border-stone-200 text-sm text-right" />
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">المحافظة *</label>
                <select value={governorate} onChange={e => setGovernorate(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-stone-200 text-sm bg-white font-semibold">
                  {govList.map(g => <option key={g} value={g}>{g} ({settings.shippingRates[g]} ج.م)</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">طريقة الدفع *</label>
                <select value={paymentMethod} onChange={e => setPaymentMethod(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-stone-200 text-sm bg-white font-semibold">
                  <option value="الدفع عند الاستلام (COD)">الدفع عند الاستلام (COD)</option>
                  <option value="إنستاباي (InstaPay)">إنستاباي (InstaPay)</option>
                  <option value="محفظة إلكترونية (فودافون / أورانج / اتصالات كاش)">محفظة إلكترونية (فودافون / أورانج / اتصالات كاش)</option>
                  <option value="بطاقة بنكية (فيزا / ماستركارد)">بطاقة بنكية (فيزا / ماستركارد)</option>
                </select>
              </div>
            </div>

            <input type="text" required value={address} onChange={e => setAddress(e.target.value)} placeholder="العنوان بالتفصيل (المنطقة، الشارع، رقم العمارة والشقة) *" className="w-full px-4 py-3 rounded-xl border border-stone-200 text-sm" />
            <input type="text" value={giftNote} onChange={e => setGiftNote(e.target.value)} placeholder="رسالة كارت الإهداء المجاني (اختياري)" className="w-full px-4 py-3 rounded-xl border border-stone-200 text-sm" />

            <button type="submit" className="w-full py-3.5 rounded-2xl bg-rose-900 hover:bg-rose-950 text-white font-black text-base shadow-md">
              تأكيد الطلب وإصدار الفاتورة ({total} ج.م)
            </button>
          </form>
        </div>
      );
    }

      return (
        <div className="min-h-screen bg-stone-100 flex items-center justify-center p-4">

    function AdminDashboard({ settings, setSettings, products, setProducts, sliders, setSliders, orders, setOrders, customers, syncState, onSyncNow, onLogout, onVisitStore, notify, toast }) {
      const [tab, setTab] = useState('products');
      const [name, setName] = useState('');
      const [category, setCategory] = useState('بوكسات هدايا ودباديب');
      const [price, setPrice] = useState('');
      const [oldPrice, setOldPrice] = useState('');
      const [description, setDescription] = useState('');
      const [image, setImage] = useState('');
      const [cloudUrlInput, setCloudUrlInput] = useState(settings.cloudSyncUrl || '');

      const handleMobileImageUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result === 'string') setImage(reader.result);
        };
        reader.readAsDataURL(file);
      };

      const addProduct = (e) => {
        e.preventDefault();
        if (!name.trim() || !price) return;
        const finalImg = image || 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=800&q=80';
        const newProd = {
          id: 'PRD-' + Math.floor(100 + Math.random() * 900),
          name: name.trim(),
          category: (category || 'عام').trim(),
          price: Number(price),
          oldPrice: oldPrice ? Number(oldPrice) : null,
          image: finalImg,
          description: description.trim(),
          internalStock: 15,
          inStock: true
        };
        setProducts(prev => [newProd, ...prev]);
        setName(''); setPrice(''); setOldPrice(''); setDescription(''); setImage('');
        notify('تمت إضافة المنتج بنجاح');

        <div className="min-h-screen bg-stone-50 flex flex-col lg:flex-row">

              <div className="bg-white rounded-2xl border overflow-x-auto">
                <table className="w-full text-right text-sm">
                  <thead className="bg-stone-50 text-xs">
                    <tr><th className="p-3">الاسم</th><th className="p-3">الموبايل</th><th className="p-3">العنوان</th><th className="p-3">الطلبات</th><th className="p-3">الإجمالي</th></tr>
                  </thead>
                  <tbody className="divide-y">
                    {customers.map((c, idx) => (
                      <tr key={idx}>
                        <td className="p-3 font-bold">{c.name}</td>
                        <td className="p-3 font-mono" dir="ltr">{c.phone}</td>
                        <td className="p-3 text-xs">{c.governorate} - {c.address}</td>
                        <td className="p-3 font-bold">{c.ordersCount}</td>
                        <td className="p-3 font-black text-emerald-700">{c.totalSpent} ج.م</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {tab === 'cloud' && (
              <div className="bg-white p-6 rounded-3xl border space-y-4 max-w-2xl">
                <h2 className="font-black text-base text-stone-900">إعدادات المتجر والمزامنة السحابية</h2>
                <input
                  type="text"
                  value={settings.storeName}
                  onChange={e => setSettings(prev => ({ ...prev, storeName: e.target.value }))}
                  placeholder="اسم المتجر"
                  className="w-full px-4 py-2.5 rounded-xl border text-sm"
                />
                <input
                  type="url"
                  dir="ltr"
                  value={cloudUrlInput}
                  onChange={e => setCloudUrlInput(e.target.value)}
                  placeholder="رابط المزامنة السحابية (اختياري)"
                  className="w-full px-4 py-2.5 rounded-xl border text-sm text-left"
                />
                <button
                  onClick={() => {
                    setSettings(prev => ({ ...prev, cloudSyncUrl: cloudUrlInput.trim() }));
                    notify('تم حفظ الإعدادات');
                  }}
                  className="px-6 py-2.5 rounded-xl bg-rose-900 text-white text-xs font-bold"
                >
                  حفظ الإعدادات
                </button>
              </div>
            )}
          </main>

          {toast && (
            <div className="fixed bottom-5 left-5 bg-stone-900 text-white px-4 py-3 rounded-2xl text-xs font-bold shadow-xl">
              {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
