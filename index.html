<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرفيرو - متجر الهدايا أونلاين</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #d97706;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            direction: rtl;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .header h1 { margin: 0; color: var(--primary); font-size: 24px; }
        .header p { margin: 5px 0 0; color: #64748b; font-size: 14px; }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            max-width: 800px;
            margin: 0 auto 30px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #e2e8f0;
        }

        .product-title { font-weight: bold; font-size: 15px; margin-bottom: 6px; }
        .product-price { color: var(--primary); font-weight: bold; font-size: 16px; }
        .product-stock { font-size: 12px; color: #16a34a; margin-top: 4px; }
        .out-of-stock { color: #dc2626; }

        .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        .add-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

        .cart-section {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .submit-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎁 متجر فرفيرو للهدايا</h1>
        <p>اختر منتجاتك المفضلة وسجل طلب الشراء مباشرة</p>
    </div>

    <!-- شبكة عرض المنتجات -->
    <div class="products-grid" id="productsContainer">
        <p style="text-align:center; grid-column: 1/-1;">جاري جلب الهدايا والمخزون من السيستم...</p>
    </div>

    <!-- سلة الطلب -->
    <div class="cart-section">
        <h3>تفاصيل طلب الشراء</h3>
        <div id="cartItemsList" style="margin-bottom: 15px; color: #64748b; font-size: 14px;">السلة فارغة حالياً</div>
        <div style="font-size: 18px; font-weight: bold; margin-bottom: 15px;">
            الإجمالي: <span id="cartTotal" style="color: var(--primary);">0</span> ج.م
        </div>

        <div class="form-group">
            <label>اسمك الكريم:</label>
            <input type="text" id="custName" placeholder="أدخل اسمك الثلاثي">
        </div>
        <div class="form-group">
            <label>رقم الموبايل:</label>
            <input type="tel" id="custPhone" placeholder="01xxxxxxxxx">
        </div>
        <div class="form-group">
            <label>عنوان التوصيل أو ملاحظات:</label>
            <textarea id="custAddress" rows="2" placeholder="العنوان بالتفصيل"></textarea>
        </div>

        <button class="submit-btn" onclick="sendPurchaseOrder()">إرسال طلب الشراء 🛒</button>
    </div>

    <script>
        // إعدادات الاتصال بقاعدة بيانات الفايربيس (تأكد من مطابقتها لمشروعك الرئيسي)
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForFarafero",
            authDomain: "farafero-gift-shop.firebaseapp.com",
            projectId: "farafero-gift-shop",
            storageBucket: "farafero-gift-shop.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123:web:abc"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let cart = [];
        let productsData = [];

        // جلب المنتجات بالأسماء الصحيحة المطابقة لسيستم المخزن عندك
        db.collection('products').onSnapshot(snapshot => {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';
            productsData = [];

            if (snapshot.empty) {
                container.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#64748b;">لا توجد منتجات مضافة حالياً في المخزن.</p>';
                return;
            }

            snapshot.forEach(doc => {
                const data = doc.data();
                const item = {
                    id: doc.id,
                    name: data.الهدية || data.name || 'هدية مميزة',
                    price: Number(data.البيع || data.price || 0),
                    stock: Number(data.المخزون || data.stock || 0)
                };
                productsData.push(item);

                const card = document.createElement('div');
                card.className = 'product-card';

                card.innerHTML = `
                    <div>
                        <div class="product-title">${item.name}</div>
                        <div class="product-price">${item.price} ج.م</div>
                        <div class="product-stock ${item.stock <= 0 ? 'out-of-stock' : ''}">
                            ${item.stock > 0 ? `المتاح: ${item.stock} قطعة` : 'نفذت الكمية'}
                        </div>
                    </div>
                    <button class="add-btn" ${item.stock <= 0 ? 'disabled' : ''} onclick="addToCart('${item.id}')">
                        ${item.stock > 0 ? '+ إضافة للطلب' : 'غير متوفر'}
                    </button>
                `;
                container.appendChild(card);
            });
        });

        function addToCart(productId) {
            const prod = productsData.find(p => p.id === productId);
            if (!prod) return;

            const existing = cart.find(c => c.id === productId);
            if (existing) {
                if (existing.qty < prod.stock) {
                    existing.qty++;
                } else {
                    alert('وصلت للحد الأقصى المتاح من هذه القطعة في المخزن!');
                }
            } else {
                cart.push({ id: prod.id, name: prod.name, price: prod.price, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cartItemsList');
            const totalEl = document.getElementById('cartTotal');
            if (cart.length === 0) {
                list.innerHTML = 'السلة فارغة حالياً';
                totalEl.innerText = '0';
                return;
            }

            let total = 0;
            list.innerHTML = cart.map(item => {
                total += item.price * item.qty;
                return `<div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                    <span>${item.name} (${item.qty})</span>
                    <span>${item.price * item.qty} ج.م</span>
                </div>`;
            }).join('');

            totalEl.innerText = total;
        }

        // إرسال الأوردر ليظهر في السيستم الرئيسي كـ "طلب شراء" (Purchase Order)
        function sendPurchaseOrder() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();

            if (cart.length === 0) return alert('سلة الطلبات فارغة!');
            if (!name || !phone) return alert('برجاء كتابة الاسم ورقم الموبايل');

            const orderTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const orderPayload = {
                customerName: name,
                customerPhone: phone,
                address: address,
                items: cart,
                totalAmount: orderTotal,
                createdAt: new Date().toISOString(),
                type: 'purchase_order', // تظهر عندك كطلب شراء في النظام الرئيسي
                status: 'pending'       // حالة معلقة بانتظار المراجعة
            };

            db.collection('purchase_orders').add(orderPayload)
                .then(() => {
                    alert('تم إرسال طلب الشراء بنجاح! سيظهر في لوحة التحكم لديك كطلب جديد.');
                    cart = [];
                    updateCartUI();
                    document.getElementById('custName').value = '';
                    document.getElementById('custPhone').value = '';
                    document.getElementById('custAddress').value = '';
                })
                .catch(err => {
                    console.error('Error sending order:', err);
                    alert('حدث خطأ أثناء إرسال الطلب، حاول ثانية.');
                });
        }
    </script>
</body>
</html>
