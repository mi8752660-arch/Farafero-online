<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FARAFERO GIFT SHOP - المتجر الإلكتروني</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'], cinzel: ['Cinzel', 'serif'], montserrat: ['Montserrat', 'sans-serif'] },
                    colors: { gold: '#C5A059' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #C5A059; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col pb-16" dir="rtl">

    <!-- TOP HEADER (بنفس الستايل مع زر السلة فوق خالص) -->
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-12 h-12 flex items-center justify-center bg-white rounded-2xl border border-gold/40 shadow-sm p-1">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
                        <path d="M50 32C42 22 30 22 33 32C35.5 38.5 48 35 50 32Z" stroke="#C5A059" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M50 32C58 22 70 22 67 32C64.5 38.5 52 35 50 32Z" stroke="#C5A059" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="25" y="32" width="50" height="12" fill="white" stroke="#C5A059" stroke-width="3" stroke-linejoin="round"/>
                        <rect x="28" y="44" width="44" height="34" fill="white" stroke="#C5A059" stroke-width="3" stroke-linejoin="round"/>
                        <line x1="50" y1="32" x2="50" y2="78" stroke="#C5A059" stroke-width="3"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-[3px] text-slate-900 leading-tight font-cinzel">FARAFERO</h1>
                    <p class="text-[9px] text-gold font-semibold tracking-[4px] uppercase font-montserrat">GIFT SHOP</p>
                </div>
            </div>

            <!-- زر السلة العلوي مع عداد المنتجات -->
            <button onclick="toggleCartModal()" class="relative flex items-center space-x-2 space-x-reverse bg-amber-50 border border-gold/40 hover:bg-amber-100 px-4 py-2.5 rounded-2xl transition-all shadow-sm">
                <i class="fa-solid fa-bag-shopping text-gold text-lg"></i>
                <span class="text-xs font-black text-slate-800">السلة</span>
                <span id="cart-badge" class="absolute -top-2 -left-2 bg-gold text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow-md">0</span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full space-y-6">
        
        <!-- قسم البحث والتصفية -->
        <div class="bg-white rounded-3xl p-6 border shadow-sm space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-3 gap-3">
                <div>
                    <h3 class="text-xl font-black text-slate-900 flex items-center">
                        <i class="fa-solid fa-gift text-gold ml-2"></i> تصفح هدايا فرفيرو المميزة
                    </h3>
                    <p class="text-xs text-slate-500 mt-1">اختر الهدية التي تعجبك وأضفها للسلة لإتمام الطلب أونلاين</p>
                </div>
            </div>
            
            <div class="bg-slate-50 p-3 rounded-2xl border flex items-center space-x-3 space-x-reverse">
                <i class="fa-solid fa-magnifying-glass text-gold"></i>
                <input type="text" id="store-search" oninput="renderStoreProducts()" placeholder="ابحث عن هدية أو كود..." class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-bold focus:outline-none focus:border-gold">
            </div>

            <!-- شبكة المنتجات (بنفس النمط والشكل المطلوب) -->
            <div id="store-products-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 p-1"></div>
        </div>

    </main>

    <!-- SLIDING / POPUP CART MODAL (السلة العلوية عند الضغط عليها) -->
    <div id="cart-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-lg p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar" dir="rtl">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-black text-lg text-slate-900 flex items-center">
                    <i class="fa-solid fa-bag-shopping text-gold ml-2"></i> سلة المشتريات
                </h3>
                <button onclick="toggleCartModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-700 font-bold flex items-center justify-center">✕</button>
            </div>

            <!-- تفاصيل العميل للـ PO -->
            <div class="space-y-3 bg-slate-50 p-3.5 rounded-2xl border">
                <h4 class="text-xs font-black text-slate-800">بيانات التوصيل والشحن:</h4>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-slate-600 block mb-1">اسم العميل:</label>
                        <input type="text" id="po-cust-name" placeholder="اسمك الكريم..." class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-gold">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-600 block mb-1">رقم الهاتف:</label>
                        <input type="tel" id="po-cust-phone" placeholder="رقم الموبايل..." class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-gold">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-600 block mb-1">عنوان الاستلام بالتفصيل:</label>
                    <input type="text5" id="po-cust-address" placeholder="المحافظة، الإسكندرية، الشارع..." class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-gold">
                </div>
            </div>

            <!-- قائمة أصناف السلة -->
            <div class="space-y-1">
                <span class="text-xs font-bold text-slate-700">الأصناف المضافة:</span>
                <div id="cart-items-list" class="divide-y max-h-[160px] overflow-y-auto my-1 text-xs bg-slate-50/50 p-2 rounded-xl border"></div>
            </div>

            <div class="space-y-2 pt-2 border-t">
                <div class="flex justify-between font-black text-base">
                    <span>الإجمالي النهائي:</span>
                    <span class="text-gold"><span id="cart-grand-total">0</span> EGP</span>
                </div>
                <button onclick="submitCustomerPO()" class="w-full bg-gold hover:bg-[#b08b49] text-white font-black py-3 rounded-2xl shadow-md text-xs transition-all flex items-center justify-center space-x-1.5 space-x-reverse">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>تأكيد وإرسال الطلب (PO) للمحل</span>
                </button>
            </div>
        </div>
    </div>

    <!-- IMAGE ZOOM MODAL -->
    <div id="image-zoom-modal" class="fixed inset-0 z-50 hidden bg-slate-900/85 backdrop-blur-md flex items-center justify-center p-4" onclick="closeImageZoom()">
        <div class="relative max-w-2xl w-full bg-white rounded-3xl p-4 shadow-2xl overflow-hidden text-center" onclick="event.stopPropagation()">
            <button onclick="closeImageZoom()" class="absolute top-4 left-4 w-9 h-9 rounded-full bg-slate-100 text-slate-700 font-bold flex items-center justify-center shadow-md z-10">✕</button>
            <h4 id="zoom-img-title" class="font-black text-base text-slate-900 mb-3"></h4>
            <div class="max-h-[70vh] overflow-hidden rounded-2xl bg-slate-100 flex items-center justify-center p-2">
                <img id="zoom-img-src" src="" class="max-h-[65vh] w-auto object-contain rounded-xl shadow-inner">
            </div>
        </div>
    </div>

    <!-- SCRIPT ENGINE -->
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAuP10QxT-N1gEo7nW6Zc9I1Nzg9ehdD6E",
          authDomain: "farafero-store-99e0d.firebaseapp.com",
          projectId: "farafero-store-99e0d",
          storageBucket: "farafero-store-99e0d.firebasestorage.app",
          messagingSenderId: "47711607235",
          appId: "1:47711607235:web:6cc25baa82eebcf6460576",
          measurementId: "G-Q736FT0ZH5"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let state = { products: [], customerCart: [] };

        function initStore() {
            db.collection("products").onSnapshot((snapshot) => {
                state.products = [];
                snapshot.forEach((doc) => {
                    state.products.push({ id: doc.id, ...doc.data() });
                });
                renderStoreProducts();
            });
        }

        function renderStoreProducts() {
            const grid = document.getElementById('store-products-grid');
            const searchInput = document.getElementById('store-search');
            if(!grid) return;
            const search = searchInput ? searchInput.value.toLowerCase().trim() : '';
            grid.innerHTML = '';

            const filtered = state.products.filter(p => p.stock > 0 && (p.name.toLowerCase().includes(search) || (p.code && p.code.toLowerCase().includes(search))));

            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white border rounded-2xl p-3 space-y-2 shadow-sm flex flex-col justify-between">
                        <img src="${p.image}" class="w-full h-36 object-cover rounded-xl cursor-pointer" onclick="openImageZoom('${p.image}', '${p.name}')">
                        <div>
                            <span class="text-[10px] text-gold font-bold">${p.code || ''}</span>
                            <h4 class="font-bold text-xs line-clamp-1">${p.name}</h4>
                            <span class="text-[9px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-bold">${p.category}</span>
                        </div>
                        <div class="flex justify-between items-center pt-2 border-t">
                            <span class="font-black text-xs text-gold">${Math.round(p.price)} EGP</span>
                            <button onclick="addToCustomerCart('${p.id}')" class="bg-gold hover:bg-[#b08b49] text-white px-3 py-1.5 rounded-xl text-[10px] font-black shadow-sm">إضافة للسلة</button>
                        </div>
                    </div>
                `;
            });
        }

        function addToCustomerCart(id) {
            const p = state.products.find(x => x.id === id);
            if (!p || p.stock <= 0) return alert('عذراً، نفذت الكمية!');
            const item = state.customerCart.find(x => x.id === id);
            if (item) {
                if (item.qty + 1 > p.stock) return alert('الكمية المطلوبة أكبر من المتاح بالمخزن!');
                item.qty++;
            } else {
                state.customerCart.push({ ...p, qty: 1 });
            }
            updateCartBadge();
            alert('تمت إضافة الهدية إلى السلة بنجاح!');
        }

        function updateCartBadge() {
            const totalItems = state.customerCart.reduce((sum, i) => sum + i.qty, 0);
            document.getElementById('cart-badge').innerText = totalItems;
        }

        function toggleCartModal() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                renderCartModalItems();
            }
        }

        function renderCartModalItems() {
            const container = document.getElementById('cart-items-list');
            if(!container) return;
            container.innerHTML = '';
            let subtotal = 0;

            if (state.customerCart.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 py-4">السلة فارغة حالياً</p>';
                document.getElementById('cart-grand-total').innerText = '0';
                return;
            }

            state.customerCart.forEach((i, idx) => {
                subtotal += i.price * i.qty;
                container.innerHTML += `
                    <div class="flex justify-between items-center py-1.5">
                        <div><span class="font-bold">${i.name}</span><span class="text-slate-400 text-[10px] block">${i.price} × ${i.qty}</span></div>
                        <div class="flex items-center space-x-2 space-x-reverse"><b>${i.price * i.qty} EGP</b><button onclick="removeFromCart(${idx})" class="text-rose-500 font-bold">✕</button></div>
                    </div>`;
            });
            document.getElementById('cart-grand-total').innerText = Math.round(subtotal);
        }

        function removeFromCart(idx) {
            state.customerCart.splice(idx, 1);
            updateCartBadge();
            renderCartModalItems();
        }

        function openImageZoom(imgUrl, title) {
            document.getElementById('zoom-img-src').src = imgUrl;
            document.getElementById('zoom-img-title').innerText = title;
            document.getElementById('image-zoom-modal').classList.remove('hidden');
        }

        function closeImageZoom() {
            document.getElementById('image-zoom-modal').classList.add('hidden');
        }

        function submitCustomerPO() {
            const name = document.getElementById('po-cust-name').value.trim();
            const phone = document.getElementById('po-cust-phone').value.trim();
            const address = document.getElementById('po-cust-address').value.trim();

            if (!name || !phone || !address) return alert('برجاء إدخال الاسم، رقم الهاتف، وعنوان الاستلام!');
            if (state.customerCart.length === 0) return alert('السلة فارغة!');

            let subtotal = state.customerCart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const poId = 'PO-' + Math.floor(1000 + Math.random() * 9000);
            const dateStr = new Date().toLocaleDateString('en-GB');

            db.collection("orders").add({
                id: poId,
                type: 'po',
                date: dateStr,
                timestamp: Date.now(),
                total: subtotal,
                shipping: 0,
                customerName: name,
                customerPhone: phone + ' - العنوان: ' + address,
                status: 'pending',
                detailedItems: JSON.parse(JSON.stringify(state.customerCart))
            }).then(() => {
                alert('🎉 تم إرسال طلبك بنجاح للمحل وسيتم مراجعته وتأكيده فوراً!');
                state.customerCart = [];
                updateCartBadge();
                toggleCartModal();
            }).catch(err => {
                alert('حدث خطأ أثناء الإرسال، برجاء المحاولة مرة أخرى.');
            });
        }

        document.addEventListener('DOMContentLoaded', initStore);
    </script>
</body>
</html>
