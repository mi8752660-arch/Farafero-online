<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farafero Gift Shop | Online Store</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            900: '#064e3b',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-header {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(12px);
        }
        .product-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(5, 150, 105, 0.1), 0 10px 10px -5px rgba(5, 150, 105, 0.04);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header & Navigation -->
    <header class="sticky top-0 z-40 glass-header border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="setCategory('all')">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-700 to-emerald-500 flex items-center justify-center text-white shadow-lg shadow-emerald-600/30">
                    <span class="text-2xl font-black">F</span>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-slate-900 leading-none">FARAFERO</h1>
                    <p class="text-[10px] font-extrabold text-emerald-600 tracking-wider uppercase mt-1">ONLINE STOREFRONT</p>
                </div>
            </div>

            <div class="hidden md:flex items-center flex-1 max-w-md mx-8 relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Search gifts, codes, acrylics..." class="w-full pl-10 pr-4 py-2.5 bg-slate-100/80 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
            </div>

            <div class="flex items-center gap-3">
                <button onclick="toggleCartModal()" class="relative p-2.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 transition-colors flex items-center gap-2 px-4">
                    <i class="fa-solid fa-bag-shopping text-lg text-emerald-600"></i>
                    <span class="font-bold text-sm hidden sm:inline">Bag</span>
                    <span id="cartBadge" class="bg-emerald-600 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Store Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        <div class="flex items-center justify-between flex-wrap gap-4 mb-8">
            <div class="flex items-center gap-2 overflow-x-auto pb-2 w-full md:w-auto no-scrollbar" id="categoryFilters">
                <button onclick="setCategory('all')" class="cat-btn active bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all shadow-sm">
                    All Items
                </button>
                <button onclick="setCategory('Lighting')" class="cat-btn bg-white border border-slate-200 text-slate-600 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all">Lighting</button>
                <button onclick="setCategory('Mugs')" class="cat-btn bg-white border border-slate-200 text-slate-600 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all">Mugs</button>
                <button onclick="setCategory('Plush')" class="cat-btn bg-white border border-slate-200 text-slate-600 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all">Plush</button>
                <button onclick="setCategory('Steel')" class="cat-btn bg-white border border-slate-200 text-slate-600 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all">Steel</button>
                <button onclick="setCategory('Boxes')" class="cat-btn bg-white border border-slate-200 text-slate-600 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all">Boxes</button>
            </div>

            <div class="flex items-center gap-2 text-sm text-slate-500 ml-auto">
                <label>Sort:</label>
                <select id="sortBy" onchange="filterProducts()" class="bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-slate-700 font-medium focus:outline-none">
                    <option value="featured">Featured Items</option>
                    <option value="low-high">Price: Low to High</option>
                    <option value="high-low">Price: High to Low</option>
                </select>
            </div>
        </div>

        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

        <div id="emptyState" class="hidden text-center py-16">
            <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400">
                <i class="fa-solid fa-box-open text-2xl"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-800">No items found</h3>
            <p class="text-sm text-slate-500 mt-1">Try resetting your search or category filter.</p>
        </div>
    </main>

    <!-- Shopping Bag Modal -->
    <div id="cartModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
            <div class="p-5 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-bag-shopping text-emerald-600 text-xl"></i>
                    <h3 class="font-extrabold text-slate-900 text-lg">Your Order Bag</h3>
                </div>
                <button onclick="toggleCartModal()" class="w-8 h-8 rounded-full hover:bg-slate-200 flex items-center justify-center text-slate-500 transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-5 space-y-4"></div>

            <div id="cartCheckoutFooter" class="p-5 border-t border-slate-200 bg-slate-50 space-y-4">
                <div class="space-y-2">
                    <div class="flex justify-between text-sm text-slate-600">
                        <span>Subtotal</span>
                        <span id="cartSubtotal">0.00 EGP</span>
                    </div>
                    <div class="flex justify-between text-lg font-extrabold text-slate-900 pt-2 border-t border-slate-200">
                        <span>Total Due</span>
                        <span id="cartTotal" class="text-emerald-700">0.00 EGP</span>
                    </div>
                </div>

                <div class="space-y-3 pt-2">
                    <input type="text" id="customerName" placeholder="Full Name *" class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <input type="tel" id="customerPhone" placeholder="Phone Number (010...) *" class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <textarea id="customerAddress" placeholder="Delivery Address & Notes" rows="2" class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                </div>

                <button onclick="submitOrder()" id="btnSubmitOrder" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check"></i> Complete Purchase & Deduct Stock
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 transform translate-y-20 opacity-0 transition-all duration-300">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg" class="text-sm font-semibold">Notification</span>
    </div>

    <!-- App Logic Script -->
    <script>
        // إعدادات Firebase (ضع بيانات مشروعك هنا إن وجدت)
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "farafero-geft-shop.firebaseapp.com",
            projectId: "farafero-geft-shop",
            storageBucket: "farafero-geft-shop.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        let db = null;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
        } catch (e) {
            console.log("Running in offline fallback mode");
        }

        // المنتجات الأساسية المطابقة للويبسايت الرئيسي بنفس الأكواد والأسعار
        let products = [
            { id: '1', code: 'FAR-101', name: 'Custom Acrylic Light Box', category: 'Lighting', price: 350, stock: 12, image: 'https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=500&auto=format&fit=crop&q=60' },
            { id: '2', code: 'FAR-102', name: 'Color Changing Magic Mug', category: 'Mugs', price: 180, stock: 8, image: 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500&auto=format&fit=crop&q=60' },
            { id: '3', code: 'FAR-103', name: 'Giant Teddy Plush Toy', category: 'Plush', price: 450, stock: 4, image: 'https://images.unsplash.com/photo-1559454403-b8fb88521f11?w=500&auto=format&fit=crop&q=60' },
            { id: '4', code: 'FAR-104', name: 'Stainless Steel Thermal Flask', category: 'Steel', price: 290, stock: 15, image: 'https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=500&auto=format&fit=crop&q=60' },
            { id: '5', code: 'FAR-105', name: 'Scented Luxury Candle Set', category: 'Boxes', price: 220, stock: 9, image: 'https://images.unsplash.com/photo-1603006905003-be475563bc59?w=500&auto=format&fit=crop&q=60' },
            { id: '6', code: 'FAR-106', name: 'Romantic Gift Box Edition', category: 'Boxes', price: 550, stock: 3, image: 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=500&auto=format&fit=crop&q=60' }
        ];

        let cart = [];
        let activeCategory = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            updateCartUI();
            if (db) {
                listenToLiveInventory();
            }
        });

        // مزامنة المخزون لحظياً من قاعدة البيانات لو متوفرة
        function listenToLiveInventory() {
            db.collection("products").onSnapshot((snapshot) => {
                if (!snapshot.empty) {
                    let cloudProducts = [];
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        cloudProducts.push({
                            id: doc.id,
                            code: data.code || 'FAR-00',
                            name: data.name || 'Gift Item',
                            category: data.category || 'Lighting',
                            price: Number(data.price || 0),
                            stock: Number(data.stock || 0),
                            image: data.image || 'https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=500&auto=format&fit=crop&q=60'
                        });
                    });
                    if (cloudProducts.length > 0) {
                        products = cloudProducts;
                        renderProducts();
                    }
                }
            }, (err) => console.log("Using default product list"));
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const emptyState = document.getElementById('emptyState');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const sortVal = document.getElementById('sortBy').value;

            let filtered = products.filter(p => {
                const matchCat = activeCategory === 'all' || p.category === activeCategory;
                const matchSearch = p.name.toLowerCase().includes(searchVal) || p.code.toLowerCase().includes(searchVal);
                return matchCat && matchSearch;
            });

            if (sortVal === 'low-high') filtered.sort((a,b) => a.price - b.price);
            if (sortVal === 'high-low') filtered.sort((a,b) => b.price - a.price);

            grid.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filtered.forEach(product => {
                    const isOutOfStock = product.stock <= 0;

                    grid.innerHTML += `
                        <div class="product-card bg-white rounded-2xl border border-slate-200 overflow-hidden flex flex-col justify-between">
                            <div>
                                <div class="relative h-48 bg-slate-100 overflow-hidden">
                                    <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover">
                                    <span class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-md text-white text-[10px] font-bold px-2.5 py-1 rounded-full uppercase">
                                        ${product.category}
                                    </span>
                                    ${isOutOfStock ? `
                                        <div class="absolute inset-0 bg-slate-900/70 flex items-center justify-center">
                                            <span class="bg-red-600 text-white font-bold text-xs px-3 py-1.5 rounded-lg">OUT OF STOCK</span>
                                        </div>
                                    ` : ''}
                                </div>
                                <div class="p-4">
                                    <span class="text-xs text-slate-400 font-mono">${product.code}</span>
                                    <h3 class="font-bold text-slate-900 mt-1 line-clamp-1">${product.name}</h3>
                                    
                                    <div class="mt-3 flex items-center justify-between">
                                        <div>
                                            <span class="text-xs text-slate-400 block">Price</span>
                                            <span class="text-lg font-extrabold text-emerald-700">${product.price.toFixed(2)} <span class="text-xs">EGP</span></span>
                                        </div>
                                        <div class="text-right">
                                            <span class="text-xs text-slate-400 block">Stock</span>
                                            <span class="text-xs font-bold ${isOutOfStock ? 'text-red-500' : 'text-emerald-600'}">
                                                ${product.stock} left
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="p-4 pt-0">
                                <button onclick="addToCart('${product.id}')" ${isOutOfStock ? 'disabled' : ''} class="w-full py-2.5 rounded-xl font-bold text-sm transition-all ${isOutOfStock ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-emerald-700 hover:bg-emerald-800 text-white shadow-md'}">
                                    <i class="fa-solid fa-cart-plus"></i> ${isOutOfStock ? 'Sold Out' : 'Add to Bag'}
                                </button>
                            </div>
                        </div>
                    `;
                });
            }
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product || product.stock <= 0) return;

            const existing = cart.find(item => item.id === productId);

            if (existing) {
                if (existing.qty < product.stock) {
                    existing.qty++;
                    showToast(`Updated quantity for ${product.name}`);
                } else {
                    showToast(`Max stock reached (${product.stock})`, true);
                    return;
                }
            } else {
                cart.push({ ...product, qty: 1 });
                showToast(`Added ${product.name} to bag`);
            }

            updateCartUI();
        }

        function updateCartQty(productId, delta) {
            const item = cart.find(i => i.id === productId);
            const product = products.find(p => p.id === productId);

            if (item) {
                if (item.qty + delta > product.stock) {
                    showToast(`Max stock is ${product.stock}`, true);
                    return;
                }
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
                updateCartUI();
            }
        }

        function updateCartUI() {
            const badge = document.getElementById('cartBadge');
            const container = document.getElementById('cartItemsContainer');
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalSum = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            badge.innerText = totalQty;
            document.getElementById('cartSubtotal').innerText = `${totalSum.toFixed(2)} EGP`;
            document.getElementById('cartTotal').innerText = `${totalSum.toFixed(2)} EGP`;

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i class="fa-solid fa-bag-shopping text-4xl mb-3 text-slate-300"></i>
                        <p class="font-bold text-slate-600">Your bag is empty</p>
                    </div>
                `;
            } else {
                container.innerHTML = '';
                cart.forEach(item => {
                    container.innerHTML += `
                        <div class="flex items-center justify-between gap-3 p-3 bg-slate-50 border border-slate-200 rounded-xl">
                            <div class="flex items-center gap-3">
                                <img src="${item.image}" class="w-12 h-12 rounded-lg object-cover">
                                <div>
                                    <h4 class="font-bold text-sm text-slate-800 line-clamp-1">${item.name}</h4>
                                    <span class="text-xs text-emerald-700 font-bold">${item.price.toFixed(2)} EGP</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 bg-white border border-slate-200 rounded-lg p-1">
                                <button onclick="updateCartQty('${item.id}', -1)" class="w-6 h-6 font-bold text-slate-600">-</button>
                                <span class="text-xs font-bold w-4 text-center">${item.qty}</span>
                                <button onclick="updateCartQty('${item.id}', 1)" class="w-6 h-6 font-bold text-slate-600">+</button>
                            </div>
                        </div>
                    `;
                });
            }
        }

        async function submitOrder() {
            if (cart.length === 0) {
                showToast('Bag is empty!', true);
                return;
            }

            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            const address = document.getElementById('customerAddress').value.trim();

            if (!name || !phone) {
                showToast('Please enter full name and phone number', true);
                return;
            }

            const btn = document.getElementById('btnSubmitOrder');
            btn.disabled = true;
            btn.innerText = 'Processing Order...';

            try {
                if (db) {
                    const batch = db.batch();
                    cart.forEach(item => {
                        const ref = db.collection("products").doc(item.id);
                        batch.update(ref, {
                            stock: firebase.firestore.FieldValue.increment(-item.qty)
                        });
                    });

                    const orderRef = db.collection("orders").doc();
                    const totalSum = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
                    
                    batch.set(orderRef, {
                        customerName: name,
                        phone: phone,
                        address: address,
                        items: cart.map(i => ({ id: i.id, name: i.name, qty: i.qty, price: i.price })),
                        totalAmount: totalSum,
                        status: 'Online Order (Pending)',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    await batch.commit();
                } else {
                    // Local fallback subtraction
                    cart.forEach(c => {
                        let p = products.find(x => x.id === c.id);
                        if(p) p.stock -= c.qty;
                    });
                }

                showToast('Order confirmed & stock updated successfully!');
                cart = [];
                updateCartUI();
                toggleCartModal();
                renderProducts();

                document.getElementById('customerName').value = '';
                document.getElementById('customerPhone').value = '';
                document.getElementById('customerAddress').value = '';

            } catch (err) {
                console.error(err);
                showToast('Order processed locally', false);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Complete Purchase & Deduct Stock';
            }
        }

        function setCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-700', 'text-white');
                btn.classList.add('bg-white', 'text-slate-600');
            });
            event.target.classList.add('bg-emerald-700', 'text-white');
            renderProducts();
        }

        function filterProducts() {
            renderProducts();
        }

        function toggleCartModal() {
            document.getElementById('cartModal').classList.toggle('hidden');
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;
            toastIcon.className = isError ? 'fa-solid fa-circle-exclamation text-red-400' : 'fa-solid fa-circle-check text-emerald-400';

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
