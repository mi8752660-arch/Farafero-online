<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farafero Store | فرفيرو للهدايا والتحف</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
  </style>
</head>
<body class="bg-stone-50 text-stone-900 antialiased min-h-screen flex flex-col selection:bg-rose-800 selection:text-white">

  <div id="root"></div>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons UMD -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_CATEGORIES = [
      'الكل',
      'مجات وأكواب',
      'إضاءات وديكور',
      'إكسسوارات وساعات',
      'شموع وروائح',
      'بوكسات هدايا'
    ];

    const INITIAL_PRODUCTS = [
      {
        id: 'p1',
        name: 'مج حراري بتصميم رخامي وغطاء ذهبي',
        category: 'مجات وأكواب',
        price: 220,
        oldPrice: 280,
        isOffer: true,
        inStock: true,
        image: 'https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?auto=format&fit=crop&w=800&q=80',
        description: 'مج سيراميك فاخر يحافظ على حرارة المشروبات مع ملعقة ذهبية أنيقة.'
      },
      {
        id: 'p2',
        name: 'أباجورة أكريليك مضيئة ثلاثية الأبعاد',
        category: 'إضاءات وديكور',
        price: 350,
        oldPrice: null,
        isOffer: false,
        inStock: true,
        image: 'https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?auto=format&fit=crop&w=800&q=80',
        description: 'إضاءة ليلية دافئة بقاعدة خشبية أنيقة تضيف لمسة ساحرة لغرفتك.'
      },
      {
        id: 'p3',
        name: 'بوكس السعادة المتكامل للهدايا',
        category: 'بوكسات هدايا',
        price: 650,
        oldPrice: 800,
        isOffer: true,
        inStock: true,
        image: 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=800&q=80',
        description: 'بوكس هدايا فاخر يضم شمعة معطرة، مج، وإكسسوارات بتغليف ملكي.'
      },
      {
        id: 'p4',
        name: 'طقم إكسسوارات ستانلس ستيل مطلي ذهب',
        category: 'إكسسوارات وساعات',
        price: 290,
        oldPrice: null,
        isOffer: false,
        inStock: true,
        image: 'https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=800&q=80',
        description: 'سلسلة وأسورة مقاومة للصدأ وتغير اللون مع علبة قطيفة فاخرة.'
      },
      {
        id: 'p5',
        name: 'شمعة صويا معطرة برائحة الفانيليا والعود',
        category: 'شموع وروائح',
        price: 185,
        oldPrice: 230,
        isOffer: true,
        inStock: true,
        image: 'https://images.unsplash.com/photo-1602874801007-bd458bb1b8b6?auto=format&fit=crop&w=800&q=80',
        description: 'شمعة طبيعية تدوم لأكثر من 35 ساعة في برطمان زجاجي أنيق.'
      },
      {
        id: 'p6',
        name: 'ساعة يد كلاسيكية بسوار جلدي',
        category: 'إكسسوارات وساعات',
        price: 490,
        oldPrice: null,
        isOffer: false,
        inStock: true,
        image: 'https://images.unsplash.com/photo-1524592094714-0f0654e20314?auto=format&fit=crop&w=800&q=80',
        description: 'تصميم عصري يناسب جميع المناسبات مع ضمان لمدة عام.'
      }
    ];

    const STORE_INFO = {
      name: 'Farafero Store',
      arabicName: 'فرفيرو ستور',
      slogan: 'Gifts with Love',
      phone: '01005187411',
      whatsapp: '201005187411',
      email: 'info@faraferostore.com',
      address: 'الإسكندرية، مصر'
    };

    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [cartOpen, setCartOpen] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState('الكل');
      const [searchQuery, setSearchQuery] = useState('');
      const [toast, setToast] = useState(null);

      // Data States
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('farafero_products');
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
      });

      const [cart, setCart] = useState(() => {
        const saved = localStorage.getItem('farafero_cart');
        return saved ? JSON.parse(saved) : [];
      });

      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem('farafero_orders');
        return saved ? JSON.parse(saved) : [];
      });

      const [customers, setCustomers] = useState(() => {
        const saved = localStorage.getItem('farafero_customers');
        return saved ? JSON.parse(saved) : [];
      });

      const [shippingRates, setShippingRates] = useState(() => {
        const saved = localStorage.getItem('farafero_shipping');
        return saved ? JSON.parse(saved) : { alexandria: 45, cairo: 65, other: 85 };
      });

      // Admin State
      const [isAdmin, setIsAdmin] = useState(false);
      const [adminPasswordInput, setAdminPasswordInput] = useState('');
      const [adminTab, setAdminTab] = useState('products');
      const [editingProduct, setEditingProduct] = useState(null);
      const [newProductForm, setNewProductForm] = useState({
        name: '', category: 'مجات وأكواب', price: '', oldPrice: '', isOffer: false, inStock: true, image: '', description: ''
      });

      // Checkout Form
      const [checkoutForm, setCheckoutForm] = useState({
        name: '', phone: '', governorate: 'alexandria', address: '', paymentMethod: 'cod', notes: ''
      });

      useEffect(() => { localStorage.setItem('farafero_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('farafero_cart', JSON.stringify(cart)); }, [cart]);
      useEffect(() => { localStorage.setItem('farafero_orders', JSON.stringify(orders)); }, [orders]);
      useEffect(() => { localStorage.setItem('farafero_customers', JSON.stringify(customers)); }, [customers]);
      useEffect(() => { localStorage.setItem('farafero_shipping', JSON.stringify(shippingRates)); }, [shippingRates]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const addToCart = (product) => {
        if (!product.inStock) return;
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, qty: 1 }];
        });
        showToast(`تمت إضافة "${product.name}" إلى السلة 🛍️`);
      };

      const updateCartQty = (id, delta) => {
        setCart(prev => prev.map(item => item.id === id ? { ...item, qty: item.qty + delta } : item).filter(item => item.qty > 0));
      };

      const cartSubtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      const cartCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const currentShippingCost = shippingRates[checkoutForm.governorate] || 0;
      const orderTotal = cartSubtotal + currentShippingCost;

      const handlePlaceOrder = (e) => {
        e.preventDefault();
        if (cart.length === 0) return;

        const newOrder = {
          id: `ORD-${Date.now().toString().slice(-6)}`,
          date: new Date().toLocaleDateString('ar-EG'),
          customerName: checkoutForm.name,
          phone: checkoutForm.phone,
          governorate: checkoutForm.governorate,
          address: checkoutForm.address,
          paymentMethod: checkoutForm.paymentMethod,
          notes: checkoutForm.notes,
          items: cart,
          subtotal: cartSubtotal,
          shipping: currentShippingCost,
          total: orderTotal,
          status: 'قيد المراجعة'
        };

        setOrders(prev => [newOrder, ...prev]);

        // Auto save customer strictly upon order creation
        setCustomers(prev => {
          const exists = prev.find(c => c.phone === checkoutForm.phone);
          if (exists) {
            return prev.map(c => c.phone === checkoutForm.phone ? { ...c, ordersCount: c.ordersCount + 1, totalSpent: c.totalSpent + orderTotal } : c);
          }
          return [{ id: `CUST-${Date.now().toString().slice(-5)}`, name: checkoutForm.name, phone: checkoutForm.phone, address: checkoutForm.address, ordersCount: 1, totalSpent: orderTotal }, ...prev];
        });

        const govNames = { alexandria: 'الإسكندرية', cairo: 'القاهرة والجيزة', other: 'باقي المحافظات' };
        const itemsText = cart.map(i => `- ${i.name} (×${i.qty}) = ${i.price * i.qty} ج.م`).join('%0A');
        const waText = `مرحباً ${STORE_INFO.name}، أود تأكيد طلبي رقم ${newOrder.id}:%0A%0A*بيانات العميل:*%0Aالاسم: ${checkoutForm.name}%0Aالموبايل: ${checkoutForm.phone}%0Aالمحافظة: ${govNames[checkoutForm.governorate]}%0Aالعنوان: ${checkoutForm.address}%0A%0A*المنتجات:*%0A${itemsText}%0A%0Aالشحن: ${currentShippingCost} ج.م%0A*الإجمالي: ${orderTotal} ج.م*`;

        setCart([]);
        setCurrentPage('home');
        showToast('تم تسجيل الطلب بنجاح! جاري تحويلك للواتساب...');
        window.open(`https://wa.me/${STORE_INFO.whatsapp}?text=${waText}`, '_blank');
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPasswordInput === 'farafero2026') {
          setIsAdmin(true);
          setCurrentPage('admin');
          setAdminPasswordInput('');
          showToast('تم تسجيل الدخول إلى لوحة التحكم بنجاح');
        } else {
          showToast('كلمة المرور غير صحيحة');
        }
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        const productData = {
          ...newProductForm,
          price: Number(newProductForm.price),
          oldPrice: newProductForm.oldPrice ? Number(newProductForm.oldPrice) : null,
          image: newProductForm.image || 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=800&q=80'
        };

        if (editingProduct) {
          setProducts(prev => prev.map(p => p.id === editingProduct.id ? { ...productData, id: p.id } : p));
          setEditingProduct(null);
          showToast('تم تحديث المنتج بنجاح');
        } else {
          setProducts(prev => [{ ...productData, id: `p-${Date.now()}` }, ...prev]);
          showToast('تمت إضافة المنتج الجديد');
        }

        setNewProductForm({ name: '', category: 'مجات وأكواب', price: '', oldPrice: '', isOffer: false, inStock: true, image: '', description: '' });
      };

      const startEditProduct = (p) => {
        setEditingProduct(p);
        setNewProductForm({ name: p.name, category: p.category, price: p.price, oldPrice: p.oldPrice || '', isOffer: p.isOffer, inStock: p.inStock, image: p.image, description: p.description });
      };

      const deleteProduct = (id) => {
        setProducts(prev => prev.filter(p => p.id !== id));
        showToast('تم حذف المنتج');
      };

      const updateOrderStatus = (orderId, newStatus) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
        showToast('تم تحديث حالة الطلب');
      };

      const filteredProducts = products.filter(p => {
        const matchesCat = selectedCategory === 'الكل' || p.category === selectedCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.category.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      const offerProducts = products.filter(p => p.isOffer);

      const ProductCard = ({ product }) => (
        <div className="group bg-white rounded-3xl border border-stone-200 overflow-hidden shadow-sm hover:shadow-2xl transition-all duration-300 flex flex-col">
          <div className="relative aspect-square overflow-hidden bg-stone-100">
            <img src={product.image} alt={product.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
            {product.isOffer && (
              <span className="absolute top-3 right-3 bg-rose-700 text-white text-xs font-black px-3.5 py-1.5 rounded-full shadow">
                عرض خاص
              </span>
            )}
            <span className={`absolute top-3 left-3 text-xs font-bold px-3 py-1 rounded-full ${product.inStock ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-stone-200 text-stone-600'}`}>
              {product.inStock ? 'in stock' : 'غير متاح'}
            </span>
          </div>

          <div className="p-5 flex-1 flex flex-col justify-between">
            <div>
              <span className="text-xs text-amber-700 font-bold">{product.category}</span>
              <h3 className="font-extrabold text-stone-900 text-base mt-1 line-clamp-1">{product.name}</h3>
              <p className="text-xs text-stone-500 mt-1 line-clamp-2 leading-relaxed">{product.description}</p>
            </div>

            <div className="mt-5 pt-4 border-t border-stone-100 flex items-center justify-between">
              <div>
                <span className="text-lg font-black text-rose-800">{product.price} ج.م</span>
                {product.oldPrice && <span className="text-xs text-stone-400 line-through mr-2 font-bold">{product.oldPrice} ج.م</span>}
              </div>

              <button 
                onClick={() => addToCart(product)} 
                disabled={!product.inStock} 
                className="bg-stone-900 hover:bg-rose-800 disabled:bg-stone-200 text-white px-4 py-2.5 rounded-2xl text-xs font-bold transition-all shadow hover:shadow-lg active:scale-95"
              >
                أضف للسلة 🛍️
              </button>
            </div>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen flex flex-col bg-stone-50 text-stone-900">
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-stone-900 text-white px-6 py-3.5 rounded-2xl shadow-2xl text-sm font-bold border border-stone-700 animate-bounce">
              {toast}
            </div>
          )}

          {/* Header */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-stone-200 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              <button onClick={() => setCurrentPage('home')} className="flex items-center gap-3 text-right group">
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-rose-800 to-amber-600 flex items-center justify-center text-white shadow-md text-xl group-hover:scale-105 transition-transform">
                  🎁
                </div>
                <div>
                  <div className="text-xl font-black tracking-tight text-stone-900 leading-none">{STORE_INFO.name}</div>
                  <div className="text-[11px] font-bold text-amber-700 tracking-widest uppercase mt-1">{STORE_INFO.slogan}</div>
                </div>
              </button>

              <nav className="hidden md:flex items-center gap-8 text-sm font-bold">
                {[
                  { id: 'home', label: 'الرئيسية' },
                  { id: 'shop', label: 'المتجر' },
                  { id: 'offers', label: 'العروض' },
                  { id: 'about', label: 'من نحن' },
                  { id: 'contact', label: 'تواصل معنا' }
                ].map((link) => (
                  <button 
                    key={link.id} 
                    onClick={() => setCurrentPage(link.id)} 
                    className={`transition-all py-1 ${currentPage === link.id ? 'text-rose-800 border-b-2 border-rose-800 font-black' : 'text-stone-600 hover:text-rose-800'}`}
                  >
                    {link.label}
                  </button>
                ))}
              </nav>

              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setCartOpen(true)} 
                  className="relative p-3 rounded-2xl bg-stone-100 hover:bg-rose-50 text-stone-700 hover:text-rose-800 transition-all shadow-xs"
                >
                  🛒
                  {cartCount > 0 && (
                    <span className="absolute -top-1 -right-1 w-5 h-5 bg-rose-800 text-white text-[11px] font-black rounded-full flex items-center justify-center shadow">
                      {cartCount}
                    </span>
                  )}
                </button>
                <button 
                  onClick={() => setCurrentPage(isAdmin ? 'admin' : 'admin-login')} 
                  title="لوحة التحكم" 
                  className={`p-3 rounded-2xl transition-all shadow-xs ${isAdmin ? 'bg-rose-800 text-white' : 'bg-stone-100 hover:bg-stone-200 text-stone-700'}`}
                >
                  🔒
                </button>
                <button 
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)} 
                  className="md:hidden p-3 rounded-2xl bg-stone-100 text-stone-700 font-bold"
                >
                  ☰
                </button>
              </div>
            </div>

            {/* Mobile Menu Dropdown */}
            {mobileMenuOpen && (
              <div className="md:hidden bg-white border-t border-stone-100 px-4 py-4 space-y-2 shadow-xl">
                {[
                  { id: 'home', label: 'الرئيسية' },
                  { id: 'shop', label: 'المتجر' },
                  { id: 'offers', label: 'العروض' },
                  { id: 'about', label: 'من نحن' },
                  { id: 'contact', label: 'تواصل معنا' }
                ].map((link) => (
                  <button 
                    key={link.id} 
                    onClick={() => { setCurrentPage(link.id); setMobileMenuOpen(false); }} 
                    className="block w-full text-right px-4 py-3 rounded-xl text-sm font-bold text-stone-700 hover:bg-rose-50 hover:text-rose-800"
                  >
                    {link.label}
                  </button>
                ))}
              </div>
            )}
          </header>

          {/* Main Content Area */}
          <main className="flex-1">
            {currentPage === 'home' && (
              <div>
                {/* Hero Banner */}
                <section className="bg-gradient-to-bl from-rose-950 via-stone-900 to-stone-900 text-white relative overflow-hidden">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 md:py-28 grid md:grid-cols-2 gap-12 items-center">
                    <div className="space-y-6">
                      <div className="inline-flex items-center gap-2 bg-white/10 border border-white/15 px-4 py-2 rounded-full text-amber-300 text-xs font-black shadow">
                        ✨ تشكيلة هدايا 2026 الأصلية وصلت الآن
                      </div>
                      <h1 className="text-4xl sm:text-6xl font-black leading-tight">
                        هدايا استثنائية تصنع <span className="text-amber-400">لحظات لا تُنسى</span>
                      </h1>
                      <p className="text-stone-300 text-base sm:text-lg leading-relaxed max-w-xl">
                        في {STORE_INFO.name} جمعنالك أرقى المجات، الإضاءات الديكورية، الإكسسوارات الفاخرة، وبوكسات الهدايا الجاهزة بتغليف ملكي يليق بكل مناسباتك.
                      </p>
                      <div className="flex flex-wrap gap-4 pt-4">
                        <button 
                          onClick={() => setCurrentPage('shop')} 
                          className="bg-rose-700 hover:bg-rose-600 text-white px-8 py-4 rounded-2xl font-black text-sm shadow-xl transition-all hover:scale-105"
                        >
                          تسوق المنتجات الآن 🛍️
                        </button>
                        <button 
                          onClick={() => setCurrentPage('offers')} 
                          className="bg-white/10 hover:bg-white/20 border border-white/20 text-white px-8 py-4 rounded-2xl font-black text-sm transition-all"
                        >
                          اكتشف العروض والخصومات 🔥
                        </button>
                      </div>
                    </div>

                    <div className="relative">
                      <img 
                        src="https://images.unsplash.com/photo-1513885535751-8b9238bd345a?auto=format&fit=crop&w=900&q=80" 
                        alt="هدايا فرفيرو ستور" 
                        className="rounded-3xl shadow-2xl border border-white/10 w-full h-80 md:h-[420px] object-cover" 
                      />
                    </div>
                  </div>
                </section>

                {/* Features Bar */}
                <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-8 relative z-10">
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                    {[
                      { title: 'تغليف هدايا ملكي فاخر', desc: 'تجهيز وتغليف أنيق جاهز للتقديم مباشرة', icon: '🎁' },
                      { title: 'شحن سريع لجميع المحافظات', desc: 'توصيل آمن وسريع لباب البيت', icon: '🚀' },
                      { title: 'جودة مضمونة ومعاينة', desc: 'معاينة المنتج مع المندوب بكل اطمئنان', icon: '🛡️' }
                    ].map((feat, idx) => (
                      <div key={idx} className="bg-white p-6 rounded-3xl shadow-xl border border-stone-100 flex items-center gap-4">
                        <div className="w-14 h-14 rounded-2xl bg-rose-50 text-rose-800 flex items-center justify-center text-2xl shrink-0 shadow-inner">
                          {feat.icon}
                        </div>
                        <div>
                          <h3 className="font-extrabold text-stone-900 text-sm">{feat.title}</h3>
                          <p className="text-xs text-stone-500 mt-1">{feat.desc}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>

                {/* Featured Section */}
                <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20">
                  <div className="flex items-center justify-between mb-10">
                    <div>
                      <h2 className="text-3xl font-black text-stone-900">أحدث الهدايا المختارة</h2>

                              <td className="p-5 font-bold">{c.ordersCount}</td>
                              <td className="p-5 font-black text-rose-800">{c.totalSpent} ج.م</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </div>
                )}

                {/* TAB 4: SHIPPING SETTINGS */}
                {adminTab === 'shipping' && (
                  <div className="max-w-md bg-white p-8 rounded-3xl border border-stone-200 shadow-sm space-y-4">
                    <h2 className="font-extrabold text-lg text-stone-900 border-b border-stone-100 pb-3">تعديل مصاريف الشحن (ج.م)</h2>
                    <div>
                      <label className="block text-xs font-black text-stone-600 mb-1">الإسكندرية</label>
                      <input 
                        type="number" 
                        value={shippingRates.alexandria} 
                        onChange={(e) => setShippingRates({...shippingRates, alexandria: Number(e.target.value)})} 
                        className="w-full bg-stone-50 border border-stone-200 rounded-2xl px-4 py-3 text-sm font-bold" 
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-black text-stone-600 mb-1">القاهرة والجيزة</label>
                      <input 
                        type="number" 
                        value={shippingRates.cairo} 
                        onChange={(e) => setShippingRates({...shippingRates, cairo: Number(e.target.value)})} 
                        className="w-full bg-stone-50 border border-stone-200 rounded-2xl px-4 py-3 text-sm font-bold" 
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-black text-stone-600 mb-1">باقي المحافظات</label>
                      <input 
                        type="number" 
                        value={shippingRates.other} 
                        onChange={(e) => setShippingRates({...shippingRates, other: Number(e.target.value)})} 
                        className="w-full bg-stone-50 border border-stone-200 rounded-2xl px-4 py-3 text-sm font-bold" 
                      />
                    </div>
                    <button 
                      onClick={() => showToast('تم حفظ أسعار الشحن بنجاح')} 
                      className="w-full bg-rose-800 text-white py-3.5 rounded-2xl font-black text-sm shadow-md"
                    >
                      حفظ إعدادات الشحن
                    </button>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Cart Slide-over Drawer */}
          {cartOpen && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex justify-end animate-fadeIn">
              <div className="w-full max-w-md bg-white h-full flex flex-col shadow-2xl">
                <div className="p-6 border-b border-stone-200 flex items-center justify-between">
                  <h2 className="font-black text-lg text-stone-900">سلة المشتريات ({cartCount})</h2>
                  <button onClick={() => setCartOpen(false)} className="p-2 rounded-xl bg-stone-100 text-stone-700 font-bold">✕</button>
                </div>

                <div className="flex-1 overflow-y-auto p-6 space-y-4">
                  {cart.length === 0 ? (
                    <div className="text-center py-24 text-stone-400 font-bold text-sm">سلة المشتريات فارغة حالياً</div>
                  ) : (
                    cart.map(item => (
                      <div key={item.id} className="flex items-center gap-4 bg-stone-50 p-4 rounded-2xl border border-stone-100">
                        <img src={item.image} alt={item.name} className="w-16 h-16 rounded-2xl object-cover bg-white" />
                        <div className="flex-1">
                          <h4 className="font-extrabold text-xs text-stone-900 line-clamp-1">{item.name}</h4>
                          <div className="text-rose-800 font-black text-sm mt-1">{item.price * item.qty} ج.م</div>
                          <div className="flex items-center gap-2 mt-2">
                            <button onClick={() => updateCartQty(item.id, -1)} className="w-7 h-7 rounded-xl bg-white border border-stone-200 font-black text-xs shadow-xs">-</button>
                            <span className="text-xs font-black">{item.qty}</span>
                            <button onClick={() => updateCartQty(item.id, 1)} className="w-7 h-7 rounded-xl bg-white border border-stone-200 font-black text-xs shadow-xs">+</button>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="p-6 border-t border-stone-200 space-y-4 bg-stone-50">
                    <div className="flex justify-between font-black text-base">
                      <span>المجموع الفرعي</span>
                      <span className="text-rose-800">{cartSubtotal} ج.م</span>
                    </div>
                    <button 
                      onClick={() => { setCartOpen(false); setCurrentPage('checkout'); }} 
                      className="w-full bg-rose-800 hover:bg-rose-700 text-white py-4 rounded-2xl font-black text-sm shadow-xl transition-all"
                    >
                      إتمام الطلب الآن 🛍️
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-stone-900 text-stone-300 mt-20">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 grid grid-cols-1 md:grid-cols-3 gap-10">
              <div className="space-y-4">
                <div className="flex items-center gap-3">
                  <div className="w-12 h-12 rounded-2xl bg-rose-800 text-white flex items-center justify-center text-xl shadow">🎁</div>
                  <div>
                    <div className="text-lg font-black text-white">{STORE_INFO.name}</div>
                    <div className="text-[11px] text-amber-400 font-bold">{STORE_INFO.slogan}</div>
                  </div>
                </div>
                <p className="text-xs text-stone-400 leading-relaxed">
                  وجهتك الأولى للهدايا العصرية والمجات والإكسسوارات والتحف الديكورية بجودة عالية وأسعار مناسبة.
                </p>
              </div>

              <div>
                <h4 className="text-white font-black text-sm mb-4">روابط سريعة</h4>
                <ul className="space-y-2 text-xs font-bold text-stone-400">
                  <li><button onClick={() => setCurrentPage('home')} className="hover:text-white">الرئيسية</button></li>
                  <li><button onClick={() => setCurrentPage('shop')} className="hover:text-white">المتجر</button></li>
                  <li><button onClick={() => setCurrentPage('offers')} className="hover:text-white">العروض</button></li>
                  <li><button onClick={() => setCurrentPage('about')} className="hover:text-white">من نحن</button></li>
                </ul>
              </div>

              <div>
                <h4 className="text-white font-black text-sm mb-4">تواصل معنا</h4>
                <ul className="space-y-2 text-xs font-bold text-stone-400">
                  <li>الهاتف / واتساب: <span dir="ltr">{STORE_INFO.phone}</span></li>
                  <li>الإيميل: {STORE_INFO.email}</li>
                  <li>العنوان: {STORE_INFO.address}</li>
                </ul>
              </div>
            </div>

            <div className="border-t border-stone-800 py-6 text-center text-xs font-bold text-stone-500">
              © 2026 {STORE_INFO.name}. جميع الحقوق محفوظة.
            </div>
          </footer>

          {/* Floating WhatsApp Button */}
          <a 
            href={`https://wa.me/${STORE_INFO.whatsapp}?text=${encodeURIComponent('مرحباً، أود الاستفسار عن منتجات Farafero Store')}`} 
            target="_blank" 
            rel="noopener noreferrer" 
            aria-label="تواصل عبر واتساب" 
            className="fixed bottom-6 left-6 z-40 bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3.5 rounded-full shadow-2xl flex items-center gap-2 text-xs font-black transition-transform hover:scale-105"
          >
            <span className="text-lg">💬</span>
            <span>تواصل معنا</span>
          </a>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
