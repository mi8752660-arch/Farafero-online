<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرفيرو - متجر الهدايا أونلاين</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #d97706;
            --primary-hover: #b45309;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border: #333333;
            --success: #16a34a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); direction: rtl; padding: 15px; padding-bottom: 50px; }

        .app-header { background: var(--card-bg); text-align: center; padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .app-header h1 { font-size: 20px; color: var(--primary); margin-bottom: 5px; }
        .app-header p { font-size: 12px; color: var(--text-muted); }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 25px; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
        .product-name { font-size: 14px; font-weight: bold; margin-bottom: 6px; }
        .product-price { font-size: 15px; font-weight: bold; color: var(--primary); margin-bottom: 10px; }
        
        .add-btn { background: var(--primary); color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 13px; }
        .add-btn:hover { background: var(--primary-hover); }

        .checkout-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); }
        .cart-total { display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; margin: 15px 0; border-top: 1px dashed var(--border); padding-top: 10px; }
        .cart-total span:last-child { color: var(--primary); }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: var(--text-muted); }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid var(--border); border-radius: 6px; color: white; font-size: 13px; }

        .submit-btn { background: var(--success); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-header">
        <h1>🎁 متجر فرفيرو أونلاين</h1>
        <p>اختر هديتك وسجل طلب الشراء فوراً</p>
    </div>

    <!-- شبكة المنتجات الثابتة المضمونة ظهورها -->
    <div class="products-grid" id="productsGrid"></div>

    <!-- السلة والاستمارة -->
    <div class="checkout-card">
        <h3 style="font-size: 15px; margin-bottom: 12px;">تفاصيل طلب الشراء</h3>
        <div id="cartItems"><p style="color: var(--text-muted); font-size: 13px;">السلة فارغة حالياً</p></div>
        
        <div class="cart-total">
            <span>الإجمالي:</span>
            <span id="cartTotal">0 ج.م</span>
        </div>

        <div class="form-group">
            <label>الاسم بالكامل:</label>
            <input type="text" id="custName" placeholder="أدخل اسمك الكريم">
        </div>
        <div class="form-group">
            <label>رقم الموبايل:</label>
            <input type="tel" id="custPhone" placeholder="01xxxxxxxxx">
        </div>
        <div class="form-group">
            <label>العنوان:</label>
            <textarea id="custAddress" rows="2" placeholder="عنوان التوصيل بالتفصيل"></textarea>
        </div>

        <button class="submit-btn" onclick="sendOrder()">إرسال طلب الشراء 🛒</button>
    </div>

    <script>
        // إعدادات الفايربيس
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForFarafero",
            authDomain: "farafero-gift-shop.firebaseapp.com",
            projectId: "farafero-gift-shop",
            storageBucket: "farafero-gift-shop.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123:web:abc"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // المنتجات الأساسية عشان تظهر فوراً ومتتعبش في جلب الجداول
        const productsList = [
            { id: '1', name: 'دبدوب أحمر عملاق كلاسيك', price: 450 },
            { id: '2', name: 'دبدوب بنكي محبوب بشريطة', price: 320 },
            { id: '3', name: 'دبدوب أبيض قطيفة ناعم', price: 380 },
            { id: '4', name: 'دبدوب بني فائق النعومة', price: 400 },
            { id: '5', name: 'دبدوب رمادي مع قلادة قلب', price: 350 },
            { id: '6', name: 'بوكيه ورد جوري فاخر', price: 380 }
        ];

        let cart = [];

        // عرض المنتجات على الشاشة فوراً
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = productsList.map(item => `
                <div class="product-card">
                    <div>
                        <div class="product-name">${item.name}</div>
                        <div class="product-price">${item.price} ج.م</div>
                    </div>
                    <button class="add-btn" onclick="addToCart('${item.id}')">+ إضافة للطلب</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const prod = productsList.find(p => p.id === id);
            const exist = cart.find(c => c.id === id);
            if (exist) {
                exist.qty++;
            } else {
                cart.push({ ...prod, qty: 1 });
            }
            updateCart();
        }

        function updateCart() {
            const itemsEl = document.getElementById('cartItems');
            const totalEl = document.getElementById('cartTotal');
            if (cart.length === 0) {
                itemsEl.innerHTML = '<p style="color: var(--text-muted); font-size: 13px;">السلة فارغة حالياً</p>';
                totalEl.innerText = '0 ج.م';
                return;
            }

            let total = 0;
            itemsEl.innerHTML = cart.map(i => {
                total += i.price * i.qty;
                return `<div class="cart-item"><span>${i.name} (×${i.qty})</span><span>${i.price * i.qty} ج.م</span></div>`;
            }).join('');
            totalEl.innerText = `${total} ج.م`;
        }

        // إرسال الطلب للسيستم الرئيسي كـ "طلب شراء"
        function sendOrder() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();

            if (cart.length === 0) return alert('السلة فارغة!');
            if (!name || !phone) return alert('ادخل الاسم ورقم الموبايل من فضلك');

            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            const orderData = {
                customerName: name,
                customerPhone: phone,
                address: address,
                items: cart,
                totalAmount: total,
                createdAt: new Date().toISOString(),
                type: 'purchase_order', // بتسمع في السيستم الرئيسي كطلب شراء
                status: 'pending'
            };

            db.collection('purchase_orders').add(orderData)
                .then(() => {
                    alert('تم إرسال طلب الشراء بنجاح وهيوصلك فى السيستم حالا!');
                    cart = [];
                    updateCart();
                    document.getElementById('custName').value = '';
                    document.getElementById('custPhone').value = '';
                    document.getElementById('custAddress').value = '';
                })
                .catch(err => {
                    console.error(err);
                    alert('خطأ في الإرسال، جرب مرة أخرى.');
                });
        }

        renderProducts();
    </script>
</body>
</html>
