<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farafero Store | فرفيرو للهدايا والتحف</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-stone-50 text-stone-800 antialiased min-h-screen flex flex-col">
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_CATEGORIES = [
      'الكل',
      'مجات وأكواب',
      'إضاءات وديكور',
      'إكسسوارات وساعات',
      'شموع وروائح',
      'بوكسات هدايا'
    ];

    const INITIAL_PRODUCTS = [
      {
        id: 'p1',
        name: 'مج حراري بتصميم رخامي وغطاء ذهبي',
        category: 'مجات وأكواب',
        price: 220,
        oldPrice: 280,
        isOffer: true,
        inStock: true,
        image: 'https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?auto=format&fit=crop&w=800&q=80',
        description: 'مج سيراميك فاخر يحافظ على حرارة المشروبات مع ملعقة ذهبية أنيقة.'
      },
      {
        id: 'p2',
        name: 'أباجورة أكريليك مضيئة ثلاثية الأبعاد',
        category: 'إضاءات وديكور',
        price: 350,
        oldPrice: null,
        isOffer: false,
        inStock: true,
        image: 'https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?auto=format&fit=crop&w=800&q=80',
        description: 'إضاءة ليلية دافئة بقاعدة خشبية أنيقة تضيف لمسة ساحرة لغرفتك.'
      },
      {
        id: 'p3',
        name: 'بوكس السعادة المتكامل للهدايا',
        category: 'بوكسات هدايا',
        price: 650,
        oldPrice: 800,
        isOffer: true,
        inStock: true,
        image: 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=800&q=80',
        description: 'بوكس هدايا فاخر يضم شمعة معطرة، مج، وإكسسوارات بتغليف ملكي.'
      },
      {
        id: 'p4',
        name: 'طقم إكسسوارات ستانلس ستيل مطلي ذهب',
        category: 'إكسسوارات وساعات',
        price: 290,
        oldPrice: null,
        isOffer: false,
        inStock: true,
        image: 'https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=800&q=80',
        description: 'سلسلة وأسورة مقاومة للصدأ وتغير اللون مع علبة قطيفة فاخرة.'
      },
      {
        id: 'p5',
        name: 'شمعة صويا معطرة برائحة الفانيليا والعود',
        category: 'شموع وروائح',
        price: 185,
        oldPrice: 230,
        isOffer: true,
        inStock: true,
        image: 'https://images.unsplash.com/photo-1602874801007-bd458bb1b8b6?auto=format&fit=crop&w=800&q=80',
        description: 'شمعة طبيعية تدوم لأكثر من 35 ساعة في برطمان زجاجي أنيق.'
      },
      {
        id: 'p6',
        name: 'ساعة يد كلاسيكية بسوار جلدي',
        category: 'إكسسوارات وساعات',
        price: 490,
        oldPrice: null,
        isOffer: false,
        inStock: true,
        image: 'https://images.unsplash.com/photo-1524592094714-0f0654e20314?auto=format&fit=crop&w=800&q=80',
        description: 'تصميم عصري يناسب جميع المناسبات مع ضمان لمدة عام.'
      }
    ];

    const STORE_INFO = {
      name: 'Farafero Store',
      arabicName: 'فرفيرو ستور',
      slogan: 'Gifts with Love',
      phone: '01005187411',
      whatsapp: '201005187411',
      email: 'info@faraferostore.com',
      address: 'الإسكندرية، مصر'
    };

    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [cartOpen, setCartOpen] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState('الكل');
      const [searchQuery, setSearchQuery] = useState('');
      const [toast, setToast] = useState(null);

      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('farafero_products');
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
      });

      const [cart, setCart] = useState(() => {
        const saved = localStorage.getItem('farafero_cart');
        return saved ? JSON.parse(saved) : [];
      });

      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem('farafero_orders');
        return saved ? JSON.parse(saved) : [];
      });

      const [customers, setCustomers] = useState(() => {
        const saved = localStorage.getItem('farafero_customers');
        return saved ? JSON.parse(saved) : [];
      });

      const [shippingRates, setShippingRates] = useState(() => {
        const saved = localStorage.getItem('farafero_shipping');
        return saved ? JSON.parse(saved) : { alexandria: 45, cairo: 65, other: 85 };
      });

      const [isAdmin, setIsAdmin] = useState(false);
      const [adminPasswordInput, setAdminPasswordInput] = useState('');
      const [adminTab, setAdminTab] = useState('products');
      const [editingProduct, setEditingProduct] = useState(null);
      const [newProductForm, setNewProductForm] = useState({
        name: '', category: 'مجات وأكواب', price: '', oldPrice: '', isOffer: false, inStock: true, image: '', description: ''
      });

      const [checkoutForm, setCheckoutForm] = useState({
        name: '', phone: '', governorate: 'alexandria', address: '', paymentMethod: 'cod', notes: ''
      });

      useEffect(() => { localStorage.setItem('farafero_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('farafero_cart', JSON.stringify(cart)); }, [cart]);
      useEffect(() => { localStorage.setItem('farafero_orders', JSON.stringify(orders)); }, [orders]);
      useEffect(() => { localStorage.setItem('farafero_customers', JSON.stringify(customers)); }, [customers]);
      useEffect(() => { localStorage.setItem('farafero_shipping', JSON.stringify(shippingRates)); }, [shippingRates]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const addToCart = (product) => {
        if (!product.inStock) return;
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, qty: 1 }];
        });
        showToast(`تمت إضافة "${product.name}" للسلة`);
      };

      const updateCartQty = (id, delta) => {
        setCart(prev => prev.map(item => item.id === id ? { ...item, qty: item.qty + delta } : item).filter(item => item.qty > 0));
      };

      const cartSubtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      const cartCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const currentShippingCost = shippingRates[checkoutForm.governorate] || 0;
      const orderTotal = cartSubtotal + currentShippingCost;

      const handlePlaceOrder = (e) => {
        e.preventDefault();
        if (cart.length === 0) return;

        const newOrder = {
          id: `ORD-${Date.now().toString().slice(-6)}`,
          date: new Date().toLocaleDateString('ar-EG'),
          customerName: checkoutForm.name,
          phone: checkoutForm.phone,
          governorate: checkoutForm.governorate,
          address: checkoutForm.address,
          paymentMethod: checkoutForm.paymentMethod,
          notes: checkoutForm.notes,
          items: cart,
          subtotal: cartSubtotal,
          shipping: currentShippingCost,
          total: orderTotal,
          status: 'قيد المراجعة'
        };

        setOrders(prev => [newOrder, ...prev]);

        setCustomers(prev => {
          const exists = prev.find(c => c.phone === checkoutForm.phone);
          if (exists) {
            return prev.map(c => c.phone === checkoutForm.phone ? { ...c, ordersCount: c.ordersCount + 1, totalSpent: c.totalSpent + orderTotal } : c);
          }
          return [{ id: `CUST-${Date.now().toString().slice(-5)}`, name: checkoutForm.name, phone: checkoutForm.phone, address: checkoutForm.address, ordersCount: 1, totalSpent: orderTotal }, ...prev];
        });

        const govNames = { alexandria: 'الإسكندرية', cairo: 'القاهرة والجيزة', other: 'باقي المحافظات' };
        const itemsText = cart.map(i => `- ${i.name} (×${i.qty}) = ${i.price * i.qty} ج.م`).join('%0A');
        const waText = `مرحباً ${STORE_INFO.name}، أود تأكيد طلبي رقم ${newOrder.id}:%0A%0A*البيانات:*%0Aالاسم: ${checkoutForm.name}%0Aالموبايل: ${checkoutForm.phone}%0Aالمحافظة: ${govNames[checkoutForm.governorate]}%0Aالعنوان: ${checkoutForm.address}%0A%0A*المنتجات:*%0A${itemsText}%0A%0Aالشحن: ${currentShippingCost} ج.م%0A*الإجمالي: ${orderTotal} ج.م*`;

        setCart([]);
        setCurrentPage('home');
        showToast('تم تسجيل الطلب بنجاح! جاري تحويلك للواتساب...');
        window.open(`https://wa.me/${STORE_INFO.whatsapp}?text=${waText}`, '_blank');
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPasswordInput === 'farafero2026') {
          setIsAdmin(true);
          setCurrentPage('admin');
          setAdminPasswordInput('');
          showToast('تم تسجيل الدخول للوحة التحكم');
        } else {
          showToast('كلمة المرور غير صحيحة');
        }
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        const productData = {
          ...newProductForm,
          price: Number(newProductForm.price),
          oldPrice: newProductForm.oldPrice ? Number(newProductForm.oldPrice) : null,
          image: newProductForm.image || 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=800&q=80'
        };

        if (editingProduct) {
          setProducts(prev => prev.map(p => p.id === editingProduct.id ? { ...productData, id: p.id } : p));
          setEditingProduct(null);
          showToast('تم تحديث المنتج بنجاح');
        } else {
          setProducts(prev => [{ ...productData, id: `p-${Date.now()}` }, ...prev]);
          showToast('تمت إضافة المنتج الجديد');
        }

        setNewProductForm({ name: '', category: 'مجات وأكواب', price: '', oldPrice: '', isOffer: false, inStock: true, image: '', description: '' });
      };

      const startEditProduct = (p) => {
        setEditingProduct(p);
        setNewProductForm({ name: p.name, category: p.category, price: p.price, oldPrice: p.oldPrice || '', isOffer: p.isOffer, inStock: p.inStock, image: p.image, description: p.description });
      };

      const deleteProduct = (id) => {
        setProducts(prev => prev.filter(p => p.id !== id));
        showToast('تم حذف المنتج');
      };

      const filteredProducts = products.filter(p => {
        const matchesCat = selectedCategory === 'الكل' || p.category === selectedCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.category.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      const offerProducts = products.filter(p => p.isOffer);

      const ProductCard = ({ product }) => (
        <div className="group bg-white rounded-2xl border border-stone-200/80 overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col">
          <div className="relative aspect-square overflow-hidden bg-stone-100">
            <img src={product.image} alt={product.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
            {product.isOffer && <span className="absolute top-3 right-3 bg-rose-700 text-white text-xs font-bold px-3 py-1 rounded-full shadow">عرض خاص</span>}
            <span className={`absolute top-3 left-3 text-xs font-semibold px-2.5 py-1 rounded-full ${product.inStock ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-stone-200 text-stone-600'}`}>
              {product.inStock ? 'in stock' : 'غير متاح'}
            </span>
          </div>
          <div className="p-4 flex-1 flex flex-col justify-between">
            <div>
              <span className="text-xs text-amber-700 font-medium">{product.category}</span>
              <h3 className="font-bold text-stone-800 text-base mt-1 line-clamp-1">{product.name}</h3>
              <p className="text-xs text-stone-500 mt-1 line-clamp-2">{product.description}</p>
            </div>
            <div className="mt-4 pt-3 border-t border-stone-100 flex items-center justify-between">
              <div>
                <span className="text-lg font-extrabold text-rose-800">{product.price} ج.م</span>
                {product.oldPrice && <span className="text-xs text-stone-400 line-through mr-2">{product.oldPrice} ج.م</span>}
              </div>
              <button onClick={() => addToCart(product)} disabled={!product.inStock} className="bg-stone-900 hover:bg-rose-800 disabled:bg-stone-300 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition-colors">
                أضف للسلة
              </button>
            </div>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen flex flex-col bg-stone-50 text-stone-800">
          {toast && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-stone-900 text-white px-5 py-3 rounded-full shadow-2xl text-sm font-medium animate-bounce">
              {toast}
            </div>
          )}

          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-stone-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              <button onClick={() => setCurrentPage('home')} className="flex items-center gap-3 text-right">
                <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-rose-800 to-amber-700 flex items-center justify-center text-white shadow-md font-bold text-lg">🎁</div>
                <div>
                  <div className="text-xl font-extrabold tracking-tight text-stone-900 leading-none">{STORE_INFO.name}</div>
                  <div className="text-[11px] font-medium text-amber-700 tracking-widest uppercase mt-1">{STORE_INFO.slogan}</div>
                </div>
              </button>

              <nav className="hidden md:flex items-center gap-7 text-sm font-bold">
                {[
                  { id: 'home', label: 'الرئيسية' },
                  { id: 'shop', label: 'المتجر' },
                  { id: 'offers', label: 'العروض' },
                  { id: 'about', label: 'من نحن' },
                  { id: 'contact', label: 'تواصل معنا' }
                ].map((link) => (
                  <button key={link.id} onClick={() => setCurrentPage(link.id)} className={`transition-colors py-1 ${currentPage === link.id ? 'text-rose-800 border-b-2 border-rose-800' : 'text-stone-600 hover:text-rose-800'}`}>
                    {link.label}
                  </button>
                ))}
              </nav>

              <div className="flex items-center gap-2">
                <button onClick={() => setCartOpen(true)} className="relative p-2.5 rounded-xl bg-stone-100 hover:bg-rose-50 text-stone-700 hover:text-rose-800 transition-colors">
                  🛒
                  {cartCount > 0 && <span className="absolute -top-1 -right-1 w-5 h-5 bg-rose-800 text-white text-[11px] font-bold rounded-full flex items-center justify-center">{cartCount}</span>}
                </button>
                <button onClick={() => setCurrentPage(isAdmin ? 'admin' : 'admin-login')} title="لوحة التحكم" className={`p-2.5 rounded-xl transition-colors ${isAdmin ? 'bg-rose-800 text-white' : 'bg-stone-100 hover:bg-stone-200 text-stone-700'}`}>
                  🔒
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1">
            {currentPage === 'home' && (
              <div>
                <section className="bg-gradient-to-bl from-rose-950 via-stone-900 to-stone-900 text-white">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 md:py-24 grid md:grid-cols-2 gap-10 items-center">
                    <div className="space-y-6">
                      <div className="inline-flex items-center gap-2 bg-white/10 px-4 py-1.5 rounded-full text-amber-300 text-xs font-bold">✨ تشكيلة هدايا 2026 وصلت الآن</div>
                      <h1 className="text-3xl sm:text-5xl font-extrabold leading-tight">هدايا استثنائية تصنع <span className="text-amber-400">لحظات لا تُنسى</span></h1>
                      <p className="text-stone-300 text-base leading-relaxed max-w-xl">في {STORE_INFO.name} جمعنالك أرقى المجات، الإضاءات الديكورية، الإكسسوارات، وبوكسات الهدايا الجاهزة بتغليف يليق بكل مناسباتك.</p>
                      <div className="flex gap-3 pt-2">
                        <button onClick={() => setCurrentPage('shop')} className="bg-rose-700 hover:bg-rose-600 text-white px-7 py-3.5 rounded-xl font-bold text-sm shadow-lg">تسوق الآن</button>
                        <button onClick={() => setCurrentPage('offers')} className="bg-white/10 hover:bg-white/20 border border-white/20 text-white px-7 py-3.5 rounded-xl font-bold text-sm">اكتشف العروض</button>
                      </div>
                    </div>
                    <div>
                      <img src="https://images.unsplash.com/photo-1513885535751-8b9238bd345a?auto=format&fit=crop&w=900&q=80" alt="هدايا" className="rounded-3xl shadow-2xl border border-white/10 w-full h-80 md:h-96 object-cover" />
                    </div>
                  </div>
                </section>

                <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                  <div className="flex items-center justify-between mb-8">
                    <h2 className="text-2xl font-extrabold text-stone-900">أحدث الهدايا المختارة</h2>
                    <button onClick={() => setCurrentPage('shop')} className="text-rose-800 font-bold text-sm hover:underline">عرض الكل ←</button>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    {products.slice(0, 6).map(product => <ProductCard key={product.id} product={product} />)}
                  </div>
                </section>
              </div>
            )}

            {currentPage === 'shop' && (
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                  <h1 className="text-2xl font-extrabold text-stone-900">المتجر</h1>
                  <input type="text" placeholder="ابحث عن هدية..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full md:w-72 bg-white border border-stone-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-rose-800" />
                </div>
                <div className="flex items-center gap-2 overflow-x-auto pb-4 mb-6">
                  {INITIAL_CATEGORIES.map(cat => (
                    <button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap ${selectedCategory === cat ? 'bg-rose-800 text-white shadow' : 'bg-white text-stone-600 border border-stone-200'}`}>{cat}</button>
                  ))}
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredProducts.map(product => <ProductCard key={product.id} product={product} />)}
                </div>
              </div>
            )}

            {currentPage === 'offers' && (
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                <div className="bg-gradient-to-l from-rose-800 to-amber-700 text-white rounded-3xl p-8 mb-8">
                  <h1 className="text-2xl sm:text-3xl font-extrabold">عروض {STORE_INFO.name}</h1>
                  <p className="text-rose-100 text-sm mt-2">استفد بأقوى الخصومات لفترة محدودة.</p>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                  {offerProducts.map(product => <ProductCard key={product.id} product={product} />)}
                </div>
              </div>
            )}

            {currentPage === 'checkout' && (
              <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                <h1 className="text-2xl font-extrabold text-stone-900 mb-6">إتمام الطلب</h1>
                {cart.length === 0 ? (
                  <div className="bg-white p-10 rounded-2xl border border-stone-200 text-center space-y-4">
                    <p className="text-stone-500">سلة المشتريات فارغة حالياً.</p>
                    <button onClick={() => setCurrentPage('shop')} className="bg-rose-800 text-white px-6 py-2.5 rounded-xl text-sm font-bold">العودة للمتجر</button>
                  </div>
                ) : (
                  <div className="grid md:grid-cols-5 gap-8">
                    <form onSubmit={handlePlaceOrder} className="md:col-span-3 bg-white p-6 rounded-2xl border border-stone-200 space-y-4">
                      <h2 className="font-bold text-lg text-stone-900 border-b pb-3">بيانات التوصيل</h2>
                      <div>
                        <label className="block text-xs font-bold text-stone-700 mb-1">الاسم بالكامل *</label>
                        <input required type="text" value={checkoutForm.name} onChange={(e) => setCheckoutForm({ ...checkoutForm, name: e.target.value })} className="w-full border rounded-xl px-4 py-2.5 text-sm" placeholder="أدخل اسمك" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-stone-700 mb-1">رقم الموبايل (واتساب) *</label>
                        <input required type="tel" value={checkoutForm.phone} onChange={(e) => setCheckoutForm({ ...checkoutForm, phone: e.target.value })} className="w-full border rounded-xl px-4 py-2.5 text-sm" placeholder="01xxxxxxxxx" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-stone-700 mb-1">المحافظة *</label>
                        <select value={checkoutForm.governorate} onChange={(e) => setCheckoutForm({ ...checkoutForm, governorate: e.target.value })} className="w-full border rounded-xl px-4 py-2.5 text-sm bg-white">
                          <option value="alexandria">الإسكندرية ({shippingRates.alexandria} ج.م)</option>
                          <option value="cairo">القاهرة والجيزة ({shippingRates.cairo} ج.م)</option>
                          <option value="other">باقي المحافظات ({shippingRates.other} ج.م)</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-stone-700 mb-1">العنوان بالتفصيل *</label>
                        <textarea required rows="2" value={checkoutForm.address} onChange={(e) => setCheckoutForm({ ...checkoutForm, address: e.target.value })} className="w-full border rounded-xl px-4 py-2.5 text-sm" placeholder="المنطقة، الشارع، رقم العقار..."></textarea>
                      </div>
                      <button type="submit" className="w-full bg-rose-800 text-white py-3.5 rounded-xl font-bold text-sm shadow-lg">تأكيد الطلب عبر واتساب ({orderTotal} ج.م)</button>
                    </form>

                    <div className="md:col-span-2 bg-white p-6 rounded-2xl border border-stone-200 h-fit space-y-4">
                      <h2 className="font-bold text-lg text-stone-900 border-b pb-3">ملخص الطلب</h2>
                      <div className="space-y-3 max-h-64 overflow-y-auto">
                        {cart.map(item => (
                          <div key={item.id} className="flex justify-between text-sm">
                            <span>{item.name} <strong className="text-rose-800">×{item.qty}</strong></span>
                            <span className="font-bold">{item.price * item.qty} ج.م</span>
                          </div>
                        ))}
                      </div>
                      <div className="border-t pt-3 space-y-2 text-sm">
                        <div className="flex justify-between text-stone-500"><span>المجموع</span><span>{cartSubtotal} ج.م</span></div>
                        <div className="flex justify-between text-stone-500"><span>الشحن</span><span>{currentShippingCost} ج.م</span></div>
                        <div className="flex justify-between text-base font-extrabold pt-2 border-t"><span>الإجمالي</span><span className="text-rose-800">{orderTotal} ج.م</span></div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {currentPage === 'about' && (
              <div className="max-w-4xl mx-auto px-4 py-12">
                <div className="bg-white p-8 rounded-3xl border border-stone-200 space-y-5">
                  <h1 className="text-2xl font-extrabold text-stone-900">من نحن - {STORE_INFO.name}</h1>
                  <p className="text-stone-600 leading-relaxed"><strong>{STORE_INFO.name}</strong> وجهتك الأولى لاختيار الهدايا المميزة والتحف العصرية في مصر بجودة عالية وأسعار مناسبة.</p>
                </div>
              </div>
            )}

            {currentPage === 'contact' && (
              <div className="max-w-4xl mx-auto px-4 py-12">
                <div className="bg-white p-8 rounded-3xl border border-stone-200 space-y-6">
                  <h1 className="text-2xl font-extrabold text-stone-900">تواصل معنا</h1>
                  <p className="text-sm text-stone-600">رقم الواتساب: {STORE_INFO.phone}</p>
                </div>
              </div>
            )}

            {currentPage === 'admin-login' && (
              <div className="max-w-md mx-auto px-4 py-16">
                <div className="bg-white p-8 rounded-3xl border border-stone-200 shadow-lg space-y-6">
                  <div className="text-center space-y-2">
                    <h1 className="text-xl font-extrabold text-stone-900">لوحة تحكم {STORE_INFO.name}</h1>
                    <p className="text-xs text-stone-500">كلمة المرور الافتراضية: farafero2026</p>
                  </div>
                  <form onSubmit={handleAdminLogin} className="space-y-4">
                    <input type="password" required value={adminPasswordInput} onChange={(e) => setAdminPasswordInput(e.target.value)} placeholder="كلمة المرور" className="w-full border rounded-xl px-4 py-3 text-sm" />
                    <button type="submit" className="w-full bg-stone-900 hover:bg-rose-800 text-white py-3 rounded-xl font-bold text-sm">دخول</button>
                  </form>
                </div>
              </div>
            )}

            {currentPage === 'admin' && isAdmin && (
              <div className="max-w-7xl mx-auto px-4 py-8">
                <div className="flex justify-between items-center mb-6">
                  <h1 className="text-2xl font-extrabold text-stone-900">لوحة الإدارة</h1>
                  <button onClick={() => { setIsAdmin(false); setCurrentPage('home'); }} className="bg-stone-200 px-4 py-2 rounded-xl text-xs font-bold">تسجيل خروج</button>
                </div>

                <div className="flex gap-2 mb-6">
                  {[
                    { id: 'products', label: `المنتجات (${products.length})` },
                    { id: 'orders', label: `الطلبات (${orders.length})` },
                    { id: 'customers', label: `العملاء (${customers.length})` }
                  ].map(tab => (
                    <button key={tab.id} onClick={() => setAdminTab(tab.id)} className={`px-4 py-2.5 rounded-xl text-xs font-bold ${adminTab === tab.id ? 'bg-rose-800 text-white' : 'bg-white border'}`}>{tab.label}</button>
                  ))}
                </div>

                {adminTab === 'products' && (
                  <div className="grid lg:grid-cols-3 gap-6">
                    <form onSubmit={handleSaveProduct} className="bg-white p-5 rounded-2xl border space-y-3 h-fit">
                      <h2 className="font-bold text-base">{editingProduct ? 'تعديل منتج' : 'إضافة منتج'}</h2>
                      <input required type="text" placeholder="اسم المنتج" value={newProductForm.name} onChange={(e) => setNewProductForm({...newProductForm, name: e.target.value})} className="w-full border rounded-xl px-3 py-2 text-sm" />
                      <select value={newProductForm.category} onChange={(e) => setNewProductForm({...newProductForm, category: e.target.value})} className="w-full border rounded-xl px-3 py-2 text-sm bg-white">
                        {INITIAL_CATEGORIES.filter(c => c !== 'الكل').map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                      <input required type="number" placeholder="السعر" value={newProductForm.price} onChange={(e) => setNewProductForm({...newProductForm, price: e.target.value})} className="w-full border rounded-xl px-3 py-2 text-sm" />
                      <input type="url" placeholder="رابط الصورة (URL)" value={newProductForm.image} onChange={(e) => setNewProductForm({...newProductForm, image: e.target.value})} className="w-full border rounded-xl px-3 py-2 text-sm" />
                      <button type="submit" className="w-full bg-rose-800 text-white py-2.5 rounded-xl font-bold text-sm">حفظ</button>
                    </form>
                    <div className="lg:col-span-2 space-y-3">
                      {products.map(p => (
                        <div key={p.id} className="bg-white p-4 rounded-2xl border flex items-center justify-between">
                          <div className="flex items-center gap-3">
                            <img src={p.image} alt={p.name} className="w-14 h-14 rounded-xl object-cover" />
                            <div>
                              <div className="font-bold text-sm">{p.name}</div>
                              <div className="text-xs text-stone-500">{p.price} ج.م</div>
                            </div>
                          </div>
                          <button onClick={() => deleteProduct(p.id)} className="bg-rose-100 text-rose-700 px-3 py-1.5 rounded-lg text-xs font-bold">حذف</button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {adminTab === 'orders' && (
                  <div className="space-y-4">
                    {orders.length === 0 ? <div className="bg-white p-10 rounded-2xl border text-center text-stone-500">لا توجد طلبات مسجلة.</div> : orders.map(o => (
                      <div key={o.id} className="bg-white p-5 rounded-2xl border space-y-2">
                        <div className="font-bold text-rose-800">{o.id} - {o.customerName} ({o.phone})</div>
                        <div className="text-xs text-stone-600">العنوان: {o.address} | الإجمالي: {o.total} ج.م</div>
                      </div>
                    ))}
                  </div>
                )}

                {adminTab === 'customers' && (
                  <div className="bg-white rounded-2xl border p-5">
                    {customers.length === 0 ? <div className="text-center text-stone-500">لا توجد سجلات عملاء بعد.</div> : customers.map(c => (
                      <div key={c.id} className="flex justify-between py-2 border-b text-sm">
                        <span>{c.name} ({c.phone})</span>
                        <span className="font-bold text-rose-800">{c.totalSpent} ج.م</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>

          {cartOpen && (
            <div className="fixed inset-0 z-50 bg-black/50 flex justify-end">
              <div className="w-full max-w-md bg-white h-full flex flex-col shadow-2xl">
                <div className="p-5 border-b flex justify-between items-center">
                  <h2 className="font-extrabold text-lg">سلة المشتريات</h2>
                  <button onClick={() => setCartOpen(false)} className="font-bold">✕</button>
                </div>
                <div className="flex-1 overflow-y-auto p-5 space-y-4">
                  {cart.length === 0 ? <p className="text-center text-stone-400">السلة فارغة</p> : cart.map(item => (
                    <div key={item.id} className="flex justify-between items-center bg-stone-50 p-3 rounded-xl">
                      <div>
                        <div className="font-bold text-xs">{item.name}</div>
                        <div className="text-rose-800 text-xs font-bold mt-1">{item.price * item.qty} ج.م</div>
                      </div>
                      <div className="flex items-center gap-2">
                        <button onClick={() => updateCartQty(item.id, -1)} className="px-2 bg-white border rounded">-</button>
                        <span className="text-xs font-bold">{item.qty}</span>
                        <button onClick={() => updateCartQty(item.id, 1)} className="px-2 bg-white border rounded">+</button>
                      </div>
                    </div>
                  ))}
                </div>
                {cart.length > 0 && (
                  <div className="p-5 border-t bg-stone-50 space-y-3">
                    <div className="flex justify-between font-bold"><span>المجموع</span><span className="text-rose-800">{cartSubtotal} ج.م</span></div>
                    <button onClick={() => { setCartOpen(false); setCurrentPage('checkout'); }} className="w-full bg-rose-800 text-white py-3 rounded-xl font-bold text-sm">إتمام الطلب</button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
