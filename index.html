<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>فرفيرو للهدايا</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Cairo:wght@400;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#0a0a09;--bg2:#15130e;--card:#12120f;--ac:#c9a45c;--ac2:#e2c987;--on:#0a0a09;--tx:#efe9da;--mut:#9a927f;--line:rgba(201,164,92,.3);--ph:rgba(201,164,92,.35)}
body.ref{--bg:#faf6f1;--bg2:#4a2a4a;--card:#ede3d9;--ac:#4a2a4a;--ac2:#4a2a4a;--on:#fff;--tx:#3d2a3d;--mut:#7a6a7a;--line:#cdbfc9;--ph:#a58ba5}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:Assistant,Cairo,sans-serif;max-width:560px;margin:auto;font-size:15px;min-height:100vh}
button,input,select{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}a{color:inherit}
.ann{height:44px;background:var(--bg2);color:var(--on);display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:14px}
body:not(.ref) .ann{color:var(--ac2);border-bottom:1px solid var(--line)}
.ann button{width:32px;height:32px;font-size:13px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);height:75px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px}
.ic{width:38px;height:38px;display:grid;place-items:center;position:relative}.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6}
.hl{display:flex;justify-content:flex-end;align-items:center;gap:2px;font-size:12px}
.logo{width:52px;height:52px;border-radius:50%;border:1px solid var(--ac);display:grid;place-items:center;text-align:center;line-height:1;cursor:pointer}
.logo b{font-family:'Cormorant Garamond',serif;color:var(--ac);font-size:21px;display:block}.logo small{font-size:5.5px;letter-spacing:.2em;color:var(--mut)}
.badge{position:absolute;top:1px;left:-1px;min-width:16px;height:16px;border-radius:8px;background:var(--ac);color:var(--on);font-size:10px;font-weight:700;display:grid;place-items:center}
.pills{display:flex;gap:8px;padding:11px 15px;height:59px;align-items:center;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.pills a{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:6px 15px;font-size:12.5px;font-weight:700;text-decoration:none;color:var(--ac2)}
.pills a.on{background:var(--ac);color:var(--on)}
.promo{position:relative;height:156px;overflow:hidden;background:#000}
.promo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
body:not(.ref) .promo img{filter:brightness(.5) saturate(.7)}
.promo .t{position:absolute;inset:0;padding:14px 20px;display:flex;flex-direction:column;justify-content:center;gap:3px;color:#fff;background:linear-gradient(90deg,rgba(0,0,0,.1),rgba(0,0,0,.7))}
.promo small{letter-spacing:.3em;font-size:10px;color:var(--ac2)}body.ref .promo small{color:#fff}
.promo h1{font-size:21px;line-height:1.4}.promo p{font-size:12px;opacity:.85}
.bar{display:block;width:100%;background:var(--ac);color:var(--on);font-weight:600;font-size:14px;line-height:17px;padding:11px 12px;text-align:center;text-decoration:none}
.ctl{display:flex;justify-content:center;align-items:center;gap:0;height:50px;color:var(--ac)}
.ctl i{width:8px;height:8px;border-radius:50%;border:1px solid var(--ac);margin:0 12px}.ctl i.on{background:var(--ac)}.ctl button{width:26px;height:26px;color:var(--ac)}
h2.sec{font-size:27px;text-align:center;font-weight:400;font-family:Georgia,'Times New Roman',serif;padding:22px 0 18px;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 4px;padding:0 15px 26px}
.pc .im{position:relative;aspect-ratio:4/5;background:var(--card);overflow:hidden;display:block}
.pc img{width:100%;height:100%;object-fit:cover}
.sale{position:absolute;bottom:8px;right:8px;background:var(--ac);color:var(--on);border-radius:99px;font-size:10.5px;font-weight:700;padding:2px 12px}
.pc h3{font-size:12.5px;font-weight:600;line-height:1.55;margin-top:8px;min-height:3.1em}
.pc h3 a{text-decoration:none}
.pr{margin:2px 0 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.pr s{color:var(--mut);font-size:11.5px}.pr b{font-size:14px;color:var(--ac2)}
.sz{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.sz button{border:1px solid var(--line);padding:6px 10px;font-size:11px;font-weight:700;min-width:44px}
.sz .on{border-color:var(--ac);background:var(--ac);color:var(--on)}.sz .out{text-decoration:line-through;opacity:.4;cursor:not-allowed}
.add{width:100%;background:var(--ac);color:var(--on);font-weight:700;padding:11px;font-size:13px}.add.dis{opacity:.45}
.add.sec2{background:none;color:var(--ac2);border:1px solid var(--ac);margin-top:8px}
.title{padding:26px 14px;background:var(--card);font-size:26px;font-family:'Cormorant Garamond','Cairo',serif}
.fbar{display:flex;justify-content:space-between;align-items:center;padding:16px 14px;font-size:13px}
.fbar button{display:flex;gap:8px;align-items:center;font-weight:600}.fbar span{color:var(--mut)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none}.overlay.show{display:block}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(88%,420px);background:var(--bg);z-index:60;transform:translateX(105%);transition:.3s;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer.show{transform:none}
.drawer header{position:static;height:auto;display:flex;justify-content:space-between;padding:16px;text-align:center}
.drawer .body{flex:1;overflow:auto}
.drow{padding:18px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:14.5px;text-decoration:none}
.fgrp{padding:14px 16px;border-bottom:1px solid var(--line)}.fgrp h4{font-size:13px;margin-bottom:9px}
.fgrp label{display:flex;gap:8px;padding:5px 0;font-size:13px}.fgrp input[type=number]{width:46%;padding:8px;background:var(--card);border:1px solid var(--line)}
.fgrp select{width:100%;padding:10px;background:var(--card);border:1px solid var(--line)}
.dfoot{display:flex;gap:10px;padding:14px 16px;align-items:center;justify-content:space-between;border-top:1px solid var(--line)}.dfoot .add{width:55%}
.pop{position:fixed;top:56px;left:12px;right:12px;max-width:520px;margin:auto;background:var(--bg);border:1px solid var(--line);z-index:70;padding:18px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.5)}.pop.show{display:block}
.pop .row{display:flex;gap:12px;margin:12px 0}.pop img{width:64px;height:80px;object-fit:cover}
.pop a.btn{display:block;text-align:center;padding:12px;border:1px solid var(--ac);margin-top:8px;font-weight:700;text-decoration:none}
.pop a.btn.fill{background:var(--ac);color:var(--on)}
.gal{position:relative;aspect-ratio:1/1;background:var(--card);overflow:hidden;margin:12px}.gal img{width:100%;height:100%;object-fit:cover}
.gal .zm{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.gnav{display:flex;justify-content:center;align-items:center;gap:14px;font-size:13px}
.pdp{padding:14px}.pdp h1{font-size:25px;font-family:'Cormorant Garamond','Cairo',serif;font-weight:600;margin-bottom:6px}
.pdp .pr b{font-size:17px}.pdp .tag{background:var(--ac);color:var(--on);border-radius:99px;font-size:11px;font-weight:700;padding:2px 11px}
.pdp .lbl{font-size:12px;color:var(--mut);margin:14px 0 7px}
.box{border:1px solid var(--line);background:var(--card);padding:12px 14px;font-size:12.5px;line-height:2;margin:16px 0}
.qty{display:inline-flex;border:1px solid var(--line)}.qty button{width:40px;height:40px;font-size:18px}.qty span{width:52px;display:grid;place-items:center}
.pdp p.d{font-size:13px;line-height:2;color:var(--mut);margin:10px 0}
.cartp{padding:16px 14px}.cartp h1{font-size:26px;text-align:center;font-family:'Cormorant Garamond','Cairo',serif}
.ci{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.ci img{width:84px;height:104px;object-fit:cover}
.ci .m{flex:1;font-size:12.5px;line-height:1.8}.ci .m b{font-size:13.5px}
.tot{padding:16px 0;font-size:13.5px;line-height:2.1}.tot div{display:flex;justify-content:space-between}
.tot .big{font-size:16px;font-weight:700;text-align:center;display:block;margin-top:8px}
.empty{text-align:center;padding:36px 20px}.empty h1{margin-bottom:18px}.empty .bar{display:inline-block;width:auto;padding:12px 28px}
.page{padding:20px 16px;line-height:2}.page h1{font-size:30px;font-family:'Cormorant Garamond','Cairo',serif;margin-bottom:10px}
.page .box{margin:18px 0}
.srch{padding:16px 14px}.srch input{width:100%;padding:13px;background:var(--card);border:1px solid var(--line)}
footer{background:var(--card);margin-top:26px;padding:22px 16px 80px;font-size:13px}
footer h3{font-size:16px;margin-bottom:4px}footer p{color:var(--mut);margin-bottom:12px}
footer details{border-top:1px solid var(--line);padding:14px 0}footer summary{font-weight:700;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
footer details a{display:block;padding:7px 0;color:var(--mut);text-decoration:none}
.sub{display:flex;margin:12px 0 16px}.sub input{flex:1;padding:12px;background:var(--bg);border:1px solid var(--line)}.sub button{background:var(--ac);color:var(--on);font-weight:700;padding:0 18px}
.fine{font-size:11px;color:var(--mut);text-align:center;margin-top:12px;line-height:2}
.cookie{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;z-index:80;background:var(--bg);border:1px solid var(--line);padding:18px;display:none}.cookie.show{display:block}
.cookie p{font-size:12.5px;line-height:1.9;margin-bottom:12px}.cookie button{display:block;width:100%;border:1px solid var(--ac);padding:11px;margin-top:8px;font-weight:700}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--on);padding:9px 18px;font-weight:700;opacity:0;transition:.3s;z-index:90;pointer-events:none}.toast.show{opacity:1}
.note{font-size:11px;color:var(--mut);padding:0 14px 10px;line-height:1.8}

.zoomov{position:fixed;inset:0;z-index:200;background:var(--bg)}.zs{position:absolute;inset:0;overflow:auto}.zs img{width:260vw;max-width:none;display:block;height:auto;min-height:100%;object-fit:cover}
.zx{position:fixed;top:14px;right:14px;z-index:201;width:44px;height:44px;border-radius:50%;background:var(--tx);color:var(--bg);font-size:18px}

.rev{margin:10px 15px 6px;padding:22px 16px;border:1px solid var(--line);background:var(--card)}.rev small{letter-spacing:.2em;color:var(--ac);font-size:11px;font-weight:700}
.rev h2{font-family:Georgia,serif;font-weight:400;font-size:24px;margin:6px 0 8px}.rev p{color:var(--mut);font-size:13px;line-height:1.9}
.cf label{display:block;font-size:12.5px;color:var(--mut);margin:12px 0}.cf input,.cf select{display:block;width:100%;margin-top:6px;padding:12px;background:var(--card);border:1px solid var(--line);color:var(--tx)}
.err{color:#e9897e;font-size:13px;min-height:20px;margin:8px 0}.add:disabled{opacity:.5}

.dn{display:none}.shr{margin-top:10px;font-size:13px;text-decoration:underline;color:var(--mut)}
@media(min-width:700px){
body{max-width:none}
header{padding:0 28px}
.pills{justify-content:center}
.promo{height:clamp(240px,34vw,420px)}.promo h1{font-size:clamp(24px,3.6vw,44px)}.promo .t{padding:20px 6vw}.promo small{font-size:12px}
.grid{grid-template-columns:repeat(2,1fr);padding:0 28px 34px;gap:34px 6px}
.pc h3{font-size:14px}
.sec{margin-top:30px}
.bar{max-width:420px;margin-left:auto;margin-right:auto}.promo+.bar{max-width:none}
#main:has(.pdp){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:24px;padding:20px 28px 0;align-items:start}

#main:has(.pdp) .pdp{grid-column:2;grid-row:1/3;padding:0}#main:has(.pdp) .pdp h1{font-size:34px}
#main:has(.pdp)>.sec,#main:has(.pdp)>.grid{grid-column:1/-1}#main:has(.pdp)>.grid{padding-left:0;padding-right:0}
body[data-v=cart] #main,body[data-v=checkout] #main,body[data-v=order] #main,body[data-v=returns] #main,body[data-v=page] #main,body[data-v=search] #main{max-width:720px;margin:0 auto}
.rev{margin:10px 28px 6px}
footer{padding-left:28px;padding-right:28px}
}
@media(min-width:1024px){

header>div:first-child{display:none}
.dn{display:flex;justify-content:center;gap:30px;font-size:14px}.dn a{text-decoration:none;color:var(--tx);padding:6px 0;border-bottom:1px solid transparent}.dn a:hover{border-color:var(--ac)}
.grid{grid-template-columns:repeat(4,1fr);padding:0 48px 40px}
.rev{margin:10px 48px 6px}
#main:has(.pdp){padding:28px 48px 0;column-gap:48px}
footer{padding-left:48px;padding-right:48px}
.fg{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.5fr;gap:0 36px;align-items:start;padding-bottom:20px}
footer details{border-top:0;padding:0 24px;border-inline-start:1px solid var(--line)}footer summary{pointer-events:none;margin-bottom:10px}footer summary span{display:none}
footer .fs h3{margin-top:0!important}footer .fine{border-top:1px solid var(--line);padding-top:16px}
.promo+.bar{width:200px;margin:-64px 48px 0 auto;position:relative;z-index:2;background:rgba(0,0,0,.75);color:var(--ac2);border:1px solid var(--ac)}
body.ref .promo+.bar{background:var(--ac);color:var(--on)}
.ctl{margin-top:0}
}
@media(min-width:700px){.bar[style]{margin-left:auto!important;margin-right:auto!important}}
.ckl{display:flex;gap:8px;align-items:center;font-size:13px;margin:8px 0}.cookie #ckS{margin-bottom:4px}
.lang{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:12px;color:var(--mut)}.lang select{background:var(--bg);color:var(--tx);border:1px solid var(--line);padding:8px 12px;font:inherit}

.logo.lg1,.logo.lg2,.logo.lg3,.logo.lg4,.logo.lg5{width:auto;height:auto;border:0;border-radius:0}
.logo{color:var(--ac)}
.logo .l1{display:flex;flex-direction:column;align-items:center;gap:1px}.logo .l1 b{font-family:'Cormorant Garamond',serif;font-size:24px;line-height:1}.logo .l1 small{font-size:6px;letter-spacing:.32em;color:var(--mut)}
.logo .l2{display:flex;flex-direction:column;align-items:center;gap:5px}.logo .l2 span{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:21px;letter-spacing:.38em;padding-inline-start:.38em}.logo .l2 i{width:46px;height:1px;background:var(--ac);position:relative}.logo .l2 i:after{content:"";position:absolute;left:50%;top:-2.5px;width:5px;height:5px;background:var(--ac);transform:translateX(-50%) rotate(45deg)}.logo .l2 small{font-size:7px;letter-spacing:.5em;color:var(--mut);padding-inline-start:.5em}
.logo .l3{display:flex;align-items:center;gap:9px}.logo .l3 span{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;letter-spacing:.28em}
.logo .l4{display:flex;flex-direction:column;align-items:center;gap:2px}.logo .l4 b{font-family:'Cairo',sans-serif;font-weight:800;font-size:26px;line-height:1.1;color:var(--ac2)}.logo .l4 u{width:34px;height:2px;background:var(--ac);text-decoration:none}.logo .l4 small{font-size:9px;letter-spacing:.3em;color:var(--mut)}
.logo .l5{width:40px;height:40px;transform:rotate(45deg);border:1px solid var(--ac);display:grid;place-items:center;outline:1px solid var(--line);outline-offset:3px}.logo .l5 b{transform:rotate(-45deg);font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;line-height:1}
.logo,.logo *{text-decoration:none}
.logo .l2 span{font-size:18px;letter-spacing:.3em;padding-inline-start:.3em}.logo .l3 span{font-size:16px;letter-spacing:.2em}
.logo .l5{width:32px;height:32px;margin:6px 0}.logo .l5 b{font-size:21px}

/* product page v2 (gallery thumbs, video, accordions) */

.thumbs button{flex:0 0 62px;height:62px;border:1px solid var(--line);background:var(--card);padding:0;opacity:.7;position:relative}.thumbs button.on{border-color:var(--ac);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;filter:none!important}.thumbs .pl{display:grid;place-items:center;height:100%;color:var(--ac);font-size:20px}
.gal.isv{background:#000}.gal video,.gal iframe{width:100%;height:100%;border:0;background:#000;object-fit:contain}
.acc{border-top:1px solid var(--line);margin-top:6px}.acc:last-of-type{border-bottom:1px solid var(--line)}.acc summary{cursor:pointer;padding:12px 2px;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between}.acc summary::after{content:"+";color:var(--ac)}.acc[open] summary::after{content:"−"}.acc .box,.acc p.d{margin:0 0 12px}
.pc .im .h2{position:absolute;inset:0;opacity:0;transition:opacity .3s}@media(hover:hover){.pc:hover .im .h2{opacity:1}}
@media(max-width:1023px){.pdp #pa{position:sticky;bottom:10px;z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.5)}}
@media(min-width:1024px){#main:has(.pdp) .gwrap{grid-column:1;grid-row:1;flex-direction:row-reverse;gap:10px}#main:has(.pdp) .gwrap .gal{flex:1;margin:0}#main:has(.pdp) .thumbs{flex-direction:column;padding:0;overflow:visible}#main:has(.pdp) .gal{aspect-ratio:1/1}}

.smp{position:absolute;top:8px;inset-inline-start:8px;background:#c9a45c;color:#000;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700}.smpn{background:#2a2417;border:1px solid #c9a45c;color:#e2c987;padding:8px 10px;border-radius:8px;font-size:12.5px;margin:8px 0}.genclip{position:relative;width:100%;height:100%;background:#000;overflow:hidden}.genclip img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;animation:gcf 9s infinite}.genclip .gcn{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:#c9a45c;background:#0008;padding:3px}@keyframes gcf{0%{opacity:0;transform:scale(1)}5%{opacity:1}33%{opacity:1;transform:scale(1.08)}40%,100%{opacity:0;transform:scale(1.08)}}

[hidden]{display:none!important}.cookie,.rev,.ann #ap,.ann #an,.ann #apz,.ctl #bz{display:none!important}.ann{justify-content:center}
.lb{position:fixed;inset:0;z-index:300;background:#050505;display:flex;flex-direction:column;touch-action:none}.lbt{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:var(--tx);font-size:13px;gap:10px}.lbt b{flex:1;text-align:center;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.lbt button{width:44px;height:44px;border-radius:50%;background:var(--tx);color:var(--bg);font-size:18px}
.lbs{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}.lbs img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;transform-origin:center center;will-change:transform}
.lbn{position:absolute;top:50%;left:10px;width:46px;height:46px;border-radius:50%;background:#000a;border:1px solid var(--ac);color:var(--ac);font-size:24px;transform:translateY(-50%)}.lbn.r{left:auto;right:10px}.lb.one .lbn{display:none}
.lbz{display:flex;justify-content:center;gap:10px;padding:10px 0 16px}.lbz button{min-width:52px;height:42px;border:1px solid var(--ac);color:var(--ac);background:#000a;font-size:18px;padding:0 10px}

/* v7 premium cards */
.pc{min-width:0}.pc h3{min-height:2.9em}.pr{flex-wrap:wrap;gap:2px 8px;margin:4px 0 10px}.pr b,.pr s{white-space:nowrap}
.osh{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}

<script type="text/plain" id="src-backend">// Talks to Supabase (REST + Auth + Storage) with plain fetch. Exposes window.F3API(path, {method, body, raw}).
// The page never sends prices or totals: the database functions compute them.
(function () {
  const C = window.F3_CFG || {};
  const base = String(C.url || '').replace(/\/+$/, '');
  const KEY = C.key || '';
  const SKEY = 'f3adm';
  const NET = 'تعذر الاتصال بالخادم.';
  const MSG = { not_found: 'لم نجد طلباً مطابقاً. تأكد من رقم الطلب ورقم الموبايل.', throttled: 'محاولات كثيرة. انتظر قليلاً ثم أعد المحاولة.', not_delivered: 'يمكن طلب الاستبدال أو الاسترجاع بعد تسليم الطلب فقط.', bad_reason: 'اكتب سبب الطلب', open_exists: 'يوجد طلب مفتوح لهذا الطلب بالفعل.', limit: 'تم الوصول للحد الأقصى من الطلبات.' };
  const STAT = { not_found: 404, throttled: 429, not_delivered: 409, bad_reason: 400, open_exists: 409, limit: 409 };
  const err = (m, status, net) => { const e = new Error(m); e.status = status; if (net) e.network = true; return e; };
  const sess = () => { try { return JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { return null; } };
  const setSess = (s) => { try { s ? localStorage.setItem(SKEY, JSON.stringify(s)) : localStorage.removeItem(SKEY); } catch (e) {} };

  async function raw(path, { method = 'GET', body, headers = {}, token, rawBody } = {}) {
    if (!base || !KEY) throw err('لم يتم ضبط ملف config.js (رابط Supabase والمفتاح).', 0, true);
    const h = Object.assign({ apikey: KEY }, headers);
    if (token) h.Authorization = 'Bearer ' + token;
    if (body !== undefined) h['Content-Type'] = 'application/json';
    let r;
    try { r = await fetch(base + path, { method, headers: h, body: rawBody !== undefined ? rawBody : body !== undefined ? JSON.stringify(body) : undefined, cache: 'no-store' }); }
    catch (e) { throw err(NET, 0, true); }
    let j = null; const t = await r.text(); try { j = t ? JSON.parse(t) : null; } catch (e) {}
    if (!r.ok) throw err((j && (j.message || j.msg || j.error_description || j.error)) || 'حدث خطأ. حاول مرة أخرى.', r.status);
    return j;
  }
  async function token() {
    const s = sess(); if (!s) throw err('سجّل الدخول أولاً.', 401);
    if (s.expires_at && s.expires_at * 1000 - Date.now() < 60000 && s.refresh_token) {
      try {
        const n = await raw('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: s.refresh_token } });
        setSess({ access_token: n.access_token, refresh_token: n.refresh_token, expires_at: n.expires_at || Math.floor(Date.now() / 1000) + (n.expires_in || 3600) });
        return n.access_token;
      } catch (e) { setSess(null); throw err('انتهت الجلسة. سجّل الدخول من جديد.', 401); }
    }
    return s.access_token;
  }
  const rpc = (fn, args, tk) => raw('/rest/v1/rpc/' + fn, { method: 'POST', body: args, token: tk });
  const adm = async (path, o = {}) => raw(path, Object.assign({ token: await token() }, o));

  async function catalog() {
    const [pr, st] = await Promise.all([raw('/rest/v1/products?select=id,data,stock&order=sort.asc'), raw('/rest/v1/settings?select=data&id=eq.1')]);
    const products = pr.map((r) => Object.assign({}, r.data, { id: r.id, stock: r.stock, inStock: r.stock > 0 }));
    return { products, settings: (st[0] && st[0].data) || {}, categories: ['new', 'boxes', 'accessories', 'sale'], sliders: [] };
  }
  const handlers = {
    'GET /api/catalog': catalog,
    'POST /api/orders': async (b) => rpc('place_order', { p: b }),
    'POST /api/orders/lookup': async (b) => { const r = await rpc('lookup_order', { p_id: String(b.id || ''), p_phone: String(b.phone || '') }); if (!r.ok) throw err(MSG[r.code] || MSG.not_found, STAT[r.code] || 404); return { order: r.order }; },
    'POST /api/returns': async (b) => { const r = await rpc('request_return', { p_id: String(b.id || ''), p_phone: String(b.phone || ''), p_type: b.type === 'return' ? 'return' : 'exchange', p_reason: String(b.reason || '') }); if (!r.ok) throw err(MSG[r.code] || MSG.not_found, STAT[r.code] || 404); return { order: r.order }; },
    'POST /api/admin/login': async (b) => {
      const n = await raw('/auth/v1/token?grant_type=password', { method: 'POST', body: { email: String(b.email || '').trim(), password: String(b.password || '') } }).catch((e) => { throw err(e.network ? e.message : 'البريد أو كلمة المرور غير صحيحة.', e.status || 401, e.network); });
      const s = { access_token: n.access_token, refresh_token: n.refresh_token, expires_at: n.expires_at || Math.floor(Date.now() / 1000) + (n.expires_in || 3600) };
      const a = await rpc('is_admin', {}, s.access_token).catch(() => false);
      if (a !== true) throw err('هذا الحساب ليس مدير المتجر.', 403);
      setSess(s); return { ok: true };
    },
    'GET /api/admin/me': async () => { if (!sess()) return { admin: false }; try { return { admin: (await rpc('is_admin', {}, await token())) === true }; } catch (e) { if (e.network) throw e; setSess(null); return { admin: false }; } },
    'POST /api/admin/logout': async () => { const s = sess(); setSess(null); if (s) raw('/auth/v1/logout', { method: 'POST', token: s.access_token }).catch(() => {}); return { ok: true }; },
    'GET /api/admin/state': async () => {
      const [os, ps] = await Promise.all([adm('/rest/v1/orders?select=data&order=created_at.desc&limit=500'), adm('/rest/v1/products?select=id,stock')]);
      return { rev: 0, orders: os.map((r) => { const o = Object.assign({}, r.data); delete o.stockReleased; return o; }), stock: Object.fromEntries(ps.map((p) => [p.id, p.stock])) };
    },
    'GET /api/admin/costs': async () => ({ costs: await rpc('admin_get_costs', {}, await token()) }),
    'GET /api/admin/customers': async () => ({ customers: await rpc('admin_list_customers', {}, await token()) }),
    'GET /api/admin/pos': async () => ({ pos: await adm('/rest/v1/pos?select=po_no,order_id,created_at,updated_at,data&order=po_no.desc&limit=1000') }),
    'PUT /api/admin/catalog': async (b) => {
      if (b.settings && Object.keys(b.settings).length) {
        const cur = (await raw('/rest/v1/settings?select=data&id=eq.1'))[0]?.data || {};
        const next = Object.assign({}, cur, b.settings);
        await adm('/rest/v1/settings?on_conflict=id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: [{ id: 1, data: next }] });
        return { ok: true };
      }
      const list = b.products || [];
      const have = (await adm('/rest/v1/products?select=id')).map((r) => r.id);
      const keep = new Set(list.map((p) => p.id));
      for (const id of have) if (!keep.has(id)) await adm('/rest/v1/products?id=eq.' + encodeURIComponent(id), { method: 'DELETE', headers: { Prefer: 'return=minimal' } });
      const rows = list.map((p) => { const d = Object.assign({}, p); delete d.stock; delete d.inStock; delete d.id; return { id: p.id, data: d }; });
      if (rows.length) await adm('/rest/v1/products?on_conflict=id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: rows });
      for (const p of list) if (!have.includes(p.id) && Number(p.stock) > 0) await adm('/rest/v1/products?id=eq.' + encodeURIComponent(p.id), { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: { stock: Math.floor(Number(p.stock)) } });
      return { ok: true };
    },
  };
  window.F3API = async function (path, opts = {}) {
    const method = (opts.method || 'GET').toUpperCase();
    const body = opts.body;
    let m = path.match(/^\/api\/admin\/products\/([^/]+)\/stock$/);
    if (m && method === 'PATCH') {
      const s = Number(body && body.stock); if (!Number.isInteger(s) || s < 0 || s > 100000) throw err('كمية غير صالحة', 400);
      const id = decodeURIComponent(m[1]);
      const r = await adm('/rest/v1/products?id=eq.' + encodeURIComponent(id), { method: 'PATCH', headers: { Prefer: 'return=representation' }, body: { stock: s } });
      if (!r.length) throw err('المنتج غير موجود', 404); return { id, stock: s };
    }
    if (path === '/api/admin/admins' && method === 'GET') return rpc('admin_list_admins', {}, await token());
    if (path === '/api/admin/admins' && method === 'POST') return rpc('admin_add_admin', { p_email: String((body && body.email) || '').trim() }, await token());
    m = path.match(/^\/api\/admin\/admins\/([0-9a-f-]{36})$/);
    if (m && method === 'DELETE') return rpc('admin_remove_admin', { p_id: m[1] }, await token());
    m = path.match(/^\/api\/admin\/costs\/([^/]+)$/);
    if (m && method === 'PUT') { const c = body && body.cost; return rpc('admin_set_cost', { p_id: decodeURIComponent(m[1]), p_cost: (c === null || c === '' || c === undefined) ? null : Number(c) }, await token()); }
    m = path.match(/^\/api\/admin\/customers\/([0-9+ -]+)$/);
    if (m && method === 'DELETE') return rpc('admin_delete_customer', { p_phone: decodeURIComponent(m[1]) }, await token());
    if (m && method === 'PATCH') return rpc('admin_set_customer_note', { p_phone: decodeURIComponent(m[1]), p_note: String((body && body.note) || '') }, await token());
    m = path.match(/^\/api\/admin\/pos\/([0-9]+)$/);
    if (m && method === 'PATCH') return rpc('admin_update_po', { p_no: m[1], p_patch: body || {} }, await token());
    if (m && method === 'DELETE') return rpc('admin_delete_po', { p_no: m[1] }, await token());
    m = path.match(/^\/api\/admin\/orders\/([^/]+)$/);
    if (m && method === 'PATCH') { const o = await rpc('admin_update_order', { p_id: decodeURIComponent(m[1]), p_patch: body || {} }, await token()); delete o.stockReleased; return { order: o }; }
    if (path === '/api/admin/upload' && method === 'POST') {
      const f = opts.raw.data; const type = opts.raw.type; const ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'video/mp4': 'mp4', 'video/webm': 'webm', 'video/quicktime': 'mov', 'audio/mpeg': 'mp3', 'audio/mp3': 'mp3', 'audio/mp4': 'm4a', 'audio/x-m4a': 'm4a', 'audio/ogg': 'ogg', 'audio/wav': 'wav' }[type];
      if (!ext || f.size > 50 * 1024 * 1024) throw err('ملف غير صالح', 400);
      const name = Array.from(crypto.getRandomValues(new Uint8Array(16)), (x) => x.toString(16).padStart(2, '0')).join('') + '.' + ext;
      await raw('/storage/v1/object/products/' + name, { method: 'POST', token: await token(), headers: { 'Content-Type': type, 'x-upsert': 'false' }, rawBody: f });
      return { url: base + '/storage/v1/object/public/products/' + name };
    }
    const h = handlers[method + ' ' + path]; if (!h) throw err('غير مدعوم', 404);
    return h(body);
  };
})();
</script>

const shrink=async file=>{if(!/^image\//.test(file.type||'')&&!/\.(jpe?g|png|webp|heic|heif)$/i.test(file.name))throw new Error('الملف ده مش صورة');if(file.type==='image/webp'&&file.size<1.5*1048576)return file;let bm;try{bm=await createImageBitmap(file)}catch(e){throw new Error('المتصفح مش قادر يفتح الصورة دي (غالبًا HEIC). صوّرها JPG أو خد سكرين شوت منها')}const k=Math.min(1,1600/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(bm,0,0,cv.width,cv.height);const bl=await new Promise(r=>cv.toBlob(r,'image/jpeg',.86));if(!bl)throw new Error('تعذّر تصغير الصورة');return new File([bl],'p.jpg',{type:'image/jpeg'})};
const apiUp=async s=>{try{return (await api('/api/admin/upload',{method:'POST',raw:{type:s.type,data:s}})).url}catch(e){throw new Error('فشل الرفع: '+e.message+' | لو فيها Bucket أو security أو mime: شغّل ملف SQL الرفع واتأكد إنك مسجّل بحساب الأدمن')}};
const sniffAud=async file=>{const u=new Uint8Array(await file.slice(0,16).arrayBuffer()),s=(a,b)=>String.fromCharCode(...u.slice(a,b));
if(s(0,3)==='ID3'||(u[0]===0xFF&&(u[1]&0xE0)===0xE0&&(u[1]&0x06)!==0))return 'audio/mpeg';if(s(4,8)==='ftyp')return 'audio/mp4';if(s(0,4)==='OggS')return 'audio/ogg';if(s(0,4)==='RIFF'&&s(8,12)==='WAVE')return 'audio/wav';return ''};
const upAud=async file=>{const t=await sniffAud(file);if(!t)throw new Error('ملف الصوت "'+file.name+'" (نوعه: '+(file.type||'غير معروف')+') مش MP3 ولا M4A. حوّله لـ MP3 وجرب تاني.');if(file.size>20*1048576)throw new Error('ملف الصوت '+(file.size/1048576).toFixed(1)+' ميجا والحد 20 ميجا. صغّره أو اقتطع منه جزء.');return apiUp(new File([file],file.name.replace(/[^\w.-]/g,'_'),{type:t}))};

const upVid=async file=>{const t=file.type||(/\.mov$/i.test(file.name)?'video/quicktime':/\.webm$/i.test(file.name)?'video/webm':/\.mp4$/i.test(file.name)?'video/mp4':'');if(!['video/mp4','video/webm','video/quicktime'].includes(t))throw new Error('نوع الفيديو غير مدعوم. استخدم MP4 أو MOV أو WEBM، أو حط رابط يوتيوب');if(file.size>50*1048576)throw new Error('الفيديو '+Math.round(file.size/1048576)+' ميجا والحد 50 ميجا. قصّره أو ارفعه على يوتيوب (غير مدرج) وحط الرابط');return apiUp(new File([file],file.name,{type:t}))};

<script type="text/plain" id="src-schema">-- Farafero gift shop: database setup for Supabase (paste into SQL Editor and press Run).
-- Safe to run once on a new project. Rules enforced here, not in the browser:
-- prices and shipping come from the tables, stock is checked and decremented in one transaction,
-- orders are private, and customers look up an order only with order number + phone.

create schema if not exists private;

-- ---------- tables ----------
create table if not exists public.settings (
  id int primary key default 1 check (id = 1),
  data jsonb not null default '{}'::jsonb
);
create table if not exists public.products (
  id text primary key check (id ~ '^[a-z0-9-]{2,40}$'),
  data jsonb not null,
  stock int not null default 0 check (stock >= 0 and stock <= 100000),
  sort serial
);
create table if not exists public.orders (
  id text primary key,
  created_at timestamptz not null default now(),
  status text not null default 'جديد',
  idem text unique,
  data jsonb not null
);
create table if not exists public.admins (
  user_id uuid primary key
);
create table if not exists private.attempts (
  k text not null,
  ts timestamptz not null default now()
);
create index if not exists attempts_k_ts on private.attempts (k, ts);

-- ---------- helpers ----------
create or replace function private.is_admin() returns boolean
language sql stable security definer set search_path = '' as $$
  select exists (select 1 from public.admins a where a.user_id = (select auth.uid()));
$$;

create or replace function private.norm_phone(v text) returns text
language sql immutable set search_path = '' as $$
  select regexp_replace(regexp_replace(coalesce(v, ''), '[\s-]', '', 'g'), '^\+?2?0?', '');
$$;

-- returns true when the key already used up its allowance in the window (and records this try otherwise)
create or replace function private.throttled(p_key text, p_max int, p_minutes int) returns boolean
language plpgsql security definer set search_path = '' as $$
declare n int;
begin
  delete from private.attempts where ts < now() - interval '1 day';
  select count(*) into n from private.attempts where k = p_key and ts > now() - make_interval(mins => p_minutes);
  if n >= p_max then return true; end if;
  insert into private.attempts(k) values (p_key);
  return false;
end $$;

create or replace function private.public_view(o jsonb) returns jsonb
language sql immutable set search_path = '' as $$
  select jsonb_build_object(
    'id', o->>'id', 'date', o->>'date', 'status', o->>'status',
    'items', coalesce((select jsonb_agg(jsonb_build_object('name', l->>'name', 'selectedOption', l->>'selectedOption', 'quantity', (l->>'quantity')::int, 'price', (l->>'price')::numeric)) from jsonb_array_elements(o->'items') l), '[]'::jsonb),
    'subtotal', (o->>'subtotal')::numeric, 'shipping', (o->>'shipping')::numeric, 'total', (o->>'total')::numeric,
    'governorate', o->>'governorate',
    'returnRequests', coalesce((select jsonb_agg(jsonb_build_object('id', r->>'id', 'type', r->>'type', 'status', r->>'status', 'date', r->>'date')) from jsonb_array_elements(coalesce(o->'returnRequests', '[]'::jsonb)) r), '[]'::jsonb)
  );
$$;

-- ---------- customer functions ----------
create or replace function public.place_order(p jsonb) returns jsonb
language plpgsql security definer set search_path = '' as $$
declare
  v_avail int;
  v_name text := btrim(coalesce(p->>'customerName', ''));
  v_phone text := regexp_replace(coalesce(p->>'phone', ''), '[\s-]', '', 'g');
  v_addr text := btrim(coalesce(p->>'address', ''));
  v_gov text := btrim(coalesce(p->>'governorate', ''));
  v_note text := btrim(coalesce(p->>'giftNote', ''));
  v_idem text := coalesce(p->>'idempotencyKey', '');
  v_pay text := coalesce(p->>'paymentMethod', 'الدفع عند الاستلام');
  v_rates jsonb; v_ship numeric; v_sub numeric := 0; v_lines jsonb := '[]'::jsonb;
  it jsonb; pr record; v_qty int; v_opt text; v_id text; v_order jsonb; prev jsonb; need jsonb := '{}'::jsonb; k text; short text := '';
begin
  if v_name = '' or v_addr = '' then raise exception 'الاسم والعنوان مطلوبان'; end if;
  if length(v_name) > 80 or length(v_addr) > 300 or length(v_note) > 200 then raise exception 'نص طويل جدًا'; end if;
  if v_phone !~ '^\+?\d{10,15}$' then raise exception 'رقم الموبايل غير صالح'; end if;
  if jsonb_typeof(p->'items') <> 'array' or jsonb_array_length(p->'items') < 1 or jsonb_array_length(p->'items') > 30 then
    raise exception 'السلة فارغة أو كبيرة جدًا';
  end if;
  if v_idem <> '' and v_idem !~ '^[A-Za-z0-9_-]{8,64}$' then raise exception 'مفتاح الطلب غير صالح'; end if;
  if v_pay not in ('الدفع عند الاستلام', 'الدفع عند الاستلام (COD)') then raise exception 'طريقة الدفع غير متاحة حاليًا'; end if;
  v_pay := 'الدفع عند الاستلام (COD)';

  if v_idem <> '' then
    perform pg_advisory_xact_lock(hashtext('idem:' || v_idem));
    select data into prev from public.orders where idem = v_idem;
    if found then
      return jsonb_build_object('duplicate', true, 'order', private.public_view(prev) || jsonb_build_object('customerName', prev->>'customerName', 'phone', prev->>'phone', 'address', prev->>'address', 'giftNote', prev->>'giftNote', 'paymentMethod', prev->>'paymentMethod'));
    end if;
  end if;

  if private.throttled('ord:' || private.norm_phone(v_phone), 6, 10) then
    raise exception 'محاولات كثيرة. انتظر قليلًا ثم أعد المحاولة.';
  end if;

  select data->'shippingRates' into v_rates from public.settings where id = 1;
  if v_rates is null or not (v_rates ? v_gov) then raise exception 'محافظة غير معروفة'; end if;
  v_ship := (v_rates->>v_gov)::numeric;

  for it in select * from jsonb_array_elements(p->'items') loop
    v_qty := coalesce((it->>'quantity')::numeric, 0)::int;
    if v_qty < 1 or v_qty > 20 or (it->>'quantity')::numeric <> v_qty then raise exception 'كمية غير صالحة'; end if;
    select * into pr from public.products where id = (it->>'id');
    if not found then raise exception 'منتج في السلة لم يعد متاحًا. حدّث الصفحة وأعد المحاولة.'; end if;
    v_opt := coalesce(nullif(it->>'selectedOption', ''), pr.data->'options'->>0, 'قياسي');
    if jsonb_array_length(coalesce(pr.data->'options', '[]'::jsonb)) > 0 and not (pr.data->'options' ? v_opt) then
      raise exception 'خيار غير صالح للمنتج';
    end if;
    need := jsonb_set(need, array[pr.id], to_jsonb(coalesce((need->>pr.id)::int, 0) + v_qty));
    v_lines := v_lines || jsonb_build_array(jsonb_build_object(
      'cartKey', pr.id || '__' || v_opt, 'id', pr.id, 'name', pr.data->>'name', 'price', (pr.data->>'price')::numeric,
      'image', pr.data->>'image', 'selectedOption', v_opt, 'quantity', v_qty));
  end loop;

  -- lock product rows in a stable order, then check and take stock
  for k in select key from jsonb_object_keys(need) as key order by 1 loop
    select * into pr from public.products where id = k for update;
    select pr.stock - coalesce((select sum((l->>'quantity')::int) from public.orders oo, jsonb_array_elements(oo.data->'items') l where l->>'id' = k and coalesce((oo.data->>'stockPending')::boolean, false) and oo.status <> 'ملغي'), 0) into v_avail;
    if v_avail < (need->>k)::int then short := short || (pr.data->>'name') || ' (المتاح ' || greatest(v_avail, 0) || ') '; end if;
  end loop;
  if short <> '' then raise exception 'الكمية المطلوبة غير متوفرة: %. لم يتم تسجيل الطلب.', btrim(short); end if;

  select coalesce(sum((l->>'price')::numeric * (l->>'quantity')::int), 0) into v_sub from jsonb_array_elements(v_lines) l;
  loop
    v_id := 'FRF-' || (floor(random() * 900000) + 100000)::int;
    exit when not exists (select 1 from public.orders where id = v_id);
  end loop;
  v_order := jsonb_build_object(
    'id', v_id, 'date', to_char(now() at time zone 'Africa/Cairo', 'YYYY/MM/DD HH24:MI'), 'createdAt', now(),
    'items', v_lines, 'subtotal', v_sub, 'customerName', v_name, 'phone', v_phone, 'governorate', v_gov,
    'address', v_addr, 'paymentMethod', v_pay, 'giftNote', v_note, 'shipping', v_ship, 'total', v_sub + v_ship,
    'status', 'جديد', 'paymentConfirmed', false, 'stockReleased', true, 'stockPending', true);
  insert into public.orders(id, status, idem, data) values (v_id, 'جديد', nullif(v_idem, ''), v_order);
  return jsonb_build_object('duplicate', false, 'order', private.public_view(v_order) || jsonb_build_object('customerName', v_name, 'phone', v_phone, 'address', v_addr, 'giftNote', v_note, 'paymentMethod', v_pay));
end $$;

create or replace function public.lookup_order(p_id text, p_phone text) returns jsonb
language plpgsql security definer set search_path = '' as $$
declare o jsonb; ph text := private.norm_phone(p_phone);
begin
  if ph = '' or private.throttled('lk:' || left(coalesce(p_id, ''), 20), 10, 10) or private.throttled('lkp:' || ph, 15, 10) then
    return jsonb_build_object('ok', false, 'code', 'throttled');
  end if;
  select data into o from public.orders where id = left(coalesce(p_id, ''), 20);
  if not found or private.norm_phone(o->>'phone') <> ph then return jsonb_build_object('ok', false, 'code', 'not_found'); end if;
  return jsonb_build_object('ok', true, 'order', private.public_view(o));
end $$;

create or replace function public.request_return(p_id text, p_phone text, p_type text, p_reason text) returns jsonb
language plpgsql security definer set search_path = '' as $$
declare o jsonb; ph text := private.norm_phone(p_phone); rr jsonb; v_reason text := btrim(coalesce(p_reason, '')); v_type text;
begin
  if ph = '' or private.throttled('rt:' || left(coalesce(p_id, ''), 20), 6, 10) or private.throttled('rtp:' || ph, 10, 10) then
    return jsonb_build_object('ok', false, 'code', 'throttled');
  end if;
  select data into o from public.orders where id = left(coalesce(p_id, ''), 20) for update;
  if not found or private.norm_phone(o->>'phone') <> ph then return jsonb_build_object('ok', false, 'code', 'not_found'); end if;
  if o->>'status' <> 'تم التسليم' then return jsonb_build_object('ok', false, 'code', 'not_delivered'); end if;
  if v_reason = '' or length(v_reason) > 400 then return jsonb_build_object('ok', false, 'code', 'bad_reason'); end if;
  rr := coalesce(o->'returnRequests', '[]'::jsonb);
  if exists (select 1 from jsonb_array_elements(rr) r where r->>'status' = 'جديد') then return jsonb_build_object('ok', false, 'code', 'open_exists'); end if;
  if jsonb_array_length(rr) >= 3 then return jsonb_build_object('ok', false, 'code', 'limit'); end if;
  v_type := case when p_type = 'return' then 'return' else 'exchange' end;
  rr := rr || jsonb_build_array(jsonb_build_object('id', 'R' || (jsonb_array_length(rr) + 1), 'type', v_type, 'reason', v_reason, 'status', 'جديد', 'date', to_char(now() at time zone 'Africa/Cairo', 'YYYY/MM/DD HH24:MI')));
  o := jsonb_set(o, '{returnRequests}', rr);
  update public.orders set data = o where id = o->>'id';
  return jsonb_build_object('ok', true, 'order', private.public_view(o));
end $$;

-- ---------- admin function ----------
create or replace function public.admin_update_order(p_id text, p_patch jsonb) returns jsonb
language plpgsql security definer set search_path = '' as $$
declare
  o jsonb; v_status text := p_patch->>'status'; l jsonb; k text; q jsonb := '{}'::jsonb; rid text := p_patch->>'returnId'; rs text := p_patch->>'returnStatus'; rr jsonb; idx int; pr record; v_pend boolean;
begin
  if not private.is_admin() then raise exception 'غير مصرح'; end if;
  select data into o from public.orders where id = p_id for update;
  if not found then raise exception 'الطلب غير موجود'; end if;
  if rid is not null then
    if rs not in ('جديد', 'تمت الموافقة', 'مرفوض', 'تم الإنجاز') then raise exception 'حالة غير صالحة'; end if;
    select (ord - 1)::int into idx from jsonb_array_elements(coalesce(o->'returnRequests', '[]'::jsonb)) with ordinality t(r, ord) where r->>'id' = rid;
    if idx is null then raise exception 'الطلب غير موجود'; end if;
    o := jsonb_set(o, array['returnRequests', idx::text, 'status'], to_jsonb(rs));
  end if;
  v_pend := coalesce((o->>'stockPending')::boolean, false);
  if p_patch->>'stock' in ('confirm', 'undo') then
    for l in select * from jsonb_array_elements(o->'items') loop
      q := jsonb_set(q, array[l->>'id'], to_jsonb(coalesce((q->>(l->>'id'))::int, 0) + (l->>'quantity')::int));
    end loop;
    if p_patch->>'stock' = 'confirm' then
      if not v_pend then raise exception 'تم خصم المخزون لهذا الطلب قبل كده.'; end if;
      if o->>'status' = 'ملغي' then raise exception 'الطلب ملغي. أعد تفعيله الأول.'; end if;
      for k in select key from jsonb_object_keys(q) as key order by 1 loop
        select * into pr from public.products where id = k for update;
        if found and pr.stock < (q->>k)::int then raise exception 'المخزون الحالي مش كفاية لتأكيد الطلب (%).', pr.data->>'name'; end if;
      end loop;
      for k in select key from jsonb_object_keys(q) as key loop
        update public.products set stock = stock - (q->>k)::int where id = k;
      end loop;
      o := jsonb_set(jsonb_set(o, '{stockReleased}', 'false'::jsonb), '{stockPending}', 'false'::jsonb);
    else
      if v_pend or coalesce((o->>'stockReleased')::boolean, false) then raise exception 'المخزون لم يُخصم لهذا الطلب.'; end if;
      for k in select key from jsonb_object_keys(q) as key order by 1 loop
        update public.products set stock = stock + (q->>k)::int where id = k;
      end loop;
      o := jsonb_set(jsonb_set(o, '{stockReleased}', 'true'::jsonb), '{stockPending}', 'true'::jsonb);
    end if;
    q := '{}'::jsonb;
  end if;
  if v_status is not null then
    if v_status not in ('جديد', 'قيد التجهيز', 'تم الشحن', 'تم التسليم', 'ملغي') then raise exception 'حالة غير صالحة'; end if;
    for l in select * from jsonb_array_elements(o->'items') loop
      q := jsonb_set(q, array[l->>'id'], to_jsonb(coalesce((q->>(l->>'id'))::int, 0) + (l->>'quantity')::int));
    end loop;
    if v_status = 'ملغي' and not coalesce((o->>'stockReleased')::boolean, false) then
      for k in select key from jsonb_object_keys(q) as key order by 1 loop
        update public.products set stock = stock + (q->>k)::int where id = k;
      end loop;
      o := jsonb_set(o, '{stockReleased}', 'true'::jsonb);
    elsif v_status <> 'ملغي' and coalesce((o->>'stockReleased')::boolean, false) and not coalesce((o->>'stockPending')::boolean, false) then
      for k in select key from jsonb_object_keys(q) as key order by 1 loop
        select * into pr from public.products where id = k for update;
        if found and pr.stock < (q->>k)::int then raise exception 'لا يمكن إعادة تفعيل الطلب: الكمية لم تعد متوفرة.'; end if;
      end loop;
      for k in select key from jsonb_object_keys(q) as key loop
        update public.products set stock = stock - (q->>k)::int where id = k;
      end loop;
      o := jsonb_set(o, '{stockReleased}', 'false'::jsonb);
    end if;
    o := jsonb_set(o, '{status}', to_jsonb(v_status));
  end if;
  update public.orders set data = o, status = o->>'status' where id = p_id;
  return o;
end $$;

create or replace function public.is_admin() returns boolean
language sql stable security definer set search_path = '' as $$ select private.is_admin(); $$;

-- ---------- permissions (nothing is open unless listed here) ----------
alter table public.settings enable row level security;
alter table public.products enable row level security;
alter table public.orders enable row level security;
alter table public.admins enable row level security;

revoke all on all tables in schema public from anon, authenticated;
revoke all on all functions in schema public from public, anon, authenticated;
revoke all on schema private from public, anon, authenticated;
revoke usage on all sequences in schema public from anon, authenticated;

grant select on public.settings, public.products to anon, authenticated;
grant insert, update, delete on public.settings, public.products to authenticated;

grant usage on all sequences in schema public to authenticated;

create policy settings_read on public.settings for select using (true);
create policy products_read on public.products for select using (true);
create policy settings_admin_write on public.settings for all to authenticated using (private.is_admin()) with check (private.is_admin());

<script type="text/plain" id="src-po">-- Farafero: فواتير / PO (أوامر الشراء). الصقه في SQL Editor واضغط Run مرة واحدة. آمن لو اتشغّل مرتين.
-- كل طلب جديد يعمل PO برقم متسلسل 0001, 0002, ... بدون حد أعلى. أرقام المحذوف لا تُستخدم تاني.
-- يعمل PO أيضًا للطلبات القديمة الموجودة (بالترتيب الزمني). فقط الأدمن يقرأ ويعدّل ويحذف.

create schema if not exists private;

create table if not exists private.po_counter (id int primary key check (id = 1), last bigint not null default 0);
insert into private.po_counter(id, last) values (1, 0) on conflict (id) do nothing;

create table if not exists public.pos (
  po_no bigint primary key,
  order_id text unique,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now(),
  data jsonb not null
);
alter table public.pos enable row level security;
revoke all on public.pos from anon, authenticated;
grant select on public.pos to authenticated;
drop policy if exists pos_admin_read on public.pos;
create policy pos_admin_read on public.pos for select to authenticated using (private.is_admin());

create or replace function private.make_po(p_order_id text, p_status text, o jsonb) returns bigint
language plpgsql security definer set search_path = '' as $$
declare n bigint;
begin
  update private.po_counter set last = last + 1 where id = 1 returning last into n;
  insert into public.pos(po_no, order_id, data) values (n, p_order_id, jsonb_build_object(
    'orderId', p_order_id, 'date', o->>'date', 'customerName', o->>'customerName', 'phone', o->>'phone',
    'governorate', o->>'governorate', 'address', o->>'address', 'paymentMethod', o->>'paymentMethod',
    'giftNote', coalesce(o->>'giftNote', ''), 'note', '',
    'items', coalesce((select jsonb_agg(jsonb_build_object('name', i->>'name', 'option', coalesce(i->>'selectedOption', ''), 'quantity', (i->>'quantity')::int, 'price', (i->>'price')::numeric)) from jsonb_array_elements(coalesce(o->'items', '[]'::jsonb)) i), '[]'::jsonb),
    'subtotal', coalesce((o->>'subtotal')::numeric, 0), 'shipping', coalesce((o->>'shipping')::numeric, 0), 'total', coalesce((o->>'total')::numeric, 0),
    'status', p_status, 'edited', false));
  return n;
end $$;

create or replace function private.po_on_order() returns trigger
language plpgsql security definer set search_path = '' as $$
begin perform private.make_po(new.id, new.status, new.data); return new; end $$;
drop trigger if exists po_on_order on public.orders;
create trigger po_on_order after insert on public.orders for each row execute function private.po_on_order();

create or replace function private.po_sync_status() returns trigger
language plpgsql security definer set search_path = '' as $$
begin
  update public.pos set data = jsonb_set(data, '{status}', to_jsonb(new.status)), updated_at = now() where order_id = new.id;
  return new;
end $$;
drop trigger if exists po_sync_status on public.orders;
create trigger po_sync_status after update on public.orders for each row when (old.status is distinct from new.status) execute function private.po_sync_status();

-- PO للطلبات القديمة (مرة واحدة، بالترتيب الزمني)
do $$
declare r record;
begin
  for r in select id, status, data from public.orders o where not exists (select 1 from public.pos p where p.order_id = o.id) order by created_at, id loop
    perform private.make_po(r.id, r.status, r.data);
  end loop;
end $$;

create or replace function public.admin_update_po(p_no text, p_patch jsonb) returns jsonb
language plpgsql security definer set search_path = '' as $$
declare
  n bigint; d jsonb; it jsonb; items jsonb; sub numeric := 0; ship numeric; k text; v text;
  txt text[] := array['customerName','phone','governorate','address','paymentMethod','giftNote','note'];
  lim int[] := array[80, 30, 60, 300, 60, 500, 1000];
  i int;
begin
  if not private.is_admin() then raise exception 'غير مصرح'; end if;
  if p_no !~ '^[0-9]{1,15}$' then raise exception 'رقم PO غير صالح'; end if;
  n := p_no::bigint;
  select data into d from public.pos where po_no = n for update;
  if not found then raise exception 'PO غير موجود'; end if;
  if jsonb_typeof(p_patch) <> 'object' then raise exception 'بيانات غير صالحة'; end if;
  for i in 1 .. array_length(txt, 1) loop
    if p_patch ? txt[i] then
      v := btrim(coalesce(p_patch->>txt[i], ''));
      if length(v) > lim[i] then raise exception 'النص طويل جدًا'; end if;
      if txt[i] in ('customerName', 'address') and v = '' then raise exception 'الاسم والعنوان مطلوبان'; end if;
      d := jsonb_set(d, array[txt[i]], to_jsonb(v));
    end if;
  end loop;
  if p_patch ? 'status' then
    if p_patch->>'status' not in ('جديد', 'قيد التجهيز', 'تم الشحن', 'تم التسليم', 'ملغي') then raise exception 'حالة غير صالحة'; end if;
    d := jsonb_set(d, '{status}', to_jsonb(p_patch->>'status'));
  end if;
  items := coalesce(p_patch->'items', d->'items');
  if jsonb_typeof(items) <> 'array' or jsonb_array_length(items) < 1 or jsonb_array_length(items) > 50 then raise exception 'الأصناف غير صالحة'; end if;
  declare clean jsonb := '[]'::jsonb; q int; pr numeric; nm text;
  begin
    for it in select * from jsonb_array_elements(items) loop
      nm := btrim(coalesce(it->>'name', ''));
      if nm = '' or length(nm) > 120 then raise exception 'اسم الصنف غير صالح'; end if;
      if coalesce(it->>'quantity', '') !~ '^[0-9]{1,4}$' or (it->>'quantity')::int < 1 then raise exception 'كمية غير صالحة'; end if;
      if coalesce(it->>'price', '') !~ '^[0-9]{1,7}(\.[0-9]{1,2})?$' then raise exception 'سعر غير صالح'; end if;
      q := (it->>'quantity')::int; pr := (it->>'price')::numeric; sub := sub + q * pr;
      clean := clean || jsonb_build_array(jsonb_build_object('name', nm, 'option', left(btrim(coalesce(it->>'option', '')), 60), 'quantity', q, 'price', pr));
    end loop;
    d := jsonb_set(d, '{items}', clean);
  end;
  if p_patch ? 'shipping' then
    if coalesce(p_patch->>'shipping', '') !~ '^[0-9]{1,6}(\.[0-9]{1,2})?$' then raise exception 'شحن غير صالح'; end if;
    ship := (p_patch->>'shipping')::numeric;
  else ship := coalesce((d->>'shipping')::numeric, 0); end if;
  d := jsonb_set(jsonb_set(jsonb_set(d, '{subtotal}', to_jsonb(sub)), '{shipping}', to_jsonb(ship)), '{total}', to_jsonb(sub + ship));
  d := jsonb_set(d, '{edited}', 'true'::jsonb);
  update public.pos set data = d, updated_at = now() where po_no = n;
  return d || jsonb_build_object('poNo', n);
end $$;

create or replace function public.admin_delete_po(p_no text) returns jsonb
language plpgsql security definer set search_path = '' as $$
declare n bigint;
begin
  if not private.is_admin() then raise exception 'غير مصرح'; end if;
  if p_no !~ '^[0-9]{1,15}$' then raise exception 'رقم PO غير صالح'; end if;
  n := p_no::bigint;
  delete from public.pos where po_no = n;
  if not found then raise exception 'PO غير موجود'; end if;
  return jsonb_build_object('ok', true);
end $$;

revoke all on function public.admin_update_po(text, jsonb), public.admin_delete_po(text) from public, anon, authenticated;
grant execute on function public.admin_update_po(text, jsonb), public.admin_delete_po(text) to authenticated;
</script>
