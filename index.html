    function persist(key, value) {
      try {
        localStorage.setItem(key, value);
        if (window.__storageFail) { window.__storageFail = false; window.dispatchEvent(new Event('farafero-storage')); }
        return true;
      } catch (e) {
        window.__storageFail = true;
        window.dispatchEvent(new Event('farafero-storage'));
        return false;
      }
    }
    function StorageBanner() {
      const [bad, setBad] = useState(false);
      useEffect(() => {
        const on = () => setBad(!!window.__storageFail);
        window.addEventListener('farafero-storage', on);
        return () => window.removeEventListener('farafero-storage', on);
      }, []);
      if (!bad) return null;
      return <div role="alert" className="fixed top-0 inset-x-0 z-[100] bg-rose-700 text-white text-xs sm:text-sm font-bold p-3 text-center leading-relaxed no-print">{STORAGE_FAIL_MSG}</div>;
    }
    const SYNC_ENABLED = false; // prototype: no authenticated backend, so cloud sync stays off

    async function cloudPull(url) {
      if (!SYNC_ENABLED) return null;
      const clean = (url || '').trim();
      if (!clean) return null;
      const sep = clean.includes('?') ? '&' : '?';
      const res = await fetch(`${clean}${sep}t=${Date.now()}`, { method: 'GET', cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    }

    async function cloudPush(url, payload) {
      if (!SYNC_ENABLED) return false;
      const clean = (url || '').trim();
      if (!clean) return false;
      try {
        const res = await fetch(clean, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        return res.ok;
      } catch {
        await fetch(clean, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        return true;
      }
    }

          cloudPush(settings.cloudSyncUrl, { products, orders, sliders, categories: categoriesList, settings: { ...settings, cloudSyncUrl: undefined } });

      }, [orders]);

      useEffect(() => {
        persist('farafero_pro_sliders_v2', JSON.stringify(sliders));
      }, [sliders]);

      useEffect(() => {
        persist('farafero_pro_cart_v2', JSON.stringify(cart));
      }, [cart]);

      useEffect(() => {
        if (!settings.announcements || settings.announcements.length <= 1) return;
        const t = setInterval(() => {
          setAnnouncementIdx(prev => (prev + 1) % settings.announcements.length);
        }, 4200);
        return () => clearInterval(t);
      }, [settings.announcements]);

      const syncCloudNow = async () => {
        if (!SYNC_ENABLED) { setSyncStatus('المزامنة متوقفة: تحتاج خادماً بمصادقة'); return; }
        if (!settings.cloudSyncUrl) {
          setSyncStatus('محلي');
          return;
        }
        setSyncStatus('جاري المزامنة...');
        try {
          const remote = await cloudPull(settings.cloudSyncUrl);
          if (remote && typeof remote === 'object') {
            skipNextPush.current = true;
            if (Array.isArray(remote.products) && remote.products.length) setProducts(remote.products);
            if (Array.isArray(remote.orders) && remote.orders.length) setOrders(remote.orders);
            if (Array.isArray(remote.sliders) && remote.sliders.length) setSliders(remote.sliders);
            if (Array.isArray(remote.categories) && remote.categories.length) setCategoriesList(remote.categories);
          }
          await cloudPush(settings.cloudSyncUrl, { products, orders, sliders, categories: categoriesList, settings: { ...settings, cloudSyncUrl: undefined } });
          setSyncStatus('متصل سحابياً');
        } catch {
          setSyncStatus('وضع محلي');
        }
      };

      const categories = useMemo(() => {
        const merged = new Set(['الكل', ...categoriesList, ...products.map(p => p.category).filter(Boolean)]);
        return Array.from(merged);
      }, [categoriesList, products]);

      const allAvailableOptions = useMemo(() => {
        const set = new Set();
        products.forEach(p => (p.options || []).forEach(opt => set.add(opt)));
        return Array.from(set);
      }, [products]);

      const highestPriceInStore = useMemo(() => {
        if (!products.length) return 1000;
        return Math.max(...products.map(p => Number(p.price) || 0));
      }, [products]);

      const filteredAndSortedProducts = useMemo(() => {
        const list = products.filter(p => {
          if (selectedCategory !== 'الكل' && p.category !== selectedCategory) return false;
          if (availabilityFilter === 'instock' && !p.inStock) return false;
          if (availabilityFilter === 'outofstock' && p.inStock) return false;
          if (selectedOptionFilter !== 'all' && !(p.options || []).includes(selectedOptionFilter)) return false;
          if (minPrice !== '' && Number(p.price) < Number(minPrice)) return false;
          if (maxPrice !== '' && Number(p.price) > Number(maxPrice)) return false;
          const q = searchQuery.trim().toLowerCase();
          if (q) {
            const match =
              p.name.toLowerCase().includes(q) ||
              (p.arabicSubtitle || '').toLowerCase().includes(q) ||
              (p.category || '').toLowerCase().includes(q) ||
              (p.description || '').toLowerCase().includes(q);
            if (!match) return false;
          }
          return true;
        });

        const sorted = [...list];
        if (sortBy === 'best-selling') sorted.sort((a, b) => (b.isBestSeller ? 1 : 0) - (a.isBestSeller ? 1 : 0));
        else if (sortBy === 'price-asc') sorted.sort((a, b) => a.price - b.price);
        else if (sortBy === 'price-desc') sorted.sort((a, b) => b.price - a.price);
        else if (sortBy === 'newest') sorted.reverse();
        return sorted;
      }, [products, selectedCategory, availabilityFilter, selectedOptionFilter, minPrice, maxPrice, searchQuery, sortBy]);

      const resetAllFilters = () => {
        setAvailabilityFilter('all');
        setSelectedOptionFilter('all');
        setMinPrice('');
        setMaxPrice('');
        setSearchQuery('');
      };

      const activeFiltersCount =
        (availabilityFilter !== 'all' ? 1 : 0) +
        (selectedOptionFilter !== 'all' ? 1 : 0) +
        (minPrice !== '' ? 1 : 0) +
        (maxPrice !== '' ? 1 : 0);

      const addToCart = (product, chosenOption) => {
        if (!product.inStock) return;
        const opt = chosenOption || (product.options && product.options[0]) || 'قياسي';
        const cartKey = `${product.id}__${opt}`;
        setCart(prev => {
          const exists = prev.find(i => i.cartKey === cartKey);
          if (exists) {
            return prev.map(i => i.cartKey === cartKey ? { ...i, quantity: i.quantity + 1 } : i);
          }
          return [
            ...prev,
            {
              cartKey,
              id: product.id,
              name: product.name,
              arabicSubtitle: product.arabicSubtitle,
              price: product.price,
              image: product.image,
              selectedOption: opt,
              quantity: 1
            }
          ];
        });
        setLastAddedItem({ name: product.name, option: opt, image: product.image });
        setCartDrawerOpen(true);
      };

      const updateCartQty = (cartKey, delta) => {
        setCart(prev =>
          prev
            .map(i => (i.cartKey === cartKey ? { ...i, quantity: i.quantity + delta } : i))
            .filter(i => i.quantity > 0)
        );
      };

      const removeFromCart = (cartKey) => {
        setCart(prev => prev.filter(i => i.cartKey !== cartKey));
      };

      const cartSubtotal = useMemo(() => cart.reduce((sum, i) => sum + i.price * i.quantity, 0), [cart]);
      const cartCount = useMemo(() => cart.reduce((sum, i) => sum + i.quantity, 0), [cart]);

      // تسجيل العميل تلقائياً عند إنشاء طلب الشراء فقط
      const customers = useMemo(() => {
        const map = new Map();
        orders.forEach(o => {
          const key = (o.phone || '').trim();
          if (!key) return;
          if (!map.has(key)) {
            map.set(key, {
              name: o.customerName,
              phone: o.phone,
              governorate: o.governorate,
              address: o.address,
              ordersCount: 1,
              totalSpent: o.total
            });
          } else {
            const cur = map.get(key);
            cur.ordersCount += 1;
            cur.totalSpent += o.total;
          }
        });
        return Array.from(map.values());
      }, [orders]);

      const handleCompleteOrder = (checkoutData) => {
        const newOrder = {
          id: 'FRF-' + Math.floor(100000 + Math.random() * 900000),
          date: new Date().toLocaleString('ar-EG', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
          }),
          items: cart,
          subtotal: cartSubtotal,
          ...checkoutData,
          status: 'جديد'
        };
        if (!persist('farafero_pro_orders_v2', JSON.stringify([newOrder, ...orders]))) {
          setToast('لم يُحفظ الطلب: ' + STORAGE_FAIL_MSG);
          return;
        }
        setOrders(prev => [newOrder, ...prev]);
        setCart([]);
        setCurrentInvoice(newOrder);
        setView('invoice');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const shownProducts = wishOnly ? filteredAndSortedProducts.filter(p => wishlist.includes(p.id)) : filteredAndSortedProducts;

      if (view === 'admin-login') {
        return (
          <AdminLogin
            storeName={settings.storeName}
            onSuccess={() => { setIsAdmin(true); setView('admin'); }}
            onBack={() => setView('collection')}
          />
        );
      }

      if (view === 'admin' && isAdmin) {
        return (
          <AdminPanel
            settings={settings}
            setSettings={setSettings}
            categoriesList={categoriesList}
            setCategoriesList={setCategoriesList}
            products={products}
            setProducts={setProducts}
            sliders={sliders}
            setSliders={setSliders}
            orders={orders}
            setOrders={setOrders}
            customers={customers}
            syncStatus={syncStatus}
            onSyncNow={syncCloudNow}
            onBackToStore={() => setView('collection')}
            onLogout={() => { setIsAdmin(false); setView('collection'); }}
          />
        );

      if (view === 'invoice' && currentInvoice) {

            settings={settings}
            invoice={currentInvoice}
            onContinueShopping={() => setView('collection')}

          <div className={`${theme.topBarBg} text-xs py-2.5 px-4`}>
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              <button
                onClick={() => setAnnouncementIdx(prev => (prev - 1 + settings.announcements.length) % settings.announcements.length)}

              </button>
              <p className="text-center font-medium truncate">
                {settings.announcements[announcementIdx]}

                ‹
              </button>

              <div className="flex items-center gap-3 sm:gap-4 flex-1 min-w-0">

                <button

                  <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="1.75" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />

                <button

                <button
                  onClick={() => setCartDrawerOpen(true)}
                  className="relative p-2 flex items-center gap-1.5"

                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="1.75" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007Z" />
                  </svg>
                  <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${theme.accentBtn}`}>
                    {cartCount}
                  </span>
                </button>
              </div>
            </div>

            {searchOpen && (
              <div className={`border-t px-4 py-3 ${theme.border} ${theme.surfaceBg}`}>
                <div className="max-w-2xl mx-auto flex items-center gap-2">
                  <input
                    type="text"
                    autoFocus
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    placeholder="ابحث عن بوكس هدايا، مج، برفان، ساعة..."
                    className={`w-full px-4 py-2.5 border text-sm focus:outline-none ${theme.cardBg} ${theme.border}`}
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="px-3 py-2.5 text-xs font-bold opacity-70">
                      مسح
                    </button>
                  )}
                  <button onClick={() => setSearchOpen(false)} className="px-3 py-2.5 text-xs font-bold">
                    إغلاق
                  </button>
                </div>
              </div>
            )}
          </header>

          {view === 'collection' && (
            <main className="flex-1">
              <HeroBannerSlider
                sliders={sliders}
                onSelectCategory={cat => setSelectedCategory(cat)}
              />

              <TrustStrip theme={theme} settings={settings} />
              <BudgetFinder theme={theme} minPrice={minPrice} maxPrice={maxPrice} setMinPrice={setMinPrice} setMaxPrice={setMaxPrice} />

              {/* شريط الأقسام */}
              <section className={`border-b ${theme.border} ${theme.surfaceBg}`}>
                <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center gap-2 sm:gap-3 overflow-x-auto snap-x [scrollbar-width:none]">
                  {categories.map(cat => (
                    <button
                      key={cat}
                      onClick={() => setSelectedCategory(cat)}
                      className={`px-4 py-2 text-xs sm:text-sm font-bold whitespace-nowrap transition border ${
                        selectedCategory === cat
                          ? theme.accentBtn + ' border-transparent'
                          : `${theme.cardBg} ${theme.border} opacity-85 hover:opacity-100`
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>
              </section>

              {/* الفلاتر والترتيب والمنتجات */}
              <section className="max-w-7xl mx-auto px-4 sm:px-6 pt-8 pb-16">
                <div className="mb-6 flex flex-wrap items-end justify-between gap-4">
                  <div>
                    <p className={`text-xs uppercase tracking-widest mb-1 ${theme.mutedText}`}>مجموعة 2027</p>
                    <h1 className="text-2xl sm:text-3xl font-bold">
                      {selectedCategory === 'الكل' ? 'جميع الهدايا والمجموعات' : selectedCategory}
                    </h1>
                  </div>
                </div>

                <p className={`mb-4 text-[11px] sm:text-xs leading-relaxed ${theme.mutedText}`}>المنتجات والصور والأسعار في هذه النسخة التجريبية توضيحية فقط، وليست مخزوناً أو عروضاً مؤكدة. الصور قد لا تطابق الموديل أو اللون.</p>
                <div className={`flex flex-wrap items-center justify-between gap-4 py-3.5 border-y mb-6 text-xs sm:text-sm ${theme.border}`}>
                  <div className="flex items-center gap-4">
                    <button
                      onClick={() => setFilterDrawerOpen(true)}
                      className="inline-flex items-center gap-2 font-bold"
                    >
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.75" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" />
                      </svg>
                      <span>فلترة وترتيب {activeFiltersCount > 0 ? `(${activeFiltersCount})` : ''}</span>
                    </button>

                    <div className={`hidden md:flex items-center gap-3 border-r pr-4 ${theme.border}`}>
                      <select
                        value={availabilityFilter}
                        onChange={e => setAvailabilityFilter(e.target.value)}
                        className="bg-transparent font-semibold focus:outline-none cursor-pointer"
                      >
                        <option value="all" className="text-stone-900">التوفر: الكل</option>
                        <option value="instock" className="text-stone-900">متوفر</option>
                        <option value="outofstock" className="text-stone-900">غير متوفر</option>
                      </select>

                      <select
                        value={selectedOptionFilter}
                        onChange={e => setSelectedOptionFilter(e.target.value)}
                        className="bg-transparent font-semibold focus:outline-none cursor-pointer"
                      >
                        <option value="all" className="text-stone-900">النوع / اللون: الكل</option>
                        {allAvailableOptions.map(opt => (
                          <option key={opt} value={opt} className="text-stone-900">{opt}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div className="flex items-center gap-4">
                    <div className="flex items-center gap-2">
                      <label className={`hidden sm:inline ${theme.mutedText}`}>ترتيب:</label>
                      <select
                        value={sortBy}
                        onChange={e => setSortBy(e.target.value)}
                        className="bg-transparent font-bold focus:outline-none cursor-pointer"
                      >
                        <option value="featured" className="text-stone-900">المميز</option>
                        <option value="best-selling" className="text-stone-900">الأكثر مبيعاً</option>
                        <option value="price-asc" className="text-stone-900">السعر: من الأقل للأعلى</option>
                        <option value="price-desc" className="text-stone-900">السعر: من الأعلى للأقل</option>
                        <option value="newest" className="text-stone-900">الأحدث</option>
                      </select>
                    </div>

                    <button

                    >

                    <span className={`font-semibold ${theme.mutedText}`}>

                    </span>

                {activeFiltersCount > 0 && (

                    {availabilityFilter !== 'all' && (
                      <button onClick={() => setAvailabilityFilter('all')} className={`px-3 py-1 border text-xs font-bold ${theme.surfaceBg} ${theme.border}`}>
                        {availabilityFilter === 'instock' ? 'متوفر' : 'غير متوفر'} ✕
                      </button>

                    {selectedOptionFilter !== 'all' && (
                      <button onClick={() => setSelectedOptionFilter('all')} className={`px-3 py-1 border text-xs font-bold ${theme.surfaceBg} ${theme.border}`}>
                        {selectedOptionFilter} ✕
                      </button>
                    )}
                    {(minPrice !== '' || maxPrice !== '') && (
                      <button onClick={() => { setMinPrice(''); setMaxPrice(''); }} className={`px-3 py-1 border text-xs font-bold ${theme.surfaceBg} ${theme.border}`}>
                        السعر: {minPrice || 0} - {maxPrice || highestPriceInStore} ج.م ✕
                      </button>
                    )}
                    <button onClick={resetAllFilters} className="text-xs font-bold underline mr-2">
                      مسح الكل
                    </button>
                  </div>
                )}

                {shownProducts.length === 0 ? (
                  <div className={`py-20 text-center border space-y-3 ${theme.border} ${theme.surfaceBg}`}>
                    <p className="text-base font-bold">لا توجد منتجات مطابقة للفلاتر الحالية</p>
                    <button onClick={resetAllFilters} className={`px-5 py-2.5 text-xs font-bold ${theme.accentBtn}`}>

                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-4 gap-y-8 sm:gap-x-6 sm:gap-y-10">

          {view === 'checkout' && (
            <CheckoutPage

              cartSubtotal={cartSubtotal}

              onBackToStore={() => setView('collection')}

            />
          )}

          {view === 'policy' && (

              type={policyType}

              theme={theme}
              onBack={() => setView('collection')}

    function Reveal({ className = '', children, ...rest }) {
      const ref = useRef(null);
      const [shown, setShown] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el || typeof IntersectionObserver === 'undefined') { setShown(true); return; }
        const io = new IntersectionObserver(([en]) => { if (en.isIntersecting) { setShown(true); io.disconnect(); } }, { threshold: 0.08 });
        io.observe(el);
        const fb = setTimeout(() => setShown(true), 2500);
        return () => { io.disconnect(); clearTimeout(fb); };
      }, []);
      return <div ref={ref} className={`reveal ${shown ? 'in' : ''} ${className}`} {...rest}>{children}</div>;
    }

    function CheckoutPage({ cart, cartSubtotal, settings, theme, updateCartQty, removeFromCart, onBackToStore, onSubmitOrder }) {

      const [address, setAddress] = useState('');

                <div>
                  <label className="block text-xs font-bold mb-1.5">رقم الموبايل *</label>
                  <input type="tel" required dir="ltr" value={phone} onChange={e => setPhone(e.target.value)} placeholder="010xxxxxxxx" className={`w-full px-3.5 py-2.5 border text-sm text-right ${theme.cardBg} ${theme.border}`} />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold mb-1.5">المحافظة (جميع محافظات مصر) *</label>

              </div>

              <div>
                <label className="block text-xs font-bold mb-1.5">العنوان بالتفصيل *</label>
                <input type="text" required value={address} onChange={e => setAddress(e.target.value)} placeholder="المنطقة، الشارع، رقم العمارة، الدور والشقة" className={`w-full px-3.5 py-2.5 border text-sm ${theme.cardBg} ${theme.border}`} />

              <div>
                <label className="block text-xs font-bold mb-1.5">رسالة كارت الإهداء المجاني (اختياري)</label>

              <h2 className={`text-base font-bold border-b pb-3 pt-2 ${theme.border}`}>2. طريقة الدفع</h2>
              <p className="text-xs leading-relaxed bg-amber-50 border border-amber-200 p-3 text-stone-800">نسخة تجريبية: الطلب يُحفظ على هذا الجهاز فقط، ولا يصل للمتجر إلا عندما ترسله على واتساب في الخطوة التالية. لا يوجد دفع إلكتروني فعّال حالياً.</p>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs font-bold">
                {[
                  { id: 'الدفع عند الاستلام (COD)', desc: 'يؤكدها المتجر معك على واتساب' },
                  { id: 'إنستاباي (InstaPay)', desc: 'تحويل يدوي يؤكده المتجر' },
                  { id: 'محفظة إلكترونية (فودافون / أورانج / اتصالات كاش)', desc: 'تحويل يدوي يؤكده المتجر' },
                  { id: 'بطاقة بنكية (Visa / Mastercard)', desc: 'دفع بالبطاقة البنكية' }
                ].map(pm => {
                  const avail = pm.id.includes('COD') || (!pm.id.includes('Visa') && !!settings.paymentNumber);

                  <label key={pm.id} className={`p-3.5 border ${avail ? 'cursor-pointer' : 'opacity-50 cursor-not-allowed'} ${paymentMethod === pm.id ? 'border-current font-black' : theme.border}`}>

            <div className={`lg:col-span-5 border p-6 space-y-4 ${theme.border}`}>
              <h2 className={`text-base font-bold border-b pb-3 ${theme.border}`}>ملخص الطلب</h2>
              <div className="space-y-3 max-h-80 overflow-y-auto">
                {cart.map(item => (
                  <div key={item.cartKey} className={`flex items-center justify-between gap-3 border-b pb-3 text-xs ${theme.border}`}>
                    <img src={item.image} alt="" className="w-14 h-16 object-cover" />
                    <div className="flex-1 min-w-0">
                      <p className="font-bold truncate">{item.name}</p>
                      <p className={theme.mutedText}>{item.selectedOption}</p>
                      <div className="flex items-center gap-2 mt-1">
                        <button type="button" onClick={() => updateCartQty(item.cartKey, -1)} className={`px-2 border ${theme.border}`}>-</button>
                        <span>{item.quantity}</span>
                        <button type="button" onClick={() => updateCartQty(item.cartKey, 1)} className={`px-2 border ${theme.border}`}>+</button>

              <div className="space-y-2 pt-2 text-sm">
                <div className="flex justify-between"><span>المجموع الفرعي:</span><strong>{cartSubtotal} ج.م</strong></div>
                <div className="flex justify-between"><span>الشحن ({governorate}):</span><strong>{shipping} ج.م</strong></div>
                <div className={`flex justify-between text-base font-black border-t pt-3 ${theme.border}`}><span>الإجمالي النهائي:</span><span>{total} ج.م</span></div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function PaymentStages({ settings, invoice }) {
      const pm = invoice.paymentMethod || '';
      const kind = pm.includes('COD') ? 'cod' : pm.includes('InstaPay') ? 'insta' : pm.includes('محفظة') ? 'wallet' : 'card';
      const payNo = settings.paymentNumber || '';
      const digits = String(settings.whatsapp || '').replace(/\D/g, '').replace(/^0/, '20');
      const lines = invoice.items.map(i => `- ${i.name} (${i.selectedOption}) x${i.quantity}`).join('\n');
      const msg = `طلب جديد ${invoice.id}\nالاسم: ${invoice.customerName}\nالموبايل: ${invoice.phone}\nالعنوان: ${invoice.governorate} - ${invoice.address}\n${lines}\nالإجمالي: ${invoice.total} ج.م\nالدفع المطلوب: ${pm}`;
      const wa = `https://wa.me/${digits}?text=${encodeURIComponent(msg)}`;
      const steps = [
        { t: 'حُفظ على جهازك', done: true },
        { t: 'أرسل الطلب على واتساب', current: true },
        { t: 'يؤكده المتجر معك' },
        { t: 'التجهيز والشحن' }
      ];
      let info = 'لم يصل طلبك للمتجر بعد. اضغط الزر لإرسال التفاصيل على واتساب، وبعدها يؤكد المتجر معك الطلب وطريقة الدفع.';
      if (kind !== 'cod' && payNo) info += ` تحويل يدوي غير موثّق إلى ${payNo}: لا ترسل أموالاً قبل أن يؤكد لك المتجر الرقم والمبلغ بنفسه. لا يتم تسجيل الدفع تلقائياً.`;
      if (kind !== 'cod' && !payNo) info += ' سيحدد المتجر وسيلة الدفع معك.';
      return (
        <div className="border border-stone-200 p-4 space-y-4 text-xs no-print">
          <div className="flex items-center justify-between gap-1">
            {steps.map((s, i) => (
              <div key={s.t} className="flex-1 flex flex-col items-center text-center gap-1.5">
                <span className={`w-7 h-7 rounded-full flex items-center justify-center font-bold ${s.done ? 'bg-emerald-600 text-white' : s.current ? 'bg-amber-500 text-white' : 'bg-stone-200 text-stone-500'}`}>{s.done ? '✓' : i + 1}</span>
                <span className={s.current || s.done ? 'font-bold' : 'text-stone-500'}>{s.t}</span>
              </div>
            ))}
          </div>
          <p className="leading-relaxed bg-amber-50 border border-amber-200 p-3">{info}</p>
          <a href={wa} target="_blank" rel="noopener noreferrer" className="block text-center py-3.5 bg-[#25D366] text-white font-bold text-sm">أرسل الطلب للمتجر على واتساب</a>
        </div>
      );
    }

              <div className="flex justify-between"><span>الشحن ({invoice.governorate}):</span><strong>{invoice.shipping} ج.م</strong></div>

        <div className="min-h-screen bg-stone-100 text-stone-900 flex items-center justify-center p-4">

    function AdminPanel({
      settings,
      setSettings,
      categoriesList,
      setCategoriesList,
      products,
      setProducts,
      sliders,
      setSliders,
      orders,
      setOrders,
      customers,
      syncStatus,
      onSyncNow,
      onBackToStore,
      onLogout
    }) {
      const [tab, setTab] = useState('dashboard');
      const [editingId, setEditingId] = useState(null);
      const [name, setName] = useState('');
      const [arabicSubtitle, setArabicSubtitle] = useState('');
      const [category, setCategory] = useState(categoriesList[0] || 'بوكسات هدايا');
      const [price, setPrice] = useState('');
      const [oldPrice, setOldPrice] = useState('');
      const [optionsText, setOptionsText] = useState('Standard, Deluxe');
      const [description, setDescription] = useState('');
      const [image, setImage] = useState('');
      const [newCategoryName, setNewCategoryName] = useState('');
      const [cloudUrl, setCloudUrl] = useState(settings.cloudSyncUrl || '');
      const [msg, setMsg] = useState('');
      const [orderFilter, setOrderFilter] = useState('الكل');
      const [productQuery, setProductQuery] = useState('');
      const [stockFilter, setStockFilter] = useState('all');

      const flash = (text) => {
        setTimeout(() => {
          setMsg(window.__storageFail ? STORAGE_FAIL_MSG : text);
          setTimeout(() => setMsg(''), window.__storageFail ? 6000 : 3000);
        }, 120);
      };

      const totalSales = useMemo(() => orders.filter(o => o.status !== 'ملغي').reduce((s, o) => s + (Number(o.total) || 0), 0), [orders]);
      const newOrders = orders.filter(o => o.status === 'جديد').length;
      const outOfStock = products.filter(p => !p.inStock);
      const topProducts = useMemo(() => {
        const m = {};
        orders.filter(o => o.status !== 'ملغي').forEach(o => (o.items || []).forEach(i => { m[i.name] = (m[i.name] || 0) + (Number(i.quantity) || 0); }));
        return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 4);
      }, [orders]);
      const waLink = (phone, text) => {
        const d = String(phone || '').replace(/\D/g, '').replace(/^0/, '20');
        return `https://wa.me/${d}?text=${encodeURIComponent(text)}`;
      };
      const STATUS_COLORS = { 'جديد': 'bg-amber-100 text-amber-900', 'قيد التجهيز': 'bg-sky-100 text-sky-900', 'تم الشحن': 'bg-indigo-100 text-indigo-900', 'تم التسليم': 'bg-emerald-100 text-emerald-900', 'ملغي': 'bg-stone-200 text-stone-600' };
      const visibleProducts = products.filter(p => {
        if (stockFilter === 'in' && !p.inStock) return false;
        if (stockFilter === 'out' && p.inStock) return false;
        const q = productQuery.trim().toLowerCase();
        return !q || (p.name + ' ' + (p.arabicSubtitle || '') + ' ' + p.id).toLowerCase().includes(q);
      });

      const handleMobileUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result === 'string') {
            if (reader.result.length > 900000) { flash('الصورة كبيرة، اختر صورة أصغر (أقل من 650KB) لأن التخزين على هذا الجهاز محدود'); return; }
            setImage(reader.result);
          }
        };
        reader.readAsDataURL(file);
      };

      const startEditProduct = (p) => {
        setEditingId(p.id);
        setName(p.name);
        setArabicSubtitle(p.arabicSubtitle || '');
        setCategory(p.category);
        setPrice(String(p.price));
        setOldPrice(p.oldPrice ? String(p.oldPrice) : '');
        setOptionsText((p.options || []).join(', '));
        setDescription(p.description || '');
        setImage(p.image || '');
        setTab('products');
      };

      const resetProductForm = () => {
        setEditingId(null);
        setName('');
        setArabicSubtitle('');
        setPrice('');
        setOldPrice('');
        setDescription('');
        setImage('');
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        if (!name.trim() || !price) return;
        const parsedOptions = optionsText.split(',').map(s => s.trim()).filter(Boolean);
        const finalImg = image || 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=900&q=80';

        if (editingId) {
          setProducts(prev =>
            prev.map(item =>
              item.id === editingId
                ? {
                    ...item,
                    name: name.trim(),
                    arabicSubtitle: arabicSubtitle.trim(),
                    category: (category || 'عام').trim(),
                    price: Number(price),
                    oldPrice: oldPrice ? Number(oldPrice) : null,
                    options: parsedOptions.length ? parsedOptions : ['قياسي'],
                    image: finalImg,
                    description: description.trim()
                  }
                : item
            )
          );
          resetProductForm();
          flash('تم تحديث بيانات المنتج ✓');
        } else {
          const newProd = {
            id: 'FRF-' + Math.floor(100 + Math.random() * 900),
            name: name.trim(),
            arabicSubtitle: arabicSubtitle.trim(),
            category: (category || 'عام').trim(),
            price: Number(price),
            oldPrice: oldPrice ? Number(oldPrice) : null,
            isBestSeller: true,
            options: parsedOptions.length ? parsedOptions : ['قياسي'],
            image: finalImg,
            hoverImage: '',
            description: description.trim(),
            inStock: true
          };
          setProducts(prev => [newProd, ...prev]);
          resetProductForm();
          flash('تمت إضافة المنتج على هذا الجهاز ✓');
        }
      };

      const addNewCategory = (e) => {
        e.preventDefault();
        const clean = newCategoryName.trim();
        if (!clean) return;
        if (!categoriesList.includes(clean)) {
          setCategoriesList(prev => [...prev, clean]);
        }
        setNewCategoryName('');
        flash(`تمت إضافة قسم "${clean}" ✓`);
      };

      return (
        <div className="min-h-screen bg-stone-50 text-stone-900 flex flex-col lg:flex-row">
          <aside className="w-full lg:w-64 bg-stone-950 text-stone-300 p-3 lg:p-4 flex flex-col justify-between gap-3">
            <div className="flex lg:flex-col gap-2 overflow-x-auto pb-1 [scrollbar-width:none]">
              {[
                { id: 'dashboard', label: 'نظرة عامة وإحصائيات' },
                { id: 'products', label: 'المنتجات ورفع الصور' },
                { id: 'categories', label: 'إدارة الأقسام' },
                { id: 'shipping', label: 'شحن المحافظات (27)' },
                { id: 'sliders', label: 'البانر والإعلانات' },
                { id: 'orders', label: `الطلبات (${orders.length})` },
                { id: 'customers', label: `العملاء (${customers.length})` },
                { id: 'settings', label: 'الأنماط والإعدادات' }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className={`shrink-0 px-4 py-2.5 text-xs font-bold whitespace-nowrap text-right transition ${
                    tab === t.id ? 'bg-white text-stone-950' : 'hover:bg-stone-900'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>
            <div className="grid grid-cols-3 lg:grid-cols-1 gap-2">
              <button onClick={onSyncNow} title="متوقفة في النسخة التجريبية: تحتاج خادماً بمصادقة قبل التشغيل" className="px-3 py-2 bg-emerald-800 text-white text-xs font-bold">مزامنة (تحتاج إعداد)</button>
              <button onClick={onBackToStore} className="px-3 py-2 bg-stone-800 text-white text-xs font-bold">المتجر</button>
              <button onClick={onLogout} className="px-3 py-2 bg-rose-900 text-white text-xs font-bold">خروج</button>
            </div>
          </aside>

          <main className="flex-1 p-5 sm:p-8 space-y-6">
            <div className="flex flex-wrap items-center justify-between gap-2 border-b pb-4">
              <h1 className="text-xl font-bold">لوحة تحكم {settings.storeName}</h1>
              <span className="text-xs font-bold px-3 py-1 bg-white border">{SYNC_ENABLED ? syncStatus : 'البيانات محفوظة على هذا الجهاز فقط'}</span>
            </div>

            {msg && <div className={`p-3 text-white text-xs font-bold ${msg === STORAGE_FAIL_MSG ? 'bg-rose-700' : 'bg-emerald-900'}`}>{msg}</div>}

            {tab === 'dashboard' && (
              <div className="space-y-5">
                <p className="text-xs bg-amber-50 border border-amber-200 p-3 leading-relaxed">نسخة تجريبية محلية: الأرقام هنا من الطلبات المحفوظة على هذا المتصفح فقط، ولا تشمل طلبات العملاء من أجهزة أخرى.</p>
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white p-5 border"><p className="text-xs text-stone-500 font-bold">إجمالي الطلبات (بدون الملغي)</p><p className="text-2xl font-black mt-1">{totalSales} ج.م</p></div>
                  <div className="bg-white p-5 border"><p className="text-xs text-stone-500 font-bold">طلبات جديدة تحتاج متابعة</p><p className="text-2xl font-black mt-1 text-amber-700">{newOrders}</p></div>
                  <div className="bg-white p-5 border"><p className="text-xs text-stone-500 font-bold">منتجات نفدت</p><p className="text-2xl font-black mt-1">{outOfStock.length} / {products.length}</p></div>
                  <div className="bg-white p-5 border"><p className="text-xs text-stone-500 font-bold">العملاء</p><p className="text-2xl font-black mt-1">{customers.length}</p></div>
                </div>
                <div className="grid lg:grid-cols-2 gap-4">
                  <div className="bg-white border p-5 space-y-3">
                    <h2 className="font-bold text-sm">آخر الطلبات</h2>
                    {orders.length === 0 ? <p className="text-xs text-stone-500">لا توجد طلبات بعد.</p> : orders.slice(0, 5).map(o => (
                      <div key={o.id} className="flex items-center justify-between gap-2 text-xs border-b pb-2">
                        <span className="font-bold">{o.id} · {o.customerName}</span>
                        <span className={`px-2 py-0.5 font-bold ${STATUS_COLORS[o.status] || ''}`}>{o.status}</span>
                      </div>
                    ))}
                    <button onClick={() => setTab('orders')} className="text-xs font-bold underline">كل الطلبات</button>
                  </div>
                  <div className="bg-white border p-5 space-y-3">
                    <h2 className="font-bold text-sm">الأكثر طلباً</h2>
                    {topProducts.length === 0 ? <p className="text-xs text-stone-500">يظهر هنا بعد أول طلب.</p> : topProducts.map(([n, q]) => (
                      <div key={n} className="flex justify-between gap-2 text-xs border-b pb-2"><span className="line-clamp-1">{n}</span><strong>{q} قطعة</strong></div>
                    ))}
                    {outOfStock.length > 0 && <p className="text-xs text-rose-700 font-bold">نفد: {outOfStock.map(p => p.name).join('، ')}</p>}
                  </div>
                </div>
              </div>
            )}

            {tab === 'products' && (
              <div className="space-y-6">
                <p className="text-xs bg-amber-50 border border-amber-200 p-3 leading-relaxed">كتالوج تجريبي: المنتجات والصور الحالية توضيحية وليست مخزوناً موثقاً. استبدلها بمنتجاتك وصورها الحقيقية. التغييرات تُحفظ على هذا الجهاز فقط.</p>
                <form onSubmit={handleSaveProduct} className="bg-white p-6 border border-stone-200 space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="font-bold text-base">
                      {editingId ? `تعديل منتج (${editingId})` : 'إضافة منتج جديد (يُحفظ على هذا الجهاز)'}
                    </h2>
                    {editingId && (
                      <button type="button" onClick={resetProductForm} className="text-xs font-bold underline text-rose-700">
                        إلغاء التعديل
                      </button>
                    )}
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    <input type="text" required value={name} onChange={e => setName(e.target.value)} placeholder="اسم المنتج *" className="px-3.5 py-2.5 border text-sm" />
                    <input type="text" value={arabicSubtitle} onChange={e => setArabicSubtitle(e.target.value)} placeholder="وصف قصير بالعربي" className="px-3.5 py-2.5 border text-sm" />
                    <select value={category} onChange={e => setCategory(e.target.value)} className="px-3.5 py-2.5 border text-sm bg-white font-semibold">
                      {categoriesList.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                    <input type="number" required value={price} onChange={e => setPrice(e.target.value)} placeholder="السعر الحالي (ج.م) *" className="px-3.5 py-2.5 border text-sm" />
                    <input type="number" value={oldPrice} onChange={e => setOldPrice(e.target.value)} placeholder="السعر قبل الخصم (لشارة الخصم)" className="px-3.5 py-2.5 border text-sm" />
                    <input type="text" value={optionsText} onChange={e => setOptionsText(e.target.value)} placeholder="الخيارات مفصولة بفاصلة (,)" className="px-3.5 py-2.5 border text-sm" />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 items-center">
                    <div>
                      <label className="block text-xs font-bold mb-1">ارفع صورة من الموبايل:</label>
                      <input type="file" accept="image/*" onChange={handleMobileUpload} className="w-full text-xs" />
                    </div>
                    <input type="text" value={description} onChange={e => setDescription(e.target.value)} placeholder="تفاصيل المنتج" className="px-3.5 py-2.5 border text-sm" />
                  </div>

                  {image && <img src={image} alt="Preview" className="w-24 h-28 object-cover border" />}

                  <button type="submit" className="px-6 py-3 bg-stone-900 text-white text-xs font-bold">
                    {editingId ? 'حفظ التعديلات على هذا الجهاز' : 'حفظ المنتج على هذا الجهاز'}
                  </button>
                </form>

                <div className="flex flex-wrap gap-3 items-center bg-white border p-3 text-xs">
                  <input type="text" value={productQuery} onChange={e => setProductQuery(e.target.value)} placeholder="ابحث في المنتجات..." className="flex-1 min-w-[160px] px-3 py-2 border" />
                  <select value={stockFilter} onChange={e => setStockFilter(e.target.value)} className="px-3 py-2 border font-bold bg-white">
                    <option value="all">كل المنتجات</option><option value="in">متوفر</option><option value="out">نفد</option>
                  </select>
                  <span className="font-bold text-stone-500">{visibleProducts.length} من {products.length}</span>
                </div>
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                  {visibleProducts.map(p => (
                    <div key={p.id} className="bg-white p-3 border space-y-2 flex flex-col justify-between min-w-0">
                      <div>
                        <img src={p.image} alt={p.name} className="w-full aspect-[3/4] object-cover mb-2" />
                        <p className="text-[11px] text-stone-400">{p.category}</p>
                        <h3 className="text-xs font-bold line-clamp-2">{p.name}</h3>
                        <p className="text-xs font-black mt-1">{p.price} ج.م</p>
                      </div>
                      <div className="flex flex-wrap gap-1.5 pt-2">
                        <button onClick={() => startEditProduct(p)} className="px-2.5 py-1.5 bg-stone-100 text-stone-900 text-[11px] font-bold">
                          تعديل
                        </button>
                        <button
                          onClick={() => setProducts(prev => prev.map(item => item.id === p.id ? { ...item, inStock: !item.inStock } : item))}
                          className={`flex-1 py-1.5 text-[11px] font-bold border ${p.inStock ? 'border-emerald-700 text-emerald-800' : 'border-stone-400 text-stone-500'}`}
                        >
                          {p.inStock ? 'متوفر' : 'نفد'}
                        </button>
                        <button
                          onClick={() => { setProducts(prev => [...prev, { ...p, id: 'FRF-' + Math.floor(1000 + Math.random() * 9000), name: p.name + ' (نسخة)' }]); flash('تم نسخ المنتج'); }}
                          className="px-2.5 py-1.5 bg-stone-100 text-stone-900 text-[11px] font-bold"
                        >
                          نسخ
                        </button>
                        <button
                          onClick={() => { if (window.confirm('حذف هذا المنتج؟')) { setProducts(prev => prev.filter(i => i.id !== p.id)); flash('تم حذف المنتج'); } }}
                          className="px-2.5 py-1.5 bg-rose-50 text-rose-700 text-[11px] font-bold"
                        >
                          حذف
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'categories' && (
              <div className="bg-white p-6 border space-y-5 max-w-xl">
                <h2 className="font-bold text-base">إدارة أقسام المتجر</h2>
                <form onSubmit={addNewCategory} className="flex gap-2">
                  <input
                    type="text"
                    value={newCategoryName}
                    onChange={e => setNewCategoryName(e.target.value)}
                    placeholder="اسم قسم جديد (مثال: هدايا رجالي)"
                    className="flex-1 px-3.5 py-2.5 border text-sm"
                  />
                  <button type="submit" className="px-5 py-2.5 bg-stone-900 text-white text-xs font-bold">إضافة</button>
                </form>
                <div className="space-y-2">
                  {categoriesList.map(cat => (
                    <div key={cat} className="flex items-center justify-between p-3 bg-stone-50 border text-xs font-bold">
                      <span>{cat}</span>
                      <button
                        onClick={() => setCategoriesList(prev => prev.filter(c => c !== cat))}
                        className="text-rose-700 underline"
                      >
                        حذف
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'shipping' && (
              <div className="bg-white p-6 border space-y-4">
                <h2 className="font-bold text-base">تعديل مصاريف الشحن لجميع محافظات مصر (ج.م)</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                  {Object.entries(settings.shippingRates).map(([gov, rate]) => (
                    <div key={gov} className="flex items-center justify-between p-3 bg-stone-50 border">
                      <span className="text-xs font-bold">{gov}</span>
                      <input
                        type="number"
                        value={rate}
                        onChange={e => {
                          const val = Number(e.target.value);
                          setSettings(prev => ({ ...prev, shippingRates: { ...prev.shippingRates, [gov]: val } }));
                        }}
                        className="w-24 px-2 py-1 border bg-white text-center text-xs font-bold"
                      />
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'sliders' && (
              <div className="bg-white p-6 border space-y-4 max-w-2xl">
                <h2 className="font-bold text-base">تعديل البانر الرئيسي والشريط العلوي</h2>
                <div className="space-y-2">
                  <label className="text-xs font-bold">إعلانات الشريط العلوي:</label>
                  {settings.announcements.map((ann, idx) => (
                    <input
                      key={idx}
                      type="text"
                      value={ann}
                      onChange={e => {
                        const updated = [...settings.announcements];
                        updated[idx] = e.target.value;
                        setSettings(prev => ({ ...prev, announcements: updated }));
                      }}
                      className="w-full px-3 py-2 border text-xs"
                    />
                  ))}
                </div>
                <div className="space-y-3 pt-3 border-t">
                  <label className="text-xs font-bold">شرائح البانر الرئيسي:</label>
                  {sliders.map((s, idx) => (
                    <div key={s.id} className="p-3 bg-stone-50 border space-y-2">
                      <input type="text" value={s.title} onChange={e => setSliders(prev => prev.map((it, i) => i === idx ? { ...it, title: e.target.value } : it))} className="w-full px-3 py-2 border bg-white text-xs font-bold" />
                      <input type="text" value={s.subtitle} onChange={e => setSliders(prev => prev.map((it, i) => i === idx ? { ...it, subtitle: e.target.value } : it))} className="w-full px-3 py-2 border bg-white text-xs" />
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'orders' && (
              <div className="space-y-3">
                <p className="text-xs bg-amber-50 border border-amber-200 p-3 leading-relaxed">الطلبات هنا محفوظة على هذا المتصفح فقط. طلب العميل لا يصل إلى هنا من جهازه؛ يصلك عبر رسالة الواتساب التي يرسلها هو. حالة الدفع تُسجَّل يدوياً بعد أن تتأكد بنفسك.</p>
                <div className="flex flex-wrap gap-2 text-xs">
                  {['الكل', 'جديد', 'قيد التجهيز', 'تم الشحن', 'تم التسليم', 'ملغي'].map(s => (
                    <button key={s} onClick={() => setOrderFilter(s)} className={`px-3 py-1.5 border font-bold ${orderFilter === s ? 'bg-stone-900 text-white border-stone-900' : 'bg-white'}`}>
                      {s}{s !== 'الكل' ? ` (${orders.filter(o => o.status === s).length})` : ` (${orders.length})`}
                    </button>
                  ))}
                </div>
                {orders.length === 0 ? (
                  <p className="text-xs text-stone-500 bg-white p-6 border">لا توجد طلبات مسجلة بعد.</p>
                ) : (
                  orders.filter(o => orderFilter === 'الكل' || o.status === orderFilter).map(o => (
                    <div key={o.id} className="bg-white p-4 border space-y-3 text-xs">
                      <div className="flex flex-wrap items-start justify-between gap-3">
                        <div>
                          <p className="font-bold text-sm">{o.id} — {o.customerName} ({o.phone})</p>
                          <p className="text-stone-500 mt-0.5">{o.date} | {o.governorate} - {o.address}</p>
                        </div>
                        <span className={`px-2.5 py-1 font-bold ${STATUS_COLORS[o.status] || ''}`}>{o.status}</span>
                      </div>
                      <ul className="bg-stone-50 border p-3 space-y-1">
                        {(o.items || []).map(i => <li key={i.cartKey}>{i.name} ({i.selectedOption}) × {i.quantity} = {i.price * i.quantity} ج.م</li>)}
                        <li className="font-bold pt-1 border-t">الشحن {o.shipping} ج.م · الإجمالي {o.total} ج.م · {o.paymentMethod}</li>
                        {o.giftNote && <li>كارت الإهداء: "{o.giftNote}"</li>}
                      </ul>
                      <div className="flex flex-wrap items-center gap-2">
                        <select
                          value={o.status}
                          onChange={e => setOrders(prev => prev.map(it => it.id === o.id ? { ...it, status: e.target.value } : it))}
                          className="px-3 py-1.5 border font-bold bg-stone-50"
                        >
                          <option value="جديد">جديد</option>
                          <option value="قيد التجهيز">قيد التجهيز</option>
                          <option value="تم الشحن">تم الشحن</option>
                          <option value="تم التسليم">تم التسليم</option>
                          <option value="ملغي">ملغي</option>
                        </select>
                        <button
                          onClick={() => setOrders(prev => prev.map(it => it.id === o.id ? { ...it, paymentConfirmed: !it.paymentConfirmed } : it))}
                          className={`px-3 py-1.5 border font-bold ${o.paymentConfirmed ? 'border-emerald-700 text-emerald-800 bg-emerald-50' : 'border-stone-300 text-stone-600'}`}
                        >
                          {o.paymentConfirmed ? 'الدفع مؤكد يدوياً ✓' : 'الدفع غير مؤكد'}
                        </button>
                        <a
                          href={waLink(o.phone, `أهلاً ${o.customerName}، بخصوص طلبك ${o.id}: حالته الآن "${o.status}".`)}
                          target="_blank" rel="noopener noreferrer"
                          className="px-3 py-1.5 bg-[#25D366] text-white font-bold"
                        >
                          رد على العميل واتساب
                        </a>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {tab === 'customers' && (
              <div className="bg-white border overflow-x-auto">
                <table className="w-full text-right text-xs">
                  <thead className="bg-stone-100">
                    <tr>
                      <th className="p-3">الاسم</th>
                      <th className="p-3">الموبايل</th>
                      <th className="p-3">المحافظة والعنوان</th>
                      <th className="p-3">عدد الطلبات</th>
                      <th className="p-3">إجمالي المشتريات</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y">
                    {customers.map((c, idx) => (
                      <tr key={idx}>
                        <td className="p-3 font-bold">{c.name}</td>
                        <td className="p-3" dir="ltr">{c.phone}</td>
                        <td className="p-3">{c.governorate} — {c.address}</td>
                        <td className="p-3 font-bold">{c.ordersCount}</td>
                        <td className="p-3 font-bold text-emerald-800">{c.totalSpent} ج.م</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {tab === 'settings' && (
              <div className="bg-white p-6 border space-y-4 max-w-xl">
                <h2 className="font-bold text-base">نمط التصميم وإعدادات المتجر</h2>
                <div>
                  <label className="block text-xs font-bold mb-1">نمط التصميم الافتراضي:</label>
                  <select
                    value={settings.themeId}
                    onChange={e => setSettings(prev => ({ ...prev, themeId: e.target.value }))}
                    className="w-full px-3.5 py-2.5 border text-sm bg-white font-bold"
                  >
                    {Object.values(THEMES).map(t => (
                      <option key={t.id} value={t.id}>{t.arabicName} ({t.name})</option>
                    ))}
                  </select>
                </div>
                <input type="text" value={settings.storeName} onChange={e => setSettings(prev => ({ ...prev, storeName: e.target.value }))} placeholder="اسم المتجر" className="w-full px-3.5 py-2.5 border text-sm" />
                <input type="text" value={settings.whatsapp} onChange={e => setSettings(prev => ({ ...prev, whatsapp: e.target.value }))} placeholder="رقم الواتساب" className="w-full px-3.5 py-2.5 border text-sm" />
                <div>
                  <label className="block text-xs font-bold mb-1">نص سياسة الاستبدال (يكتبه صاحب المتجر ويراجعه قبل النشر):</label>
                  <textarea rows={4} value={settings.exchangePolicy || ''} onChange={e => setSettings(prev => ({ ...prev, exchangePolicy: e.target.value }))} placeholder="اكتب سياسة الاستبدال والاسترجاع الفعلية هنا" className="w-full px-3.5 py-2.5 border text-sm" />
                </div>
                <p className="text-xs text-stone-600 leading-relaxed">المزامنة السحابية متوقفة في هذه النسخة التجريبية عمداً: الرابط الحالي بدون مصادقة وكان سيرسل بيانات العملاء ويستبدل بيانات المتجر. تُفعَّل لاحقاً مع خادم بمصادقة.</p>
                <input type="text" dir="ltr" value={settings.paymentNumber || ''} onChange={e => setSettings(prev => ({ ...prev, paymentNumber: e.target.value }))} placeholder="حساب تحويل يدوي (اختياري، غير موثّق، لا يؤكد الدفع تلقائياً)" className="w-full px-3.5 py-2.5 border text-sm text-left" />
                <input type="url" dir="ltr" disabled value={cloudUrl} onChange={e => setCloudUrl(e.target.value)} placeholder="رابط المزامنة السحابية (اختياري)" className="w-full px-3.5 py-2.5 border text-sm text-left" />
                <button onClick={() => { setSettings(prev => ({ ...prev, cloudSyncUrl: cloudUrl.trim() })); flash('تم حفظ الإعدادات ✓'); }} className="px-6 py-2.5 bg-stone-900 text-white text-xs font-bold">
                  حفظ الإعدادات
                </button>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<><App /><StorageBanner /></>);
  </script>
</body>
</html>
