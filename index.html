<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FARAFERO GIFT SHOP - متجر الهدايا</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'], cinzel: ['Cinzel', 'serif'], montserrat: ['Montserrat', 'sans-serif'] },
                    colors: {
                        rosegold: { gold: '#C5A059' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #C5A059; border-radius: 4px; }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200"><g fill="none" stroke="%23C5A059" stroke-width="2"><path d="M50 32C42 22 30 22 33 32C35.5 38.5 48 35 50 32Z"/><path d="M50 32C58 22 70 22 67 32C64.5 38.5 52 35 50 32Z"/><rect x="25" y="32" width="50" height="12"/><rect x="28" y="44" width="44" height="34"/><line x1="50" y1="32" x2="50" y2="78"/></g><text x="150" y="130" font-family="Cinzel, serif" font-weight="700" font-size="26" fill="%23C5A059" letter-spacing="4" text-anchor="middle">FARAFERO</text><text x="150" y="155" font-family="Montserrat, sans-serif" font-weight="600" font-size="14" fill="%23333333" letter-spacing="5" text-anchor="middle">GIFT SHOP</text></svg>');
            background-repeat: repeat;
            background-position: center;
            background-size: 350px 250px;
            opacity: 0.035;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body class="bg-slate-50/90 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- STORE HEADER -->
    <header class="bg-white/95 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-12 h-12 flex items-center justify-center bg-white rounded-2xl border border-[#C5A059]/40 shadow-sm p-1">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
                        <path d="M50 32C42 22 30 22 33 32C35.5 38.5 48 35 50 32Z" stroke="#C5A059" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M50 32C58 22 70 22 67 32C64.5 38.5 52 35 50 32Z" stroke="#C5A059" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="25" y="32" width="50" height="12" fill="white" stroke="#C5A059" stroke-width="3" stroke-linejoin="round"/>
                        <rect x="28" y="44" width="44" height="34" fill="white" stroke="#C5A059" stroke-width="3" stroke-linejoin="round"/>
                        <line x1="50" y1="32" x2="50" y2="78" stroke="#C5A059" stroke-width="3"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-[3px] text-slate-900 leading-tight font-cinzel">FARAFERO</h1>
                    <p class="text-[9px] text-[#C5A059] font-semibold tracking-[4px] uppercase font-montserrat">GIFT SHOP</p>
                </div>
            </div>

            <!-- زر سلة الشراء العلوية -->
            <button onclick="toggleCartDrawer(true)" class="bg-amber-50 border border-amber-200 text-[#C5A059] px-4 py-2.5 rounded-2xl font-black text-xs flex items-center space-x-2 space-x-reverse shadow-sm hover:bg-[#C5A059] hover:text-white transition-all">
                <i class="fa-solid fa-cart-shopping text-sm"></i>
                <span>سلة طلبات الشراء (<span id="cart-counter">0</span>)</span>
            </button>
        </div>
    </header>

    <!-- MAIN STORE CONTAINER -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full space-y-8">
        
        <!-- بانر الترحيب -->
        <div class="bg-gradient-to-r from-amber-500 to-[#C5A059] rounded-3xl p-8 text-white shadow-lg flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
            <div class="space-y-2 text-center md:text-right">
                <span class="bg-white/20 text-white text-[11px] font-bold px-3 py-1 rounded-xl">أهلاً بك في متجرنا</span>
                <h2 class="text-2xl md:text-3xl font-black">اختار أجمل الهدايا لمن تحب بكل سهولة!</h2>
                <p class="text-xs text-amber-100">تصفح تشكيلتنا المميزة من الدباديب، الورود، وهدايا الأستانلس والشنط الحريمي.</p>
            </div>
            <div class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center text-3xl">
                🎁
            </div>
        </div>

        <!-- بحث وفلاتر الفئات -->
        <div class="space-y-4">
            <input type="text" id="store-search" oninput="renderStoreProducts()" placeholder="ابحث عن هدية معينة..." class="w-full bg-white border border-slate-200 rounded-2xl px-5 py-3.5 text-sm font-semibold shadow-sm focus:outline-none focus:border-[#C5A059]">
            <div id="categories-filter-bar" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- شبكة عرض المنتجات -->
        <div id="store-products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>

    </main>

    <!-- سلة الشراء الجانبية (Drawer) -->
    <div id="cart-drawer" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex justify-end transition-all">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col justify-between p-6 overflow-y-auto">
            <div class="space-y-4">
                <div class="flex justify-between items-center border-b pb-4">
                    <h3 class="font-black text-base text-slate-900 flex items-center">
                        <i class="fa-solid fa-cart-shopping text-[#C5A059] ml-2"></i> سلة طلبات الشراء
                    </h3>
                    <button onclick="toggleCartDrawer(false)" class="w-8 h-8 rounded-full bg-slate-100 text-slate-700 font-bold flex items-center justify-center hover:bg-rose-50 hover:text-rose-600">✕</button>
                </div>

                <div id="cart-items-list" class="divide-y space-y-2 max-h-[320px] overflow-y-auto custom-scrollbar"></div>
            </div>

            <div class="space-y-4 pt-4 border-t">
                <div class="space-y-2 bg-slate-50 p-4 rounded-2xl border">
                    <label class="text-[11px] font-bold text-slate-700 block">الاسم الكريم:</label>
                    <input type="text" id="order-cust-name" placeholder="اكتب اسمك الكامل..." class="w-full bg-white border rounded-xl p-2.5 text-xs font-semibold focus:outline-none focus:border-[#C5A059]">

                    <label class="text-[11px] font-bold text-slate-700 block mt-2">رقم الهاتف:</label>
                    <input type="tel" id="order-cust-phone" placeholder="رقم الموبايل للتواصل..." class="w-full bg-white border rounded-xl p-2.5 text-xs font-semibold focus:outline-none focus:border-[#C5A059]">

                    <label class="text-[11px] font-bold text-slate-700 block mt-2">عنوان التوصيل بالتفصيل:</label>
                    <input type="text" id="order-cust-address" placeholder="المدينة، الشارع، العمارة..." class="w-full bg-white border rounded-xl p-2.5 text-xs font-semibold focus:outline-none focus:border-[#C5A059]">
                </div>

                <div class="flex justify-between font-black text-base px-2">
                    <span>الإجمالي النهائي:</span>
                    <span class="text-[#C5A059]"><span id="cart-grand-total">0</span> EGP</span>
                </div>

                <button onclick="submitCustomerOrder()" class="w-full bg-[#C5A059] hover:bg-[#b08b49] text-white font-black py-3.5 rounded-2xl shadow-md text-sm transition-all flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-check-circle"></i>
                    <span>إرسال طلب الشراء للمحل الآن</span>
                </button>
            </div>
        </div>
    </div>

    <!-- نافذة تكبير الصورة -->
    <div id="image-zoom-modal" class="fixed inset-0 z-50 hidden bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4" onclick="closeImageZoom()">
        <div class="relative max-w-xl w-full bg-white rounded-3xl p-4 shadow-2xl text-center" onclick="event.stopPropagation()">
            <button onclick="closeImageZoom()" class="absolute top-4 left-4 w-9 h-9 rounded-full bg-slate-100 text-slate-700 font-bold flex items-center justify-center">✕</button>
            <h4 id="zoom-img-title" class="font-black text-base text-slate-900 mb-3"></h4>
            <img id="zoom-img-src" src="" class="max-h-[60vh] w-auto mx-auto rounded-2xl object-contain">
        </div>
    </div>

    <!-- SCRIPT ENGINE -->
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAuP10QxT-N1gEo7nW6Zc9I1Nzg9ehdD6E",
          authDomain: "farafero-store-99e0d.firebaseapp.com",
          projectId: "farafero-store-99e0d",
          storageBucket: "farafero-store-99e0d.firebasestorage.app",
          messagingSenderId: "47711607235",
          appId: "1:47711607235:web:6cc25baa82eebcf6460576",
          measurementId: "G-Q736FT0ZH5"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let storeState = {
            products: [],
            categories: [],
            selectedCategory: 'الكل',
            cart: []
        };

        function initStore() {
            db.collection("settings").doc("categories").onSnapshot((doc) => {
                if (doc.exists && doc.data().list) {
                    storeState.categories = doc.data().list;
                    renderCategoriesFilter();
                }
            });

            db.collection("products").onSnapshot((snapshot) => {
                storeState.products = [];
                snapshot.forEach((doc) => {
                    storeState.products.push({ id: doc.id, ...doc.data() });
                });
                renderStoreProducts();
            });
        }

        function renderCategoriesFilter() {
            const bar = document.getElementById('categories-filter-bar');
            if(!bar) return;
            bar.innerHTML = `
                <button onclick="filterCategory('الكل')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all ${storeState.selectedCategory === 'الكل' ? 'bg-[#C5A059] text-white shadow-md' : 'bg-white border text-slate-700 hover:bg-slate-100'}">جميع الهدايا</button>
            `;
            storeState.categories.forEach(cat => {
                bar.innerHTML += `
                    <button onclick="filterCategory('${cat}')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all ${storeState.selectedCategory === cat ? 'bg-[#C5A059] text-white shadow-md' : 'bg-white border text-slate-700 hover:bg-slate-100'}">${cat}</button>
                `;
            });
        }

        function filterCategory(cat) {
            storeState.selectedCategory = cat;
            renderCategoriesFilter();
            renderStoreProducts();
        }

        function renderStoreProducts() {
            const grid = document.getElementById('store-products-grid');
            const searchInput = document.getElementById('store-search');
            if(!grid) return;
            const search = searchInput ? searchInput.value.toLowerCase() : '';
            grid.innerHTML = '';

            let filtered = storeState.products.filter(p => {
                const matchCat = storeState.selectedCategory === 'الكل' || p.category === storeState.selectedCategory;
                const matchSearch = p.name.toLowerCase().includes(search) || (p.code && p.code.toLowerCase().includes(search));
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-slate-400 py-12">لا توجد هدايا متاحة في هذا القسم حالياً</p>';
                return;
            }

            filtered.forEach(p => {
                const isAvailable = p.stock > 0;
                grid.innerHTML += `
                    <div class="bg-white rounded-3xl p-4 border border-slate-200 shadow-sm flex flex-col justify-between space-y-4 relative overflow-hidden group">
                        <div class="h-48 rounded-2xl overflow-hidden bg-slate-100 relative cursor-pointer" onclick="openImageZoom('${p.image}', '${p.name}')">
                            <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition-all duration-300">
                            <span class="absolute bottom-2 right-2 bg-[#C5A059] text-white text-[10px] font-bold px-2.5 py-1 rounded-xl shadow">${p.code || 'هدية'}</span>
                        </div>
                        <div class="space-y-1">
                            <h4 class="font-black text-slate-900 text-sm line-clamp-1">${p.name}</h4>
                            <div class="flex justify-between items-center pt-2">
                                <span class="font-black text-[#C5A059] text-base">${p.price} EGP</span>
                                <span class="text-[10px] font-bold px-2.5 py-1 rounded-xl ${isAvailable ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">${isAvailable ? 'متوفر بالمحل' : 'نفذت الكمية'}</span>
                            </div>
                        </div>
                        <button ${isAvailable ? `onclick="addToCart('${p.id}')"` : 'disabled'} class="w-full ${isAvailable ? 'bg-slate-900 hover:bg-[#C5A059] text-white cursor-pointer' : 'bg-slate-100 text-slate-400 cursor-not-allowed'} py-3 rounded-2xl text-xs font-black shadow-sm transition-all flex items-center justify-center space-x-1.5 space-x-reverse">
                            <i class="fa-solid fa-cart-plus"></i>
                            <span>${isAvailable ? 'إضافة للسلة' : 'غير متوفر'}</span>
                        </button>
                    </div>
                `;
            });
        }

        function openImageZoom(imgUrl, title) {
            document.getElementById('zoom-img-src').src = imgUrl;
            document.getElementById('zoom-img-title').innerText = title;
            document.getElementById('image-zoom-modal').classList.remove('hidden');
        }

        function closeImageZoom() {
            document.getElementById('image-zoom-modal').classList.add('hidden');
        }

        function toggleCartDrawer(isOpen) {
            const drawer = document.getElementById('cart-drawer');
            if (isOpen) drawer.classList.remove('hidden');
            else drawer.classList.add('hidden');
        }

        function addToCart(prodId) {
            const p = storeState.products.find(x => x.id === prodId);
            if (!p || p.stock <= 0) return alert('عذراً، هذه الهدية نفذت من المخزون!');

            let item = storeState.cart.find(x => x.id === prodId);
            if (item) {
                if (item.qty + 1 > p.stock) return alert('الكمية المطلوبة أكبر من المتبقي بالمخزن!');
                item.qty++;
            } else {
                storeState.cart.push({ ...p, qty: 1 });
            }
            renderCart();
            toggleCartDrawer(true);
        }

        function removeFromCart(idx) {
            storeState.cart.splice(idx, 1);
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-items-list');
            const counter = document.getElementById('cart-counter');
            const grandTotalEl = document.getElementById('cart-grand-total');
            if(!list) return;
            list.innerHTML = '';

            let totalPieces = 0;
            let subtotal = 0;

            if (storeState.cart.length === 0) {
                list.innerHTML = '<p class="text-center text-slate-400 py-6 text-xs">سلة طلبات الشراء فارغة حالياً</p>';
            } else {
                storeState.cart.forEach((item, idx) => {
                    totalPieces += item.qty;
                    subtotal += item.price * item.qty;
                    list.innerHTML += `
                        <div class="flex justify-between items-center py-2.5 text-xs">
                            <div>
                                <p class="font-bold text-slate-900">${item.name}</p>
                                <p class="text-slate-400 text-[10px]">${item.price} EGP × ${item.qty}</p>
                            </div>
                            <div class="flex items-center space-x-3 space-x-reverse">
                                <span class="font-black text-[#C5A059]">${item.price * item.qty} EGP</span>
                                <button onclick="removeFromCart(${idx})" class="text-rose-500 font-bold hover:underline">✕</button>
                            </div>
                        </div>
                    `;
                });
            }

            counter.innerText = totalPieces;
            grandTotalEl.innerText = subtotal;
        }

        // دالة توليد رقم PO متسلسل تلقائياً وثابت من PO-0001 إلى مالا نهاية ولا يمكن تعديله
        async function getNextPoId() {
            const counterRef = db.collection("settings").doc("po_counter");
            
            try {
                return await db.runTransaction(async (transaction) => {
                    const counterDoc = await transaction.get(counterRef);
                    let nextSeq = 1;
                    
                    if (counterDoc.exists) {
                        nextSeq = (counterDoc.data().lastSeq || 0) + 1;
                    }
                    
                    // تحديث العداد في القاعدة فوراً
                    transaction.set(counterRef, { lastSeq: nextSeq }, { merge: true });
                    
                    // تنسيق الرقم ليكون PO-0001, PO-0002 وهكذا
                    return 'PO-' + String(nextSeq).padStart(4, '0');
                });
            } catch (error) {
                console.error("Error generating PO sequence: ", error);
                // كود احتياطي في حال حدوث أي خطأ في الاتصال
                const fallbackNum = Math.floor(1000 + Math.random() * 9000);
                return 'PO-' + fallbackNum;
            }
        }

        async function submitCustomerOrder() {
            if (storeState.cart.length === 0) return alert('برجاء إضافة هدايا للسلة أولاً!');
            
            const name = document.getElementById('order-cust-name').value.trim();
            const phone = document.getElementById('order-cust-phone').value.trim();
            const address = document.getElementById('order-cust-address').value.trim();

            if (!name || !phone || !address) {
                alert('برجاء كتابة الاسم، رقم الهاتف، وعنوان التوصيل لإتمام الطلب!');
                return;
            }

            let subtotal = storeState.cart.reduce((a, b) => a + (b.price * b.qty), 0);
            
            // سحب الرقم التسلسلي الدقيق من قاعدة البيانات
            const orderId = await getNextPoId();
            const dateStr = new Date().toLocaleDateString('en-GB');

            const newPurchaseOrder = {
                id: orderId,
                date: dateStr,
                timestamp: Date.now(),
                total: subtotal,
                discount: 0,
                packaging: 0,
                shipping: 0,
                customerName: name + ' (طلب شراء أونلاين)',
                customerPhone: phone + ' - العنوان: ' + address,
                status: 'pending',        // بانتظار المراجعة والاعتماد
                type: 'po',               // مخصص لخانة PO في السيستم الرئيسي
                detailedItems: JSON.parse(JSON.stringify(storeState.cart))
            };

            db.collection("orders").add(newPurchaseOrder).then(() => {
                // حفظ العميل في سجل العملاء
                const customerDocId = 'cust_' + phone.replace(/\s+/g, '_');
                const customerRef = db.collection("customers").doc(customerDocId);
                
                customerRef.get().then((docSnap) => {
                    if (docSnap.exists) {
                        customerRef.update({
                            name: name,
                            ordersCount: (docSnap.data().ordersCount || 1) + 1,
                            lastDate: dateStr
                        });
                    } else {
                        customerRef.set({
                            name: name,
                            phone: phone + ' (' + address + ')',
                            ordersCount: 1,
                            lastDate: dateStr,
                            timestamp: Date.now()
                        });
                    }
                });

                alert(`تم إرسال طلب الشراء برقم (${orderId}) بنجاح! سيتم مراجعته والتواصل معك قريباً.`);
                storeState.cart = [];
                renderCart();
                toggleCartDrawer(false);
                document.getElementById('order-cust-name').value = '';
                document.getElementById('order-cust-phone').value = '';
                document.getElementById('order-cust-address').value = '';
            }).catch(err => {
                console.error(err);
                alert('حدث خطأ أثناء إرسال الطلب، برجاء المحاولة مرة أخرى.');
            });
        }

        document.addEventListener('DOMContentLoaded', initStore);
    </script>
</body>
</html>
