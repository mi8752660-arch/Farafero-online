    // دوال المزامنة السحابية (Cloud Sync Helpers)
    async function pullFromCloud(endpoint) {
      if (!endpoint || !endpoint.trim()) return null;
      const res = await fetch(endpoint.trim(), { method: 'GET', cache: 'no-store' });
      if (!res.ok) throw new Error('Cloud GET failed');
      return await res.json();
    }

    async function pushToCloud(endpoint, payload) {
      if (!endpoint || !endpoint.trim()) return false;
      const res = await fetch(endpoint.trim(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      return res.ok;
    }

    function App() {
      const [settings, setSettings] = useState(() => {
        try {
          const saved = localStorage.getItem('farafero_settings_v1');
          return saved ? { ...INITIAL_SETTINGS, ...JSON.parse(saved) } : INITIAL_SETTINGS;
        } catch { return INITIAL_SETTINGS; }
      });

      const [products, setProducts] = useState(() => {
        try {
          const saved = localStorage.getItem('farafero_products_v1');
          return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
        } catch { return INITIAL_PRODUCTS; }
      });

      const [orders, setOrders] = useState(() => {
        try {
          const saved = localStorage.getItem('farafero_orders_v1');
          return saved ? JSON.parse(saved) : INITIAL_ORDERS;
        } catch { return INITIAL_ORDERS; }
      });

      const [cart, setCart] = useState(() => {
        try {
          const saved = localStorage.getItem('farafero_cart_v1');
          return saved ? JSON.parse(saved) : [];
        } catch { return []; }
      });

      const [syncStatus, setSyncStatus] = useState('محلي');
      const [currentView, setCurrentView] = useState('home');
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [searchModalOpen, setSearchModalOpen] = useState(false);
      const [globalSearchQuery, setGlobalSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [quickViewProduct, setQuickViewProduct] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3200);
      };

      // سحب البيانات من السحابة عند الفتح إذا كان هناك رابط مسجل
      useEffect(() => {
        let active = true;
        async function initCloud() {
          if (!settings.cloudSyncUrl) {
            setSyncStatus('محلي (LocalStorage)');
            return;
          }
          setSyncStatus('جاري المزامنة...');
          try {
            const data = await pullFromCloud(settings.cloudSyncUrl);
            if (!active || !data) return;
            if (Array.isArray(data.products)) setProducts(data.products);
            if (Array.isArray(data.orders)) setOrders(data.orders);
            if (data.settings) setSettings((prev) => ({ ...prev, ...data.settings }));
            setSyncStatus('متصل سحابياً ✓');
          } catch {
            if (active) setSyncStatus('وضع غير متصل (محلي)');
          }
        }
        initCloud();
        return () => { active = false; };
      }, [settings.cloudSyncUrl]);

      // حفظ محلي + رفع سحابي تلقائي عند تغير البيانات الأساسية
      useEffect(() => {
        try { localStorage.setItem('farafero_settings_v1', JSON.stringify(settings)); } catch {}
      }, [settings]);

      useEffect(() => {
        try { localStorage.setItem('farafero_products_v1', JSON.stringify(products)); } catch {}
        if (settings.cloudSyncUrl) {
          pushToCloud(settings.cloudSyncUrl, { products, orders, settings })
            .then((ok) => setSyncStatus(ok ? 'متصل سحابياً ✓' : 'محلي'))
            .catch(() => setSyncStatus('وضع غير متصل (محلي)'));
        }
      }, [products]);

      useEffect(() => {
        try { localStorage.setItem('farafero_orders_v1', JSON.stringify(orders)); } catch {}
        if (settings.cloudSyncUrl) {
          pushToCloud(settings.cloudSyncUrl, { products, orders, settings })

        }
      }, [orders]);

      useEffect(() => {
        try { localStorage.setItem('farafero_cart_v1', JSON.stringify(cart)); } catch {}

      const navigateTo = (view, category = null) => {
        if (category) setSelectedCategory(category);
        setCurrentView(view);
        setMobileMenuOpen(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const addToCart = (product, qty = 1) => {
        if (!product.inStock) {
          showToast('عذراً، هذا المنتج غير متوفر حالياً');
          return;
        }
        setCart((prev) => {
          const existing = prev.find((item) => item.id === product.id);
          if (existing) {
            return prev.map((item) => item.id === product.id ? { ...item, quantity: item.quantity + qty } : item);
          }
          return [...prev, { ...product, quantity: qty }];
        });
        showToast(`تمت إضافة "${product.name}" إلى السلة 🎁`);
      };

      const updateCartQuantity = (productId, delta) => {
        setCart((prev) =>
          prev
            .map((item) => item.id === productId ? { ...item, quantity: Math.max(0, item.quantity + delta) } : item)
            .filter((item) => item.quantity > 0)
        );
      };

      const removeFromCart = (productId) => {
        setCart((prev) => prev.filter((item) => item.id !== productId));
        showToast('تم حذف المنتج من السلة');
      };

      const cartItemsCount = useMemo(() => cart.reduce((sum, item) => sum + item.quantity, 0), [cart]);
      const cartSubtotal = useMemo(() => cart.reduce((sum, item) => sum + item.price * item.quantity, 0), [cart]);

      // تسجيل العملاء تلقائياً عند إنشاء طلب فقط
      const customers = useMemo(() => {
        const map = new Map();
        orders.forEach((order) => {
          const key = order.phone.trim();
          if (!map.has(key)) {
            map.set(key, {
              name: order.customerName,
              phone: order.phone,
              governorate: order.governorate,
              address: order.address,
              ordersCount: 1,
              totalSpent: order.total,
              lastOrderDate: order.date
            });
          } else {
            const existing = map.get(key);
            existing.ordersCount += 1;
            existing.totalSpent += order.total;
            existing.lastOrderDate = order.date;
          }
        });
        return Array.from(map.values());
      }, [orders]);

      const handleCreateOrder = (orderPayload) => {
        const newOrder = {
          id: `FRF-${Math.floor(1000 + Math.random() * 9000)}`,
          date: new Date().toLocaleString('ar-EG', {
            year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'

          ...orderPayload,
          status: 'جديد'
        };
        setOrders((prev) => [newOrder, ...prev]);
        setProducts((prev) =>
          prev.map((prod) => {
            const orderedItem = orderPayload.items.find((i) => i.id === prod.id);
            if (orderedItem) {
              const updatedStock = Math.max(0, (prod.internalStock || 10) - orderedItem.quantity);
              return { ...prod, internalStock: updatedStock, inStock: updatedStock > 0 ? prod.inStock : false };
            }
            return prod;
          })
        );
        setCart([]);
        return newOrder;
      };

        return `https://wa.me/${cleanPhone}?text=${encodeURIComponent(defaultMsg)}`;

      }

                </button>

    function ShopView({ products, selectedCategory, setSelectedCategory, addToCart, setQuickViewProduct, offersOnly }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('default');
      const filteredProducts = useMemo(() => {
        return products
          .filter((p) => {
            if (offersOnly && (!p.oldPrice || p.oldPrice <= p.price)) return false;
            if (selectedCategory !== 'all' && p.category !== selectedCategory) return false;
            if (searchQuery.trim() && !p.name.toLowerCase().includes(searchQuery.toLowerCase()) && !p.description.toLowerCase().includes(searchQuery.toLowerCase())) return false;
            return true;
          })
          .sort((a, b) => sortBy === 'price-asc' ? a.price - b.price : sortBy === 'price-desc' ? b.price - a.price : 0);
      }, [products, offersOnly, selectedCategory, searchQuery, sortBy]);

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
          <div className="bg-gradient-to-l from-rose-50 to-amber-50/50 p-8 rounded-3xl border border-rose-100">
            <h1 className="text-2xl sm:text-4xl font-extrabold text-stone-900">
              {offersOnly ? 'العروض والباقات الخاصة 🎉' : 'متجر الهدايا الكامل 🎁'}
            </h1>
          </div>
          <div className="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4">
            <div className="flex items-center gap-2 overflow-x-auto pb-2 lg:pb-0">
              {CATEGORIES.map((cat) => (
                <button
                  key={cat.id}
                  onClick={() => setSelectedCategory(cat.id)}
                  className={`px-4 py-2.5 rounded-2xl text-sm font-bold whitespace-nowrap transition ${
                    selectedCategory === cat.id ? 'bg-rose-900 text-white' : 'bg-white text-stone-700 border border-stone-200'
                  }`}
                >
                  {cat.icon} {cat.name}
                </button>
              ))}
            </div>
            <div className="flex flex-col sm:flex-row gap-3">
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="ابحث باسم الهدية..."
                className="px-4 py-2.5 rounded-2xl bg-white border border-stone-200 text-sm"
              />
              <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="px-4 py-2.5 rounded-2xl bg-white border border-stone-200 text-sm font-semibold">
                <option value="default">الترتيب الافتراضي</option>
                <option value="price-asc">السعر: من الأقل للأعلى</option>
                <option value="price-desc">السعر: من الأعلى للأقل</option>
              </select>
            </div>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            {filteredProducts.map((product) => (
              <ProductCard key={product.id} product={product} onAddToCart={addToCart} onQuickView={setQuickViewProduct} />
            ))}
          </div>
        </div>
      );
    }

    function ProductCard({ product, onAddToCart, onQuickView }) {
      const discountPercent = product.oldPrice && product.oldPrice > product.price
        ? Math.round(((product.oldPrice - product.price) / product.oldPrice) * 100)
        : null;
      return (
        <div className="bg-white rounded-3xl border border-stone-100 shadow-sm hover:shadow-xl transition overflow-hidden flex flex-col">
          <div className="relative aspect-square overflow-hidden bg-stone-50">
            <img src={product.image} alt={product.name} onClick={() => onQuickView(product)} className="w-full h-full object-cover cursor-pointer hover:scale-105 transition" />
            {discountPercent && (
              <span className="absolute top-3 right-3 px-3 py-1 rounded-full bg-rose-800 text-white text-xs font-extrabold">
                خصم {discountPercent}%
              </span>
            )}
            <span className={`absolute top-3 left-3 px-2.5 py-1 rounded-full text-[11px] font-bold ${product.inStock ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-stone-800 text-white'}`}>
              {product.inStock ? 'in stock' : 'غير متوفر'}
            </span>
          </div>
          <div className="p-5 flex-1 flex flex-col justify-between space-y-4">
            <h3 onClick={() => onQuickView(product)} className="font-bold text-stone-900 text-base line-clamp-2 cursor-pointer hover:text-rose-900">
              {product.name}
            </h3>
            <div className="space-y-3 pt-2 border-t border-stone-100">
              <div className="flex items-baseline gap-2">
                <span className="text-xl font-extrabold text-rose-900">{product.price} ج.م</span>
                {product.oldPrice && <span className="text-sm text-stone-400 line-through">{product.oldPrice} ج.م</span>}
              </div>
              <button
                disabled={!product.inStock}
                onClick={() => onAddToCart(product, 1)}
                className={`w-full py-3 px-4 rounded-2xl font-bold text-sm ${product.inStock ? 'bg-stone-900 hover:bg-rose-900 text-white' : 'bg-stone-100 text-stone-400 cursor-not-allowed'}`}
              >
                {product.inStock ? 'أضف للسلة' : 'غير متوفر حالياً'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function ProductQuickViewModal({ product, onClose, onAddToCart }) {
      const [qty, setQty] = useState(1);
      return (
        <div className="fixed inset-0 z-50 bg-stone-950/60 flex items-center justify-center p-4">
          <div className="bg-white w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2 relative">
            <button onClick={onClose} className="absolute top-4 left-4 z-10 p-2 rounded-full bg-white/90 text-stone-700 shadow">✕</button>
            <img src={product.image} alt={product.name} className="w-full h-full aspect-square object-cover" />
            <div className="p-6 sm:p-8 flex flex-col justify-between space-y-6">
              <div className="space-y-3">
                <span className="inline-block px-3 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700">
                  {product.inStock ? 'in stock' : 'غير متوفر'}
                </span>
                <h2 className="text-xl sm:text-2xl font-extrabold text-stone-900">{product.name}</h2>
                <div className="text-2xl font-extrabold text-rose-900">{product.price} ج.م</div>
                <p className="text-sm text-stone-600 leading-relaxed">{product.description}</p>
              </div>
              <div className="space-y-4">
                <div className="flex items-center gap-3">
                  <button onClick={() => setQty(Math.max(1, qty - 1))} className="px-3 py-1.5 rounded-lg bg-stone-100 font-bold">-</button>
                  <span className="font-bold">{qty}</span>
                  <button onClick={() => setQty(qty + 1)} className="px-3 py-1.5 rounded-lg bg-stone-100 font-bold">+</button>
                </div>
                <button disabled={!product.inStock} onClick={() => onAddToCart(product, qty)} className="w-full py-3.5 rounded-2xl bg-rose-900 hover:bg-rose-950 text-white font-bold">
                  أضف للسلة ({product.price * qty} ج.م)
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function CheckoutView({ cart, cartSubtotal, settings, updateCartQuantity, removeFromCart, handleCreateOrder, navigateTo, getWhatsAppUrl }) {
      const [customerName, setCustomerName] = useState('');
      const [phone, setPhone] = useState('');
      const [governorate, setGovernorate] = useState('الإسكندرية');
      const [address, setAddress] = useState('');
      const [paymentMethod, setPaymentMethod] = useState('الدفع عند الاستلام (COD)');
      const [giftNote, setGiftNote] = useState('');
      const [completedOrder, setCompletedOrder] = useState(null);

      const shippingCost = useMemo(() => {
        const govObj = EGYPT_GOVERNORATES.find((g) => g.name === governorate);
        return Number(settings.shippingRates[govObj ? govObj.region : 'other'] || 60);
      }, [governorate, settings.shippingRates]);

      const grandTotal = cartSubtotal + (cart.length > 0 ? shippingCost : 0);

      const submitOrder = (e) => {
        e.preventDefault();
        if (!customerName.trim() || !phone.trim() || !address.trim()) return;
        const govObj = EGYPT_GOVERNORATES.find((g) => g.name === governorate);
        const order = handleCreateOrder({
          customerName: customerName.trim(),
          phone: phone.trim(),
          governorate,
          shippingRegion: govObj ? govObj.region : 'other',
          address: address.trim(),
          paymentMethod,
          giftNote: giftNote.trim(),
          items: cart.map((item) => ({ id: item.id, name: item.name, price: item.price, quantity: item.quantity })),
          subtotal: cartSubtotal,
          shipping: shippingCost,
          total: grandTotal
        });
        setCompletedOrder(order);
      };

      if (completedOrder) {
        const msg = `أهلاً ${settings.storeName} 🎁، تم تسجيل طلبي بنجاح:\n• رقم الطلب: ${completedOrder.id}\n• الاسم: ${completedOrder.customerName}\n• العنوان: ${completedOrder.governorate} - ${completedOrder.address}\n• الإجمالي: ${completedOrder.total} ج.م`;
        return (
          <div className="max-w-2xl mx-auto px-4 py-14">
            <div className="bg-white rounded-3xl border border-emerald-100 shadow-xl p-8 text-center space-y-5">
              <h1 className="text-2xl sm:text-3xl font-extrabold text-stone-900">شكراً لثقتك في {settings.storeName} 🎁</h1>
              <p className="text-sm text-stone-600">رقم الطلب: <strong className="text-rose-900">{completedOrder.id}</strong></p>
              <div className="flex flex-col sm:flex-row gap-3 justify-center pt-2">
                <a href={getWhatsAppUrl(msg)} target="_blank" rel="noreferrer" className="py-3.5 px-6 rounded-2xl bg-emerald-600 text-white font-bold text-sm">
                  إرسال تفاصيل الطلب على واتساب
                </a>
                <button onClick={() => navigateTo('shop', 'all')} className="py-3.5 px-6 rounded-2xl bg-stone-100 text-stone-800 font-bold text-sm">
                  متابعة التسوق
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (cart.length === 0) {
        return (
          <div className="max-w-xl mx-auto px-4 py-20 text-center space-y-5">
            <h1 className="text-2xl font-extrabold text-stone-900">سلة المشتريات فارغة حالياً</h1>
            <button onClick={() => navigateTo('shop', 'all')} className="px-8 py-3.5 rounded-2xl bg-rose-900 text-white font-bold text-sm">
              الذهاب إلى المتجر
            </button>
          </div>
        );
      }

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 grid grid-cols-1 lg:grid-cols-12 gap-8">
          <form onSubmit={submitOrder} className="lg:col-span-7 bg-white p-6 sm:p-8 rounded-3xl border border-stone-100 space-y-5">
            <h2 className="text-xl font-extrabold text-stone-900">بيانات التوصيل والاستلام</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <input type="text" required value={customerName} onChange={(e) => setCustomerName(e.target.value)} placeholder="الاسم بالكامل *" className="px-4 py-3 rounded-xl border border-stone-200 text-sm" />
              <input type="tel" required dir="ltr" value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="010xxxxxxxx *" className="px-4 py-3 rounded-xl border border-stone-200 text-sm text-right" />
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <select value={governorate} onChange={(e) => setGovernorate(e.target.value)} className="px-4 py-3 rounded-xl border border-stone-200 text-sm bg-white">
                {EGYPT_GOVERNORATES.map((g) => <option key={g.name} value={g.name}>{g.name}</option>)}
              </select>
              <select value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)} className="px-4 py-3 rounded-xl border border-stone-200 text-sm bg-white">
                <option value="الدفع عند الاستلام (COD)">الدفع عند الاستلام (COD)</option>
                <option value="إنستاباي (InstaPay)">إنستاباي (InstaPay)</option>
                <option value="فودافون كاش (Vodafone Cash)">فودافون كاش (Vodafone Cash)</option>
              </select>
            </div>
            <input type="text" required value={address} onChange={(e) => setAddress(e.target.value)} placeholder="العنوان بالتفصيل *" className="w-full px-4 py-3 rounded-xl border border-stone-200 text-sm" />
            <textarea rows={2} value={giftNote} onChange={(e) => setGiftNote(e.target.value)} placeholder="رسالة كارت الإهداء المجاني (اختياري) 💌" className="w-full px-4 py-3 rounded-xl border border-stone-200 text-sm" />
            <button type="submit" className="w-full py-4 rounded-2xl bg-rose-900 hover:bg-rose-950 text-white font-extrabold text-base">
              تأكيد الطلب الآن ({grandTotal} ج.م)
            </button>
          </form>

          <div className="lg:col-span-5 bg-white p-6 sm:p-8 rounded-3xl border border-stone-100 space-y-4">
            <h2 className="text-xl font-extrabold text-stone-900">ملخص الطلب</h2>
            {cart.map((item) => (
              <div key={item.id} className="flex items-center justify-between gap-3 border-b border-stone-100 pb-3">
                <div className="flex-1 min-w-0">
                  <p className="font-bold text-sm truncate">{item.name}</p>
                  <p className="text-xs text-rose-900 font-bold">{item.price * item.quantity} ج.م</p>
                </div>
                <div className="flex items-center gap-1.5">
                  <button type="button" onClick={() => updateCartQuantity(item.id, -1)} className="px-2 py-1 rounded bg-stone-100 font-bold">-</button>
                  <span className="text-xs font-bold">{item.quantity}</span>
                  <button type="button" onClick={() => updateCartQuantity(item.id, 1)} className="px-2 py-1 rounded bg-stone-100 font-bold">+</button>
                  <button type="button" onClick={() => removeFromCart(item.id)} className="px-2 py-1 text-rose-600 text-xs">حذف</button>
                </div>
              </div>
            ))}
            <div className="space-y-2 pt-2 text-sm">
              <div className="flex justify-between"><span>المجموع الفرعي:</span><strong>{cartSubtotal} ج.م</strong></div>
              <div className="flex justify-between"><span>الشحن ({governorate}):</span><strong>{shippingCost} ج.م</strong></div>
              <div className="flex justify-between text-base font-extrabold text-rose-900 pt-2 border-t"><span>الإجمالي:</span><span>{grandTotal} ج.م</span></div>
            </div>
          </div>
        </div>
      );
    }

    function AboutView({ settings, navigateTo }) {
      return (
        <div className="max-w-4xl mx-auto px-4 py-14">
          <div className="bg-white p-8 sm:p-12 rounded-3xl border border-rose-100 space-y-5">
            <h1 className="text-3xl font-extrabold text-stone-900">{settings.storeName} ({settings.arabicName})</h1>
            <p className="text-stone-600 leading-relaxed">
              نختار بعناية هدايا أنيقة تناسب كل مناسبة مع تغليف فاخر وتوصيل سريع لجميع محافظات مصر.
            </p>
            <button onClick={() => navigateTo('shop', 'all')} className="px-7 py-3 rounded-2xl bg-rose-900 text-white font-bold text-sm">تسوق الآن</button>
          </div>
        </div>
      );
    }

    function ContactView({ settings, getWhatsAppUrl }) {
      const [msgName, setMsgName] = useState('');
      const [msgText, setMsgText] = useState('');
      const onSubmit = (e) => {
        e.preventDefault();
        window.open(getWhatsAppUrl(`أهلاً ${settings.storeName}، أنا ${msgName}: ${msgText}`), '_blank');
      };
      return (
        <div className="max-w-4xl mx-auto px-4 py-14 grid grid-cols-1 md:grid-cols-2 gap-8">
          <div className="bg-white p-8 rounded-3xl border border-stone-100 space-y-4">
            <h1 className="text-2xl font-extrabold text-stone-900">تواصل معنا</h1>
            <p className="text-sm text-stone-600">الهاتف / واتساب: {settings.phone}</p>
            <p className="text-sm text-stone-600">{settings.location}</p>
          </div>
          <form onSubmit={onSubmit} className="bg-white p-8 rounded-3xl border border-stone-100 space-y-4">
            <input type="text" required value={msgName} onChange={(e) => setMsgName(e.target.value)} placeholder="الاسم" className="w-full px-4 py-3 rounded-xl border border-stone-200 text-sm" />
            <textarea rows={4} required value={msgText} onChange={(e) => setMsgText(e.target.value)} placeholder="رسالتك..." className="w-full px-4 py-3 rounded-xl border border-stone-200 text-sm" />
            <button type="submit" className="w-full py-3 rounded-2xl bg-rose-900 text-white font-bold text-sm">إرسال عبر واتساب</button>
          </form>
        </div>
      );
    }

    function PoliciesView({ settings, navigateTo }) {
      return (
        <div className="max-w-4xl mx-auto px-4 py-14">
          <div className="bg-white p-8 rounded-3xl border border-stone-100 space-y-4">
            <h1 className="text-2xl font-extrabold text-stone-900">سياسة الشحن والاستبدال</h1>
            <p className="text-sm text-stone-600">
              الشحن: الإسكندرية ({settings.shippingRates.alexandria} ج.م)، القاهرة والجيزة ({settings.shippingRates.cairoGiza} ج.م)، باقي المحافظات ({settings.shippingRates.other} ج.م). الاستبدال والاسترجاع خلال 14 يوماً في حالة وجود عيب أو تلف.
            </p>
            <button onClick={() => navigateTo('shop', 'all')} className="px-6 py-2.5 rounded-xl bg-rose-900 text-white text-sm font-bold">العودة للمتجر</button>
          </div>
        </div>
      );
    }

    function AdminLoginView({ settings, onSuccess, onBack }) {
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const handleLogin = (e) => {
        e.preventDefault();
        if (password === ADMIN_PASSCODE || password === '123456') onSuccess();
        else setError('كلمة المرور غير صحيحة');
      };
      return (
        <div dir="rtl" className="min-h-screen bg-stone-100 flex items-center justify-center p-4">
          <div className="bg-white w-full max-w-md rounded-3xl shadow-xl p-8 space-y-5">
            <h1 className="text-2xl font-extrabold text-center text-stone-900">لوحة تحكم {settings.storeName}</h1>
            {error && <p className="text-xs font-bold text-rose-700 text-center bg-rose-50 p-2.5 rounded-xl">{error}</p>}
            <form onSubmit={handleLogin} className="space-y-4">
              <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} placeholder="كلمة المرور" className="w-full px-4 py-3 rounded-xl border border-stone-200" />
              <button type="submit" className="w-full py-3 rounded-xl bg-rose-900 text-white font-bold text-sm">دخول</button>
            </form>
            <button onClick={onBack} className="w-full text-xs text-stone-500 hover:text-stone-800">العودة للموقع</button>
          </div>
        </div>
      );
    }

    function AdminDashboardView({ settings, setSettings, products, setProducts, orders, setOrders, customers, syncStatus, onLogout, onVisitStore, showToast, toastMessage }) {
      const [activeTab, setActiveTab] = useState('overview');
      const [cloudInput, setCloudInput] = useState(settings.cloudSyncUrl || '');

      const totalRevenue = useMemo(() => orders.filter((o) => o.status !== 'ملغي').reduce((s, o) => s + o.total, 0), [orders]);

      return (
        <div dir="rtl" className="min-h-screen bg-stone-50 flex flex-col lg:flex-row">
          <aside className="w-full lg:w-64 bg-stone-950 text-stone-300 p-4 flex lg:flex-col justify-between gap-4">
            <div className="flex lg:flex-col gap-2 overflow-x-auto">
              {[
                { id: 'overview', label: 'نظرة عامة' },
                { id: 'products', label: 'المنتجات' },
                { id: 'orders', label: 'الطلبات' },
                { id: 'customers', label: 'العملاء' },
                { id: 'cloud', label: 'الربط السحابي' }
              ].map((t) => (
                <button key={t.id} onClick={() => setActiveTab(t.id)} className={`px-4 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap text-right ${activeTab === t.id ? 'bg-rose-900 text-white' : 'hover:bg-stone-900'}`}>
                  {t.label}
                </button>
              ))}
            </div>
            <div className="flex lg:flex-col gap-2">
              <button onClick={onVisitStore} className="px-4 py-2 rounded-xl bg-stone-900 text-xs font-bold">معاينة المتجر</button>
              <button onClick={onLogout} className="px-4 py-2 rounded-xl bg-rose-950 text-rose-200 text-xs font-bold">خروج</button>
            </div>
          </aside>

          <main className="flex-1 p-6 sm:p-8 space-y-6">
            <div className="flex items-center justify-between">
              <h1 className="text-2xl font-extrabold text-stone-900">إدارة {settings.storeName}</h1>
              <span className="text-xs font-bold px-3 py-1 rounded-full bg-white border border-stone-200">{syncStatus}</span>
            </div>

            {activeTab === 'overview' && (
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div className="bg-white p-5 rounded-2xl border"><p className="text-xs text-stone-500">إجمالي المبيعات</p><p className="text-2xl font-extrabold text-rose-900 mt-1">{totalRevenue} ج.م</p></div>
                <div className="bg-white p-5 rounded-2xl border"><p className="text-xs text-stone-500">الطلبات</p><p className="text-2xl font-extrabold mt-1">{orders.length}</p></div>
                <div className="bg-white p-5 rounded-2xl border"><p className="text-xs text-stone-500">العملاء</p><p className="text-2xl font-extrabold text-emerald-700 mt-1">{customers.length}</p></div>
              </div>
            )}

            {activeTab === 'products' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {products.map((p) => (
                  <div key={p.id} className="bg-white p-4 rounded-2xl border space-y-2">
                    <img src={p.image} alt={p.name} className="w-full h-36 object-cover rounded-xl" />
                    <h3 className="font-bold text-sm">{p.name}</h3>
                    <p className="text-sm font-extrabold text-rose-900">{p.price} ج.م — <span className="text-xs text-emerald-700">{p.inStock ? 'in stock' : 'غير متوفر'}</span></p>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'orders' && (
              <div className="space-y-3">
                {orders.map((o) => (
                  <div key={o.id} className="bg-white p-4 rounded-2xl border flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <p className="font-bold text-sm">{o.id} — {o.customerName} ({o.phone})</p>
                      <p className="text-xs text-stone-500">{o.governorate} - {o.address} | الإجمالي: {o.total} ج.م</p>
                    </div>
                    <select
                      value={o.status}
                      onChange={(e) => {
                        setOrders((prev) => prev.map((item) => item.id === o.id ? { ...item, status: e.target.value } : item));
                        showToast('تم تحديث حالة الطلب');
                      }}
                      className="px-3 py-1.5 rounded-xl border text-xs font-bold bg-stone-50"
                    >
                      <option value="جديد">جديد</option>
                      <option value="قيد التجهيز">قيد التجهيز</option>
                      <option value="تم الشحن">تم الشحن</option>
                      <option value="تم التسليم">تم التسليم</option>
                      <option value="ملغي">ملغي</option>
                    </select>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'customers' && (
              <div className="bg-white rounded-2xl border overflow-x-auto">
                <table className="w-full text-right text-sm">
                  <thead className="bg-stone-50 text-xs">
                    <tr><th className="p-3">الاسم</th><th className="p-3">الموبايل</th><th className="p-3">العنوان</th><th className="p-3">الطلبات</th><th className="p-3">الإجمالي</th></tr>
                  </thead>
                  <tbody className="divide-y">
                    {customers.map((c, idx) => (
                      <tr key={idx}>
                        <td className="p-3 font-bold">{c.name}</td>
                        <td className="p-3 font-mono" dir="ltr">{c.phone}</td>
                        <td className="p-3 text-xs">{c.governorate} - {c.address}</td>
                        <td className="p-3 font-bold">{c.ordersCount}</td>
                        <td className="p-3 font-extrabold text-emerald-700">{c.totalSpent} ج.م</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {activeTab === 'cloud' && (
              <div className="bg-white p-6 rounded-2xl border max-w-2xl space-y-4">
                <h2 className="font-extrabold text-base">ربط المزامنة السحابية</h2>
                <p className="text-xs text-stone-500 leading-relaxed">
                  أدخل رابط نقطة النهاية السحابية (API / Apps Script / JSON endpoint) التي تقرأ البيانات عبر GET وتحفظ التحديثات عبر POST لمزامنة المنتجات والطلبات والعملاء عبر الأجهزة.
                </p>
                <input
                  type="url"
                  dir="ltr"
                  value={cloudInput}
                  onChange={(e) => setCloudInput(e.target.value)}
                  placeholder="https://script.google.com/macros/s/.../exec"
                  className="w-full px-4 py-2.5 rounded-xl border text-sm text-left"
                />
                <button
                  onClick={() => {
                    setSettings((prev) => ({ ...prev, cloudSyncUrl: cloudInput.trim() }));
                    showToast('تم حفظ رابط المزامنة السحابية');
                  }}
                  className="px-6 py-2.5 rounded-xl bg-rose-900 text-white text-xs font-bold"
                >
                  حفظ وتفعيل المزامنة
                </button>
              </div>
            )}
          </main>

          {toastMessage && (
            <div className="fixed bottom-6 left-6 bg-stone-900 text-white px-4 py-3 rounded-2xl text-xs font-bold shadow-xl">
              {toastMessage}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
