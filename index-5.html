    async function cloudPull(url) {
      const clean = (url || '').trim();
      if (!clean) return null;
      const sep = clean.includes('?') ? '&' : '?';
      const res = await fetch(`${clean}${sep}t=${Date.now()}`, { method: 'GET', cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    }

    async function cloudPush(url, payload) {
      const clean = (url || '').trim();
      if (!clean) return false;
      try {
        const res = await fetch(clean, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        return res.ok;
      } catch {
        await fetch(clean, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        return true;
      }
    }

      const [cart, setCart] = useState(() => {

      const [filterDrawerOpen, setFilterDrawerOpen] = useState(false);
      const [availabilityFilter, setAvailabilityFilter] = useState('all'); // all | instock | outofstock

      const [maxPrice, setMaxPrice] = useState('');
      const [sortBy, setSortBy] = useState('featured'); // featured | best-selling | price-asc | price-desc | newest

      // السلة الجانبية (Slide-over Cart Drawer) + نافذة تفاصيل المنتج السريعة
      const [cartDrawerOpen, setCartDrawerOpen] = useState(false);

      // الإدارة والفواتير
      const [isAdmin, setIsAdmin] = useState(false);

      const [announcementIdx, setAnnouncementIdx] = useState(0);
      const [syncStatus, setSyncStatus] = useState('محلي');

        try { localStorage.setItem('farafero_editorial_settings_v1', JSON.stringify(settings)); } catch {}

      useEffect(() => {
        if (!settings.announcements || settings.announcements.length <= 1) return;
        const timer = setInterval(() => {
          setAnnouncementIdx(prev => (prev + 1) % settings.announcements.length);
        }, 4000);
        return () => clearInterval(timer);
      }, [settings.announcements]);

      const syncCloudNow = async () => {
        if (!settings.cloudSyncUrl) {
          setSyncStatus('محلي');
          return;
        }
        setSyncStatus('جاري المزامنة...');
        try {
          const remote = await cloudPull(settings.cloudSyncUrl);
          if (remote && typeof remote === 'object') {
            skipNextPush.current = true;
            if (Array.isArray(remote.products) && remote.products.length) setProducts(remote.products);
            if (Array.isArray(remote.orders) && remote.orders.length) setOrders(remote.orders);
            if (Array.isArray(remote.sliders) && remote.sliders.length) setSliders(remote.sliders);

          await cloudPush(settings.cloudSyncUrl, { products, orders, sliders, settings: { ...settings, cloudSyncUrl: undefined } });
          setSyncStatus('متصل سحابياً');
        } catch {
          setSyncStatus('وضع محلي');

      const categories = useMemo(() => ['الكل', ...new Set(products.map(p => p.category).filter(Boolean))], [products]);

      const highestPriceInStore = useMemo(() => {
        if (!products.length) return 1000;

      }, [products]);

      // تطبيق الفلاتر والترتيب
      const filteredAndSortedProducts = useMemo(() => {
        let list = products.filter(p => {
          if (selectedCategory !== 'الكل' && p.category !== selectedCategory) return false;
          if (availabilityFilter === 'instock' && !p.inStock) return false;
          if (availabilityFilter === 'outofstock' && p.inStock) return false;
          if (selectedOptionFilter !== 'all' && !(p.options || []).includes(selectedOptionFilter)) return false;
          if (minPrice !== '' && Number(p.price) < Number(minPrice)) return false;
          if (maxPrice !== '' && Number(p.price) > Number(maxPrice)) return false;

          if (q) {
            const match =
              p.name.toLowerCase().includes(q) ||
              (p.arabicSubtitle || '').toLowerCase().includes(q) ||
              (p.category || '').toLowerCase().includes(q) ||
              (p.description || '').toLowerCase().includes(q);
            if (!match) return false;
          }
          return true;
        });

        const sorted = [...list];
        if (sortBy === 'best-selling') {
          sorted.sort((a, b) => (b.isBestSeller ? 1 : 0) - (a.isBestSeller ? 1 : 0));
        } else if (sortBy === 'price-asc') {
          sorted.sort((a, b) => a.price - b.price);
        } else if (sortBy === 'price-desc') {
          sorted.sort((a, b) => b.price - a.price);
        } else if (sortBy === 'newest') {
          sorted.reverse();
        }
        return sorted;
      }, [products, selectedCategory, availabilityFilter, selectedOptionFilter, minPrice, maxPrice, searchQuery, sortBy]);

      const resetAllFilters = () => {
        setAvailabilityFilter('all');
        setSelectedOptionFilter('all');
        setMinPrice('');
        setMaxPrice('');
        setSearchQuery('');
      };

      const activeFiltersCount =
        (availabilityFilter !== 'all' ? 1 : 0) +
        (selectedOptionFilter !== 'all' ? 1 : 0) +
        (minPrice !== '' ? 1 : 0) +
        (maxPrice !== '' ? 1 : 0);

      // إدارة السلة
      const addToCart = (product, chosenOption) => {
        if (!product.inStock) return;
        const opt = chosenOption || (product.options && product.options[0]) || 'قياسي';
        const cartKey = `${product.id}__${opt}`;
        setCart(prev => {
          const exists = prev.find(i => i.cartKey === cartKey);
          if (exists) {
            return prev.map(i => i.cartKey === cartKey ? { ...i, quantity: i.quantity + 1 } : i);
          }
          return [
            ...prev,
            {
              cartKey,
              id: product.id,
              name: product.name,
              arabicSubtitle: product.arabicSubtitle,
              price: product.price,
              image: product.image,
              selectedOption: opt,
              quantity: 1
            }
          ];
        });
        setLastAddedItem({ name: product.name, option: opt, image: product.image });
        setCartDrawerOpen(true);
      };

      const updateCartQty = (cartKey, delta) => {
        setCart(prev =>
          prev
            .map(i => (i.cartKey === cartKey ? { ...i, quantity: i.quantity + delta } : i))
            .filter(i => i.quantity > 0)
        );
      };

      const removeFromCart = (cartKey) => {
        setCart(prev => prev.filter(i => i.cartKey !== cartKey));
      };

      const cartSubtotal = useMemo(() => cart.reduce((sum, i) => sum + i.price * i.quantity, 0), [cart]);
      const cartCount = useMemo(() => cart.reduce((sum, i) => sum + i.quantity, 0), [cart]);

      // تسجيل العميل تلقائياً عند إنشاء طلب الشراء فقط
      const customers = useMemo(() => {
        const map = new Map();
        orders.forEach(o => {
          const key = (o.phone || '').trim();
          if (!key) return;
          if (!map.has(key)) {
            map.set(key, {
              name: o.customerName,
              phone: o.phone,
              governorate: o.governorate,
              address: o.address,
              ordersCount: 1,
              totalSpent: o.total
            });
          } else {
            const cur = map.get(key);
            cur.ordersCount += 1;
            cur.totalSpent += o.total;
          }
        });
        return Array.from(map.values());
      }, [orders]);

      const handleCompleteOrder = (checkoutData) => {
        const newOrder = {
          id: 'FRF-' + Math.floor(100000 + Math.random() * 900000),
          date: new Date().toLocaleString('ar-EG', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
          }),
          items: cart,
          subtotal: cartSubtotal,
          ...checkoutData,
          status: 'جديد'
        };
        setOrders(prev => [newOrder, ...prev]);
        setCart([]);
        setCurrentInvoice(newOrder);
        setView('invoice');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // عرض لوحة التحكم أو تسجيل الدخول
      if (view === 'admin-login') {
        return (
          <AdminLogin
            storeName={settings.storeName}
            onSuccess={() => { setIsAdmin(true); setView('admin'); }}
            onBack={() => setView('collection')}
          />
        );
      }

      if (view === 'admin' && isAdmin) {
        return (
          <AdminPanel
            settings={settings}
            setSettings={setSettings}
            products={products}
            setProducts={setProducts}
            sliders={sliders}
            setSliders={setSliders}
            orders={orders}
            setOrders={setOrders}
            customers={customers}
            syncStatus={syncStatus}
            onSyncNow={syncCloudNow}
            onBackToStore={() => setView('collection')}
            onLogout={() => { setIsAdmin(false); setView('collection'); }}
          />
        );
      }

      if (view === 'invoice' && currentInvoice) {
        return (
          <InvoicePage
            settings={settings}
            invoice={currentInvoice}
            onContinueShopping={() => setView('collection')}
          />
        );
      }

      return (

          {/* 1. شريط الإعلانات العلوي (Announcement Bar) */}
          <div className="bg-stone-950 text-white text-xs py-2.5 px-4 border-b border-stone-800">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              <button
                onClick={() => setAnnouncementIdx(prev => (prev - 1 + settings.announcements.length) % settings.announcements.length)}
                className="text-stone-400 hover:text-white px-2"
                aria-label="السابق"
              >
                ›
              </button>
              <p className="text-center font-medium tracking-wide truncate">
                {settings.announcements[announcementIdx]}
              </p>
              <button
                onClick={() => setAnnouncementIdx(prev => (prev + 1) % settings.announcements.length)}
                className="text-stone-400 hover:text-white px-2"
                aria-label="التالي"

                ‹
              </button>

                </button>

                <nav className="hidden lg:flex items-center gap-6 text-sm font-semibold text-stone-700">
                  <button

                    الرئيسية
                  </button>
                  {categories.filter(c => c !== 'الكل').slice(0, 4).map(cat => (
                    <button
                      key={cat}
                      onClick={() => { setSelectedCategory(cat); setView('collection'); }}
                      className={`hover:text-stone-950 transition pb-1 ${view === 'collection' && selectedCategory === cat ? 'border-b-2 border-stone-900 text-stone-950' : ''}`}
                    >
                      {cat}
                    </button>
                  ))}
                </nav>
              </div>

              {/* المنتصف: اللوجو */}
              <div className="text-center">
                <button onClick={() => { setSelectedCategory('الكل'); setView('collection'); }} className="group">
                  <div className="font-editorial text-xl sm:text-2xl lg:text-3xl font-bold tracking-wider text-stone-950 uppercase">
                    {settings.storeName}
                  </div>
                  <div className="text-[10px] tracking-[0.22em] text-stone-400 uppercase hidden sm:block">
                    {settings.tagline}
                  </div>
                </button>
              </div>

                      </svg>
                      <span>فلترة وترتيب {activeFiltersCount > 0 ? `(${activeFiltersCount})` : ''}</span>
                    </button>

                    {/* فلاتر سريعة على الديسكتوب */}
                    <div className="hidden md:flex items-center gap-3 border-r border-stone-200 pr-4">
                      <select
                        value={availabilityFilter}
                        onChange={e => setAvailabilityFilter(e.target.value)}
                        className="bg-transparent font-semibold text-stone-700 focus:outline-none cursor-pointer"
                      >
                        <option value="all">التوفر: الكل</option>
                        <option value="instock">متوفر (in stock)</option>
                        <option value="outofstock">غير متوفر</option>
                      </select>

                      <select
                        value={selectedOptionFilter}
                        onChange={e => setSelectedOptionFilter(e.target.value)}
                        className="bg-transparent font-semibold text-stone-700 focus:outline-none cursor-pointer"
                      >
                        <option value="all">النوع / اللون: الكل</option>
                        {allAvailableOptions.map(opt => (
                          <option key={opt} value={opt}>{opt}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div className="flex items-center gap-4">
                    <div className="flex items-center gap-2">
                      <label className="text-stone-500 hidden sm:inline">ترتيب حسب:</label>
                      <select
                        value={sortBy}
                        onChange={e => setSortBy(e.target.value)}
                        className="bg-transparent font-bold text-stone-800 focus:outline-none cursor-pointer"
                      >
                        <option value="featured">المميز (Featured)</option>
                        <option value="best-selling">الأكثر مبيعاً (Best selling)</option>
                        <option value="price-asc">السعر: من الأقل للأعلى</option>
                        <option value="price-desc">السعر: من الأعلى للأقل</option>
                        <option value="newest">الأحدث (Date, new to old)</option>
                      </select>
                    </div>

                    <span className="text-stone-500 font-semibold">
                      {filteredAndSortedProducts.length} منتج
                    </span>
                  </div>
                </div>

                {/* شارات الفلاتر النشطة */}
                {activeFiltersCount > 0 && (
                  <div className="flex flex-wrap items-center gap-2 mb-6">
                    {availabilityFilter !== 'all' && (
                      <button
                        onClick={() => setAvailabilityFilter('all')}
                        className="px-3 py-1 rounded-full bg-stone-100 text-xs font-bold text-stone-800 hover:bg-stone-200"
                      >
                        {availabilityFilter === 'instock' ? 'in stock' : 'غير متوفر'} ✕
                      </button>
                    )}
                    {selectedOptionFilter !== 'all' && (
                      <button
                        onClick={() => setSelectedOptionFilter('all')}
                        className="px-3 py-1 rounded-full bg-stone-100 text-xs font-bold text-stone-800 hover:bg-stone-200"
                      >
                        {selectedOptionFilter} ✕
                      </button>
                    )}
                    {(minPrice !== '' || maxPrice !== '') && (
                      <button
                        onClick={() => { setMinPrice(''); setMaxPrice(''); }}
                        className="px-3 py-1 rounded-full bg-stone-100 text-xs font-bold text-stone-800 hover:bg-stone-200"
                      >

                      </button>
                    )}
                    <button onClick={resetAllFilters} className="text-xs font-bold underline text-stone-600 hover:text-stone-950 mr-2">
                      مسح الكل
                    </button>
                  </div>
                )}

                {/* 6. شبكة المنتجات (Product Grid) */}
                {filteredAndSortedProducts.length === 0 ? (
                  <div className="py-20 text-center border border-stone-200 bg-stone-50/50 space-y-3">
                    <p className="text-base font-bold text-stone-800">لا توجد منتجات مطابقة للفلاتر الحالية</p>
                    <button onClick={resetAllFilters} className="px-5 py-2.5 bg-stone-900 text-white text-xs font-bold">
                      إعادة ضبط الفلاتر
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-4 gap-y-8 sm:gap-x-6 sm:gap-y-10">
                    {filteredAndSortedProducts.map(product => (
                      <EditorialProductCard
                        key={product.id}
                        product={product}
                        onAddToCart={addToCart}
                        onQuickView={() => setQuickViewProduct(product)}
                      />
                    ))}
                  </div>
                )}
              </section>
            </main>
          )}

          {/* صفحة إتمام الطلب (Checkout) */}
          {view === 'checkout' && (
            <CheckoutPage
              cart={cart}
              cartSubtotal={cartSubtotal}
              settings={settings}
              updateCartQty={updateCartQty}
              removeFromCart={removeFromCart}
              onBackToStore={() => setView('collection')}
              onSubmitOrder={handleCompleteOrder}
            />
          )}

          {/* صفحة السياسات (Exchange / Shipping) */}
          {view === 'policy' && (
            <PolicyPage
              type={policyType}
              settings={settings}
              onBack={() => setView('collection')}
            />
          )}

          {/* 7. الفوتر الاحترافي المطابق للموقع */}
          <footer className="bg-stone-100 border-t border-stone-200 text-stone-700 mt-auto">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-12 grid grid-cols-1 md:grid-cols-4 gap-8 text-sm">
              <div className="space-y-3">
                <div className="font-editorial text-xl font-bold text-stone-950 uppercase">{settings.storeName}</div>
                <p className="text-xs text-stone-500 leading-relaxed">
                  هدايا مختارة بعناية وتغليف فاخر يليق بكل مناسبة سعيدة. توصيل سريع وآمن لجميع محافظات مصر.
                </p>
                <p className="text-xs font-bold text-stone-800">واتساب وخدمة العملاء: {settings.whatsapp}</p>
              </div>

              <div className="space-y-2.5">
                <h3 className="font-bold text-stone-950 text-xs uppercase tracking-wider">الأقسام (Shop)</h3>
                <ul className="space-y-1.5 text-xs text-stone-600">
                  {categories.map(cat => (
                    <li key={cat}>
                      <button onClick={() => { setSelectedCategory(cat); setView('collection'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="hover:text-stone-950">

                    </button>

                        { id: 'all', label: 'الكل' },
                        { id: 'instock', label: 'in stock (متوفر حالياً)' },
                        { id: 'outofstock', label: 'غير متوفر' }
                      ].map(opt => (
                        <label key={opt.id} className="flex items-center gap-2.5 cursor-pointer">
                          <input
                            type="radio"
                            name="avail"
                            checked={availabilityFilter === opt.id}
                            onChange={() => setAvailabilityFilter(opt.id)}
                            className="accent-stone-900"
                          />
                          <span>{opt.label}</span>
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* فلتر السعر */}
                  <div className="space-y-2.5 border-b pb-5">
                    <div className="flex items-center justify-between">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-stone-500">السعر (Price)</h3>
                      <span className="text-[11px] text-stone-400">أعلى سعر {highestPriceInStore} ج.م</span>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <input
                        type="number"
                        placeholder="من (ج.م)"
                        value={minPrice}
                        onChange={e => setMinPrice(e.target.value)}
                        className="px-3 py-2 border border-stone-300 text-xs"
                      />
                      <input
                        type="number"
                        placeholder="إلى (ج.م)"
                        value={maxPrice}
                        onChange={e => setMaxPrice(e.target.value)}
                        className="px-3 py-2 border border-stone-300 text-xs"
                      />
                    </div>
                  </div>

                  {/* فلتر اللون / النوع */}
                  <div className="space-y-2.5 border-b pb-5">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-stone-500">النوع / اللون</h3>
                    <select
                      value={selectedOptionFilter}
                      onChange={e => setSelectedOptionFilter(e.target.value)}
                      className="w-full px-3 py-2 border border-stone-300 text-xs bg-white font-semibold"
                    >
                      <option value="all">جميع الأنواع والألوان</option>
                      {allAvailableOptions.map(opt => (
                        <option key={opt} value={opt}>{opt}</option>
                      ))}
                    </select>
                  </div>

                  {/* الترتيب */}
                  <div className="space-y-2.5">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-stone-500">ترتيب حسب (Sort by)</h3>
                    <select
                      value={sortBy}
                      onChange={e => setSortBy(e.target.value)}
                      className="w-full px-3 py-2 border border-stone-300 text-xs bg-white font-semibold"
                    >
                      <option value="featured">المميز (Featured)</option>
                      <option value="best-selling">الأكثر مبيعاً (Best selling)</option>
                      <option value="price-asc">السعر: من الأقل للأعلى</option>
                      <option value="price-desc">السعر: من الأعلى للأقل</option>
                      <option value="newest">الأحدث</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2 pt-4 border-t mt-6">
                  <button onClick={resetAllFilters} className="py-2.5 border border-stone-300 text-xs font-bold">
                    مسح الكل
                  </button>
                  <button onClick={() => setFilterDrawerOpen(false)} className="py-2.5 bg-stone-900 text-white text-xs font-bold">
                    عرض النتائج
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* السلة الجانبية (Shopify-style Slide-over Cart Drawer) */}
          {cartDrawerOpen && (
            <div className="fixed inset-0 z-50 flex justify-end">
              <div className="fixed inset-0 bg-black/45" onClick={() => setCartDrawerOpen(false)} />
              <div className="relative bg-white w-96 max-w-[92vw] h-full flex flex-col justify-between z-10 shadow-2xl">
                <div className="p-5 border-b border-stone-200 flex items-center justify-between">
                  <div>
                    <h2 className="font-bold text-base">حقيبة التسوق ({cartCount})</h2>
                    {lastAddedItem && (
                      <p className="text-[11px] text-emerald-700 font-bold mt-0.5">
                        ✓ تمت إضافة "{lastAddedItem.name}" للسلة
                      </p>
                    )}
                  </div>
                  <button onClick={() => setCartDrawerOpen(false)} className="text-lg font-bold p-1">✕</button>
                </div>

                <div className="flex-1 overflow-y-auto p-5 space-y-4">
                  {cart.length === 0 ? (
                    <div className="text-center py-16 space-y-3">
                      <p className="text-sm font-bold text-stone-500">حقيبة التسوق فارغة حالياً</p>
                      <button
                        onClick={() => setCartDrawerOpen(false)}
                        className="px-5 py-2.5 bg-stone-900 text-white text-xs font-bold"
                      >
                        متابعة التسوق
                      </button>
                    </div>
                  ) : (
                    cart.map(item => (
                      <div key={item.cartKey} className="flex gap-3.5 border-b border-stone-100 pb-4">
                        <img src={item.image} alt={item.name} className="w-20 h-24 object-cover bg-stone-100 shrink-0" />
                        <div className="flex-1 min-w-0 flex flex-col justify-between">
                          <div>
                            <h3 className="text-xs font-bold text-stone-900 line-clamp-2">{item.name}</h3>
                            <p className="text-[11px] text-stone-500 mt-0.5">الاختيار: {item.selectedOption}</p>
                            <p className="text-xs font-bold text-stone-900 mt-1">{item.price} ج.م</p>
                          </div>
                          <div className="flex items-center justify-between mt-2">
                            <div className="inline-flex items-center border border-stone-300">
                              <button onClick={() => updateCartQty(item.cartKey, -1)} className="px-2.5 py-0.5 text-xs font-bold">-</button>
                              <span className="px-2.5 text-xs font-bold">{item.quantity}</span>
                              <button onClick={() => updateCartQty(item.cartKey, 1)} className="px-2.5 py-0.5 text-xs font-bold">+</button>
                            </div>
                            <button onClick={() => removeFromCart(item.cartKey)} className="text-[11px] underline text-stone-500 hover:text-stone-900">
                              حذف
                            </button>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="p-5 border-t border-stone-200 bg-stone-50 space-y-3">
                    <div className="flex items-center justify-between text-sm font-bold">
                      <span>المجموع الفرعي</span>
                      <span>{cartSubtotal} ج.م</span>
                    </div>
                    <p className="text-[11px] text-stone-500">يتم احتساب مصاريف الشحن حسب المحافظة في الخطوة التالية.</p>
                    <button
                      onClick={() => { setCartDrawerOpen(false); setView('checkout'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                      className="w-full py-3 bg-stone-900 hover:bg-stone-800 text-white text-xs sm:text-sm font-bold tracking-wide transition"
                    >
                      إتمام الطلب والدفع (Check out)
                    </button>
                    <button
                      onClick={() => setCartDrawerOpen(false)}
                      className="w-full py-2 text-xs font-bold text-stone-600 hover:text-stone-950 underline"
                    >
                      متابعة التسوق (Continue shopping)
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* نافذة المعاينة السريعة للمنتج (Quick View Modal) */}
          {quickViewProduct && (
            <QuickViewModal
              product={quickViewProduct}
              onClose={() => setQuickViewProduct(null)}
              onAddToCart={(prod, opt) => { addToCart(prod, opt); setQuickViewProduct(null); }}
            />
          )}
        </div>
      );
    }

    // =========================================================================
    // 1. سلايدر الإعلانات العلوي (Hero Slider)
    // =========================================================================
    function HeroBannerSlider({ sliders, onSelectCategory }) {
      const [current, setCurrent] = useState(0);

      useEffect(() => {
        if (!sliders || sliders.length <= 1) return;
        const timer = setInterval(() => {
          setCurrent(prev => (prev + 1) % sliders.length);
        }, 5000);
        return () => clearInterval(timer);
      }, [sliders]);

      const slide = sliders[current] || sliders[0];
      if (!slide) return null;

      return (
        <section className="relative h-[340px] sm:h-[460px] bg-stone-900 overflow-hidden">
          <img
            src={slide.image}
            alt={slide.title}
            className="w-full h-full object-cover opacity-70 transition-all duration-700"
          />
          <div className="absolute inset-0 bg-gradient-to-t from-black/75 via-black/30 to-transparent flex items-end">
            <div className="max-w-7xl mx-auto w-full px-4 sm:px-6 pb-10 sm:pb-14 text-white space-y-3">
              {slide.badge && (
                <span className="inline-block px-3 py-1 bg-white/15 backdrop-blur text-[11px] font-bold tracking-widest uppercase">
                  {slide.badge}
                </span>
              )}
              <h2 className="text-2xl sm:text-4xl lg:text-5xl font-bold max-w-2xl leading-tight">
                {slide.title}
              </h2>
              <p className="text-xs sm:text-base text-stone-200 max-w-xl">
                {slide.subtitle}
              </p>
              <div className="pt-2 flex flex-wrap items-center gap-4">
                <button
                  onClick={() => onSelectCategory(slide.targetCategory || 'الكل')}
                  className="px-6 py-3 bg-white text-stone-950 hover:bg-stone-200 text-xs sm:text-sm font-bold transition"
                >
                  {slide.ctaText || 'تسوق الآن'}
                </button>
                {sliders.length > 1 && (
                  <div className="flex items-center gap-2">
                    {sliders.map((s, idx) => (
                      <button
                        key={s.id}
                        onClick={() => setCurrent(idx)}
                        className={`h-2 transition-all ${idx === current ? 'w-8 bg-white' : 'w-2 bg-white/50'}`}
                        aria-label={`بانر ${idx + 1}`}
                      />
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        </section>
      );
    }

    // =========================================================================
    // 2. كارت المنتج بستايل PJsByElegant (صورة طولية + اختيار النوع + Sale + in stock)
    // =========================================================================
    function EditorialProductCard({ product, onAddToCart, onQuickView }) {
      const options = product.options && product.options.length > 0 ? product.options : ['قياسي'];
      const [selectedOpt, setSelectedOpt] = useState(options[0]);
      const [hovered, setHovered] = useState(false);

      const displayImage = hovered && product.hoverImage ? product.hoverImage : product.image;

      return (
        <div
          className="group flex flex-col justify-between bg-white"
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
        >
          <div>
            {/* صورة المنتج الطولية */}
            <div className="relative aspect-[3/4] bg-stone-100 overflow-hidden mb-3 cursor-pointer" onClick={onQuickView}>
              <img
                src={displayImage}
                alt={product.name}
                className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
              />

              {/* شارة Sale أو Sold out */}
              <div className="absolute top-2.5 right-2.5 flex flex-col gap-1.5">
                {!product.inStock ? (
                  <span className="px-2.5 py-0.5 bg-stone-900 text-white text-[11px] font-bold">
                    Sold out
                  </span>
                ) : product.oldPrice && product.oldPrice > product.price ? (
                  <span className="px-2.5 py-0.5 bg-rose-800 text-white text-[11px] font-bold">
                    Sale
                  </span>
                ) : null}
              </div>

              {/* حالة التوفر in stock */}
              {product.inStock && (
                <span className="absolute bottom-2.5 left-2.5 px-2 py-0.5 bg-white/90 backdrop-blur text-emerald-800 text-[10px] font-bold">
                  in stock
                </span>
              )}
            </div>

            {/* اسم المنتج والوصف */}
            <div className="space-y-1">
              <h3
                onClick={onQuickView}
                className="text-xs sm:text-sm font-bold text-stone-900 hover:underline cursor-pointer line-clamp-2 leading-snug"
              >
                {product.name}
              </h3>
              {product.arabicSubtitle && (
                <p className="text-[11px] text-stone-500 line-clamp-1">{product.arabicSubtitle}</p>
              )}

              {/* السعر قبل وبعد الخصم */}
              <div className="flex flex-wrap items-baseline gap-2 pt-0.5 text-xs sm:text-sm">
                {product.oldPrice && product.oldPrice > product.price && (
                  <span className="text-stone-400 line-through text-xs">{product.oldPrice.toFixed(2)} EGP</span>
                )}
                <span className="font-bold text-stone-950">{Number(product.price).toFixed(2)} EGP</span>
              </div>
            </div>
          </div>

          {/* اختيار النوع / اللون + زر الإضافة للسلة */}
          <div className="mt-3 space-y-2.5">
            {options.length > 1 && (
              <div className="flex flex-wrap gap-1">
                {options.map(opt => (
                  <button
                    key={opt}
                    type="button"
                    onClick={() => setSelectedOpt(opt)}
                    className={`px-2 py-0.5 text-[10px] font-semibold border transition ${
                      selectedOpt === opt
                        ? 'border-stone-900 bg-stone-900 text-white'
                        : 'border-stone-300 text-stone-700 hover:border-stone-900'
                    }`}
                  >
                    {opt}
                  </button>
                ))}
              </div>
            )}

            <button
              type="button"
              disabled={!product.inStock}
              onClick={() => onAddToCart(product, selectedOpt)}
              className={`w-full py-2.5 text-xs font-bold border transition ${
                product.inStock
                  ? 'border-stone-900 text-stone-900 hover:bg-stone-900 hover:text-white'
                  : 'border-stone-200 bg-stone-100 text-stone-400 cursor-not-allowed'
              }`}
            >
              {product.inStock ? 'أضف للسلة (Add to cart)' : 'Sold out'}
            </button>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 3. نافذة المعاينة السريعة (Quick View)
    // =========================================================================
    function QuickViewModal({ product, onClose, onAddToCart }) {
      const options = product.options && product.options.length > 0 ? product.options : ['قياسي'];
      const [selectedOpt, setSelectedOpt] = useState(options[0]);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="fixed inset-0 bg-black/50" onClick={onClose} />
          <div className="relative bg-white max-w-3xl w-full grid grid-cols-1 md:grid-cols-2 overflow-hidden shadow-2xl z-10 max-h-[90vh] overflow-y-auto">
            <button onClick={onClose} className="absolute top-3 left-3 bg-white/90 w-8 h-8 flex items-center justify-center font-bold text-sm z-10">
              ✕
            </button>
            <div className="bg-stone-100 aspect-[3/4] md:aspect-auto">
              <img src={product.image} alt={product.name} className="w-full h-full object-cover" />
            </div>
            <div className="p-6 sm:p-8 flex flex-col justify-between space-y-5">
              <div className="space-y-3">
                <span className="text-[11px] font-bold uppercase tracking-wider text-stone-400">{product.category}</span>
                <h2 className="text-xl font-bold text-stone-950">{product.name}</h2>
                {product.arabicSubtitle && <p className="text-xs font-semibold text-stone-600">{product.arabicSubtitle}</p>}
                <div className="flex items-baseline gap-2.5">
                  <span className="text-lg font-black text-stone-950">{Number(product.price).toFixed(2)} EGP</span>
                  {product.oldPrice && <span className="text-xs text-stone-400 line-through">{Number(product.oldPrice).toFixed(2)} EGP</span>}
                </div>
                <p className="text-xs text-stone-600 leading-relaxed pt-2 border-t">{product.description}</p>

                {options.length > 0 && (
                  <div className="pt-2 space-y-2">
                    <label className="block text-xs font-bold text-stone-800">{product.optionsLabel || 'الاختيار'}: {selectedOpt}</label>
                    <div className="flex flex-wrap gap-2">
                      {options.map(opt => (
                        <button
                          key={opt}
                          onClick={() => setSelectedOpt(opt)}
                          className={`px-3 py-1.5 text-xs font-bold border ${
                            selectedOpt === opt ? 'bg-stone-900 text-white border-stone-900' : 'border-stone-300 text-stone-700'
                          }`}
                        >
                          {opt}
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </div>

              <button
                disabled={!product.inStock}
                onClick={() => onAddToCart(product, selectedOpt)}
                className={`w-full py-3.5 text-xs sm:text-sm font-bold ${
                  product.inStock ? 'bg-stone-900 hover:bg-stone-800 text-white' : 'bg-stone-200 text-stone-400 cursor-not-allowed'
                }`}
              >
                {product.inStock ? 'إضافة إلى حقيبة التسوق' : 'غير متوفر حالياً'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 4. صفحة إتمام الطلب والدفع (27 محافظة + كل طرق الدفع)
    // =========================================================================
    function CheckoutPage({ cart, cartSubtotal, settings, updateCartQty, removeFromCart, onBackToStore, onSubmitOrder }) {
      const govs = Object.keys(settings.shippingRates);
      const [customerName, setCustomerName] = useState('');
      const [phone, setPhone] = useState('');
      const [governorate, setGovernorate] = useState(govs.includes('الإسكندرية') ? 'الإسكندرية' : govs[0] || 'القاهرة');
      const [address, setAddress] = useState('');
      const [paymentMethod, setPaymentMethod] = useState('الدفع عند الاستلام (COD)');
      const [giftNote, setGiftNote] = useState('');

      if (cart.length === 0) {
        return (
          <div className="max-w-lg mx-auto my-16 p-10 border border-stone-200 text-center space-y-4">
            <h2 className="text-xl font-bold">سلة المشتريات فارغة</h2>
            <button onClick={onBackToStore} className="px-6 py-3 bg-stone-900 text-white text-xs font-bold">
              العودة للمتجر
            </button>
          </div>
        );
      }

      const shipping = Number(settings.shippingRates[governorate] ?? 0);
      const total = cartSubtotal + shipping;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!customerName.trim() || !phone.trim() || !address.trim()) return;
        onSubmitOrder({
          customerName: customerName.trim(),
          phone: phone.trim(),
          governorate,
          address: address.trim(),
          paymentMethod,
          giftNote: giftNote.trim(),
          shipping,
          total
        });
      };

      return (
        <div className="max-w-6xl mx-auto px-4 sm:px-6 py-10">
          <div className="flex items-center justify-between border-b pb-4 mb-8">
            <h1 className="text-2xl font-bold">إتمام الطلب والدفع (Checkout)</h1>
            <button onClick={onBackToStore} className="text-xs font-bold underline text-stone-600 hover:text-stone-950">
              ← العودة للمتجر
            </button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            {/* نموذج بيانات العميل وطريقة الدفع */}
            <form onSubmit={handleSubmit} className="lg:col-span-7 space-y-5 bg-stone-50 p-6 sm:p-8 border border-stone-200">
              <h2 className="text-base font-bold border-b border-stone-200 pb-3">1. بيانات الشحن والتوصيل</h2>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold mb-1.5">الاسم بالكامل *</label>
                  <input
                    type="text"
                    required
                    value={customerName}
                    onChange={e => setCustomerName(e.target.value)}
                    placeholder="مثال: أحمد محمد"
                    className="w-full px-3.5 py-2.5 bg-white border border-stone-300 text-sm focus:outline-none focus:border-stone-900"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1.5">رقم الموبايل (واتساب) *</label>
                  <input
                    type="tel"
                    required
                    dir="ltr"
                    value={phone}
                    onChange={e => setPhone(e.target.value)}
                    placeholder="010xxxxxxxx"
                    className="w-full px-3.5 py-2.5 bg-white border border-stone-300 text-sm text-right focus:outline-none focus:border-stone-900"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold mb-1.5">المحافظة (جميع محافظات مصر) *</label>
                <select
                  value={governorate}
                  onChange={e => setGovernorate(e.target.value)}
                  className="w-full px-3.5 py-2.5 bg-white border border-stone-300 text-sm font-semibold focus:outline-none focus:border-stone-900"
                >
                  {govs.map(g => (
                    <option key={g} value={g}>
                      {g} — مصاريف الشحن: {settings.shippingRates[g]} ج.م
                    </option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold mb-1.5">العنوان بالتفصيل *</label>
                <input
                  type="text"
                  required
                  value={address}
                  onChange={e => setAddress(e.target.value)}
                  placeholder="الحي / المنطقة، اسم الشارع، رقم العمارة، الدور والشقة"
                  className="w-full px-3.5 py-2.5 bg-white border border-stone-300 text-sm focus:outline-none focus:border-stone-900"
                />
              </div>

              <div>
                <label className="block text-xs font-bold mb-1.5">رسالة كارت الإهداء المجاني (اختياري)</label>
                <input
                  type="text"
                  value={giftNote}
                  onChange={e => setGiftNote(e.target.value)}
                  placeholder="اكتب الرسالة اللي تحب نطبعها جوه البوكس..."
                  className="w-full px-3.5 py-2.5 bg-white border border-stone-300 text-sm focus:outline-none focus:border-stone-900"
                />
              </div>

              <h2 className="text-base font-bold border-b border-stone-200 pb-3 pt-2">2. طريقة الدفع</h2>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs font-bold">
                {[
                  { id: 'الدفع عند الاستلام (COD)', desc: 'نقداً لمندوب الشحن عند الاستلام' },
                  { id: 'إنستاباي (InstaPay)', desc: 'تحويل فوري على حساب المتجر' },
                  { id: 'محفظة إلكترونية (فودافون / أورانج / اتصالات كاش)', desc: 'تحويل محفظة إلكترونية' },
                  { id: 'بطاقة بنكية (Visa / Mastercard)', desc: 'دفع إلكتروني بالبطاقة البنكية' }
                ].map(pm => (
                  <label
                    key={pm.id}
                    className={`p-3.5 border cursor-pointer transition ${
                      paymentMethod === pm.id ? 'border-stone-900 bg-white shadow-xs' : 'border-stone-200 bg-white/60'
                    }`}
                  >
                    <div className="flex items-center gap-2">
                      <input
                        type="radio"
                        name="pm"
                        checked={paymentMethod === pm.id}
                        onChange={() => setPaymentMethod(pm.id)}
                        className="accent-stone-900"
                      />
                      <span>{pm.id}</span>
                    </div>
                    <p className="text-[11px] font-normal text-stone-500 mt-1 mr-5">{pm.desc}</p>
                  </label>
                ))}
              </div>

              <button
                type="submit"
                className="w-full py-4 bg-stone-950 hover:bg-stone-800 text-white text-sm font-bold tracking-wide transition mt-4"
              >
                تأكيد الطلب وإصدار الفاتورة ({total} ج.م)
              </button>
            </form>

            {/* ملخص الطلب */}
            <div className="lg:col-span-5 border border-stone-200 p-6 space-y-4">
              <h2 className="text-base font-bold border-b pb-3">ملخص الطلب ({cart.reduce((s, i) => s + i.quantity, 0)} قطع)</h2>
              <div className="space-y-3 max-h-80 overflow-y-auto">
                {cart.map(item => (
                  <div key={item.cartKey} className="flex items-center justify-between gap-3 border-b border-stone-100 pb-3 text-xs">
                    <img src={item.image} alt="" className="w-14 h-16 object-cover bg-stone-100" />
                    <div className="flex-1 min-w-0">
                      <p className="font-bold truncate">{item.name}</p>
                      <p className="text-stone-500">{item.selectedOption}</p>
                      <div className="flex items-center gap-2 mt-1">
                        <button type="button" onClick={() => updateCartQty(item.cartKey, -1)} className="px-2 border">-</button>
                        <span>{item.quantity}</span>
                        <button type="button" onClick={() => updateCartQty(item.cartKey, 1)} className="px-2 border">+</button>
                        <button type="button" onClick={() => removeFromCart(item.cartKey)} className="text-rose-700 underline mr-2">حذف</button>
                      </div>
                    </div>
                    <span className="font-bold">{item.price * item.quantity} ج.م</span>
                  </div>
                ))}
              </div>

              <div className="space-y-2 pt-2 text-sm">
                <div className="flex justify-between">
                  <span className="text-stone-600">المجموع الفرعي:</span>
                  <strong>{cartSubtotal} ج.م</strong>
                </div>
                <div className="flex justify-between">
                  <span className="text-stone-600">الشحن ({governorate}):</span>
                  <strong>{shipping} ج.م</strong>
                </div>
                <div className="flex justify-between text-base font-black border-t pt-3">
                  <span>الإجمالي النهائي:</span>
                  <span>{total} ج.م</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 7. تسجيل الدخول ولوحة التحكم الكاملة للموبايل
    // =========================================================================
    function AdminLogin({ storeName, onSuccess, onBack }) {
      const [pass, setPass] = useState('');
      const [err, setErr] = useState('');

      const submit = (e) => {
        e.preventDefault();
        if (pass === ADMIN_PASSCODE || pass === '123456') onSuccess();
        else setErr('كلمة المرور غير صحيحة');
      };

      return (
        <div className="min-h-screen bg-stone-100 flex items-center justify-center p-4">
          <div className="bg-white border border-stone-200 max-w-md w-full p-8 space-y-5 shadow-sm">
            <h1 className="text-lg font-bold text-center">لوحة تحكم {storeName}</h1>
            {err && <p className="text-xs font-bold text-rose-700 bg-rose-50 p-2.5 text-center">{err}</p>}
            <form onSubmit={submit} className="space-y-4">
              <input
                type="password"
                required
                value={pass}
                onChange={e => setPass(e.target.value)}
                placeholder="أدخل كلمة المرور"
                className="w-full px-4 py-3 border border-stone-300 text-sm"
              />
              <button type="submit" className="w-full py-3 bg-stone-900 text-white text-xs font-bold">
                دخول لوحة الإدارة
              </button>
            </form>
            <button onClick={onBack} className="w-full text-xs text-stone-500 underline">
              العودة للمتجر
            </button>
          </div>
        </div>
      );
    }

    function AdminPanel({
      settings,
      setSettings,
      products,
      setProducts,
      sliders,
      setSliders,
      orders,
      setOrders,
      customers,
      syncStatus,
      onSyncNow,
      onBackToStore,
      onLogout
    }) {
      const [tab, setTab] = useState('products');
      const [name, setName] = useState('');
      const [arabicSubtitle, setArabicSubtitle] = useState('');
      const [category, setCategory] = useState('بوكسات هدايا');
      const [price, setPrice] = useState('');
      const [oldPrice, setOldPrice] = useState('');
      const [optionsText, setOptionsText] = useState('Standard, Deluxe');
      const [description, setDescription] = useState('');
      const [image, setImage] = useState('');
      const [cloudUrl, setCloudUrl] = useState(settings.cloudSyncUrl || '');
      const [msg, setMsg] = useState('');

      const flash = (text) => {
        setMsg(text);
        setTimeout(() => setMsg(''), 3000);
      };

      const handleMobileUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result === 'string') setImage(reader.result);
        };
        reader.readAsDataURL(file);
      };

      const handleAddProduct = (e) => {
        e.preventDefault();
        if (!name.trim() || !price) return;
        const parsedOptions = optionsText
          .split(',')
          .map(s => s.trim())
          .filter(Boolean);

        const newProd = {
          id: 'FRF-' + Math.floor(100 + Math.random() * 900),
          name: name.trim(),
          arabicSubtitle: arabicSubtitle.trim(),
          category: (category || 'عام').trim(),
          price: Number(price),
          oldPrice: oldPrice ? Number(oldPrice) : null,
          isBestSeller: true,
          optionsLabel: 'الاختيار',
          options: parsedOptions.length ? parsedOptions : ['قياسي'],
          image: image || 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=900&q=80',
          hoverImage: '',
          description: description.trim(),
          inStock: true
        };
        setProducts(prev => [newProd, ...prev]);
        setName('');
        setArabicSubtitle('');
        setPrice('');
        setOldPrice('');
        setDescription('');
        setImage('');
        flash('تمت إضافة المنتج ونشره في المتجر ✓');
      };

      return (
        <div className="min-h-screen bg-stone-50 flex flex-col lg:flex-row">
          <aside className="w-full lg:w-64 bg-stone-950 text-stone-300 p-4 flex lg:flex-col justify-between gap-3">
            <div className="flex lg:flex-col gap-2 overflow-x-auto">
              {[
                { id: 'products', label: 'المنتجات ورفع الصور' },
                { id: 'shipping', label: 'شحن المحافظات (27)' },
                { id: 'sliders', label: 'البانر والإعلانات' },
                { id: 'orders', label: `الطلبات (${orders.length})` },
                { id: 'customers', label: `العملاء (${customers.length})` },
                { id: 'settings', label: 'الإعدادات والسحابة' }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className={`px-4 py-2.5 text-xs font-bold whitespace-nowrap text-right transition ${
                    tab === t.id ? 'bg-white text-stone-950' : 'hover:bg-stone-900'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>
            <div className="flex lg:flex-col gap-2">
              <button onClick={onSyncNow} className="px-3 py-2 bg-emerald-800 text-white text-xs font-bold">مزامنة</button>
              <button onClick={onBackToStore} className="px-3 py-2 bg-stone-800 text-white text-xs font-bold">معاينة المتجر</button>
              <button onClick={onLogout} className="px-3 py-2 bg-rose-900 text-white text-xs font-bold">خروج</button>
            </div>
          </aside>

          <main className="flex-1 p-5 sm:p-8 space-y-6">
            <div className="flex flex-wrap items-center justify-between gap-2 border-b pb-4">
              <h1 className="text-xl font-bold">إدارة {settings.storeName}</h1>
              <span className="text-xs font-bold px-3 py-1 bg-white border">{syncStatus}</span>
            </div>

            {msg && <div className="p-3 bg-emerald-900 text-white text-xs font-bold">{msg}</div>}

            {tab === 'products' && (
              <div className="space-y-6">
                <form onSubmit={handleAddProduct} className="bg-white p-6 border border-stone-200 space-y-4">
                  <h2 className="font-bold text-base">إضافة منتج جديد (من الموبايل مباشرة)</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    <input type="text" required value={name} onChange={e => setName(e.target.value)} placeholder="اسم المنتج (إنجليزي أو عربي) *" className="px-3.5 py-2.5 border text-sm" />
                    <input type="text" value={arabicSubtitle} onChange={e => setArabicSubtitle(e.target.value)} placeholder="وصف فرعي قصير بالعربي" className="px-3.5 py-2.5 border text-sm" />
                    <input type="text" required value={category} onChange={e => setCategory(e.target.value)} placeholder="القسم (مثال: بوكسات هدايا) *" className="px-3.5 py-2.5 border text-sm" />
                    <input type="number" required value={price} onChange={e => setPrice(e.target.value)} placeholder="السعر الحالي (ج.م) *" className="px-3.5 py-2.5 border text-sm" />
                    <input type="number" value={oldPrice} onChange={e => setOldPrice(e.target.value)} placeholder="السعر قبل الخصم (لإظهار شارة Sale)" className="px-3.5 py-2.5 border text-sm" />
                    <input type="text" value={optionsText} onChange={e => setOptionsText(e.target.value)} placeholder="الألوان أو الأنواع مفصولة بفاصلة (,)" className="px-3.5 py-2.5 border text-sm" />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 items-center">
                    <div>
                      <label className="block text-xs font-bold mb-1">ارفع صورة المنتج من الموبايل:</label>
                      <input type="file" accept="image/*" onChange={handleMobileUpload} className="w-full text-xs" />
                    </div>
                    <input type="text" value={description} onChange={e => setDescription(e.target.value)} placeholder="تفاصيل ومواصفات المنتج" className="px-3.5 py-2.5 border text-sm" />
                  </div>

                  {image && <img src={image} alt="Preview" className="w-24 h-28 object-cover border" />}

                  <button type="submit" className="px-6 py-3 bg-stone-900 text-white text-xs font-bold">
                    حفظ ونشر المنتج
                  </button>
                </form>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  {products.map(p => (
                    <div key={p.id} className="bg-white p-3.5 border space-y-2 flex flex-col justify-between">
                      <div>
                        <img src={p.image} alt={p.name} className="w-full aspect-[3/4] object-cover mb-2" />
                        <p className="text-[11px] text-stone-400">{p.category}</p>
                        <h3 className="text-xs font-bold line-clamp-2">{p.name}</h3>
                        <p className="text-xs font-black mt-1">{p.price} EGP</p>
                      </div>
                      <div className="flex gap-2 pt-2">
                        <button
                          onClick={() => setProducts(prev => prev.map(item => item.id === p.id ? { ...item, inStock: !item.inStock } : item))}
                          className={`flex-1 py-1.5 text-[11px] font-bold border ${p.inStock ? 'border-emerald-700 text-emerald-800' : 'border-stone-400 text-stone-500'}`}
                        >
                          {p.inStock ? 'in stock' : 'Sold out'}
                        </button>
                        <button
                          onClick={() => { setProducts(prev => prev.filter(i => i.id !== p.id)); flash('تم حذف المنتج'); }}
                          className="px-3 py-1.5 bg-rose-50 text-rose-700 text-[11px] font-bold"
                        >
                          حذف
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'shipping' && (
              <div className="bg-white p-6 border space-y-4">
                <h2 className="font-bold text-base">تعديل مصاريف الشحن لجميع محافظات مصر (ج.م)</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                  {Object.entries(settings.shippingRates).map(([gov, rate]) => (
                    <div key={gov} className="flex items-center justify-between p-3 bg-stone-50 border">
                      <span className="text-xs font-bold">{gov}</span>
                      <input
                        type="number"
                        value={rate}
                        onChange={e => {
                          const val = Number(e.target.value);
                          setSettings(prev => ({
                            ...prev,
                            shippingRates: { ...prev.shippingRates, [gov]: val }
                          }));
                        }}
                        className="w-24 px-2 py-1 border bg-white text-center text-xs font-bold"
                      />
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'sliders' && (
              <div className="bg-white p-6 border space-y-4 max-w-2xl">
                <h2 className="font-bold text-base">تعديل البانر الرئيسي والشريط العلوي</h2>
                <div className="space-y-2">
                  <label className="text-xs font-bold">إعلانات الشريط العلوي المتحرك:</label>
                  {settings.announcements.map((ann, idx) => (
                    <input
                      key={idx}
                      type="text"
                      value={ann}
                      onChange={e => {
                        const updated = [...settings.announcements];
                        updated[idx] = e.target.value;
                        setSettings(prev => ({ ...prev, announcements: updated }));
                      }}
                      className="w-full px-3 py-2 border text-xs"
                    />
                  ))}
                </div>
                <div className="space-y-3 pt-3 border-t">
                  <label className="text-xs font-bold">شرائح البانر الكبير:</label>
                  {sliders.map((s, idx) => (
                    <div key={s.id} className="p-3 bg-stone-50 border space-y-2">
                      <input
                        type="text"
                        value={s.title}
                        onChange={e => setSliders(prev => prev.map((it, i) => i === idx ? { ...it, title: e.target.value } : it))}
                        className="w-full px-3 py-2 border bg-white text-xs font-bold"
                      />
                      <input
                        type="text"
                        value={s.subtitle}
                        onChange={e => setSliders(prev => prev.map((it, i) => i === idx ? { ...it, subtitle: e.target.value } : it))}
                        className="w-full px-3 py-2 border bg-white text-xs"
                      />
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'orders' && (
              <div className="space-y-3">
                {orders.length === 0 ? (
                  <p className="text-xs text-stone-500 bg-white p-6 border">لا توجد طلبات مسجلة بعد.</p>
                ) : (
                  orders.map(o => (
                    <div key={o.id} className="bg-white p-4 border flex flex-wrap items-center justify-between gap-3 text-xs">
                      <div>
                        <p className="font-bold text-sm">{o.id} — {o.customerName} ({o.phone})</p>
                        <p className="text-stone-500 mt-0.5">{o.governorate} - {o.address} | {o.paymentMethod} | الإجمالي: {o.total} ج.م</p>
                      </div>
                      <select
                        value={o.status}
                        onChange={e => setOrders(prev => prev.map(it => it.id === o.id ? { ...it, status: e.target.value } : it))}
                        className="px-3 py-1.5 border font-bold bg-stone-50"
                      >
                        <option value="جديد">جديد</option>
                        <option value="قيد التجهيز">قيد التجهيز</option>
                        <option value="تم الشحن">تم الشحن</option>
                        <option value="تم التسليم">تم التسليم</option>
                        <option value="ملغي">ملغي</option>
                      </select>
                    </div>
                  ))
                )}
              </div>
            )}

            {tab === 'customers' && (
              <div className="bg-white border overflow-x-auto">
                <table className="w-full text-right text-xs">
                  <thead className="bg-stone-100">
                    <tr>
                      <th className="p-3">الاسم</th>
                      <th className="p-3">الموبايل</th>
                      <th className="p-3">المحافظة والعنوان</th>
                      <th className="p-3">عدد الطلبات</th>
                      <th className="p-3">إجمالي المشتريات</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y">
                    {customers.map((c, idx) => (
                      <tr key={idx}>
                        <td className="p-3 font-bold">{c.name}</td>
                        <td className="p-3" dir="ltr">{c.phone}</td>
                        <td className="p-3">{c.governorate} — {c.address}</td>
                        <td className="p-3 font-bold">{c.ordersCount}</td>
                        <td className="p-3 font-bold text-emerald-800">{c.totalSpent} ج.م</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {tab === 'settings' && (
              <div className="bg-white p-6 border space-y-4 max-w-xl">
                <h2 className="font-bold text-base">إعدادات المتجر والمزامنة السحابية</h2>
                <input
                  type="text"
                  value={settings.storeName}
                  onChange={e => setSettings(prev => ({ ...prev, storeName: e.target.value }))}
                  placeholder="اسم المتجر"
                  className="w-full px-3.5 py-2.5 border text-sm"
                />
                <input
                  type="text"
                  value={settings.whatsapp}
                  onChange={e => setSettings(prev => ({ ...prev, whatsapp: e.target.value }))}
                  placeholder="رقم الواتساب"
                  className="w-full px-3.5 py-2.5 border text-sm"
                />
                <input
                  type="url"
                  dir="ltr"
                  value={cloudUrl}
                  onChange={e => setCloudUrl(e.target.value)}
                  placeholder="رابط المزامنة السحابية (اختياري)"
                  className="w-full px-3.5 py-2.5 border text-sm text-left"
                />
                <button
                  onClick={() => { setSettings(prev => ({ ...prev, cloudSyncUrl: cloudUrl.trim() })); flash('تم حفظ الإعدادات ✓'); }}
                  className="px-6 py-2.5 bg-stone-900 text-white text-xs font-bold"
                >
                  حفظ الإعدادات
                </button>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
