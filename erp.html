  <div class="card"><h3>أوامر الشراء</h3>${po.map(r=>{const t=poTotal(r),due=t-N(r.data.paid);return `<div class="row" data-po="${r.id}" style="cursor:pointer"><div class="g"><b>#${r.id} · ${esc(r.data.supplierName)}</b><small>${esc(r.data.date)} · ${(r.data.lines||[]).length} صنف${due>0&&r.data.status!=='cancelled'?' · باقي '+fm(due):''}</small></div><div style="text-align:end"><b>${fm(t)}</b><br><span class="pill s-${r.data.status==='received'?'received':'draft'}">${r.data.status==='received'?'تم الاستلام':r.data.status==='cancelled'?'ملغي':'مستني الاستلام'}</span></div></div>`}).join('')||'<div class="mut">لا توجد أوامر</div>'}</div>
  <div class="card"><h3>الموردين</h3>${sup.map(s=>{const t=S.R.purchase.filter(r=>r.data.supplierId===s.id&&r.data.status!=='cancelled');return `<div class="row"><div class="g"><b>${esc(s.data.name)}</b><small>${esc(s.data.phone||'')} · ${esc(s.data.note||'')}</small></div><div style="text-align:end"><b>${fm(t.reduce((a,r)=>a+poTotal(r),0))}</b><br><small class="mut">${t.length} أمر</small></div><button class="btn sm g2" data-es="${s.id}">تعديل</button></div>`}).join('')||'<div class="mut">أضف أول مورد</div>'}</div>`}
function supModal(id){const r=id?S.R.supplier.find(x=>x.id==id):null,d=r?r.data:{};const m=modal(`<div class="mh"><b>${r?'تعديل مورد':'مورد جديد'}</b><button class="x">×</button></div><label>الاسم</label><input id="n" value="${esc(d.name||'')}"><label>الموبايل</label><input id="p" value="${esc(d.phone||'')}"><label>ملاحظات</label><input id="t" value="${esc(d.note||'')}"><div class="bar" style="margin-top:12px"><button class="btn" id="ok">حفظ</button>${r?'<button class="btn red" id="dl">حذف</button>':''}</div>`);
  $('#ok',m).onclick=()=>run(async()=>{const n=$('#n',m).value.trim();if(!n)throw new Error('اكتب الاسم');const data={name:n,phone:$('#p',m).value.trim(),note:$('#t',m).value.trim()};r?await Q.upd(r,data):await Q.add('supplier',data);m.remove()},'تم الحفظ');
  if(r)$('#dl',m).onclick=()=>confirm(tr('حذف المورد؟'))&&run(async()=>{await Q.del(r);m.remove()})}
function poModal(id){const r=id?S.R.purchase.find(x=>x.id==id):null;
  if(r){const t=poTotal(r),m=modal(`<div class="mh"><b>أمر شراء #${r.id}</b><button class="x">×</button></div><small class="mut">${esc(r.data.supplierName)} · ${esc(r.data.date)}</small><div class="card" style="margin-top:10px">${r.data.lines.map(l=>`<div class="row"><div class="g">${esc(l.name)} <small>× ${fn(l.qty)} @ ${fm(l.cost)}</small></div><b>${fm(l.qty*l.cost)}</b></div>`).join('')}<div class="tot"><span>الإجمالي</span><span>${fm(t)}</span></div></div>
    <label>المدفوع للمورد</label><input id="pd" type="number" value="${N(r.data.paid)}"><div class="bar" style="margin-top:12px"><button class="btn g2" id="sv">حفظ الدفع</button>${r.data.status==='draft'?'<button class="btn grn" id="rc">استلام البضاعة ← يزود المخزون</button><button class="btn red" id="cn">إلغاء</button>':''}</div>`);
    $('#sv',m).onclick=()=>run(async()=>{await Q.upd(r,Object.assign({},r.data,{paid:N($('#pd',m).value)}));m.remove()},'تم الحفظ');
    if(r.data.status==='draft'){$('#rc',m).onclick=()=>run(async()=>{await Q.receive(r);m.remove()},'تم الاستلام وزاد المخزون');$('#cn',m).onclick=()=>run(async()=>{await Q.upd(r,Object.assign({},r.data,{status:'cancelled'}));m.remove()},'تم الإلغاء')}return}
  if(!S.R.supplier.length){toast('أضف مورد الأول',1);return supModal()}
  const opts=S.P.map(p=>`<option value="${esc(p.id)}" data-c="${p.cost}">${p.code} ${esc(p.name)}</option>`).join('');
  const m=modal(`<div class="mh"><b>أمر شراء جديد</b><button class="x">×</button></div><label>المورد</label><select id="sp">${S.R.supplier.map(s=>`<option value="${s.id}">${esc(s.data.name)}</option>`).join('')}</select><label>الأصناف</label><div class="lines" id="ls"></div><button class="btn sm g2" id="al">+ صنف</button><div class="tot"><span>الإجمالي</span><span id="tt">0</span></div><label>المدفوع مقدمًا</label><input id="pd" type="number" value="0"><div class="bar" style="margin-top:12px"><button class="btn" id="ok">حفظ الأمر</button></div>`);
  const add=()=>{const d=document.createElement('div');d.className='ln';d.innerHTML=`<select class="pp">${opts}</select><input class="qq" type="number" min="1" value="1"><input class="cc" type="number" step="0.01" placeholder="التكلفة"><button class="x">×</button>`;$('#ls',m).appendChild(d);const sel=$('.pp',d),sync=()=>{$('.cc',d).value=sel.selectedOptions[0].dataset.c||'';tot()};sel.onchange=sync;sync();$('.x',d).onclick=()=>{d.remove();tot()};$$('input',d).forEach(i=>i.oninput=tot)};
  const tot=()=>{$('#tt',m).textContent=fm($$('.ln',m).reduce((a,d)=>a+N($('.qq',d).value)*N($('.cc',d).value),0))};
  $('#al',m).onclick=add;add();
  $('#ok',m).onclick=()=>run(async()=>{const lines=$$('.ln',m).map(d=>({productId:$('.pp',d).value,name:$('.pp',d).selectedOptions[0].textContent.replace(/^F\d+ /,''),qty:parseInt($('.qq',d).value||'0',10),cost:N($('.cc',d).value)})).filter(l=>l.qty>0);if(!lines.length)throw new Error('أضف صنف');const s=S.R.supplier.find(x=>x.id==$('#sp',m).value);await Q.add('purchase',{supplierId:s.id,supplierName:s.data.name,date:today(),status:'draft',paid:N($('#pd',m).value),lines});m.remove()},'تم حفظ الأمر')}

const CATS=['إيجار','إعلانات','رواتب','شحن وتغليف','كهرباء ومياه','مشتريات متنوعة','أخرى'];
function acc(){const p=filt.per||'month',f=fin(p),ex=f.ex.slice().sort((a,b)=>(b.data.date||'').localeCompare(a.data.date||'')),bycat={};ex.forEach(e=>bycat[e.data.category]=(bycat[e.data.category]||0)+N(e.data.amount));
  const pm={};f.os.forEach(o=>{const k=/insta/i.test(o.paymentMethod)?'InstaPay':'كاش عند الاستلام';pm[k]=(pm[k]||0)+N(o.total)});
  return `<h2>المحاسبة</h2><div class="bar"><select id="per"><option value="month" ${p==='month'?'selected':''}>هذا الشهر</option><option value="d30" ${p==='d30'?'selected':''}>آخر ٣٠ يوم</option><option value="all" ${p==='all'?'selected':''}>الكل</option></select><button class="btn" id="newex">+ مصروف</button></div>
  <div class="card"><h3>قائمة الأرباح والخسائر</h3><div class="row"><div class="g">المبيعات (طلبات مسلّمة)</div><b>${fm(f.rev)}</b></div><div class="row"><div class="g">تكلفة البضاعة المباعة</div><b class="bad">− ${fm(f.cg)}</b></div><div class="row"><div class="g"><b>مجمل الربح</b></div><b>${fm(f.gross)}</b></div><div class="row"><div class="g">المصروفات</div><b class="bad">− ${fm(f.exp)}</b></div><div class="tot"><span>صافي الربح</span><span class="${f.net>=0?'ok':'bad'}">${fm(f.net)}</span></div></div>
  <div class="grid two"><div class="card"><h3>التحصيل حسب الدفع</h3>${Object.entries(pm).map(([k,v])=>`<div class="row"><div class="g">${k}</div><b>${fm(v)}</b></div>`).join('')||'<div class="mut">—</div>'}<div class="row"><div class="g">مستحق للموردين</div><b class="bad">${fm(payables())}</b></div><div class="row"><div class="g">مخزون بالتكلفة (أصول)</div><b>${fm(stockVal())}</b></div></div>
  <div class="card"><h3>المصروفات حسب النوع</h3>${Object.entries(bycat).map(([k,v])=>`<div class="row"><div class="g">${esc(k)}<div class="hb"><i style="width:${v/f.exp*100}%"></i></div></div><b>${fm(v)}</b></div>`).join('')||'<div class="mut">لا توجد مصروفات</div>'}</div></div>
  <div class="card"><h3>سجل المصروفات</h3>${ex.map(e=>`<div class="row" data-ex="${e.id}" style="cursor:pointer"><div class="g"><b>${esc(e.data.category)}</b><small>${esc(e.data.date)} · ${esc(e.data.note||'')}</small></div><b>${fm(e.data.amount)}</b></div>`).join('')||'<div class="mut">—</div>'}</div>`}
function exModal(id){const r=id?S.R.expense.find(x=>x.id==id):null,d=r?r.data:{date:today(),method:'نقدي'};const m=modal(`<div class="mh"><b>${r?'تعديل مصروف':'مصروف جديد'}</b><button class="x">×</button></div><label>النوع</label><select id="c">${CATS.map(c=>`<option value="${c}" ${d.category===c?'selected':''}>${c}</option>`).join('')}</select><label>المبلغ</label><input id="a" type="number" value="${d.amount||''}"><label>التاريخ</label><input id="d" type="date" value="${d.date}"><label>ملاحظة</label><input id="n" value="${esc(d.note||'')}"><div class="bar" style="margin-top:12px"><button class="btn" id="ok">حفظ</button>${r?'<button class="btn red" id="dl">حذف</button>':''}</div>`);
  $('#ok',m).onclick=()=>run(async()=>{const a=N($('#a',m).value);if(a<=0)throw new Error('اكتب المبلغ');const data={category:$('#c',m).value,amount:a,date:$('#d',m).value,note:$('#n',m).value.trim(),method:d.method||'نقدي'};r?await Q.upd(r,data):await Q.add('expense',data);m.remove()},'تم الحفظ');
  if(r)$('#dl',m).onclick=()=>confirm(tr('حذف المصروف؟'))&&run(async()=>{await Q.del(r);m.remove()})}

function custs(){const mp={};S.O.filter(o=>o.status!=='ملغي').forEach(o=>{const k=String(o.phone).replace(/\D/g,'').slice(-10),c=mp[k]||(mp[k]={name:o.customerName,phone:o.phone,gov:o.governorate,n:0,sum:0,last:''});c.n++;c.sum+=N(o.total);if(oDate(o)>c.last)c.last=oDate(o)});return Object.values(mp).sort((a,b)=>b.sum-a.sum)}
function cust(){const q=(filt.q||'').toLowerCase(),l=custs().filter(c=>!q||(c.name+c.phone).toLowerCase().includes(q)),rep=l.filter(c=>c.n>1).length;
  return `<h2>العملاء</h2><div class="grid kpis"><div class="kpi"><small>إجمالي العملاء</small><b>${fn(custs().length)}</b></div><div class="kpi"><small>عملاء متكررين</small><b>${fn(custs().filter(c=>c.n>1).length)}</b></div><div class="kpi"><small>متوسط قيمة الطلب</small><b>${fm(live().reduce((a,o)=>a+N(o.total),0)/Math.max(1,live().length))}</b></div></div>
  <div class="bar" style="margin-top:12px"><input id="q" placeholder="ابحث بالاسم أو الموبايل" value="${esc(filt.q||'')}"></div><div class="card">${l.map(c=>`<div class="row"><div class="g"><b>${esc(c.name)} ${c.n>=3?'⭐':''}</b><small>${esc(c.phone)} · ${esc(c.gov||'')} · آخر طلب ${c.last}</small></div><div style="text-align:end"><b>${fm(c.sum)}</b><br><small class="mut">${fn(c.n)} طلب</small></div><a class="btn sm g2" href="${wa(c.phone)}" target="_blank">واتساب</a></div>`).join('')||'<div class="mut">—</div>'}</div>`}

function hr(){const em=S.R.employee,td=today(),att=r=>S.R.attendance.find(a=>a.data.empId===r.id&&a.data.date===td),pay=em.reduce((a,e)=>a+N(e.data.salary),0),mo=td.slice(0,7);
  return `<h2>الموظفين</h2><div class="grid kpis"><div class="kpi"><small>عدد الموظفين</small><b>${fn(em.length)}</b></div><div class="kpi"><small>إجمالي الرواتب شهريًا</small><b>${fm(pay)}</b></div></div><div class="bar" style="margin-top:12px"><button class="btn" id="newem">+ موظف</button></div>
  <div class="card">${em.map(e=>{const a=att(e),paid=S.R.expense.some(x=>x.data.category==='رواتب'&&x.data.empId===e.id&&String(x.data.date).startsWith(mo));return `<div class="row"><div class="g"><b>${esc(e.data.name)}</b><small>${esc(e.data.role||'')} · ${fm(e.data.salary)}</small></div><button class="btn sm ${a?'grn':'g2'}" data-at="${e.id}">${a?'حاضر ✓':'حضور اليوم'}</button>${paid?'<span class="pill s-received">اتدفع</span>':`<button class="btn sm" data-sal="${e.id}">صرف الراتب</button>`}<button class="btn sm g2" data-ee="${e.id}">⋯</button></div>`}).join('')||'<div class="mut">أضف أول موظف</div>'}</div><small class="mut">صرف الراتب بيتسجّل تلقائيًا كمصروف "رواتب" في المحاسبة.</small>`}
function emModal(id){const r=id?S.R.employee.find(x=>x.id==id):null,d=r?r.data:{};const m=modal(`<div class="mh"><b>${r?'تعديل موظف':'موظف جديد'}</b><button class="x">×</button></div><label>الاسم</label><input id="n" value="${esc(d.name||'')}"><label>الوظيفة</label><input id="r" value="${esc(d.role||'')}"><label>الراتب الشهري</label><input id="s" type="number" value="${d.salary||''}"><label>الموبايل</label><input id="p" value="${esc(d.phone||'')}"><div class="bar" style="margin-top:12px"><button class="btn" id="ok">حفظ</button>${r?'<button class="btn red" id="dl">حذف</button>':''}</div>`);
  $('#ok',m).onclick=()=>run(async()=>{const n=$('#n',m).value.trim();if(!n)throw new Error('اكتب الاسم');const data={name:n,role:$('#r',m).value.trim(),salary:N($('#s',m).value),phone:$('#p',m).value.trim()};r?await Q.upd(r,data):await Q.add('employee',data);m.remove()},'تم الحفظ');
  if(r)$('#dl',m).onclick=()=>confirm(tr('حذف الموظف؟'))&&run(async()=>{await Q.del(r);m.remove()})}

function rep(){const g={},p={},py={};S.O.filter(o=>o.status==='تم التسليم').forEach(o=>{g[o.governorate]=(g[o.governorate]||0)+N(o.total);o.items.forEach(l=>{const x=p[l.name]||(p[l.name]={q:0,r:0,pf:0});x.q+=N(l.quantity);x.r+=l.price*l.quantity;const pr=S.P.find(z=>z.id===l.id);x.pf+=l.price*l.quantity-(pr?pr.cost:0)*l.quantity});});
  const gs=Object.entries(g).sort((a,b)=>b[1]-a[1]),ps=Object.entries(p).sort((a,b)=>b[1].r-a[1].r),gm=gs[0]?gs[0][1]:1;
  return `<h2>التقارير</h2><div class="bar"><button class="btn g2" id="x1">تصدير الطلبات CSV</button><button class="btn g2" id="x2">تصدير المخزون CSV</button><button class="btn g2" id="x3">تصدير المصروفات CSV</button></div>
  <div class="card tw"><h3>أداء المنتجات (طلبات مسلّمة)</h3><table><tr><th>المنتج</th><th>مبيع</th><th>إيراد</th><th>ربح</th></tr>${ps.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${fn(v.q)}</td><td>${fm(v.r)}</td><td class="${v.pf>=0?'ok':'bad'}">${fm(v.pf)}</td></tr>`).join('')}</table></div>
  <div class="card"><h3>المبيعات حسب المحافظة</h3>${gs.map(([k,v])=>`<div class="row"><div class="g">${esc(k)}<div class="hb"><i style="width:${v/gm*100}%"></i></div></div><b>${fm(v)}</b></div>`).join('')}</div>`}

/* ---------- shell ---------- */
const VIEWS={home,dash,sales,inv,buy,acc,cust,hr,rep};
function render(){const root=$('#root');if(!S.ready)return;
  const title=(APPS.find(a=>a[0]===route)||[])[1];
  root.innerHTML=`${S.demo?'<div class="demo">نسخة تجريبية ببيانات وهمية — مفيش حاجة من بيانات متجرك الحقيقية هنا</div>':''}${S.noTables?'<div class="demo">شغّل ملف erp.sql في Supabase عشان تفتح الموردين والمشتريات والمصروفات والموظفين</div>':''}<div class="top"><span class="logo" data-go="home">فرفيرو ERP</span><span class="grow"></span><button class="btn sm g2" id="lg">${LANG==='ar'?'English':'العربية'}</button><button class="btn sm g2" id="rf">تحديث</button>${S.demo?'':'<button class="btn sm g2" id="lo">خروج</button>'}</div><div class="tabs">${APPS.map(a=>`<span class="tab ${route===a[0]?'on':''}" data-go="${a[0]}">${a[2]} ${a[1]}</span>`).join('')}</div><main>${VIEWS[route]()}</main>`;
  const on=(s,f)=>$$(s).forEach(f);
  on('[data-go]',e=>e.onclick=()=>{route=e.dataset.go;filt={};location.hash='#/'+route+(S.demo?'?demo':'');render();scrollTo(0,0)});
  on('[data-ord]',e=>e.onclick=()=>ordModal(e.dataset.ord));on('[data-adj]',e=>e.onclick=()=>adjModal(e.dataset.adj));on('[data-po]',e=>e.onclick=()=>poModal(e.dataset.po));
  on('[data-es]',e=>e.onclick=()=>supModal(e.dataset.es));on('[data-ex]',e=>e.onclick=()=>exModal(e.dataset.ex));on('[data-ee]',e=>e.onclick=()=>emModal(e.dataset.ee));
  on('[data-at]',e=>e.onclick=()=>run(async()=>{const id=+e.dataset.at,a=S.R.attendance.find(x=>x.data.empId===id&&x.data.date===today());a?await Q.del(a):await Q.add('attendance',{empId:id,date:today()})}));
  on('[data-sal]',e=>e.onclick=()=>{const em=S.R.employee.find(x=>x.id==e.dataset.sal);if(confirm(tr('صرف راتب')+' '+em.data.name+' ('+fm(em.data.salary)+')?'))run(()=>Q.add('expense',{category:'رواتب',amount:N(em.data.salary),date:today(),note:'راتب '+em.data.name,empId:em.id,method:'نقدي'}),'تم الصرف وسُجّل كمصروف')});
  const bind=(id,ev,f)=>{const el=$(id);if(el)el[ev]=f};
  bind('#q','oninput',e=>{filt.q=e.target.value;const p=e.target.selectionStart;render();const i=$('#q');i.focus();i.setSelectionRange(p,p)});bind('#st','onchange',e=>{filt.st=e.target.value;render()});bind('#per','onchange',e=>{filt.per=e.target.value;render()});
  bind('#newpo','onclick',()=>poModal());bind('#newsup','onclick',()=>supModal());bind('#newex','onclick',()=>exModal());bind('#newem','onclick',()=>emModal());
  bind('#lg','onclick',flip);bind('#rf','onclick',()=>run(async()=>{await load()},'تم التحديث'));bind('#lo','onclick',()=>{localStorage.removeItem(SK);location.reload()});
  bind('#x1','onclick',()=>csv('orders',['id','date','customer','phone','governorate','status','total'],S.O.map(o=>[o.id,oDate(o),o.customerName,o.phone,o.governorate,o.status,o.total])));
  bind('#x2','onclick',()=>csv('inventory',['code','name','stock','cost','price'],S.P.map(p=>[p.code,p.name,p.stock,p.cost,p.price])));
  bind('#x3','onclick',()=>csv('expenses',['date','category','amount','note'],S.R.expense.map(e=>[e.data.date,e.data.category,e.data.amount,e.data.note])));localize($('#root'))}

function loginView(msg){$('#root').innerHTML=`<div class="login"><h2 style="text-align:center;color:var(--gold)">فرفيرو ERP</h2><p class="mut" style="text-align:center">سجّل دخول بنفس حساب المشرف بتاع المتجر</p><label>الإيميل</label><input id="em" type="email" dir="ltr"><label>كلمة السر</label><input id="pw" type="password" dir="ltr"><p class="bad">${esc(msg||'')}</p><button class="btn" style="width:100%" id="go">دخول</button><p style="text-align:center;margin-top:18px"><button class="btn sm g2" id="lg2">${LANG==='ar'?'English':'العربية'}</button> &nbsp; <a href="#/home?demo" id="dm">جرّب النسخة التجريبية</a></p></div>`;
  $('#lg2').onclick=flip;localize($('#root'));
  $('#dm').onclick=()=>{S.demo=true;start()};
  $('#go').onclick=async()=>{try{const n=await raw('/auth/v1/token?grant_type=password',{method:'POST',body:{email:$('#em').value.trim(),password:$('#pw').value}});const s={access_token:n.access_token,refresh_token:n.refresh_token,expires_at:n.expires_at||Math.floor(Date.now()/1000)+3600};
    const a=await raw('/rest/v1/rpc/is_admin',{method:'POST',body:{},token:s.access_token});if(a!==true)return loginView('هذا الحساب ليس مشرفًا.');localStorage.setItem(SK,JSON.stringify(s));start()}catch(e){loginView(e.message)}}}
async function start(){
  const h=location.hash.replace('#/','').split('?')[0];if(VIEWS[h])route=h;
  try{await load();render()}catch(e){if(S.demo)throw e;localStorage.removeItem(SK);loginView(sess()?e.message:'')}}
setDir();S.demo=/demo/.test(location.hash+location.search);
if(S.demo||sess())start();else loginView();
})();
</script></body></html>
